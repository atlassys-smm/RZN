                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    question_id:
                      type: string
                      format: uuid
                    order:
                      type: integer
        created_at:
          type: string
          format: date-time
    QuizSession:
      description: Сущность сессии викторины (без связей)
      type: object
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - individual
          - team
        status:
          type: string
          enum:
          - waiting
          - active
          - finished
        settings:
          type: object
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    QuizSessionFull:
      description: Сессия викторины со связями. Поля заполняются в зависимости от
        параметра select.
      type: object
      allOf:
      - $ref: '#/components/schemas/QuizSession'
      - type: object
        properties:
          current_round:
            type: object
            nullable: true
            description: Текущий раунд (заполняется при select=current_round)
            properties:
              index:
                type: integer
              round_type:
                type: string
          current_question:
            type: object
            nullable: true
            description: Текущий вопрос (заполняется при select=current_question)
            properties:
              index:
                type: integer
              question:
                $ref: '#/components/schemas/QuizQuestion'
              correct_answer:
                type: object
                nullable: true
                description: Заполнено после вызова reveal (ответ показан)
                properties:
                  answer_option_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                  explanation:
                    type: string
                    nullable: true
              votes:
                type: array
                description: Распределение голосов по вариантам ответа
                items:
                  type: object
                  properties:
                    answer_option_id:
                      type: string
                      format: uuid
                    count:
                      type: integer
          timer:
            $ref: '#/components/schemas/QuizTimerState'
          teams:
            type: array
            nullable: true
            description: Заполняется при select=teams
            items:
              $ref: '#/components/schemas/QuizTeam'
          participants:
            type: array
            nullable: true
            description: Заполняется при select=participants
            items:
              $ref: '#/components/schemas/QuizParticipant'
    QuizTeam:
      description: Команда в сессии викторины
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        captain_id:
          type: string
          format: uuid
          nullable: true
        score:
          type: integer
    QuizParticipant:
      description: Участник сессии викторины
      type: object
