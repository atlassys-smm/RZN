  /organizations/recommendations:
    get:
      tags:
      - Организации
      summary: Рекомендации организаций и направлений по выбранным профессиям
      description: 'Требуется действующий Bearer JWT пользователя (включая гостя),
        сотрудника любой роли или активного устройства. Принимает от 1 до 3 различных
        ID профессий повторяемым query-параметром profession_ids. Ответ содержит employers,
        educations и education_programs в том же формате и с теми же правилами ранжирования,
        что и /users/me/recommendations: до пяти организаций каждого типа и отдельно
        до пяти направлений. Выше больше различных совпавших профессий, затем ID организации
        или направления по возрастанию. Направления выбираются по прямым связям с
        профессиями, независимо от организаций; поле education_program содержит полные
        данные направления, рядом возвращаются profession_ids, profession_count и
        position. Учитываются профессии, связи, программы и организации с deleted_at.
        Результат не сохраняется. Правило покрытия применяется отдельно к каждому
        из трёх списков: employers, educations, education_programs. Сначала формируется
        топ-5 по числу различных совпавших профессий DESC и ID организации или направления
        ASC. Затем проверяется покрытие каждой выбранной профессии. Если для неё есть
        связанные записи, но ни одна не попала в топ-5, лучшая из них заменяет последнюю
        запись, удаление которой не лишает покрытия другие профессии. Одна запись
        может покрывать несколько профессий. После замен сохраняется сортировка по
        рейтингу; лимит — 5 уникальных записей в каждом списке. Если соответствующих
        связей нет, покрытие этой профессии в данном списке не требуется. Профиль
        пользователя и результаты тестов не требуются. Если соответствующих связей
        нет, массивы пустые. Любой неизвестный ID профессии возвращает 404.'
      security:
      - bearerAuth: []
      parameters:
      - name: profession_ids
        in: query
        required: true
        style: form
        explode: true
        description: От 1 до 3 различных ID профессий, включая мягко удалённые.
        schema:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: integer
        example:
        - 1
        - 2
        - 3
      responses:
        '200':
          description: Рекомендации организаций по выбранным профессиям
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRecommendations'
        '401':
          description: Отсутствующий или недействительный JWT.
        '404':
          description: Профессия не найдена.
        '422':
          description: Неверное количество, повторяющиеся ID или некорректный формат
            profession_ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
