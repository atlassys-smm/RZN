        name:
          type: string
        individual_score:
          type: integer
    QuizSessionState:
      description: Текущее состояние игры викторины (для next, reveal)
      type: object
      properties:
        status:
          type: string
          enum:
          - waiting
          - active
          - finished
        current_round:
          type: object
          nullable: true
          properties:
            index:
              type: integer
            round_type:
              type: string
        current_question:
          type: object
          nullable: true
          properties:
            index:
              type: integer
            question:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                text:
                  type: string
                question_type:
                  type: string
                media_url:
                  type: string
                  nullable: true
                time_limit:
                  type: integer
                answer_options:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      text:
                        type: string
                      media_url:
                        type: string
                        nullable: true
            correct_answer:
              type: object
              nullable: true
              description: Заполнено после вызова reveal
              properties:
                answer_option_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                explanation:
                  type: string
                  nullable: true
            votes:
              type: array
              description: Распределение голосов по вариантам ответа
              items:
                type: object
                properties:
                  answer_option_id:
                    type: string
                    format: uuid
                  count:
                    type: integer
        timer:
          $ref: '#/components/schemas/QuizTimerState'
        scores:
          type: array
          description: Текущий рейтинг
          items:
            type: object
            properties:
              team_id:
                type: string
                format: uuid
                nullable: true
              participant_id:
                type: string
                format: uuid
                nullable: true
              name:
                type: string
              score:
                type: integer
    QuizTimerState:
      description: 'Состояние таймера текущего вопроса викторины.

        Для синхронизации используется абсолютный timestamp `ends_at`, а не относительный
        `remaining`.

        Клиент вычисляет оставшееся время: remaining = ends_at - now.

        '
      type: object
      properties:
        ends_at:
          type: integer
          format: int64
          nullable: true
          description: UNIX timestamp (мс), когда таймер закончится. Null если на
            паузе.
        remaining_at_pause:
          type: integer
          nullable: true
          description: Секунд осталось на момент паузы. Заполняется если running=false.
        running:
          type: boolean
          description: true — таймер идёт, false — на паузе
    QuizScoredEntry:
      description: Запись с баллами. id — team_id для team mode, participant_id для
        individual.
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Название команды или имя участника
    QuizRoundResult:
      description: Результат раунда
