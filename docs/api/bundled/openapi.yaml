          type: integer
          format: int64
      responses:
        '200':
          description: Текущий результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTotalResult'
  /quiz/sessions/{sessionId}/join:
    post:
      tags:
      - Викторина - Игрок
      summary: Подключиться к сессии
      description: Подключиться к сессии по QR-коду
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Подключён
          content:
            application/json:
              schema:
                type: object
                required:
                - participant_id
                - session_id
                - token
                - mode
                properties:
                  participant_id:
                    type: integer
                    format: int64
                    description: ID GameSessionParticipant
                  session_id:
                    type: integer
                    format: int64
                  token:
                    type: string
                    description: User JWT гостевого пользователя
                  mode:
                    type: integer
                    enum:
                    - 1
                    - 2
                    description: 1 — individual, 2 — team
                  teams:
                    type: array
                    description: Список команд (для mode=2, team)
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        name:
                          type: string
                        color:
                          type: string
                        participant_count:
                          type: integer
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Сессия уже завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{sessionId}/team/{teamId}/join:
    post:
      tags:
      - Викторина - Игрок
      summary: Выбрать команду
      description: Присоединиться к команде (для mode=team)
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - participant_id
              properties:
                participant_id:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Присоединился к команде
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_id:
                    type: integer
                    format: int64
                  team_id:
                    type: integer
                    format: int64
                  is_captain:
                    type: boolean
                    description: true если участник стал капитаном (первый в команде)
        '409':
          description: Сессия уже началась или команда заполнена (10 участников)
  /quiz/sessions/{sessionId}/answer:
    post:
      tags:
      - Викторина - Игрок
      summary: Ответ на вопрос
      description: 'Ответ на текущий вопрос. Поведение зависит от режима и роли:

        - Individual mode: ответ засчитывается

        - Team mode, обычный участник: сохраняется как голос (для отображения капитану)

        - Team mode, капитан: предварительный ответ при `is_final=false`, зачётный
        ответ команды при `is_final=true`

        '
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - participant_id
              - answer
              properties:
                participant_id:
                  type: integer
                  format: int64
                  description: ID GameSessionParticipant, полученный при подключении
                answer:
                  type: object
                  description: JSON-ответ согласно типу вопроса; форматы описаны в
                    entities/quiz.md
                  additionalProperties: true
                is_final:
                  type: boolean
                  default: false
                  description: true только для решающего ответа капитана команды;
                    false означает предварительный ответ участника
      responses:
        '200':
          description: Ответ принят
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_answered:
                  summary: Уже ответил
                  value:
                    error: already_answered
                    message: Вы уже дали ответ на этот вопрос
                answering_closed:
                  summary: Приём ответов завершён
                  value:
                    error: answering_closed
                    message: Приём ответов на этот вопрос завершён
                captain_already_answered:
                  summary: Капитан уже отправил решающий ответ
                  value:
                    error: captain_already_answered
                    message: Капитан команды уже отправил решающий ответ
                not_captain:
                  summary: Решающий ответ может отправить только капитан
                  value:
                    error: not_captain
                    message: Только капитан может отправить решающий ответ команды
        '404':
          description: Сессия или вопрос не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/devices:
