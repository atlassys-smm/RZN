      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roundId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Раунд обновлён
  /cms/quiz/templates/{id}/rounds/{roundId}/questions:
    post:
      tags:
      - Викторина - CMS
      summary: Добавить вопрос в раунд
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roundId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - question_id
