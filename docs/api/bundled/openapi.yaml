            test_code_type:
              const: holland
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 15
            answered_count:
              maximum: 15
            answers:
              maxItems: 15
          allOf:
          - if:
              properties:
                status:
                  const: 2
              required:
              - status
            then:
              properties:
                answered_count:
                  const: 15
          - if:
              properties:
                status:
                  const: 2
              required:
              - status
            then:
              properties:
                answers:
                  minItems: 15
          - if:
              properties:
                answered_count:
                  const: 15
              required:
              - answered_count
            then:
              properties:
                next_question_id:
                  type: 'null'
      - if:
          properties:
            test_code_type:
              const: dellinger
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 1
            answered_count:
              maximum: 1
            answers:
              maxItems: 1
          allOf:
          - if:
              properties:
                status:
                  const: 2
              required:
              - status
            then:
              properties:
                answered_count:
                  const: 1
          - if:
              properties:
                status:
                  const: 2
              required:
              - status
            then:
              properties:
                answers:
                  minItems: 1
          - if:
              properties:
                answered_count:
                  const: 1
              required:
              - answered_count
            then:
              properties:
                next_question_id:
                  type: 'null'
      - if:
          properties:
            status:
              const: 3
          required:
          - status
        then:
          properties:
            next_question_id:
              type: 'null'
      - if:
          properties:
            status:
              const: 2
          required:
          - status
        then:
          properties:
            completed_at:
              type: string
            next_question_id:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - 1
              - 3
          required:
          - status
        then:
          properties:
            completed_at:
              type: 'null'
      description: answers — принятые ответы. У completed заполнен completed_at; у
        in_progress и abandoned он равен null. Результат доступен по ID сессии.
    ProfStartAnswerReceipt:
      type: object
      additionalProperties: false
      required:
      - session_id
      - answer
      - answered_count
      - question_count
      - next_question_id
      - status
      properties:
        session_id:
          type: integer
          format: int64
          minimum: 1
        answer:
          $ref: '#/components/schemas/ProfStartSavedAnswer'
        answered_count:
          type: integer
          minimum: 1
        question_count:
          type: integer
          minimum: 1
        next_question_id:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        status:
          type: integer
          format: int32
          enum:
          - 1
          - 2
          description: 1 — in_progress, 2 — completed.
      allOf:
      - if:
          properties:
            question_count:
              const: 1
          required:
          - question_count
        then:
          properties:
            answered_count:
              maximum: 1
          allOf:
          - if:
              properties:
                status:
                  const: 2
              required:
              - status
            then:
              properties:
                answered_count:
                  const: 1
                next_question_id:
                  type: 'null'
      - if:
          properties:
            question_count:
              const: 15
          required:
          - question_count
        then:
          properties:
            answered_count:
              maximum: 15
          allOf:
          - if:
              properties:
                status:
                  const: 2
              required:
              - status
            then:
              properties:
                answered_count:
                  const: 15
                next_question_id:
                  type: 'null'
      - if:
          properties:
            question_count:
              const: 42
          required:
          - question_count
        then:
          properties:
            answered_count:
              maximum: 42
          allOf:
          - if:
              properties:
                status:
                  const: 2
              required:
              - status
            then:
              properties:
                answered_count:
                  const: 42
                next_question_id:
                  type: 'null'
      - if:
          properties:
            status:
              enum:
              - 2
          required:
          - status
        then:
          properties:
            next_question_id:
              type: 'null'
      description: Принятый ответ и текущий прогресс; next_question_id=null после
        завершения.
    ProfStartScore:
      type: object
      additionalProperties: false
      required:
