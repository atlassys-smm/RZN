      - name: type
        in: query
        schema:
          type: string
          enum:
          - education
          - employer
        description: Фильтр по типу (education — учебные заведения, employer — работодатели)
      - name: search
        in: query
        schema:
          type: string
        description: Поиск по названию
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список организаций
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  total:
                    type: integer
