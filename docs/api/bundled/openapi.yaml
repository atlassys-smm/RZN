                properties:
                  answer:
                    type: object
                    description: Эталонный ответ в формате соответствующего question_type
                    additionalProperties: true
                  explanation:
                    type: string
                    nullable: true
              answer_submissions:
                type: object
                description: Счётчики принятых ответов; для капитана команды также
