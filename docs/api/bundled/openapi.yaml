        properties:
          place:
            type: integer
          score:
            type: integer
    QuizTotalResult:
      description: Итоговый результат на текущий момент. mode определяет, что означает
        id.
      type: object
      properties:
        mode:
          type: string
          enum:
          - individual
          - team
        results:
          type: array
          description: Рейтинг по убыванию баллов
          items:
            $ref: '#/components/schemas/QuizFinalResult'
