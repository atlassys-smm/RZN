              properties:
                seconds:
                  type: integer
                  minimum: 1
                  description: Сколько секунд добавить
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Обновлённое состояние таймера
          content:
            application/json:
