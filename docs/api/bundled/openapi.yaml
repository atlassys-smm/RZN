                        description: Имя и фамилия из users, соединённые пробелом;
                          пустые части пропускаются
                      answer:
                        type: object
                        additionalProperties: true
        timer:
          $ref: '#/components/schemas/QuizTimerState'
        scores:
          type: array
          description: Текущий рейтинг
          items:
            type: object
            properties:
              team_id:
                type: integer
                format: int64
                nullable: true
              participant_id:
                type: integer
                format: int64
                nullable: true
              name:
                type: string
              score:
                type: number
                description: Десятичное число баллов; в JSON передаётся как number
    QuizTimerState:
      description: 'Состояние таймера текущего вопроса викторины.

        Для синхронизации используется абсолютный timestamp `ends_at`, а не относительный
        `remaining`.

        Клиент вычисляет оставшееся время: remaining = ends_at - now.

        '
      type: object
      properties:
        ends_at:
          type: integer
          format: int64
          nullable: true
          description: UNIX timestamp (мс), когда таймер закончится. Null если на
            паузе.
        remaining_at_pause:
          type: integer
          nullable: true
          description: Секунд осталось на момент паузы. Null при работающем или закрытом
            таймере.
        running:
          type: boolean
          description: true — таймер идёт, false — на паузе или приём ответов закрыт
    QuizWebSocketEvent:
      type: object
      required:
      - type
      additionalProperties: false
      description: 'Уведомление канала викторины, содержащее только тип события.

        Сессия определяется URL подключения. После события клиент запрашивает

        GET /quiz/sessions/active?device_id=...; состояние игры в сокете не передаётся.

        '
      properties:
        type:
          type: string
          enum:
          - session_state
          - participant_joined
          - participant_team_changed
          - captain_changed
          - team_renamed
          - answers_update
          - all_answered
          - question_started
          - question_revealed
          - timer_paused
          - timer_resumed
          - timer_updated
          - timer_stopped
          - timer_expired
          - round_finished
          - session_finished
      example:
        type: answers_update
    InteractiveVideoWebSocketEvent:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - phase_changed
          - votes_updated
          - scenario_finished
          - session_finished
    QuizScoredEntry:
      description: Запись с баллами. id — team_id для mode=2 (team), participant_id
        для mode=1 (individual).
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Название команды или имя участника
    QuizRoundResult:
