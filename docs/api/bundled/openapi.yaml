      responses:
        '200':
          description: Обновлённое состояние таймера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTimerState'
        '400':
          description: Нет текущего вопроса или приём ответов уже закрыт
  /quiz/sessions/{id}/timer/stop:
    post:
      tags:
      - Викторина - Оператор
      summary: Остановить таймер
      description: Досрочно завершить приём ответов на текущий вопрос. После остановки
        применяется настройка `auto_reveal`; при выключенном автопоказе оператор вызывает
