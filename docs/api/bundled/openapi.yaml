      tags:
      - Викторина - Оператор
      summary: Пауза таймера
      description: Поставить на паузу таймер текущего вопроса
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Состояние таймера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTimerState'
  /quiz/sessions/{id}/timer/resume:
    post:
      tags:
      - Викторина - Оператор
      summary: Возобновить таймер
      description: Возобновить отсчёт таймера текущего вопроса
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Состояние таймера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTimerState'
  /quiz/sessions/{id}/timer/add-time:
    post:
      tags:
      - Викторина - Оператор
      summary: Добавить время
      description: Увеличить оставшееся время текущего вопроса. Работает при запущенном
        таймере и на паузе.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - seconds
              properties:
                seconds:
                  type: integer
                  minimum: 1
                  description: Сколько секунд добавить
      responses:
        '200':
          description: Обновлённое состояние таймера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTimerState'
        '400':
          description: Нет текущего вопроса или приём ответов уже закрыт
  /quiz/sessions/{id}/timer/stop:
    post:
      tags:
      - Викторина - Оператор
      summary: Остановить таймер
      description: Досрочно завершить приём ответов на текущий вопрос. После остановки
        применяется настройка `auto_reveal`; при выключенном автопоказе оператор вызывает
        `reveal` или `skip`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Текущее состояние игры после остановки таймера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
        '400':
          description: Нет текущего вопроса или приём ответов уже закрыт
  /quiz/sessions/{id}/skip:
    post:
      tags:
      - Викторина - Оператор
      summary: Пропустить показ ответа
      description: После закрытия приёма ответов перейти к следующему вопросу или
        результатам раунда без показа правильного ответа. Уже принятые зачётные ответы
        проверяются автоматически.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Текущее состояние игры после перехода
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
        '400':
          description: Нет текущего вопроса или приём ответов ещё открыт
  /quiz/sessions/{id}/led/next:
    post:
      tags:
      - Викторина - LED
      summary: Следующий вопрос (LED)
      description: 'LED-экран вызывает этот endpoint после окончания таймера.

        Если время вышло и `auto_reveal = true` — автоматически показывает правильный
        ответ и начисляет баллы.

        Если ответ уже показан — переходит к следующему вопросу.

