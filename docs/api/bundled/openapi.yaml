              type: array
              description: ID всех видеосценариев в сессии
              items:
                type: integer
                format: int64
            voting_duration:
              type: integer
              description: Длительность голосования в секундах
            result_display_duration:
              type: integer
              description: Длительность показа результата в секундах
        current_scenario:
          $ref: '#/components/schemas/InteractiveVideoScenario'
          nullable: true
          description: Текущий видеосценарий
        current_branch:
          type: object
          nullable: true
          description: Текущая ветка (видеофрагмент)
          properties:
            id:
              type: integer
              format: int64
