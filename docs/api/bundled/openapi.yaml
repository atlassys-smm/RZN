      summary: Список активных анкет
      description: Получить активные анкеты с вопросами и вариантами ответов. Требуется
        User JWT либо Device JWT с ролью 4 и действующей QR-привязкой. Для устройства
        обязателен X-Device-Connection-Id. Черновики и неактивные версии не возвращаются.
        total содержит общее число активных анкет.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DeviceConnectionId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: offset
        in: query
