    get:
      tags:
      - Организации
      summary: Детали организации
      description: Получить полную информацию об организации
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Организация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
