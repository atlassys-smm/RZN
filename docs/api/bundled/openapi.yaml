  /quiz/sessions:
    post:
      tags:
      - Викторина - Оператор
      summary: Создать сессию
      description: 'Создаёт сессию в статусе `1` (waiting). Она привязывается к LED-устройству
        `device_id`; на одном устройстве одновременно может быть только одна сессия
        со статусом `1` (waiting) или `2` (active).

        API принимает только готовый массив `rounds`, без `template_id`. Если оператор
        выбрал шаблон, клиент переносит его типы раундов и `question_ids` в этот массив.
        Для каждого раунда передаются либо конкретные `question_ids`, либо `question_count`
        и `question_filters` для автоматического выбора вопросов.

        Команды создаются автоматически по `settings.team_count` (для `mode = 2`,
        team).

        Оператор запускает первый вопрос через `POST /quiz/sessions/{id}/next`. Для
        командной игры нужны не менее двух команд с не менее чем двумя участниками
        в каждой. Пустые команды исключаются при старте. Состав раундов и вопросов
        после создания не редактируется.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - device_id
              - mode
              - rounds
              properties:
                device_id:
                  type: integer
                  format: int64
                  description: LED-устройство, на котором проводится сессия
                mode:
                  type: integer
                  enum:
                  - 1
                  - 2
                  description: 1 — individual, 2 — team
                rounds:
                  type: array
                  description: Раунды с вопросами из шаблона, выбранными явно по ID
                    или автоматически по количеству и фильтрам
                  items:
                    type: object
                    required:
                    - round_type
                    oneOf:
                    - required:
                      - question_ids
                    - required:
                      - question_count
                      - question_filters
                    properties:
                      round_type:
                        type: integer
                        enum:
                        - 1
                        - 2
                        - 3
                        - 4
                        - 5
                        - 6
                        - 7
                        - 8
                        - 9
                      question_ids:
                        type: array
                        description: Явно выбранные вопросы; используется вместо автоматического
                          выбора
                        items:
                          type: integer
                          format: int64
                      question_count:
                        type: integer
                        minimum: 1
                        description: Сколько вопросов автоматически выбрать для раунда
                      question_filters:
                        type: object
                        description: Фильтры кандидатов. Каждое поле необязательно;
                          заданные поля ограничивают выбор.
                        properties:
                          difficulty:
                            type: integer
                            enum:
                            - 1
                            - 2
                            - 3
                            description: Числовой ID сложности
                          age_group:
                            type: integer
                            description: Числовой ID возрастной группы
                          tags:
                            type: array
                            items:
                              type: string
                            description: Теги для фильтрации вопросов
                settings:
                  type: object
                  properties:
                    team_count:
                      type: integer
                      minimum: 2
                      maximum: 8
                      description: Количество команд (для mode=2, team)
                    team_capacity:
                      type: integer
                      minimum: 2
                      maximum: 10
                      default: 10
                      description: Максимум участников в одной команде
                    auto_reveal:
                      type: boolean
                      default: true
                    auto_next:
                      type: boolean
                      default: false
                    auto_next_delay:
                      type: integer
                      default: 5
                    between_rounds_delay:
                      type: integer
                      default: 10
                    show_intermediate_results:
                      type: boolean
                      default: true
                    scoring:
                      type: object
                      description: Настройки системы начисления баллов. Если не переданы
                        — подставляются стандартные из CMS
                      properties:
                        partial_correct:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                        speed_bonus:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            coefficient:
                              type: number
                              default: 1.5
                            threshold_percent:
                              type: integer
                              default: 50
                        streak_bonus:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            step:
                              type: number
                              default: 0.05
                            max:
                              type: number
                              default: 2.0
                        consensus_bonus:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            coefficient:
                              type: number
                              default: 1.2
                        final_multiplier:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            coefficient:
                              type: number
                              default: 1.5
                        penalty:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: false
                            coefficient:
                              type: number
                              default: 0.0
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '201':
          description: Сессия создана (статус waiting, ожидает старта оператора)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSession'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_rounds:
                  summary: Некорректные раунды
                  value:
                    error: invalid_rounds
                    message: Количество раундов должно быть от 3 до 8
                invalid_team_count:
                  summary: Некорректное количество команд
                  value:
                    error: invalid_team_count
                    message: Количество команд должно быть от 2 до 8
        '409':
          description: На этом устройстве уже есть незавершённая сессия
  /quiz/sessions/active:
    get:
      tags:
      - Викторина
      summary: Получить активную сессию
      description: 'Возвращает текущую незавершённую сессию (status=1, waiting или
        status=2, active) для указанного LED-устройства.

        Оператор использует запрос для отображения сессии, уже запущенной на этом
        устройстве.

        Если активной сессии нет — возвращает 404.

        '
      parameters:
      - name: device_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        description: Связанные данные для включения
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - teams
            - participants
            - current_question
            - current_round
            - timer
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Активная сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionFull'
        '404':
          description: Активной сессии нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{id}:
    get:
      tags:
      - Викторина
      summary: Получить сессию
      description: 'Без параметра select возвращает только базовые поля сессии (QuizSession).

        С параметром select возвращает QuizSessionFull с запрошенными связями. Пользователь
        определяется по access-токену и должен быть участником сессии; device-токен
        разрешён только для устройства этой сессии. `answer_submissions` сейчас содержит
        счётчики ответов. До раскрытия правильного ответа поля `is_correct` у вариантов
        и `answer_key` вопроса не возвращаются.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        description: Связанные данные для включения
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - teams
            - participants
            - current_question
            - current_round
            - timer
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Сессия. Без select — только базовые поля. С select — запрошенные
            связи заполнены, остальные null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionFull'
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{id}/finish:
    post:
      tags:
      - Викторина - Оператор
      summary: Завершить сессию
      description: Завершить сессию. Статус меняется на `3` (finished). Возвращает
        состояние завершённой сессии.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Сессия завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
  /quiz/sessions/{id}/teams/{teamId}:
    patch:
      tags:
      - Викторина - Оператор
      summary: Переименовать команду
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Команда обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTeam'
        '404':
          description: Сессия или команда не найдена
  /quiz/sessions/{id}/teams/{teamId}/captain:
    put:
      tags:
      - Викторина - Оператор
      summary: Назначить капитана команды
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - participant_id
              properties:
                participant_id:
                  type: integer
                  format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Капитан назначен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTeam'
        '404':
          description: Сессия, команда или участник не найдены
  /quiz/sessions/{id}/participants/{participantId}/team:
    patch:
      tags:
      - Викторина - Оператор
      summary: Переместить участника в другую команду
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: participantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - team_id
              properties:
                team_id:
                  type: integer
                  format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Участник перемещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizParticipant'
        '404':
          description: Сессия, участник или команда не найдены
        '409':
          description: В целевой команде достигнут лимит в 10 участников
  /quiz/sessions/{id}/next:
    post:
      tags:
      - Викторина - Оператор
      summary: Следующий вопрос / Начать игру
      description: 'Если сессия в статусе `1` (waiting) — запускает первый вопрос
        первого раунда (старт игры).

        При старте командной игры исключает пустые команды и требует не менее 2 оставшихся
        команд с минимум 2 участниками в каждой.

        Если игра идёт — переход к следующему вопросу. Между вопросами — таймер автопереключения
        (auto_next_delay).

        Если вопросов в раунде больше нет — показ результатов раунда, затем (через
        between_rounds_delay) — следующий раунд.

        После последнего вопроса последнего раунда — показ финальных результатов.
        Сессия остаётся в статусе `2` (active), оператор завершает её явно через `POST
        /quiz/sessions/{id}/finish`.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Текущее состояние игры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_team_members:
                  summary: Недостаточный состав при старте игры
                  value:
                    error: insufficient_team_members
                    message: Для старта нужны минимум 2 команды по 2 участника
                session_finished:
                  summary: Сессия завершена
                  value:
                    error: session_finished
                    message: Сессия уже завершена
                no_more_questions:
                  summary: Нет следующих вопросов
                  value:
                    error: no_more_questions
                    message: Это последний вопрос, используйте finish для завершения
  /quiz/sessions/{id}/reveal:
    post:
      tags:
      - Викторина - Оператор
      summary: Показать ответ
      description: Показать правильный ответ с пояснением (используется если auto_reveal
        = false)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Правильный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: object
                    description: Эталонный ответ в формате соответствующего question_type
                    additionalProperties: true
                  explanation:
                    type: string
                    nullable: true
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_revealed:
                  summary: Ответ уже показан
                  value:
                    error: already_revealed
                    message: Правильный ответ уже был показан
                no_active_question:
                  summary: Нет активного вопроса
                  value:
                    error: no_active_question
                    message: Нет активного вопроса для показа ответа
  /quiz/sessions/{id}/timer/pause:
    post:
      tags:
      - Викторина - Оператор
      summary: Пауза таймера
      description: Поставить на паузу таймер текущего вопроса
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Состояние таймера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTimerState'
  /quiz/sessions/{id}/timer/resume:
    post:
      tags:
      - Викторина - Оператор
      summary: Возобновить таймер
      description: Возобновить отсчёт таймера текущего вопроса
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Состояние таймера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTimerState'
  /quiz/sessions/{id}/timer/add-time:
    post:
      tags:
      - Викторина - Оператор
      summary: Добавить время
      description: Увеличить оставшееся время текущего вопроса. Работает при запущенном
        таймере и на паузе.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - seconds
              properties:
                seconds:
                  type: integer
                  minimum: 1
                  description: Сколько секунд добавить
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Обновлённое состояние таймера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTimerState'
        '400':
          description: Нет текущего вопроса или приём ответов уже закрыт
  /quiz/sessions/{id}/timer/stop:
    post:
      tags:
      - Викторина - Оператор
      summary: Остановить таймер
      description: Досрочно завершить приём ответов на текущий вопрос. После остановки
        применяется настройка `auto_reveal`; при выключенном автопоказе оператор вызывает
        `reveal` или `skip`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Текущее состояние игры после остановки таймера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
        '400':
          description: Нет текущего вопроса или приём ответов уже закрыт
  /quiz/sessions/{id}/skip:
    post:
      tags:
      - Викторина - Оператор
      summary: Пропустить показ ответа
      description: После закрытия приёма ответов перейти к следующему вопросу или
        результатам раунда без показа правильного ответа. Уже принятые зачётные ответы
        проверяются автоматически.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Текущее состояние игры после перехода
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
        '400':
          description: Нет текущего вопроса или приём ответов ещё открыт
  /quiz/sessions/{id}/led/next:
    post:
      tags:
      - Викторина - LED
      summary: Следующий вопрос (LED)
      description: 'LED-экран вызывает этот endpoint после окончания таймера.

        Если время вышло и `auto_reveal = true` — автоматически показывает правильный
        ответ и начисляет баллы.

        Если ответ уже показан — переходит к следующему вопросу.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Текущее состояние сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
  /quiz/sessions/{id}/results:
    get:
      tags:
      - Викторина - Оператор
      summary: Текущий результат
      description: 'Актуальный рейтинг на текущий момент. Можно запрашивать в любой
        момент — между раундами или после завершения сессии.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Текущий результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTotalResult'
  /quiz/sessions/{sessionId}/join:
    post:
      tags:
      - Викторина - Игрок
      summary: Подключиться к сессии
      description: Подключиться с user access-токеном после гостевого входа или OAuth.
        Повторный запрос возвращает того же участника.
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Подключён
          content:
            application/json:
              schema:
                type: object
                required:
                - participant_id
                - session_id
                - mode
                properties:
                  participant_id:
                    type: integer
                    format: int64
                    description: ID GameSessionParticipant
                  session_id:
                    type: integer
                    format: int64
                  mode:
                    type: integer
                    enum:
                    - 1
                    - 2
                    description: 1 — individual, 2 — team
                  teams:
                    type: array
                    description: Список команд (для mode=2, team)
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        name:
                          type: string
                        color:
                          type: string
                        participant_count:
                          type: integer
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Сессия уже завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{sessionId}/team/{teamId}/join:
    post:
      tags:
      - Викторина - Игрок
      summary: Выбрать команду
      description: Присоединиться к команде (для mode=team). Участник определяется
        по текущему пользователю. Сначала вызовите /join; смена команды доступна оператору.
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Присоединился к команде
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_id:
                    type: integer
                    format: int64
                  team_id:
                    type: integer
                    format: int64
                  is_captain:
                    type: boolean
                    description: true если участник стал капитаном (первый в команде)
        '409':
          description: Сессия уже началась или команда заполнена (10 участников)
  /quiz/sessions/{sessionId}/answer:
    post:
      tags:
      - Викторина - Игрок
      summary: Ответ на вопрос
      description: 'User access-токен обязателен. Участник определяется по пользователю
        и сессии.

        Ответ на текущий вопрос. Поведение зависит от режима и роли:

        - Individual mode: ответ засчитывается

        - Team mode, обычный участник: сохраняется как голос (для отображения капитану)

        - Team mode, капитан: предварительный ответ при `is_final=false`, зачётный
        ответ команды при `is_final=true`

        '
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - answer
              additionalProperties: false
              properties:
                answer:
                  type: object
                  description: JSON-ответ согласно типу вопроса; форматы описаны в
                    entities/quiz.md
                  additionalProperties: true
                is_final:
                  type: boolean
                  default: false
                  description: true только для решающего ответа капитана команды;
                    false означает предварительный ответ участника
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Ответ принят
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_answered:
                  summary: Уже ответил
                  value:
                    error: already_answered
                    message: Вы уже дали ответ на этот вопрос
                answering_closed:
                  summary: Приём ответов завершён
                  value:
                    error: answering_closed
                    message: Приём ответов на этот вопрос завершён
                captain_already_answered:
                  summary: Капитан уже отправил решающий ответ
                  value:
                    error: captain_already_answered
                    message: Капитан команды уже отправил решающий ответ
                not_captain:
                  summary: Решающий ответ может отправить только капитан
                  value:
                    error: not_captain
                    message: Только капитан может отправить решающий ответ команды
        '404':
          description: Сессия или вопрос не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/devices:
    post:
      tags:
      - LED-устройства
      summary: Зарегистрировать устройство
      description: 'Требуется staff access-токен оператора.

        Зарегистрировать новое LED-устройство и выпустить для него device-токен (JWT,
        привязан к `device_id`).

        Токен возвращается только один раз, в ответе на регистрацию — сохраните его
        в конфигурации плеера.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                location:
                  type: string
                  nullable: true
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '201':
          description: Устройство зарегистрировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceWithToken'
    get:
      tags:
      - LED-устройства
      summary: Список устройств
      description: Требуется staff access-токен оператора. Получить список зарегистрированных
        LED-устройств
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Список устройств
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
  /cms/devices/{id}:
    get:
      tags:
      - LED-устройства
      summary: Получить устройство
      description: Требуется staff access-токен оператора.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Устройство
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          description: Устройство не найдено
    delete:
      tags:
      - LED-устройства
      summary: Отозвать устройство
      description: Требуется staff access-токен оператора. Отзывает device-токен устройства
        (`is_active = false`). Существующий токен перестаёт приниматься сервером.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '204':
          description: Устройство отозвано
        '404':
          description: Устройство не найдено
  /cms/devices/{device_id}/refresh-token:
    post:
      tags:
      - LED-устройства
      summary: Обновить JWT устройства
      description: Требуется staff access-токен оператора. Выпустить новый device
        JWT по идентификатору активного устройства.
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Новый токен устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '404':
          description: Устройство не найдено
        '409':
          description: Устройство неактивно
  /cms/video-scenarios:
    get:
      tags:
      - Профессии в действии - CMS
      summary: Список видеосценариев
      description: Требуется staff access-токен редактора контента или оператора.
        Получить список видеосценариев с фильтрацией и пагинацией
      parameters:
      - name: profession_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по профессии
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Список видеосценариев
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InteractiveVideoScenario'
                  total:
                    type: integer
    post:
      tags:
      - Профессии в действии - CMS
      summary: Создать видеосценарий
      description: 'Требуется staff access-токен редактора контента.

        Создать новый видеосценарий. Стартовая ветка создаётся автоматически,

        её `media_id` заполняется системным видео-заглушкой (`DEFAULT_SCENARIO_VIDEO_ID`)
        — замените его на реальное видео через `PUT /cms/video-scenarios/{id}/branches/{branchId}`.

        Для добавления дочерних веток используйте `POST /cms/video-scenarios/{id}/branches`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              properties:
                title:
                  type: string
                description:
                  type: string
                profession_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '201':
          description: Видеосценарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenario'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/video-scenarios/{id}:
    get:
      tags:
      - Профессии в действии - CMS
      summary: Получить видеосценарий
      description: Требуется staff access-токен редактора контента или оператора.
        Получить видеосценарий с деревом веток
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Видеосценарий с деревом веток
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioFull'
        '404':
          description: Видеосценарий не найден
    put:
      tags:
      - Профессии в действии - CMS
      summary: Обновить видеосценарий
      description: Требуется staff access-токен редактора контента. Обновить название,
        описание или профессию
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                profession_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Видеосценарий обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenario'
        '404':
          description: Видеосценарий не найден
    delete:
      tags:
      - Профессии в действии - CMS
      summary: Удалить видеосценарий
      description: Требуется staff access-токен редактора контента. Удалить видеосценарий
        (только если не использовался в активных сессиях)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '204':
          description: Видеосценарий удалён
        '409':
          description: Видеосценарий использовался в сессиях, удаление невозможно
  /cms/video-scenarios/{id}/branches:
    post:
      tags:
      - Профессии в действии - CMS
      summary: Добавить ветку
      description: 'Требуется staff access-токен редактора контента.

        Добавить дочернюю ветку к указанному родителю.

        Если `parent_id` не указан — добавляется как вариант выбора для стартовой
        ветки.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: ID видеосценария
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - parent_id
              - text
              - media_id
              properties:
                parent_id:
                  type: integer
                  format: int64
                  description: ID родительской ветки
                text:
                  type: string
                  description: Текст варианта выбора
                media_id:
                  type: integer
                  format: int64
                  description: ID видеофайла
                prompt:
                  type: string
                  description: Текст вопроса в точке выбора (для родительской ветки)
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '201':
          description: Ветка добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/video-scenarios/{id}/branches/{branchId}:
    put:
      tags:
      - Профессии в действии - CMS
      summary: Обновить ветку
      description: Требуется staff access-токен редактора контента. Обновить текст
        вопроса, текст варианта или видеофайл
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: branchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                prompt:
                  type: string
                media_id:
                  type: integer
                  format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Ветка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
        '404':
          description: Ветка не найдена
    delete:
      tags:
      - Профессии в действии - CMS
      summary: Удалить ветку
      description: Требуется staff access-токен редактора контента. Удалить ветку
        и все её дочерние ветки. Стартовую ветку удалить нельзя.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: branchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '204':
          description: Ветка удалена
        '400':
          description: Нельзя удалить стартовую ветку
        '404':
          description: Ветка не найдена
  /interactive-video/sessions:
    post:
      tags:
      - Профессии в действии - Оператор
      summary: Запустить показ
      description: 'Запустить показ видеосценариев на LED-экране. Требуется staff
        access-токен оператора или администратора.

        В `settings` передаётся либо `scenario_ids` (ручной выбор), либо `profession_count`
        (случайный выбор N сценариев).

        Бэкенд конвертит `profession_count` в `scenario_ids` перед сохранением.

        Статус сессии сразу становится `active`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - device_id
              - settings
              properties:
                device_id:
                  type: integer
                  format: int64
                  description: Идентификатор LED-устройства, на котором запускается
                    показ
                settings:
                  type: object
                  required:
                  - scenario_ids или profession_count
                  properties:
                    scenario_ids:
                      type: array
                      items:
                        type: integer
                        format: int64
                      description: ID видеосценариев для показа (ручной выбор)
                    profession_count:
                      type: integer
                      minimum: 1
                      maximum: 10
                      default: 3
                      description: Количество случайных сценариев для показа (если
                        scenario_ids не указан)
                    voting_duration:
                      type: integer
                      default: 30
                      description: Длительность голосования в секундах
                    result_display_duration:
                      type: integer
                      default: 5
                      description: Длительность показа результата в секундах
      responses:
        '401':
          description: Отсутствующий или недействительный staff access-токен
        '403':
          description: Требуется роль оператора или администратора
        '201':
          description: Показ запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoSession'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_scenarios:
                  summary: Нет доступных сценариев
                  value:
                    error: no_scenarios
                    message: Нет доступных видеосценариев для показа
                device_busy:
                  summary: Устройство занято
                  value:
                    error: device_busy
                    message: На этом устройстве уже запущена сессия
  /interactive-video/sessions/active:
    get:
      tags:
      - Профессии в действии
      summary: Получить активную сессию
      description: 'Доступ для оператора/администратора со staff access-токеном или
        LED с device-токеном. Для LED используется устройство из токена.

        Возвращает текущую активную сессию показа с полным состоянием.

        Если указан `device_id` — возвращает сессию для этого устройства.

        Если `device_id` не указан — возвращает любую активную сессию (для оператора).

        Используется LED-экраном при переподключении для восстановления состояния.

        Используется оператором при перезапуске планшета для возможности остановки.

        Если активной сессии нет — возвращает 404.

        '
      parameters:
      - name: device_id
        in: query
        schema:
          type: integer
          format: int64
        description: Идентификатор LED-устройства (если не указан — возвращается любая
          активная сессия)
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Активная сессия с полным состоянием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoState'
        '404':
          description: Активной сессии нет
  /interactive-video/sessions/{id}/stop:
    post:
      tags:
      - Профессии в действии - Оператор
      summary: Остановить показ
      description: Остановить показ и вернуть LED-экран в режим ожидания. Требуется
        staff access-токен оператора или администратора.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий или недействительный staff access-токен
        '403':
          description: Требуется роль оператора или администратора
        '204':
          description: Показ остановлен
        '404':
          description: Сессия не найдена
  /interactive-video/sessions/{id}/state:
    get:
      tags:
      - Профессии в действии - LED
      summary: Получить состояние показа
      description: 'Текущее состояние показа для LED-экрана.

        Включает информацию о текущем видео, точке голосования, результатах.

        LED-экран опрашивает этот эндпоинт для синхронизации.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Состояние показа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoState'
        '403':
          description: Сессия принадлежит другому устройству
        '404':
          description: Сессия не найдена
  /interactive-video/sessions/{id}/advance:
    post:
      tags:
      - Профессии в действии - LED
      summary: Сигнал окончания видео
      description: 'Вызывается LED-плеером, когда воспроизведение текущего видеофрагмента
        (`current_branch`) завершилось.

        Сервер не хранит длительность видео — момент перехода к точке голосования
        (или к следующему сценарию/завершению показа)

        определяется именно этим сигналом, а не таймером.

        Требует device-токен (`Authorization: Bearer <device token>`), полученный
        при регистрации устройства.

        - Если у `current_branch` есть дочерние ветки — показ переходит в фазу `voting`
        (голосование).

        - Если дочерних веток нет и в очереди остались сценарии — переход к следующему
        сценарию (`scenario_finished`).

        - Если дочерних веток нет и сценариев больше нет — показ завершается (`session_finished`).

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Обновлённое состояние показа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoState'
        '400':
          description: Показ сейчас не в фазе воспроизведения видео
        '403':
          description: Сессия принадлежит другому устройству
        '404':
          description: Сессия не найдена
  /interactive-video/sessions/{id}/voting:
    get:
      tags:
      - Профессии в действии - Зритель
      summary: Получить информацию о голосовании
      description: 'Информация о текущей точке голосования для мобильного клиента.
        Пользователь определяется по user access-токену.

        Включает варианты выбора, таймер, статус участника (проголосовал/не проголосовал),
        результат.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный user access-токен
        '200':
          description: Информация о голосовании
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoVoting'
        '404':
          description: Сессия или точка голосования не найдена
  /interactive-video/sessions/{sessionId}/join:
    post:
      tags:
      - Профессии в действии - Зритель
      summary: Подключиться к показу
      description: Подключиться с user access-токеном после гостевого входа или OAuth.
        Возвращает ID текущего пользователя. Повторный запрос возвращает тот же ID.
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный user access-токен
        '200':
          description: Подключён
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_id:
                    type: integer
                    format: int64
                  session_id:
                    type: integer
                    format: int64
        '404':
          description: Сессия не найдена
        '409':
          description: Показ уже завершён
  /interactive-video/sessions/{sessionId}/vote:
    post:
      tags:
      - Профессии в действии - Зритель
      summary: Проголосовать
      description: 'Проголосовать за вариант продолжения в точке голосования. Пользователь
        определяется по user access-токену.

        Один участник может проголосовать только один раз за каждую точку голосования.

        '
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - branch_id
              additionalProperties: false
              properties:
                branch_id:
                  type: integer
                  format: int64
                  description: ID выбранной ветки (варианта продолжения)
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный user access-токен
        '200':
          description: Голос принят
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                voting_closed:
                  summary: Голосование завершено
                  value:
                    error: voting_closed
                    message: Голосование уже завершено
                already_voted:
                  summary: Уже голосовал
                  value:
                    error: already_voted
                    message: Вы уже проголосовали
                invalid_branch:
                  summary: Неверная ветка
                  value:
                    error: invalid_branch
                    message: Выбранная ветка не является допустимым вариантом
        '404':
          description: Сессия или точка голосования не найдена
