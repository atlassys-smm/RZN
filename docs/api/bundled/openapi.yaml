    InteractiveVideoVoting:
      description: Информация о голосовании для мобильного клиента
      type: object
      properties:
        session_id:
          type: integer
          format: int64
        phase:
          type: string
          enum:
          - playing
          - voting
          description: 'Фаза показа:

            - `playing` — проигрывание ролика

            - `voting` — точка голосования, сбор ответов

            '
        voting_point:
          type: object
          nullable: true
          description: Точка голосования (заполняется в фазе voting)
          properties:
            prompt:
              type: string
              description: Текст вопроса/ситуации
            options:
              type: array
              description: Варианты выбора
              items:
                type: object
                properties:
                  branch_id:
                    type: integer
                    format: int64
                  text:
                    type: string
            timer:
              type: object
              properties:
                ends_at:
                  type: integer
                  format: int64
                  description: UNIX timestamp (мс), когда таймер закончится. Клиент
                    вычисляет remaining = ends_at - now.
            already_voted:
              type: boolean
