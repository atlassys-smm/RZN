    put:
      tags:
      - Организации
      summary: Обновить организацию
      description: Обновить организацию (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
