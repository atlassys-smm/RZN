  /quiz/sessions/{sessionId}/answer:
    post:
      tags:
      - Викторина - Игрок
      summary: Ответ на вопрос
      description: 'Ответ на текущий вопрос. Поведение зависит от режима и роли:

        - Individual mode: ответ засчитывается

        - Team mode, обычный участник: сохраняется как голос (для отображения капитану)

        - Team mode, капитан: предварительный ответ при `is_final=false`, зачётный
        ответ команды при `is_final=true`

        '
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - participant_id
              - answer
              properties:
                participant_id:
                  type: integer
                  format: int64
                  description: ID GameSessionParticipant, полученный при подключении
                answer:
                  type: object
                  description: JSON-ответ согласно типу вопроса; форматы описаны в
                    entities/quiz.md
                  additionalProperties: true
                is_final:
                  type: boolean
                  default: false
                  description: true только для решающего ответа капитана команды;
                    false означает предварительный ответ участника
      responses:
        '200':
          description: Ответ принят
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_answered:
                  summary: Уже ответил
