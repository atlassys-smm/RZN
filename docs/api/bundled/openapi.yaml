                $ref: '#/components/schemas/QuizTimerState'
  /quiz/sessions/{id}/timer/add-time:
    post:
      tags:
      - Викторина - Оператор
      summary: Добавить время
      description: Увеличить оставшееся время текущего вопроса. Работает при запущенном
        таймере и на паузе.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
