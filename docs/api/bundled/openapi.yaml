  /quiz/sessions:
    post:
      tags:
      - Викторина - Оператор
      summary: Создать сессию
      description: 'Создаёт сессию в статусе `1` (waiting). Она привязывается к LED-устройству
        `device_id`; на одном устройстве одновременно может быть только одна сессия
        со статусом `1` (waiting) или `2` (active).

        После создания в waiting устройство получает session_started в /api/device/sessions/ws
        с payload device_id, session_id и module=quiz.

        API принимает только готовый массив `rounds`, без `template_id`. Если оператор
        выбрал шаблон, клиент переносит его типы раундов и `question_ids` в этот массив.
        Для каждого раунда передаются либо конкретные `question_ids`, либо `question_count`
        и `question_filters` для автоматического выбора вопросов.

        Команды создаются автоматически по `settings.team_count` (для `mode = 2`,
        team).

        Оператор запускает первый вопрос через `POST /quiz/sessions/{id}/next`. Для
        командной игры нужны не менее двух команд с не менее чем двумя участниками
        в каждой. Пустые команды исключаются при старте. Состав раундов и вопросов
        после создания не редактируется.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - device_id
              - mode
              - rounds
              properties:
                device_id:
                  type: integer
                  format: int64
                  description: LED-устройство, на котором проводится сессия
                mode:
                  type: integer
                  enum:
                  - 1
                  - 2
                  description: 1 — individual, 2 — team
                rounds:
                  type: array
                  description: Раунды с вопросами из шаблона, выбранными явно по ID
                    или автоматически по количеству и фильтрам
                  items:
                    type: object
                    required:
                    - round_type
                    oneOf:
                    - required:
                      - question_ids
                    - required:
                      - question_count
                      - question_filters
                    properties:
                      round_type:
                        type: integer
                        enum:
                        - 1
                        - 2
                        - 3
                        - 4
                        - 5
                        - 6
                        - 7
                        - 8
                        - 9
                      question_ids:
                        type: array
                        description: Явно выбранные вопросы; используется вместо автоматического
                          выбора
                        items:
                          type: integer
                          format: int64
                      question_count:
                        type: integer
                        minimum: 1
                        description: Сколько вопросов автоматически выбрать для раунда
                      question_filters:
                        type: object
                        description: Фильтры кандидатов. Каждое поле необязательно;
                          заданные поля ограничивают выбор.
                        properties:
                          difficulty:
                            type: integer
                            enum:
                            - 1
                            - 2
                            - 3
                            description: Числовой ID сложности
                          age_group:
                            type: integer
                            description: Числовой ID возрастной группы
                          tags:
                            type: array
                            items:
                              type: string
                            description: Теги для фильтрации вопросов
                settings:
                  type: object
                  additionalProperties: false
                  properties:
                    team_count:
                      type: integer
                      minimum: 2
                      maximum: 8
                      description: Количество команд (для mode=2, team)
                    team_capacity:
                      type: integer
                      minimum: 2
                      maximum: 10
                      default: 10
                      description: Максимум участников в одной команде
                    auto_reveal_delay:
                      type:
                      - integer
                      - 'null'
                      minimum: 0
                      default: 0
                      description: Задержка показа ответа после закрытия приёма ответов,
                        в секундах. null отключает автоматическое действие; 0 выполняет
                        без ожидания. Если поле не передано, используется значение
                        из CMS.
                    auto_next_delay:
                      type:
                      - integer
                      - 'null'
                      minimum: 0
                      default: null
                      description: Задержка перехода к следующему вопросу внутри раунда
                        после показа ответа, в секундах. null отключает автоматическое
                        действие; 0 выполняет без ожидания. Если поле не передано,
                        используется значение из CMS.
                    between_rounds_delay:
                      type:
                      - integer
                      - 'null'
                      minimum: 0
                      default: 10
                      description: Задержка перехода к следующему раунду после показа
                        ответа на последний вопрос, в секундах. null отключает автоматическое
                        действие; 0 выполняет без ожидания. Если поле не передано,
                        используется значение из CMS.
                    show_intermediate_results:
                      type: boolean
                      default: true
                    scoring:
                      type: object
                      description: Настройки системы начисления баллов. Если не переданы
                        — подставляются стандартные из CMS
                      properties:
                        partial_correct:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                        speed_bonus:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            coefficient:
                              type: number
                              default: 1.5
                            threshold_percent:
                              type: integer
                              default: 50
                        streak_bonus:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            step:
                              type: number
                              default: 0.05
                            max:
                              type: number
                              default: 2.0
                        consensus_bonus:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            coefficient:
                              type: number
                              default: 1.2
                        final_multiplier:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            coefficient:
                              type: number
                              default: 1.5
                        penalty:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: false
                            coefficient:
                              type: number
                              default: 0.0
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '201':
          description: Сессия создана (статус waiting, ожидает старта оператора)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSession'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_rounds:
                  summary: Некорректные раунды
                  value:
                    error: invalid_rounds
                    message: Количество раундов должно быть от 3 до 8
                invalid_team_count:
                  summary: Некорректное количество команд
                  value:
                    error: invalid_team_count
                    message: Количество команд должно быть от 2 до 8
        '409':
          description: На этом устройстве уже есть незавершённая сессия
  /quiz/sessions/active:
    get:
      tags:
      - Викторина
      summary: Получить активную сессию
      description: "Возвращает текущую незавершённую сессию (status=1, waiting или\
        \ status=2, active) для указанного LED-устройства.\nОператор использует запрос\
        \ для отображения сессии, уже запущенной на этом устройстве.\nВсегда возвращает\
        \ `round_count` — общее количество раундов и `current_round_question_count`\
        \ — количество вопросов в текущем раунде. В статусе waiting счётчик вопросов\
        \ относится к первому раунду. current_question.revealed показывает реальное\
        \ раскрытие ответа на этот вопрос для всех ролей, независимо от select; в\
        \ waiting и finished объекта current_question нет. can_start_final_round показывает\
        \ возможность добавить финал после раскрытия последнего вопроса; в waiting\
        \ и при наличии FINAL он false.\nВо время active также возвращает текущий\
        \ раунд, вопрос и таймер. Сотрудник получает current_question.correct_answer\
        \ сразу; User и Device — только после reveal. Просмотр сотрудником не раскрывает\
        \ ответ для игроков. `select=answers` добавляет корневое поле `answers` с\
        \ голосами участников, решающими ответами и статусами команд, счётчиками по\
        \ вариантам; без параметра поле отсутствует. До начала и после завершения\
        \ игры `answers=null`. User в командной игре видит свою команду, StaffUser\
        \ — все команды, Device — общие счётчики и статусы без содержимого ответов.\
        \ `select=teams` и `select=participants` добавляют состав команд и участников;\
        \ несколько значений select передаются повторяющимися параметрами запроса.\n\
        Если активной сессии нет — возвращает 404.\n Для device-токена требуется роль\
        \ 1; другая группа устройства — 403."
      parameters:
      - name: device_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        description: Связанные данные для включения; answers добавляет голосование
          текущего вопроса в корневое поле answers.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - teams
            - participants
            - answers
            - current_question
            - current_round
            - timer
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Активная сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionFull'
        '404':
          description: Активной сессии нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{id}:
    get:
      tags:
      - Викторина
      summary: Получить сессию
      description: "Возвращает базовые поля сессии, счётчики round_count/current_round_question_count\
        \ и вычисляемый can_start_final_round. Во время active также возвращаются\
        \ текущий раунд, вопрос и таймер. current_question.revealed показывает реальное\
        \ раскрытие ответа на этот вопрос, независимо от роли и select; в waiting/finished\
        \ объекта current_question нет.\n`select=answers` добавляет корневое поле\
        \ `answers` с голосами участников, решающими ответами и статусами команд,\
        \ счётчиками по вариантам; без параметра поле отсутствует. До начала и после\
        \ завершения игры `answers=null`. User в командной игре видит свою команду,\
        \ StaffUser — все команды, Device — общие счётчики и статусы без содержимого\
        \ ответов. `select=teams` и `select=participants` добавляют состав команд\
        \ и участников. Несколько значений select передаются повторяющимися параметрами\
        \ запроса. Для авторизованного капитана `answer_submissions` текущего вопроса\
        \ содержит ответы его команды; участник определяется по access-токену. Сотрудник\
        \ получает current_question.correct_answer сразу; User и Device — только после\
        \ reveal. Просмотр сотрудником не раскрывает ответ для игроков. До раскрытия\
        \ правильного ответа поля `is_correct` у вариантов и `answer_key` вопроса\
        \ не возвращаются.\n Для device-токена требуется роль 1; другая группа устройства\
        \ — 403."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        description: Связанные данные для включения; answers добавляет голосование
          текущего вопроса в корневое поле answers.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - teams
            - participants
            - answers
            - current_question
            - current_round
            - timer
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Состояние сессии; select добавляет состав команд, участников
            и блок answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionFull'
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{id}/professions:
    get:
      tags:
      - Викторина
      summary: ID профессий по вопросам сессии
      operationId: quiz_session_professions_get
      description: 'До пяти уникальных ID профессий из снимков привязок всех вопросов
        всех раундов сессии, включая финальный и ещё не показанные вопросы. Частота
        считается по записям GameSessionQuestion: повтор одного вопроса считается
        повторно. Сортировка по количеству DESC, при равенстве по profession_id ASC.
        Вопросы без привязки исключаются. Изменение исходной привязки в CMS не меняет
        снимки сессии. Доступно для активных и завершённых сессий; не зависит от Redis
        и не меняет ход сессии. Допускаются ADMIN/OPERATOR и активное устройство роли
        1 только для собственной сессии. Мягко удалённые профессии не исключаются.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Массив ID профессий; при отсутствии привязок — пустой массив.
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                maxItems: 5
                items:
                  type: integer
                  format: int64
        '401':
          description: Отсутствующий или недействительный токен; User не допускается.
        '403':
          description: Недостаточно прав, неверная роль устройства или чужая сессия.
        '404':
          description: Сессия не найдена.
        '422':
          description: Некорректный ID сессии.
  /quiz/sessions/{id}/questions:
    get:
      tags:
      - Викторина
      summary: Список вопросов сессии для оператора
      operationId: quiz_session_questions_get
      description: Требуется staff access-токен admin/operator. Все вопросы всех раундов
        конкретной сессии в порядке GameSessionRound.order, GameSessionQuestion.order;
        повторения одного вопроса различаются по id записи сессии. В waiting все вопросы
        future. В active ранее пройденные позиции — passed, текущая позиция — current,
        остальные — future. Reveal, пауза и остановка таймера сохраняют current до
        next. После finish текущая и прежние позиции — passed, не показанные вопросы
        остаются future; завершённая до старта сессия содержит только future. Добавленный
        финальный раунд включается в конец списка. Чтение не изменяет ход сессии.
      x-implementation-status: implemented
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Упорядоченный список вопросов с вычисленным статусом прохождения.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizSessionQuestion'
        '401':
          description: Требуется действующий staff-токен; User и Device не допускаются.
        '403':
          description: Роль сотрудника не admin/operator.
        '404':
          description: Сессия не найдена.
        '422':
          description: Некорректный ID сессии.
  /quiz/sessions/{id}/final-round:
    post:
      tags:
      - Викторина - Оператор
      summary: Добавить и запустить финальный раунд
      description: 'Доступен admin/operator только в активной сессии после раскрытия
        последнего вопроса последнего раунда.

        Проверяется реальное раскрытие для игроков, а не наличие correct_answer у
        оператора.

        Создаёт последний GameSessionRound с round_type=9 и связанные GameSessionQuestion,

        переключает индексы и сразу запускает первый вопрос обычным механизмом викторины.

        В запросе укажите question_ids либо question_count с необязательными question_filters.

        При одновременной передаче приоритет у question_ids. Отсутствие или null фильтров
        означает выбор без фильтров.

        Отбор использует общую базу вопросов, как при создании сессии; ранее использованные
        вопросы не исключаются.

        Начальные 3–8 раундов дополняются одним финальным: после 8 основных допустимо
        9 раундов.

        Статус остаётся active; ID сессии, участники, команды, настройки и набранные
        баллы сохраняются.

        Повторный или параллельный запрос не добавляет второй финал: существующий
        FINAL в любом месте сессии даёт 409.

        Если вопросы не найдены или их недостаточно, раунд не создаётся и текущая
        позиция не меняется.

        Возвращает состояние с can_start_final_round=false; первый вопрос имеет работающий
        таймер.

        Отправляются существующие question_started и session_state. События начала/завершения
        сессии устройства не отправляются.

        В финале действуют обычные переходы, ответы и final_multiplier. После последнего
        вопроса финала

        клиент завершает игру через /finish без повторного предложения финала. Сервер
        не добавляет новые задержки или временные метки.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalRoundRequest'
            examples:
              explicit:
                summary: Конкретные вопросы
                value:
                  question_ids:
                  - 101
                  - 102
              random:
                summary: Случайный выбор по фильтрам
                value:
                  question_count: 3
                  question_filters:
                    difficulty: 2
      responses:
        '200':
          description: Финальный раунд добавлен, первый вопрос запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
        '400':
          description: Сессия не active, основные вопросы ещё не раскрыты, способ
            выбора не указан, вопросы не найдены или их недостаточно
        '401':
          description: Отсутствует действующая авторизация сотрудника
        '403':
          description: Сотруднику требуется роль admin/operator
        '404':
          description: Сессия не найдена
        '409':
          description: В сессии уже есть финальный раунд
        '422':
          description: Некорректное тело запроса, пустой question_ids, question_count
            меньше 1 или неизвестное поле
  /quiz/sessions/{id}/finish:
    post:
      tags:
      - Викторина - Оператор
      summary: Завершить сессию
      description: После раскрытия последнего вопроса последнего раунда переносит
        счётчики личных правильных ответов из Redis в quiz/answers одной транзакцией
        со статусом сессии. Повторный finish не начисляет повторно; досрочный finish
        не начисляет ответы. Завершить сессию. Статус меняется на `3` (finished).
        Возвращает состояние завершённой сессии. После первого завершения устройство
        получает session_finished в /api/device/sessions/ws с module=quiz. Для индивидуального
        режима SESSION_FINISHED аналитики содержит results[{participant_id,user_id,total_score}]
        — снимок сохранённых личных баллов, включая нули, отправляемый после commit;
        повтор finish не создаёт событие. Командный payload не меняется.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Сессия завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
  /quiz/sessions/{id}/teams/{teamId}:
    patch:
      tags:
