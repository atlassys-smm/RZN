  /quiz/sessions/{sessionId}/join:
    post:
      tags:
      - Викторина - Игрок
      summary: Подключиться к сессии
      description: Подключиться к сессии по QR-коду
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Подключён
          content:
            application/json:
              schema:
                type: object
