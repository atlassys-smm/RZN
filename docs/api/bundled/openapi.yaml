                $ref: '#/components/schemas/QuizScenarioTemplate'
  /cms/quiz/templates/{id}/publish:
    post:
      tags:
      - Викторина - CMS
      summary: Опубликовать шаблон
      description: Изменить статус с draft на published — шаблон становится доступен
        оператору
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Шаблон опубликован
  /cms/quiz/templates/{id}/unpublish:
    post:
      tags:
      - Викторина - CMS
      summary: В черновик
      description: Изменить статус с published на draft
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Шаблон переведён в черновик
  /cms/quiz/templates/{id}/rounds:
