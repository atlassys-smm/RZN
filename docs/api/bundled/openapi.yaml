  /auth/user/oauth/{provider}:
    get:
      tags:
      - Авторизация пользователей
      summary: Вход через Яндекс ID / VK ID
      description: Фронтенд самостоятельно запускает OAuth и проверяет state. API
        принимает одноразовый код в параметре token, для VK также device_id, state,
        redirect_uri. Обязательны существующая версия согласия, consent_accepted=true
        и доверенный Origin/Referer. Access текущего гостя необязателен; он позволяет
        сохранить его ID при авторизации. При существующем OAuth-аккаунте выполняется
        вход в него без объединения истории. Access возвращается в JSON, refresh —
        в HttpOnly cookie. Ссылка аватара сохраняется в avatar_url и обновляется при
        входе, если отличается. Отсутствующий аватар не стирает прежнюю ссылку.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - yandex
          - vk
      - name: token
        in: query
        required: true
        description: Одноразовый код авторизации от провайдера
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: consent_version_id
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - name: consent_accepted
        in: query
        required: true
        schema:
          type: boolean
          enum:
          - true
      - name: device_id
        in: query
        required: false
        description: 'Обязателен для VK: ID устройства из ответа VK ID'
        schema:
          type: string
          minLength: 1
      - name: state
        in: query
        required: false
        description: 'Обязателен для VK: state, проверенный фронтендом'
        schema:
          type: string
          minLength: 1
      - name: redirect_uri
        in: query
        required: false
        description: 'Обязателен для VK: URI фронтенда, использованный при получении
          кода; его origin должен быть в AUTH_ALLOWED_ORIGINS'
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Авторизация завершена
          headers:
            Set-Cookie:
              schema:
                type: string
              description: user_refresh; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/user
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthTokenResponse'
                - type: object
                  required:
                  - user_id
                  - is_guest
                  properties:
                    user_id:
                      type: integer
                    is_guest:
                      type: boolean
                      enum:
                      - false
        '400':
          description: Отказ провайдера, недействительный или повторный код, неправильные
            параметры VK
        '401':
          description: Связанный аккаунт заблокирован или сессия отозвана
        '409':
          description: Смена OAuth-аккаунта у авторизованного пользователя не поддерживается
        '503':
          description: Провайдер не настроен или сервис временно недоступен
        '422':
          description: Некорректные параметры, согласие не принято или версия не существует
        '403':
          description: Недопустимый Origin/Referer
  /user/info:
    get:
      tags:
      - Пользователь
      summary: Данные пользователя
      description: Получение данных текущего пользователя по токену
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - is_guest
                properties:
                  id:
                    type: integer
                    description: ID пользователя
                  is_guest:
                    type: boolean
                    description: true — гость, false — авторизован
                  email:
                    type: string
                    nullable: true
                    description: Email (только для авторизованных)
                  first_name:
                    type: string
                    nullable: true
                    description: Имя из OAuth или заданное пользователем через PATCH
                      /user/info
                  last_name:
                    type: string
                    nullable: true
                    description: Фамилия из OAuth или заданная пользователем через
                      PATCH /user/info
                  avatar_url:
                    type: string
                    nullable: true
                    description: URL аватара (только для авторизованных)
                  gender:
                    type:
                    - integer
                    - 'null'
                    enum:
                    - 1
                    - 2
                    - null
                    description: 1 — мужской, 2 — женский; null — не указан.
                  birth_date:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Дата рождения YYYY-MM-DD или null.
        '401':
          description: Недействительный токен
    patch:
      tags:
      - Пользователь
      summary: Изменить данные пользователя
      description: 'Частично обновляет данные текущего пользователя по Bearer-токену,
        включая

        гостя с действующей сессией. Принимает first_name, last_name, gender и birth_date:

        хотя бы одно поле обязательно. Пропущенные поля сохраняются. Пробелы по краям

        имени и фамилии удаляются до проверки длины; null для них не принимается.

        Пол: 1 — мужской, 2 — женский. Дата рождения — YYYY-MM-DD. Пол и дату

        рождения можно очистить значением null. При следующем OAuth-входе эти

        данные могут быть обновлены данными провайдера.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Непустое имя после удаления пробелов по краям.
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Непустая фамилия после удаления пробелов по краям.
                gender:
                  type:
                  - integer
                  - 'null'
                  enum:
                  - 1
                  - 2
                  - null
                  description: 1 — мужской, 2 — женский; null очищает значение.
                birth_date:
                  type:
                  - string
                  - 'null'
                  format: date
                  description: Дата рождения YYYY-MM-DD; null очищает значение.
            example:
              first_name: Анна
              last_name: Иванова
              gender: 2
              birth_date: '2000-05-17'
      responses:
        '200':
          description: Обновлённые данные текущего пользователя
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            Pragma:
              schema:
                type: string
                enum:
                - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          description: Токен отсутствует или недействителен; токены сотрудников и
            устройств не принимаются
        '422':
          description: Не передано ни одного поля; имя или фамилия null, не строка,
            пустые, длиннее 255 символов; недопустимый пол или дата рождения; переданы
            лишние поля
  /users/me/recommendations:
    get:
      tags:
      - Рекомендации пользователя
      summary: Общий профиль рекомендаций текущего пользователя
      operationId: user_recommendations_get
      description: 'Дополнительный источник quiz/answers пополняется при полном завершении
        викторины: group_scores содержит profession_id/answers_count, оценки — 100
        × answers_count / максимум; reasons — answers_count/max_answers_count. Вес
        викторины 1, просмотров 4; оба источника необязательны и пустыми не влияют
        на знаменатель. Источник professions/views обновляется перед расчётом при
        отсутствии записи или возрасте более 6 часов: первый импорт за 30 суток, далее
        прибавление событий [updated_at, начало выборки). Счётчики в group_scores,
        оценки в profession_scores — 100 × просмотры / максимум. Пустой views не участвует
        в расчёте; views необязателен для is_complete и не входит в missing_sources.
        Ошибка ClickHouse сохраняет прежние данные и updated_at. User JWT или Device
        JWT с ролью 3 и действующей QR-привязкой; для устройства обязателен X-Device-Connection-Id.
        Профиль с максимум тремя профессиями и вкладами источников. Каждая профессия
        содержит description — текущее описание из справочника или null, а также file:
        собственный файл; при пустом media_id — male_photo_file_id шаблона аватара;
        без обоих — null. Название и баллы сохраняют значения из снимков источников.
        До первого сохранённого источника — JSON null. В расчёте участвуют только
        источники с положительным весом в SOURCE_WEIGHTS. Рейтинг рассчитывается при
        каждом запросе из снимков источников; веса заданы в коде, итог не сохраняется.
        Мягкое удаление профессии (`deleted_at`) не исключает её из ранее сохранённых
        рекомендаций: ID, название и исходные баллы берутся из снимка источника. При
        новом прохождении подбираются только активные профессии по активным связям.
        По максимум трём профессиям из итогового рейтинга рассчитываются три отдельных
        списка: `employers` (до 5 работодателей типа 1), `educations` (до 5 учебных
        заведений типа 2) и `education_programs` (до 5 направлений подготовки). Работодатели
        определяются через profession_employers, учебные заведения — через profession_education_programs
        → education_programs → organization_education_programs → organizations. Направления
        подбираются непосредственно через profession_education_programs → education_programs,
        независимо от наличия организаций. В каждом списке сначала идут записи с большим
        числом различных совпавших профессий, затем с меньшим ID. Несколько программ
        одной профессии не увеличивают её вклад в рейтинг организации. Элементы списков
        организаций содержат `organization` (полные данные организации), `profession_ids`
        (по возрастанию ID), `profession_count` и `position` (1–5). В списке направлений
        вместо `organization` возвращается `education_program`: id, name, education_level,
        duration, base_class, created_at, updated_at; остальные поля совпадают. Общее
        направление возвращается один раз независимо от числа его организаций. Профессии,
        связи, программы и организации с deleted_at участвуют в расчёте для сохранённых
        рекомендаций. Данные и связи читаются в текущем состоянии при каждом GET;
        снимки этих трёх списков не сохраняются. При отсутствии профессий или соответствующих
        связей массивы пустые; до создания профиля ответ остаётся null. Правило покрытия
        применяется отдельно к каждому из трёх списков: employers, educations, education_programs.
        Сначала формируется топ-5 по числу различных совпавших профессий DESC и ID
        организации или направления ASC. Затем проверяется покрытие каждой выбранной
        профессии. Если для неё есть связанные записи, но ни одна не попала в топ-5,
        лучшая из них заменяет последнюю запись, удаление которой не лишает покрытия
        другие профессии. Одна запись может покрывать несколько профессий. После замен
        сохраняется сортировка по рейтингу; лимит — 5 уникальных записей в каждом
        списке. Если соответствующих связей нет, покрытие этой профессии в данном
        списке не требуется.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DeviceConnectionId'
      responses:
        '403':
          description: Недостаточная роль устройства или пользователь не подключён
            к этому устройству.
        '422':
          description: Некорректные параметры; для Device JWT обязателен X-Device-Connection-Id.
        '200':
