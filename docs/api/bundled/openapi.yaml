  /feedback/surveys/{survey_id}/start:
    post:
      tags:
      - Обратная связь - Пользователь
      summary: Начать заполнение анкеты
      description: 'Создать незавершённый SurveyResponse перед показом первого вопроса.
        started_at назначается сервером, completed_at остаётся NULL. Требуется User
        JWT либо Device JWT с ролью 4 и действующей QR-привязкой. Для устройства обязателен
        X-Device-Connection-Id. Полученный id передать как response_id в respond.
        Каждый вызов start создаёт новое прохождение: после успешного ответа используйте
        сохранённый id, не вызывайте start повторно.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DeviceConnectionId'
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackStartRequest'
      responses:
        '201':
          description: Создан незавершённый ответ на анкету
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackStartResponse'
        '401':
          description: Требуется действующий токен пользователя или устройства
        '403':
          description: Недостаточная роль устройства или пользователь не подключён
        '404':
          description: Анкета не найдена
        '422':
          description: Анкета неактивна, неверное тело или не передан заголовок подключения
  /feedback/surveys/{survey_id}/respond:
    post:
      tags:
      - Обратная связь - Пользователь
      summary: Ответить на анкету
      description: 'Отправить ответы по User JWT либо Device JWT с ролью 4 и действующей
        QR-привязкой. Для устройства обязателен X-Device-Connection-Id; пользователь
        определяется по связи в Redis. При User JWT владелец определяется по токену;
        user_id в JSON запрещён. Новый поток: сначала start, затем response_id в этом
        запросе. Повтор с тем же response_id и ответами возвращает прежний результат
        без новых событий. Другие ответы, согласие или источник завершённого прохождения
        дают 409. Без response_id сохранение остаётся совместимым со старым клиентом:
        есть оценки и окончание, но нет реального старта или защиты от повторной отправки.
        Оценка rating_scale — целое число в границах шкалы; чужие и повторные question_id
        отклоняются. Для SINGLE_CHOICE value содержит строку с ID варианта, для MULTIPLE_CHOICE
        и PROFESSION_CHOICE — строку с JSON-массивом ID вариантов. ID должны принадлежать
        вопросу и не повторяться.'
      parameters:
      - $ref: '#/components/parameters/DeviceConnectionId'
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Идентификатор анкеты
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmitRequest'
      responses:
        '403':
          description: Недостаточная роль устройства или пользователь не подключён
            к этому устройству.
        '401':
          description: Недействительный или отсутствующий user access-токен
        '201':
          description: Ответы отправлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackSubmitResponse'
        '404':
          description: Анкета не найдена
        '409':
          description: Источник или ответы не совпадают с сохранённым прохождением
        '422':
          description: Анкета не активна, оценка некорректна или вопрос чужой/повторный
  /files/{file_uuid}:
