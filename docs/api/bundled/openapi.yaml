    ProfStartResult:
      type: object
      additionalProperties: false
      required:
      - session_id
      - test_id
      - test_type_id
      - user_id
      - test_code_type
      - test_version
      - answered_count
      - question_count
      - created_at
      - scores
      - answers
      - professions
      properties:
        session_id:
          type: integer
          format: int64
          minimum: 1
        test_id:
          type: integer
          format: int64
          minimum: 1
        test_type_id:
          type: integer
          format: int64
          minimum: 1
        user_id:
          type: integer
          format: int64
          minimum: 1
        test_version:
          type: integer
          minimum: 1
        answered_count:
          type: integer
          minimum: 1
        question_count:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        scores:
          type: array
          items:
            $ref: '#/components/schemas/ProfStartScore'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/ProfStartSavedAnswer'
        professions:
          type: array
          description: Наиболее подходящие профессии этого прохождения; score DESC,
            profession_id ASC; пустой список, если рекомендаций нет
          items:
            $ref: '#/components/schemas/ProfStartRecommendedProfession'
        test_code_type:
          type: string
      allOf:
      - if:
          properties:
            test_code_type:
              const: solomin
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 42
            answered_count:
              const: 42
            scores:
              minItems: 7
              maxItems: 7
              items:
                properties:
                  group_code:
                    enum:
                    - human_human
                    - human_technology
                    - human_sign
                    - human_art
                    - human_nature
                    - executive
                    - creative
                  category:
                    enum:
                    - subject
                    - labor
                  raw_score:
                    maximum: 18
                    multipleOf: 1
                  max_score:
                    const: 18
      - if:
          properties:
            test_code_type:
              const: holland
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 15
            answered_count:
              const: 15
            scores:
              minItems: 6
              maxItems: 6
              items:
                properties:
                  group_code:
                    enum:
                    - R
                    - I
                    - S
                    - E
                    - C
                    - A
                  category:
                    enum:
                    - riasec
                  raw_score:
                    maximum: 15
                    multipleOf: 1
                  max_score:
                    const: 15
      - if:
          properties:
            test_code_type:
              const: dellinger
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 1
            answered_count:
              const: 1
            scores:
              minItems: 5
              maxItems: 5
              items:
                properties:
                  group_code:
                    enum:
                    - square
                    - triangle
                    - circle
                    - zigzag
                    - rectangle
                  category:
                    enum:
                    - geometry
                  raw_score:
                    maximum: 1
                    multipleOf: 1
                  max_score:
                    const: 1
      description: Сохранённые показатели групп завершённой сессии. Общие рекомендации
        доступны через /users/me/recommendations.
