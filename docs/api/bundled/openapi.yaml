    ProfStartTest:
      type: object
      additionalProperties: false
      required:
      - id
      - test_type_id
      - test_code_type
      - version
      - name
      - description
      - instructions
      - age_group_ids
      - question_count
      - group_count
      - published_at
      - created_at
      - updated_at
      - status
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        test_type_id:
          type: integer
          format: int64
          minimum: 1
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
          default: ''
        instructions:
          type: string
          default: ''
        age_group_ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          uniqueItems: true
          default: []
        question_count:
          type: integer
          minimum: 0
        group_count:
          type: integer
          minimum: 0
        published_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Дата первой публикации; null у draft.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        test_code_type:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          minLength: 1
          maxLength: 64
          description: Код типа теста.
        status:
          type: integer
          format: int32
          enum:
          - 1
          - 2
          - 3
          description: 1 — draft, 2 — active, 3 — archived.
      allOf:
      - if:
          properties:
            status:
              const: 1
          required:
          - status
        then:
          properties:
            published_at:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - 2
              - 3
          required:
          - status
        then:
          properties:
            published_at:
              type: string
      - if:
          properties:
            status:
              enum:
              - 2
              - 3
            test_code_type:
              const: solomin
          required:
          - status
          - test_code_type
        then:
          properties:
            question_count:
              const: 42
            group_count:
              const: 7
      - if:
          properties:
            status:
              enum:
              - 2
              - 3
            test_code_type:
              const: holland
          required:
          - status
          - test_code_type
        then:
          properties:
            question_count:
              const: 15
            group_count:
              const: 6
      - if:
          properties:
            status:
              enum:
              - 2
              - 3
            test_code_type:
              const: dellinger
          required:
          - status
          - test_code_type
        then:
          properties:
            question_count:
              const: 1
            group_count:
              const: 5
    ProfStartPublicTest:
      type: object
      additionalProperties: false
      required:
      - id
      - test_type_id
      - test_code_type
      - version
      - name
      - description
      - instructions
      - age_group_ids
      - question_count
      - status
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        test_type_id:
          type: integer
          format: int64
          minimum: 1
        version:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        age_group_ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          uniqueItems: true
        question_count:
          type: integer
          minimum: 1
        test_code_type:
          type: string
        status:
          type: integer
          format: int32
          enum:
          - 2
          - 3
          description: 2 — active, 3 — archived.
      allOf:
      - if:
          properties:
            test_code_type:
              const: solomin
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 42
      - if:
          properties:
            test_code_type:
              const: holland
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 15
      - if:
          properties:
