        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - participant_id
              properties:
                participant_id:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Капитан назначен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTeam'
        '404':
          description: Сессия, команда или участник не найдены
  /quiz/sessions/{id}/participants/{participantId}/team:
    patch:
      tags:
      - Викторина - Оператор
      summary: Переместить участника в другую команду
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: participantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
