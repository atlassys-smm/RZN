components:
  parameters:
    DeviceConnectionId:
      name: X-Device-Connection-Id
      in: header
      required: false
      description: Обязателен для личных операций по Device JWT. Возьмите connection_id
        из /device/auth/user; пользователь определяется по Redis-привязке. При User
        JWT заголовок не требуется.
      schema:
        type: string
    RequiredDeviceConnectionId:
      name: X-Device-Connection-Id
      in: header
      required: true
      description: connection_id текущего подключения из /device/auth/user; требуется
        вместе с Device JWT.
      schema:
        type: string
    DeviceCatalogConnectionId:
      name: X-Device-Connection-Id
      in: header
      required: false
      description: Для персонализации каталога по Device JWT передайте connection_id
        текущего подключения. Без заголовка устройство читает общий каталог. При User
        JWT используется владелец токена.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    staffRefresh:
      type: apiKey
      in: cookie
      name: staff_refresh
    userRefresh:
      type: apiKey
      in: cookie
      name: user_refresh
  schemas:
    LedScreensaver:
      type: object
      required:
      - id
      - name
      - file
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 255
        file:
          $ref: '#/components/schemas/FileResponse'
    LedScreensaverList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedScreensaver'
        total:
          type: integer
    AnalyticsMetabaseObject:
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: integer
          description: Текущий числовой ID объекта Metabase
          example: 101
        type:
          type: string
          enum:
          - collection
          - dashboard
