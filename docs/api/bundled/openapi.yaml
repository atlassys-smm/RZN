                properties:
                  branch_id:
                    type: integer
                    format: int64
                  text:
                    type: string
        voting_point:
          type: object
          nullable: true
          description: Информация о голосовании (заполняется в фазе voting)
          required:
          - voted_count
          - participant_count
          properties:
            voted_count:
              type: integer
              minimum: 0
              description: Число уникальных пользователей, уже проголосовавших в текущей
                точке выбора.
            participant_count:
              type: integer
              minimum: 0
              description: Счётчик успешных join за всю сессию, используемый как общее
                возможное число голосов. Каждый повторный join тоже увеличивает значение;
                это не число уникальных или онлайн-зрителей. Голосование без join
                не увеличивает счётчик.
            timer:
              type: object
              properties:
                ends_at:
                  type: integer
                  format: int64
                  description: UNIX timestamp (мс), когда таймер закончится. Клиент
                    вычисляет remaining = ends_at - now.
            votes:
              type: array
              description: Распределение голосов
              items:
                type: object
                properties:
                  branch_id:
                    type: integer
                    format: int64
                  count:
                    type: integer
