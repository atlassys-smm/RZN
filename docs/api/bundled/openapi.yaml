  /cms/video-scenarios:
    get:
      tags:
      - Профессии в действии - CMS
      summary: Список видеосценариев
      description: Требуется staff access-токен редактора контента или оператора.
        Получить список видеосценариев с фильтрацией и пагинацией. Каждый элемент
        содержит profession_id. При select=profession добавляется вложенный profession
        с полными данными профессии; без привязки profession=null. Без select=profession
        поле profession отсутствует. Мягко удалённая профессия существующего сценария
        также возвращается при выборе profession.
      parameters:
      - name: profession_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по профессии
      - name: select
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        description: 'Дополнительные данные: select=profession включает полную профессию.
          Параметр можно повторять; неизвестные значения игнорируются. По умолчанию
          дополнительные данные не загружаются.'
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Список видеосценариев
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InteractiveVideoScenarioListItem'
                  total:
                    type: integer
    post:
      tags:
      - Профессии в действии - CMS
      summary: Создать видеосценарий
      description: 'Требуется staff access-токен редактора контента.

        Создать новый видеосценарий. Стартовая ветка создаётся автоматически,

        её видео заполняется системным видео-заглушкой (`DEFAULT_SCENARIO_VIDEO_ID`)
        — замените его на реальное видео через `PUT /cms/video-scenarios/{id}/branches/{branchId}`.

        Для добавления дочерних веток используйте `POST /cms/video-scenarios/{id}/branches`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              properties:
                title:
                  type: string
                description:
                  type: string
                profession_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '201':
          description: Видеосценарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenario'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/video-scenarios/{id}:
    get:
      tags:
      - Профессии в действии - CMS
      summary: Получить видеосценарий
      description: Требуется staff access-токен редактора контента или оператора.
        Получить видеосценарий с деревом веток. При select=profession добавляется
        полная связанная профессия (включая мягко удалённую), без привязки — profession=null.
        Без этого параметра поле profession отсутствует и данные профессии не загружаются.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        description: 'Дополнительные данные: select=profession включает полную профессию.
          Параметр можно повторять; неизвестные значения игнорируются.'
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Видеосценарий с деревом веток
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioFull'
        '404':
          description: Видеосценарий не найден
    put:
      tags:
      - Профессии в действии - CMS
      summary: Обновить видеосценарий
      description: Требуется staff access-токен редактора контента. Обновить название,
        описание или профессию
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                profession_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Видеосценарий обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenario'
        '404':
          description: Видеосценарий не найден
    delete:
      tags:
      - Профессии в действии - CMS
      summary: Удалить видеосценарий
      description: Требуется staff access-токен редактора контента. Удалить видеосценарий
        (только если не использовался в активных сессиях)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '204':
          description: Видеосценарий удалён
        '409':
          description: Видеосценарий использовался в сессиях, удаление невозможно
  /cms/video-scenarios/{id}/branches:
    post:
      tags:
      - Профессии в действии - CMS
      summary: Добавить ветку
      description: 'Требуется staff access-токен редактора контента.

        Добавить дочернюю ветку к указанному родителю.

        `parent_id` и `text` обязательны. Для обычной ветки обязателен `file` multipart/form-data.

        Ссылочной ветке достаточно `reference_branch_id` существующей ветки того же
        сценария:

        сохраняется собственный `text`, показ сразу переходит к видео, вопросу и вариантам
        цели.

        Цепочки ссылок допустимы; отсутствующая цель, другой сценарий и циклы — 400.

        Ссылочная ветка не может быть родителем. Без файла и ссылки — 422.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: ID видеосценария
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              properties:
                reference_branch_id:
                  type: integer
                  format: int64
                  nullable: true
                  description: ID существующей ветки того же сценария; без ссылки
                    требуется file
                parent_id:
                  type: integer
                  title: Parent Id
                text:
                  type: string
                  title: Text
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  title: File
                file_preview:
                  anyOf:
                  - type: string
                    contentMediaType: application/octet-stream
                  - type: 'null'
                  title: File Preview
                prompt:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Prompt
                file_title:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: File Title
                file_description:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: File Description
              type: object
              required:
              - parent_id
              - text
              title: Body_create_branch_api_cms_video_scenarios__scenario_id__branches_post
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '201':
          description: Ветка добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
        '422':
          description: Для ветки без ссылки требуется видеофайл или неверный формат
            поля
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/video-scenarios/{id}/branches/{branchId}:
    put:
      tags:
      - Профессии в действии - CMS
      summary: Обновить ветку
      description: 'Требуется staff access-токен редактора контента. Обновляет текст
        вопроса, текст варианта, видео или ссылку.

        reference_branch_id отсутствует — сохранить ссылку; пустое значение — снять
        ссылку.

        При снятии ссылки нужно собственное сохранённое видео или новый file, иначе
        422.

        При выборе ссылки используются видео, вопрос и дальнейшие варианты конечной
        цели; собственные видео и prompt игнорируются.

        Стартовая ветка и ветка с детьми не могут стать ссылочными.

        Циклы, отсутствующая цель и ссылка на другой сценарий — 400.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: branchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                reference_branch_id:
                  type: integer
                  format: int64
                  nullable: true
                  description: ID цели; пустое значение снимает ссылку, отсутствие
                    сохраняет её
                text:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Text
                prompt:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Prompt
                file:
                  anyOf:
                  - type: string
                    contentMediaType: application/octet-stream
                  - type: 'null'
                  title: File
                file_preview:
                  anyOf:
                  - type: string
                    contentMediaType: application/octet-stream
                  - type: 'null'
                  title: File Preview
                file_title:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: File Title
                file_description:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: File Description
              type: object
              title: Body_update_branch_api_cms_video_scenarios__scenario_id__branches__branch_id__put
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Ветка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
        '400':
          description: Недопустимая ссылка или цикл переходов
        '422':
          description: Для ветки без ссылки требуется видеофайл или неверный формат
            поля
        '404':
          description: Ветка не найдена
  /interactive-video/scenarios:
    get:
      security:
      - bearerAuth: []
      tags:
      - Профессии в действии - LED
      summary: Все сценарии с первой веткой и файлом
      description: 'Требуется staff access-токен admin/operator или device-токен активного
        устройства с ролью 1 (QUIZ_VIDEO). Возвращает все сценарии без пагинации,
        по ID по возрастанию, независимо от наличия сессии. Формат элемента совпадает
        с /interactive-video/sessions/{id}/scenarios: id, title, description, profession_id
        и first_branch. Первая ветка определяется по parent_id=null; при нескольких
        стартовых ветках выбирается ветка с наименьшим ID. first_branch.file содержит
        url, preview_url, mime_type, title, description либо null при отсутствии файла.
        Если стартовой ветки нет, first_branch=null. Список не меняет состояние показа
        и не создаёт сессию.'
      responses:
        '200':
          description: Все сценарии; пустой массив при отсутствии сценариев
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InteractiveVideoSessionScenario'
        '401':
          description: Отсутствующий или недействительный токен
        '403':
          description: Недостаточно прав сотрудника или другая роль устройства
  /interactive-video/sessions:
    post:
      tags:
      - Профессии в действии - Оператор
      summary: Запустить показ
      description: 'Запустить показ видеосценариев на LED-экране. Требуется staff
        access-токен оператора или администратора.

        В `settings` передаётся либо `scenario_ids` (ручной выбор), либо `profession_count`
        (случайный выбор N сценариев).

        Бэкенд конвертит `profession_count` в `scenario_ids` перед сохранением.

        Статус сессии сразу становится `active`.

        Устройство получает session_started в /api/device/sessions/ws с payload device_id,
        session_id и module=interactive_video.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - device_id
              - settings
              properties:
                device_id:
                  type: integer
                  format: int64
                  description: Идентификатор LED-устройства, на котором запускается
                    показ
                settings:
                  type: object
                  required:
                  - scenario_ids или profession_count
                  properties:
                    scenario_ids:
                      type: array
                      items:
                        type: integer
                        format: int64
                      description: ID видеосценариев для показа (ручной выбор)
                    profession_count:
                      type: integer
                      minimum: 1
                      maximum: 10
                      default: 3
                      description: Количество случайных сценариев для показа (если
                        scenario_ids не указан)
                    voting_duration:
                      type: integer
                      default: 30
                      description: Длительность голосования в секундах
                    result_display_duration:
                      type: integer
                      default: 5
                      description: Длительность показа результата в секундах
      responses:
        '401':
          description: Отсутствующий или недействительный staff access-токен
        '403':
          description: Требуется роль оператора или администратора
        '201':
          description: Показ запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoSession'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_scenarios:
                  summary: Нет доступных сценариев
                  value:
                    error: no_scenarios
                    message: Нет доступных видеосценариев для показа
                device_busy:
                  summary: Устройство занято
                  value:
                    error: device_busy
                    message: На этом устройстве уже запущена сессия
  /interactive-video/sessions/active:
    get:
      tags:
      - Профессии в действии
      summary: Получить активную сессию
      description: Доступ с действующим User JWT (включая гостя), staff access-токеном
        сотрудника любой роли или Device JWT с ролью QUIZ_VIDEO=1. Возвращает активную
        сессию показа с полным состоянием. Для пользователя и сотрудника device_id
        выбирает устройство; без device_id возвращается любая активная сессия. User
        JWT не требует предварительного присоединения к показу или QR-привязки. Для
        Device JWT используется устройство из токена; чужой device_id возвращает 403.
        Устройства без роли 1 получают 403. Недействительный или отсутствующий JWT
        — 401; отсутствие активной сессии — 404. Права остальных маршрутов интерактивного
        видео не меняются.
      parameters:
      - name: device_id
        in: query
        schema:
          type: integer
          format: int64
        description: Идентификатор LED-устройства (если не указан — возвращается любая
          активная сессия)
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Активная сессия с полным состоянием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoState'
        '404':
          description: Активной сессии нет
  /interactive-video/sessions/{id}/stop:
    post:
      tags:
      - Профессии в действии - Оператор
      summary: Остановить показ
      description: Остановить показ и вернуть LED-экран в режим ожидания. После первого
        завершения устройство получает session_finished в /api/device/sessions/ws
        с module=interactive_video. Требуется staff access-токен оператора или администратора.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
