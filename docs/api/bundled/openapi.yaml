          nullable: true
        profession_id:
          type: integer
          format: int64
          nullable: true
        branch_count:
          type: integer
          description: Количество веток в сценарии
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InteractiveVideoScenarioFull:
      description: Видеосценарий с деревом веток
      allOf:
      - $ref: '#/components/schemas/InteractiveVideoScenario'
      - type: object
        properties:
          branches:
            $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
            nullable: true
            description: Корневая ветка дерева (стартовая, с рекурсивно вложенными
              дочерними через children). null если сценарий не имеет веток.
    InteractiveVideoScenarioBranch:
      description: Ветка видеосценария (видеофрагмент с вариантами выбора)
      type: object
      properties:
        id:
          type: integer
          format: int64
        scenario_id:
          type: integer
          format: int64
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: ID родительской ветки (null для стартовой)
        file:
          anyOf:
          - $ref: '#/components/schemas/FileResponse'
          - type: 'null'
        text:
          type: string
          nullable: true
          description: Текст варианта выбора (для дочерних веток)
        prompt:
          type: string
          nullable: true
          description: Текст вопроса в точке выбора (для веток с дочерними вариантами)
        children:
          type: array
          description: Дочерние ветки (варианты выбора после этого видео)
          items:
            $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
    InteractiveVideoSessionScenario:
      properties:
        id:
          title: Id
          type: integer
        title:
          title: Title
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        profession_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Profession Id
        first_branch:
          anyOf:
          - $ref: '#/components/schemas/InteractiveVideoSessionFirstBranch'
          - type: 'null'
      required:
      - id
      - title
      - description
      - profession_id
      - first_branch
      type: object
    InteractiveVideoSessionFirstBranch:
      properties:
        id:
          title: Id
          type: integer
        scenario_id:
          title: Scenario Id
          type: integer
        parent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent Id
        file:
          anyOf:
          - $ref: '#/components/schemas/FileResponse'
          - type: 'null'
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
      required:
      - id
      - scenario_id
      - parent_id
      - file
      - text
      - prompt
      type: object
    InteractiveVideoSession:
      description: Сессия показа «Профессии в действии»
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: integer
          enum:
          - 1
          - 2
          description: 1 — active, 2 — finished
        settings:
          type: object
          properties:
            scenario_ids:
              type: array
              description: ID видеосценариев для показа (порядок определяет очередь
                воспроизведения)
              items:
                type: integer
                format: int64
            voting_duration:
              type: integer
              description: Длительность голосования в секундах
            result_display_duration:
              type: integer
              description: Длительность показа результата в секундах
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    InteractiveVideoState:
      description: Текущее состояние показа для LED-экрана
      type: object
      properties:
        session_id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
          description: Идентификатор LED-устройства, на котором запущена сессия
        status:
          type: integer
          enum:
          - 1
          - 2
          description: 1 — active, 2 — finished
        phase:
          type: integer
          enum:
          - 1
          - 2
          description: 'Фаза показа:

            - `1` — playing, проигрывание ролика

            - `2` — voting, точка голосования, сбор ответов

            '
        phase_started_at:
          type: integer
          format: int64
          description: UNIX timestamp (мс), когда началась текущая фаза
        settings:
          type: object
          description: Настройки показа
          properties:
            scenario_ids:
              type: array
              description: ID всех видеосценариев в сессии
              items:
                type: integer
                format: int64
            voting_duration:
              type: integer
              description: Длительность голосования в секундах
            result_display_duration:
              type: integer
              description: Длительность показа результата в секундах
        current_scenario:
          $ref: '#/components/schemas/InteractiveVideoScenario'
          nullable: true
          description: Текущий видеосценарий
        current_branch:
          type: object
          nullable: true
          description: Текущая ветка (видеофрагмент)
          properties:
            id:
              type: integer
              format: int64
            file:
              anyOf:
              - $ref: '#/components/schemas/FileResponse'
              - type: 'null'
            prompt:
              type: string
              nullable: true
              description: Текст вопроса в точке выбора
            profession_name:
              type: string
              nullable: true
              description: Название профессии (показывается в начале видео)
            children:
              type: array
              nullable: true
              description: Варианты выбора (дочерние ветки)
              items:
                type: object
                properties:
                  branch_id:
                    type: integer
                    format: int64
                  text:
                    type: string
        voting_point:
          type: object
          nullable: true
          description: Информация о голосовании (заполняется в фазе voting)
          properties:
            timer:
              type: object
              properties:
                ends_at:
                  type: integer
                  format: int64
                  description: UNIX timestamp (мс), когда таймер закончится. Клиент
                    вычисляет remaining = ends_at - now.
            votes:
              type: array
              description: Распределение голосов
              items:
                type: object
                properties:
                  branch_id:
                    type: integer
                    format: int64
                  count:
                    type: integer
    InteractiveVideoVoting:
      description: Информация о голосовании для мобильного клиента
      type: object
      properties:
        session_id:
          type: integer
          format: int64
        phase:
          type: integer
          enum:
          - 1
          - 2
          description: 'Фаза показа:

            - `1` — playing, проигрывание ролика

            - `2` — voting, точка голосования, сбор ответов

            '
        voting_point:
          type: object
          nullable: true
          description: Точка голосования (заполняется в фазе voting)
          properties:
            prompt:
              type: string
              description: Текст вопроса/ситуации
            options:
              type: array
              description: Варианты выбора
              items:
                type: object
                properties:
                  branch_id:
                    type: integer
                    format: int64
                  text:
                    type: string
            timer:
              type: object
              properties:
                ends_at:
                  type: integer
                  format: int64
                  description: UNIX timestamp (мс), когда таймер закончится. Клиент
                    вычисляет remaining = ends_at - now.
            already_voted:
              type: boolean
              description: true, если участник уже проголосовал
            voted_branch_id:
              type: integer
              format: int64
              nullable: true
              description: ID ветки, за которую проголосовал участник (если already_voted=true)
    CmsSurvey:
      description: Анкета обратной связи (CMS)
      type: object
      properties:
        id:
          type: integer
          format: int64
        external_id:
          type: string
          description: Символьный идентификатор (например, videoresume_feedback)
        name:
          type: string
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          description: Активна ли анкета
        copied_from_id:
          type: integer
          format: int64
          nullable: true
          description: ID анкеты, от которой эта была скопирована
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: '#/components/schemas/CmsSurveyQuestion'
    CmsSurveyCreateRequest:
      type: object
      required:
      - external_id
      - name
      properties:
        external_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
    CmsSurveyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
    CmsSurveyQuestion:
      description: Вопрос анкеты (CMS)
      type: object
      properties:
        id:
          type: integer
          format: int64
        survey_id:
          type: integer
          format: int64
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: ID родительского вопроса для условного показа
        type:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          description: 'Тип вопроса:

            - `1` — rating_scale (шкала оценки)

            - `2` — single_choice (одиночный выбор)

            - `3` — multiple_choice (множественный выбор)

            - `4` — text (текстовый ответ)

            - `5` — profession_choice (выбор профессии)

            '
        text:
          type: string
        media_id:
          type: integer
          format: int64
          nullable: true
        required:
          type: boolean
        order:
          type: integer
        condition:
          type: object
          nullable: true
          description: 'Условие показа (например, {"operator": "lte", "value": 2})'
          additionalProperties: true
        scale_min:
          type: integer
          nullable: true
          description: Минимальное значение шкалы (по умолчанию 1)
        scale_max:
          type: integer
          nullable: true
          description: Максимальное значение шкалы (по умолчанию 5)
    CmsSurveyQuestionCreateRequest:
      type: object
      required:
      - type
      - text
      - order
      properties:
        type:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
        text:
          type: string
        order:
          type: integer
        required:
          type: boolean
          default: false
        parent_id:
          type: integer
          format: int64
          nullable: true
        media_id:
          type: integer
          format: int64
          nullable: true
        condition:
          type: object
          nullable: true
          additionalProperties: true
        scale_min:
          type: integer
          nullable: true
        scale_max:
          type: integer
          nullable: true
    CmsSurveyQuestionUpdateRequest:
      type: object
      properties:
        text:
          type: string
        required:
          type: boolean
        condition:
          type: object
          nullable: true
          additionalProperties: true
        scale_min:
          type: integer
          nullable: true
        scale_max:
          type: integer
          nullable: true
        media_id:
          type: integer
          format: int64
          nullable: true
    CmsSurveyResponse:
      description: Ответ пользователя на анкету (CMS)
      type: object
      properties:
        id:
          type: integer
          format: int64
        survey_id:
          type: integer
          format: int64
        source_id:
          type: string
          description: XML_ID устройства (ПАК, веб)
        user_id:
          type: integer
          format: int64
        consent_version_id:
          type: integer
          format: int64
          nullable: true
        completed_at:
          type: string
          format: date-time
        duration:
          type: integer
          description: Время прохождения в секундах
        answers:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              question_id:
                type: integer
                format: int64
              value:
                type: string
        survey:
          $ref: '#/components/schemas/CmsSurvey'
          nullable: true
          description: Анкета, на которую дан ответ
    FeedbackSurvey:
      description: Активная анкета для прохождения (клиент)
      type: object
      properties:
        id:
          type: integer
          format: int64
        external_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        questions:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              parent_id:
                type: integer
                format: int64
                nullable: true
              type:
                type: integer
                enum:
                - 1
                - 2
                - 3
                - 4
                - 5
              text:
                type: string
              media_id:
                type: integer
                format: int64
                nullable: true
              required:
                type: boolean
              order:
                type: integer
              condition:
                type: object
                nullable: true
                additionalProperties: true
              scale_min:
                type: integer
                nullable: true
              scale_max:
                type: integer
                nullable: true
    FeedbackSubmitRequest:
      description: Запрос на отправку ответов
      type: object
      required:
      - source_id
      - user_id
      - duration
      - answers
      properties:
        source_id:
          type: string
          description: XML_ID устройства (ПАК, веб)
        user_id:
          type: integer
          format: int64
          description: ID пользователя
        duration:
          type: integer
          description: Время прохождения в секундах
        consent_version_id:
          type: integer
          format: int64
          nullable: true
          description: ID версии согласия, которое принял пользователь
        answers:
          type: array
          items:
            type: object
            required:
            - question_id
            - value
            properties:
              question_id:
                type: integer
                format: int64
              value:
                type: string
                description: Значение ответа (число, текст, JSON для множественного
                  выбора)
    FeedbackSubmitResponse:
      description: Результат отправки ответов
      type: object
      properties:
        id:
          type: integer
          format: int64
        survey_id:
          type: integer
          format: int64
        completed_at:
          type: string
          format: date-time
security:
- bearerAuth: []
