  /interactive-video/sessions/{id}/advance:
    post:
      tags:
      - Профессии в действии - LED
      summary: Сигнал окончания видео
      description: "Вызывается LED-плеером, когда воспроизведение текущего видеофрагмента\
        \ (`current_branch`) завершилось.\nСервер не хранит длительность видео — момент\
        \ перехода к точке голосования (или к следующему сценарию/завершению показа)\n\
        определяется именно этим сигналом, а не таймером.\nТребует device-токен (`Authorization:\
        \ Bearer <device token>`), полученный при регистрации устройства.\n- Если\
        \ у `current_branch` есть дочерние ветки — показ переходит в фазу `voting`\
        \ (голосование).\n- Если дочерних веток нет и в очереди остались сценарии\
        \ — переход к следующему сценарию (`scenario_finished`).\n- Если дочерних\
        \ веток нет и сценариев больше нет — показ завершается (`session_finished`).\n\
        \ Для device-токена требуется роль 1; другая группа устройства — 403."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Обновлённое состояние показа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoState'
        '400':
          description: Показ сейчас не в фазе воспроизведения видео
        '403':
