      description: 'Требуется staff access-токен редактора контента или администратора.
        Удалённая запись недоступна для изменения и повторного удаления (404). Ссылки
        на удалённые записи отклоняются (422). Для загрузки вложения используется
        multipart/form-data: file, необязательные file_preview, file_title и file_description.
        coordinates передаётся JSON-строкой. В ответе file содержит подписанный URL,
        preview_url, mime_type, title и description либо null. При PUT без нового
        file прежнее вложение сохраняется; новый file заменяет привязку. file_preview
        без нового file возвращает 422. Новая загрузка и организация сохраняются одной
