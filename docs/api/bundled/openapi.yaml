          current_round_question_count:
            type: integer
            minimum: 0
            description: Количество вопросов в текущем раунде; до старта — в первом
              раунде, 0 при отсутствии раунда.
          current_round:
            type: object
            nullable: true
            description: Текущий раунд (заполняется при select=current_round)
            properties:
              index:
                type: integer
              round_type:
                type: integer
