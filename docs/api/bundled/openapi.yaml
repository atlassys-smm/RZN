openapi: 3.1.0
info:
  title: ПрофНавигатор 62 — API
  description: 'REST API платформы «ПрофНавигатор 62».

    Единая цифровая профориентационная платформа для Центра занятости населения Рязанской
    области.

    '
  version: 0.1.0
  contact:
    name: ПрофНавигатор 62
servers:
- url: http://localhost:8000/api
  description: Локальная разработка
tags:
- name: auth
  description: Авторизация и аутентификация
- name: users
  description: Пользователи и профили
- name: LED-устройства
  description: Регистрация LED-устройств, управление ими и device-токенами
- name: Профессии
  description: Справочник профессий, отраслей и направлений
- name: Компетенции
  description: Справочник компетенций
- name: Организации
  description: Учебные заведения и работодатели
- name: Согласия
  description: Версионируемые юридические согласия на обработку персональных данных
- name: Аватары профессий
  description: Эталонные образы профессий для генерации аватаров
- name: Аватары пользователей
  description: Сгенерированные аватары пользователей
- name: Файлы
  description: Скачивание файлов по подписанным URL
- name: Викторина
  description: Общие методы — получение состояния сессии (используются оператором
    и игроками)
- name: Викторина - CMS
  description: Управление вопросами и шаблонами сценариев викторины
- name: Викторина - Оператор
  description: Игровая сессия — создание, управление ходом, результаты
- name: Викторина - Игрок
  description: Мобильный клиент — подключение к сессии и ответы
- name: Профессии в действии
  description: Общие методы — получение состояния показа (используется LED-экраном)
- name: Профессии в действии - CMS
  description: Управление видеосценариями и ветками
- name: Профессии в действии - Оператор
  description: Показ — запуск и остановка
- name: Профессии в действии - LED
  description: Получение состояния показа для LED-экрана
- name: Профессии в действии - Зритель
  description: Мобильный клиент — подключение и голосование
- name: profstart
  description: ПрофСтарт — тестирование
- name: analytics
  description: Аналитика и события
- name: cms
  description: CMS — управление контентом
- name: feedback
  description: Обратная связь и анкеты
- name: files
  description: Загрузка и управление файлами
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Вход в систему
      description: Аутентификация пользователя и получение JWT-токенов
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              - password
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Успешная аутентификация
        '401':
          description: Неверные учётные данные
  /auth/logout:
    post:
      tags:
      - auth
      summary: Выход из системы
      description: Инвалидация текущего токена
      responses:
        '204':
          description: Токен инвалидирован
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Обновление токена
      description: Получение новой пары access/refresh токенов
      responses:
        '200':
          description: Токены обновлены
        '401':
          description: Refresh-токен недействителен
  /users/me:
    get:
      tags:
      - users
      summary: Текущий пользователь
      description: Получить профиль текущего аутентифицированного пользователя
      responses:
        '200':
          description: Профиль пользователя
    patch:
      tags:
      - users
      summary: Обновить профиль
      description: Частичное обновление профиля текущего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Профиль обновлён
  /professions:
    get:
      tags:
      - Профессии
      summary: Список профессий
      description: Получить справочник профессий с фильтрацией и пагинацией
      security: []
      parameters:
      - name: direction_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по профессиональному направлению
      - name: industry_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по отрасли
      - name: search
        in: query
        schema:
          type: string
        description: Поиск по названию
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список профессий
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profession'
                  total:
                    type: integer
    post:
      tags:
      - Профессии
      summary: Создать профессию
      description: Создать новую профессию (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - industry_id
              - direction_id
              properties:
                name:
                  type: string
                description:
                  type: string
                industry_id:
                  type: integer
                  format: int64
                direction_id:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Профессия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profession'
  /professions/{id}:
    get:
      tags:
      - Профессии
      summary: Детали профессии
      description: Получить полную информацию о профессии по идентификатору
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Карточка профессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profession'
        '404':
          description: Профессия не найдена
    put:
      tags:
      - Профессии
      summary: Обновить профессию
      description: Обновить профессию (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                industry_id:
                  type: integer
                  format: int64
                direction_id:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Профессия обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profession'
        '404':
          description: Не найдена
    delete:
      tags:
      - Профессии
      summary: Удалить профессию
      description: Удалить профессию (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Профессия удалена
        '404':
          description: Не найдена
  /industries:
    get:
      tags:
      - Профессии
      summary: Список отраслей
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список отраслей
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Industry'
                  total:
                    type: integer
    post:
      tags:
      - Профессии
      summary: Создать отрасль
      description: Создать новую отрасль (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Отрасль создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Industry'
  /industries/{id}:
    put:
      tags:
      - Профессии
      summary: Обновить отрасль
      description: Обновить отрасль (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Отрасль обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Industry'
        '404':
          description: Не найдена
    delete:
      tags:
      - Профессии
      summary: Удалить отрасль
      description: Удалить отрасль (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Отрасль удалена
        '409':
          description: Нельзя удалить — есть связанные профессии
  /directions:
    get:
      tags:
      - Профессии
      summary: Список направлений
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список направлений
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Direction'
                  total:
                    type: integer
    post:
      tags:
      - Профессии
      summary: Создать направление
      description: Создать новое направление (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Направление создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direction'
  /directions/{id}:
    put:
      tags:
      - Профессии
      summary: Обновить направление
      description: Обновить направление (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Направление обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direction'
        '404':
          description: Не найдена
    delete:
      tags:
      - Профессии
      summary: Удалить направление
      description: Удалить направление (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Направление удалено
        '409':
          description: Нельзя удалить — есть связанные профессии
  /competences:
    get:
      tags:
      - Компетенции
      summary: Список компетенций
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список компетенций
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Competence'
                  total:
                    type: integer
    post:
      tags:
      - Компетенции
      summary: Создать компетенцию
      description: Создать новую компетенцию (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Компетенция создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competence'
  /competences/{id}:
    get:
      tags:
      - Компетенции
      summary: Получить компетенцию
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Компетенция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competence'
        '404':
          description: Не найдена
    put:
      tags:
      - Компетенции
      summary: Обновить компетенцию
      description: Обновить компетенцию (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Компетенция обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competence'
        '404':
          description: Не найдена
    delete:
      tags:
      - Компетенции
      summary: Удалить компетенцию
      description: Удалить компетенцию (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Компетенция удалена
        '409':
          description: Нельзя удалить — есть связанные пользователи
  /organizations:
    get:
      tags:
      - Организации
      summary: Список организаций
      description: Получить справочник организаций с фильтрацией и пагинацией
      security: []
      parameters:
      - name: type
        in: query
        schema:
          type: string
          enum:
          - education
          - employer
        description: Фильтр по типу (education — учебные заведения, employer — работодатели)
      - name: search
        in: query
        schema:
          type: string
        description: Поиск по названию
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список организаций
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  total:
                    type: integer
    post:
      tags:
      - Организации
      summary: Создать организацию
      description: Создать новую организацию (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - type
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum:
                  - education
                  - employer
                address:
                  type: string
                coordinates:
                  type: object
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
                description:
                  type: string
                website:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: Организация создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
  /organizations/{id}:
    get:
      tags:
      - Организации
      summary: Детали организации
      description: Получить полную информацию об организации
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Организация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: Не найдена
    put:
      tags:
      - Организации
      summary: Обновить организацию
      description: Обновить организацию (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum:
                  - education
                  - employer
                address:
                  type: string
                coordinates:
                  type: object
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
                description:
                  type: string
                website:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Организация обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: Не найдена
    delete:
      tags:
      - Организации
      summary: Удалить организацию
      description: Удалить организацию (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Организация удалена
        '404':
          description: Не найдена
  /consents/types:
    get:
      tags:
      - Согласия
      summary: Список типов согласий
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список типов согласий
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentType'
                  total:
                    type: integer
    post:
      tags:
      - Согласия
      summary: Создать тип согласия
      description: Создать новый тип согласия (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - title
              properties:
                code:
                  type: string
                  description: Уникальный код (например, personal_data)
                title:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Тип согласия создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentType'
  /consents/types/{id}:
    get:
      tags:
      - Согласия
      summary: Детали типа согласия
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Тип согласия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentType'
        '404':
          description: Не найден
    put:
      tags:
      - Согласия
      summary: Обновить тип согласия
      description: Обновить тип согласия (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Тип согласия обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentType'
        '404':
          description: Не найден
    delete:
      tags:
      - Согласия
      summary: Удалить тип согласия
      description: Удалить тип согласия (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Тип согласия удалён
        '404':
          description: Не найден
        '409':
          description: Нельзя удалить — есть связанные версии
  /consents/types/{type_id}/versions:
    get:
      tags:
      - Согласия
      summary: Список версий типа согласия
      security: []
      parameters:
      - name: type_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список версий
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
