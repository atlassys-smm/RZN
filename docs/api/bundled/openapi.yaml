  /cms/quiz/templates/{id}/rounds/{roundId}/questions/reorder:
    put:
      tags:
      - Викторина - CMS
      summary: Изменить порядок вопросов в раунде
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roundId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: ID вопросов в новом порядке
      responses:
        '200':
          description: Порядок изменён
  /cms/quiz/templates/{id}/rounds/{roundId}/questions/{questionId}:
    delete:
      tags:
      - Викторина - CMS
      summary: Убрать вопрос из раунда
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roundId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: questionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Вопрос убран из раунда
  /quiz/sessions:
    post:
      tags:
      - Викторина - Оператор
      summary: Создать сессию
      description: 'Создаёт сессию в статусе `waiting` (формирование команд).

        `current_round` и `current_question` = null — игра ещё не началась.

        Фронтенд получает список шаблонов через `GET /cms/quiz/templates`, выбирает
        нужный и отправляет раунды с вопросами.

        Команды создаются автоматически по `settings.team_count` (для mode=team).

        Оператор запускает первый вопрос через `POST /quiz/sessions/{id}/next`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              - rounds
              properties:
                mode:
                  type: string
                  enum:
                  - individual
                  - team
                rounds:
                  type: array
                  description: Раунды с вопросами (заполнены из шаблона или вручную)
                  items:
                    type: object
                    properties:
                      round_type:
                        type: string
                      question_ids:
                        type: array
                        items:
                          type: string
                          format: uuid
                settings:
                  type: object
                  properties:
                    team_count:
                      type: integer
                      minimum: 2
                      maximum: 8
                      description: Количество команд (для mode=team)
                    auto_reveal:
                      type: boolean
                      default: true
                    auto_next:
                      type: boolean
                      default: false
                    auto_next_delay:
                      type: integer
                      default: 5
                    between_rounds_delay:
                      type: integer
                      default: 10
                    show_intermediate_results:
                      type: boolean
                      default: true
      responses:
        '201':
          description: Сессия создана (статус waiting, ожидает старта оператора)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSession'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_rounds:
                  summary: Некорректные раунды
                  value:
                    error: invalid_rounds
                    message: Количество раундов должно быть от 3 до 8
                invalid_team_count:
                  summary: Некорректное количество команд
                  value:
                    error: invalid_team_count
                    message: Количество команд должно быть от 2 до 8
  /quiz/sessions/active:
    get:
      tags:
      - Викторина
      summary: Получить активную сессию
      description: 'Возвращает текущую активную сессию (status=waiting или active).

        Используется оператором при перезапуске планшета для восстановления состояния.

        Если активной сессии нет — возвращает 404.

        '
      parameters:
      - name: select
        in: query
        description: Связанные данные для включения
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - teams
            - participants
            - current_question
            - current_round
            - timer
      responses:
        '200':
          description: Активная сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionFull'
        '404':
          description: Активной сессии нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{id}:
    get:
      tags:
      - Викторина
      summary: Получить сессию
      description: 'Без параметра select возвращает только базовые поля сессии (QuizSession).

        С параметром select возвращает QuizSessionFull с запрошенными связями.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: select
        in: query
        description: Связанные данные для включения
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - teams
            - participants
            - current_question
            - current_round
            - timer
      responses:
        '200':
          description: Сессия. Без select — только базовые поля. С select — запрошенные
            связи заполнены, остальные null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionFull'
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{id}/finish:
    post:
      tags:
      - Викторина - Оператор
      summary: Завершить сессию
      description: Завершить сессию. Статус меняется на `finished`.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Сессия завершена
  /quiz/sessions/{id}/next:
    post:
      tags:
      - Викторина - Оператор
      summary: Следующий вопрос / Начать игру
      description: 'Если сессия в статусе `waiting` — запускает первый вопрос первого
        раунда (старт игры).

        Если игра идёт — переход к следующему вопросу. Между вопросами — таймер автопереключения
        (auto_next_delay).

        Если вопросов в раунде больше нет — показ результатов раунда, затем (через
        between_rounds_delay) — следующий раунд.

        После последнего вопроса последнего раунда — показ финальных результатов.
        Сессия остаётся в статусе `active`, оператор завершает её явно через `POST
        /quiz/sessions/{id}/finish`.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Текущее состояние игры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                session_finished:
                  summary: Сессия завершена
                  value:
                    error: session_finished
                    message: Сессия уже завершена
                no_more_questions:
                  summary: Нет следующих вопросов
                  value:
                    error: no_more_questions
                    message: Это последний вопрос, используйте finish для завершения
  /quiz/sessions/{id}/reveal:
    post:
      tags:
      - Викторина - Оператор
      summary: Показать ответ
      description: Показать правильный ответ с пояснением (используется если auto_reveal
        = false)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Правильный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer_option_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                  explanation:
                    type: string
                    nullable: true
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_revealed:
                  summary: Ответ уже показан
                  value:
                    error: already_revealed
                    message: Правильный ответ уже был показан
                no_active_question:
                  summary: Нет активного вопроса
                  value:
                    error: no_active_question
                    message: Нет активного вопроса для показа ответа
  /quiz/sessions/{id}/timer/pause:
    post:
      tags:
      - Викторина - Оператор
      summary: Пауза таймера
      description: Поставить на паузу таймер текущего вопроса
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Состояние таймера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTimerState'
  /quiz/sessions/{id}/timer/resume:
    post:
      tags:
      - Викторина - Оператор
      summary: Возобновить таймер
      description: Возобновить отсчёт таймера текущего вопроса
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Состояние таймера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTimerState'
  /quiz/sessions/{id}/results/rounds/{roundIndex}:
    get:
      tags:
      - Викторина - Оператор
      summary: Результат раунда
      description: Результаты конкретного раунда. Используется LED для показа после
        окончания раунда.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roundIndex
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Результат раунда
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizRoundResult'
        '404':
          description: Раунд не найден
  /quiz/sessions/{id}/results/total:
    get:
      tags:
      - Викторина - Оператор
      summary: Итоговый результат
      description: 'Итоговый результат на текущий момент (сумма по завершённым раундам).

        Можно запрашивать в любой момент — между раундами или после завершения сессии.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Итоговый результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTotalResult'
  /quiz/sessions/{sessionId}/join:
    post:
      tags:
      - Викторина - Игрок
      summary: Подключиться к сессии
      description: Подключиться к сессии по коду (из QR)
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Подключён
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_id:
                    type: string
                    format: uuid
                  session_id:
                    type: string
                    format: uuid
                  mode:
                    type: string
                    enum:
                    - individual
                    - team
                  teams:
                    type: array
                    description: Список команд (для mode=team)
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        color:
                          type: string
                        participant_count:
                          type: integer
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Сессия уже завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{sessionId}/team/{teamId}/join:
    post:
      tags:
      - Викторина - Игрок
      summary: Выбрать команду
      description: Присоединиться к команде (для mode=team)
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Присоединился к команде
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_id:
                    type: string
                    format: uuid
                  team_id:
                    type: string
                    format: uuid
                  is_captain:
                    type: boolean
                    description: true если участник стал капитаном (первый в команде)
  /quiz/sessions/{sessionId}/answer:
    post:
      tags:
      - Викторина - Игрок
      summary: Ответ на вопрос
      description: 'Ответ на текущий вопрос. Поведение зависит от режима и роли:

        - Individual mode: ответ засчитывается

        - Team mode, обычный участник: сохраняется как голос (для отображения капитану)

        - Team mode, капитан: засчитывается как ответ команды

        '
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answer:
                  description: Зависит от типа вопроса
      responses:
        '200':
          description: Ответ принят
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_answered:
                  summary: Уже ответил
                  value:
                    error: already_answered
                    message: Вы уже дали ответ на этот вопрос
                voting_closed:
                  summary: Приём ответов завершён
                  value:
                    error: voting_closed
                    message: Приём ответов на этот вопрос завершён
                captain_already_answered:
                  summary: Капитан уже ответил
                  value:
                    error: captain_already_answered
                    message: Капитан команды уже дал итоговый ответ
                not_captain:
                  summary: Не капитан
                  value:
                    error: not_captain
                    message: Только капитан может дать итоговый ответ команды
        '404':
          description: Сессия или вопрос не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/devices:
    post:
      tags:
      - LED-устройства
      summary: Зарегистрировать устройство
      description: 'Зарегистрировать новое LED-устройство и выпустить для него device-токен
        (JWT, привязан к `device_id`).

        Токен возвращается только один раз, в ответе на регистрацию — сохраните его
        в конфигурации плеера.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                location:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Устройство зарегистрировано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceWithToken'
    get:
      tags:
      - LED-устройства
      summary: Список устройств
      description: Получить список зарегистрированных LED-устройств
      responses:
        '200':
          description: Список устройств
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
  /cms/devices/{id}:
    get:
      tags:
      - LED-устройства
      summary: Получить устройство
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Устройство
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          description: Устройство не найдено
    delete:
      tags:
      - LED-устройства
      summary: Отозвать устройство
      description: Отзывает device-токен устройства (`is_active = false`). Существующий
        токен перестаёт приниматься сервером.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Устройство отозвано
        '404':
          description: Устройство не найдено
  /cms/devices/{device_id}/refresh-token:
    post:
      tags:
      - LED-устройства
      summary: Обновить JWT устройства
      description: Выпустить новый device JWT по идентификатору активного устройства.
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Новый токен устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '404':
          description: Устройство не найдено
        '409':
          description: Устройство неактивно
  /cms/video-scenarios:
    get:
      tags:
      - Профессии в действии - CMS
      summary: Список видеосценариев
      description: Получить список видеосценариев с фильтрацией и пагинацией
      parameters:
      - name: profession_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по профессии
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список видеосценариев
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InteractiveVideoScenario'
                  total:
                    type: integer
    post:
      tags:
      - Профессии в действии - CMS
      summary: Создать видеосценарий
      description: 'Создать новый видеосценарий. Стартовая ветка создаётся автоматически,

        её `media_id` заполняется системным видео-заглушкой (`DEFAULT_SCENARIO_VIDEO_ID`)
        — замените его на реальное видео через `PUT /cms/video-scenarios/{id}/branches/{branchId}`.

        Для добавления дочерних веток используйте `POST /cms/video-scenarios/{id}/branches`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              properties:
                title:
                  type: string
                description:
                  type: string
                profession_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '201':
          description: Видеосценарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenario'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/video-scenarios/{id}:
    get:
      tags:
      - Профессии в действии - CMS
      summary: Получить видеосценарий
      description: Получить видеосценарий с деревом веток
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Видеосценарий с деревом веток
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioFull'
        '404':
          description: Видеосценарий не найден
    put:
      tags:
      - Профессии в действии - CMS
      summary: Обновить видеосценарий
      description: Обновить название, описание или профессию
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                profession_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '200':
          description: Видеосценарий обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenario'
        '404':
          description: Видеосценарий не найден
    delete:
      tags:
      - Профессии в действии - CMS
      summary: Удалить видеосценарий
      description: Удалить видеосценарий (только если не использовался в активных
        сессиях)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Видеосценарий удалён
        '409':
          description: Видеосценарий использовался в сессиях, удаление невозможно
  /cms/video-scenarios/{id}/branches:
    post:
      tags:
      - Профессии в действии - CMS
      summary: Добавить ветку
      description: 'Добавить дочернюю ветку к указанному родителю.

        Если `parent_id` не указан — добавляется как вариант выбора для стартовой
        ветки.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: ID видеосценария
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - parent_id
              - text
              - media_id
              properties:
                parent_id:
                  type: integer
                  format: int64
                  description: ID родительской ветки
                text:
                  type: string
                  description: Текст варианта выбора
                media_id:
                  type: integer
                  format: int64
                  description: ID видеофайла
                prompt:
                  type: string
                  description: Текст вопроса в точке выбора (для родительской ветки)
      responses:
        '201':
          description: Ветка добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/video-scenarios/{id}/branches/{branchId}:
    put:
      tags:
      - Профессии в действии - CMS
      summary: Обновить ветку
      description: Обновить текст вопроса, текст варианта или видеофайл
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: branchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                prompt:
                  type: string
                media_id:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Ветка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
        '404':
          description: Ветка не найдена
  /interactive-video/sessions:
    post:
      tags:
      - Профессии в действии - Оператор
      summary: Запустить показ
      description: 'Запустить показ видеосценариев на LED-экране.

        Если `scenario_ids` указан — используются эти сценарии.

        Если не указан — система выбирает случайные сценарии (количество определяется
        `profession_count`).

        Статус сессии сразу становится `active`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - device_id
              properties:
                device_id:
                  type: integer
                  format: int64
                  description: Идентификатор LED-устройства, на котором запускается
                    показ
                scenario_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: ID видеосценариев для показа (опционально)
                profession_count:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 3
                  description: Количество профессий для показа (если scenario_ids
                    не указан)
                settings:
                  type: object
                  properties:
                    voting_duration:
                      type: integer
                      default: 30
                      description: Длительность голосования в секундах
                    result_display_duration:
                      type: integer
                      default: 5
                      description: Длительность показа результата в секундах
      responses:
        '201':
          description: Показ запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoSession'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                no_scenarios:
                  summary: Нет доступных сценариев
                  value:
                    error: no_scenarios
                    message: Нет доступных видеосценариев для показа
                device_busy:
                  summary: Устройство занято
                  value:
                    error: device_busy
                    message: На этом устройстве уже запущена сессия
  /interactive-video/sessions/active:
    get:
      tags:
      - Профессии в действии
      summary: Получить активную сессию
      description: 'Возвращает текущую активную сессию показа с полным состоянием.

        Если указан `device_id` — возвращает сессию для этого устройства.

        Если `device_id` не указан — возвращает любую активную сессию (для оператора).

        Используется LED-экраном при переподключении для восстановления состояния.

        Используется оператором при перезапуске планшета для возможности остановки.

        Если активной сессии нет — возвращает 404.

        '
      parameters:
      - name: device_id
        in: query
        schema:
          type: integer
          format: int64
        description: Идентификатор LED-устройства (если не указан — возвращается любая
          активная сессия)
      responses:
        '200':
          description: Активная сессия с полным состоянием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoState'
        '404':
          description: Активной сессии нет
  /interactive-video/sessions/{id}/stop:
    post:
      tags:
      - Профессии в действии - Оператор
      summary: Остановить показ
      description: Остановить показ и вернуть LED-экран в режим ожидания
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Показ остановлен
        '404':
          description: Сессия не найдена
  /interactive-video/sessions/{id}/state:
    get:
      tags:
      - Профессии в действии - LED
      summary: Получить состояние показа
      description: 'Текущее состояние показа для LED-экрана.

        Включает информацию о текущем видео, точке голосования, результатах.

        LED-экран опрашивает этот эндпоинт для синхронизации.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Состояние показа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoState'
        '403':
          description: Сессия принадлежит другому устройству
        '404':
          description: Сессия не найдена
  /interactive-video/sessions/{id}/advance:
    post:
      tags:
      - Профессии в действии - LED
      summary: Сигнал окончания видео
      description: 'Вызывается LED-плеером, когда воспроизведение текущего видеофрагмента
        (`current_branch`) завершилось.

        Сервер не хранит длительность видео — момент перехода к точке голосования
        (или к следующему сценарию/завершению показа)

        определяется именно этим сигналом, а не таймером.

        Требует device-токен (`Authorization: Bearer <device token>`), полученный
        при регистрации устройства.

        - Если у `current_branch` есть дочерние ветки — показ переходит в фазу `voting`
        (голосование).

        - Если дочерних веток нет и в очереди остались сценарии — переход к следующему
        сценарию (`scenario_finished`).

        - Если дочерних веток нет и сценариев больше нет — показ завершается (`session_finished`).

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Обновлённое состояние показа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoState'
        '400':
          description: Показ сейчас не в фазе воспроизведения видео
        '403':
          description: Сессия принадлежит другому устройству
        '404':
          description: Сессия не найдена
  /interactive-video/sessions/{id}/voting:
    get:
      tags:
      - Профессии в действии - Зритель
      summary: Получить информацию о голосовании
      description: 'Информация о текущей точке голосования для мобильного клиента.

        Включает варианты выбора, таймер, статус участника (проголосовал/не проголосовал),
        результат.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: participant_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
        description: ID участника (получен при подключении через /join)
      responses:
        '200':
          description: Информация о голосовании
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoVoting'
        '404':
          description: Сессия или точка голосования не найдена
  /interactive-video/sessions/{sessionId}/join:
    post:
      tags:
      - Профессии в действии - Зритель
      summary: Подключиться к показу
      description: Подключиться к показу по QR-коду
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Подключён
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_id:
                    type: integer
                    format: int64
                  session_id:
                    type: integer
                    format: int64
        '404':
          description: Сессия не найдена
        '409':
          description: Показ уже завершён
  /interactive-video/sessions/{sessionId}/vote:
    post:
      tags:
      - Профессии в действии - Зритель
      summary: Проголосовать
      description: 'Проголосовать за вариант продолжения в точке голосования.

        Один участник может проголосовать только один раз за каждую точку голосования.

        '
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - branch_id
              properties:
                branch_id:
                  type: integer
                  format: int64
                  description: ID выбранной ветки (варианта продолжения)
      responses:
        '200':
          description: Голос принят
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                voting_closed:
                  summary: Голосование завершено
                  value:
                    error: voting_closed
                    message: Голосование уже завершено
                already_voted:
                  summary: Уже голосовал
                  value:
                    error: already_voted
                    message: Вы уже проголосовали
                invalid_branch:
                  summary: Неверная ветка
                  value:
                    error: invalid_branch
                    message: Выбранная ветка не является допустимым вариантом
        '404':
          description: Сессия или точка голосования не найдена
  /profstart/sessions:
    post:
      tags:
      - profstart
      summary: Начать тестирование
      description: Создать новую сессию тестирования ПрофСтарт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Сессия создана
  /profstart/sessions/{id}/answer:
    post:
      tags:
      - profstart
      summary: Ответ на вопрос теста
      description: Отправить ответ на вопрос теста ПрофСтарт
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Идентификатор сессии
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Ответ принят
        '404':
          description: Сессия не найдена
  /profstart/sessions/{id}/result:
    get:
      tags:
      - profstart
      summary: Результат тестирования
      description: Получить результат пройденного тестирования ПрофСтарт
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Идентификатор сессии
      responses:
        '200':
          description: Результат тестирования
        '404':
          description: Сессия не найдена
  /analytics/events:
    post:
      tags:
      - analytics
      summary: Отправить событие
      description: Зарегистрировать аналитическое событие
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Событие зарегистрировано
    get:
      tags:
      - analytics
      summary: Список событий
      description: Получить список аналитических событий с фильтрацией
      parameters:
      - name: type
        in: query
        schema:
          type: string
        description: Тип события
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Список событий
  /cms/references:
    get:
      tags:
      - cms
      summary: Справочники
      description: Получить список справочников CMS
      responses:
        '200':
          description: Список справочников
  /cms/surveys:
    get:
      tags:
      - cms
      summary: Анкеты
      description: Получить список анкет (CMS)
      responses:
        '200':
          description: Список анкет
    post:
      tags:
      - cms
      summary: Создать анкету
      description: Добавить новую анкету
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Анкета создана
  /feedback/surveys:
    get:
      tags:
      - feedback
      summary: Доступные анкеты
      description: Получить список анкет обратной связи
      security: []
      responses:
        '200':
          description: Список анкет
  /feedback/surveys/{id}/respond:
    post:
      tags:
      - feedback
      summary: Ответить на анкету
      description: Отправить ответы на анкету обратной связи
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Идентификатор анкеты
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Ответы отправлены
        '404':
          description: Анкета не найдена
  /files/upload:
    post:
      tags:
      - files
      summary: Загрузить файл
      description: Загрузить файл на платформу
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                description:
                  type: string
                uploaded_by:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Файл загружен
  /files/{id}:
    get:
      tags:
      - files
      summary: Получить файл
      description: Получить информацию о файле или скачать его
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Файл найден
        '404':
          description: Файл не найден
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Industry:
      description: Отрасль экономики
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Direction:
      description: Профессиональное направление
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Profession:
      description: Профессия из справочника
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        industry_id:
          type: string
          format: uuid
        direction_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Competence:
      description: Компетенция (навык/способность)
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Organization:
      description: Организация (учебное заведение или работодатель)
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum:
          - education
          - employer
        address:
          type: string
          nullable: true
        coordinates:
          type: object
          nullable: true
          properties:
            lat:
              type: number
            lng:
              type: number
        description:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    Device:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        location:
          type: string
          nullable: true
        is_active:
          type: boolean
    DeviceWithToken:
      allOf:
      - $ref: '#/components/schemas/Device'
      - type: object
        properties:
          token:
            type: string
