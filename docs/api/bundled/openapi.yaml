  /interactive-video/sessions/{sessionId}/vote:
    post:
      tags:
      - Профессии в действии - Зритель
      summary: Проголосовать
      description: 'Проголосовать за вариант продолжения в точке голосования. Пользователь
        определяется по user access-токену.

        Один участник может проголосовать только один раз за каждую точку голосования.
        После каждого принятого голоса проверяется текущий participant_count. Если
        он больше нуля и число голосов в текущей точке достигло этого значения, голосование
        завершается досрочно: применяется обычный выбор победителя, показ переходит
        к его ветке в фазе playing, voting_ends_at очищается. После votes_updated
        отправляется phase_changed (только type). Ожидать остаток таймера не требуется;
        дальнейшее воспроизведение и переходы выполняются как обычно. При отсутствии
        участников досрочного завершения нет. Повторные голоса не учитываются; поздний
        голос получает voting_closed. Счётчик participant_count сохраняет прежнюю
        семантику: каждый успешный /join увеличивает его, включая повторное подключение
        того же пользователя.'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - branch_id
              additionalProperties: false
              properties:
                branch_id:
                  type: integer
                  format: int64
                  description: ID выбранной ветки (варианта продолжения)
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный user access-токен
        '200':
          description: Голос принят
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                voting_closed:
                  summary: Голосование завершено
                  value:
                    error: voting_closed
                    message: Голосование уже завершено
                already_voted:
                  summary: Уже голосовал
                  value:
                    error: already_voted
                    message: Вы уже проголосовали
                invalid_branch:
                  summary: Неверная ветка
                  value:
                    error: invalid_branch
                    message: Выбранная ветка не является допустимым вариантом
        '404':
          description: Сессия или точка голосования не найдена
