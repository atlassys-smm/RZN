  /quiz/sessions/{id}/participants/{participantId}/team:
    patch:
      tags:
      - Викторина - Оператор
      summary: Переместить участника в другую команду
      description: 'При переносе капитана в другую команду новый капитан старой команды
        выбирается случайно из оставшихся участников. Если участников не осталось,
        `captain_id` старой команды становится `null`. Если в целевой команде нет
        капитана, им становится перенесённый участник (даже если до переноса он не
        был капитаном); существующий капитан целевой команды сохраняется. Участник
        и капитаны обеих команд обновляются одной транзакцией. После сохранения отправляется
        только participant_team_changed; клиент по нему обновляет составы и капитанов
        команд. Повторный запрос с текущей командой возвращает участника без изменений
        и событий, даже если команда заполнена. Перенос в другую заполненную команду
        возвращает 409 без изменений.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: participantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - team_id
              properties:
                team_id:
                  type: integer
                  format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Участник перемещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizParticipant'
        '404':
          description: Сессия, участник или команда не найдены
        '409':
          description: В целевой команде достигнут лимит в 10 участников
  /quiz/sessions/{id}/next:
    post:
      tags:
      - Викторина - Оператор
      summary: Следующий вопрос / Начать игру
      description: 'Если сессия в статусе `1` (waiting) — запускает первый вопрос
        первого раунда (старт игры).

        При старте командной игры исключает пустые команды и требует не менее 2 оставшихся
        команд с минимум 2 участниками в каждой.

        Если игра идёт — ручной переход к следующему вопросу без ожидания автоматической
        задержки.

        Если вопросов в раунде больше нет — ручной запуск следующего раунда. Задержки
        отсчитывает клиент перед вызовом LED endpoint /led/next.

        После последнего вопроса последнего раунда сессия остаётся в статусе `2` (active);
        /next больше не продвигает игру. После раскрытия ответа can_start_final_round=true
        позволяет оператору выбрать /finish или /final-round. Если FINAL (9) уже есть,
        доступно только завершение через /finish.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Текущее состояние игры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_team_members:
                  summary: Недостаточный состав при старте игры
                  value:
                    error: insufficient_team_members
                    message: Для старта нужны минимум 2 команды по 2 участника
                session_finished:
                  summary: Сессия завершена
                  value:
                    error: session_finished
                    message: Сессия уже завершена
                no_more_questions:
                  summary: Нет следующих вопросов
                  value:
                    error: no_more_questions
                    message: Это последний вопрос, используйте finish для завершения
  /quiz/sessions/{id}/reveal:
    post:
      tags:
      - Викторина - Оператор
      summary: Показать ответ
      description: Показать правильный ответ с пояснением вручную, в том числе при
        auto_reveal_delay = null или до окончания задержки
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Правильный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: object
                    description: Эталонный ответ в формате соответствующего question_type
                    additionalProperties: true
                  explanation:
                    type: string
                    nullable: true
        '400':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_revealed:
                  summary: Ответ уже показан
                  value:
                    error: already_revealed
                    message: Правильный ответ уже был показан
                no_active_question:
                  summary: Нет активного вопроса
                  value:
                    error: no_active_question
                    message: Нет активного вопроса для показа ответа
  /quiz/sessions/{id}/timer/pause:
    post:
      tags:
      - Викторина - Оператор
      summary: Пауза таймера
      description: Поставить на паузу таймер текущего вопроса
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
