paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Вход в систему
      description: Аутентификация пользователя и получение JWT-токенов
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              - password
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Успешная аутентификация
        '401':
          description: Неверные учётные данные
  /auth/logout:
    post:
      tags:
      - auth
      summary: Выход из системы
      description: Инвалидация текущего токена
      responses:
        '204':
          description: Токен инвалидирован
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Обновление токена
      description: Получение новой пары access/refresh токенов
      responses:
        '200':
          description: Токены обновлены
        '401':
          description: Refresh-токен недействителен
  /auth/{id}:
    get:
      tags:
      - auth
      summary: Временный тестовый JWT пользователя
      description: Без авторизации выдаёт JWT существующего пользователя; удалить
        перед запуском в production.
      x-implementation-status: implemented
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: JWT пользователя
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
        '404':
          description: Пользователь не найден
        '422':
          description: Некорректный идентификатор
  /users/me/recommendations:
    get:
      tags:
      - Рекомендации пользователя
      summary: Общий профиль рекомендаций текущего пользователя
      operationId: user_recommendations_get
      description: Профиль с максимум тремя профессиями и вкладами источников. До
        первого сохранённого источника — JSON null. В расчёте участвуют только источники
        с положительным весом в SOURCE_WEIGHTS. Рейтинг рассчитывается при каждом
        запросе из снимков источников; веса заданы в коде, итог не сохраняется.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Профиль рекомендаций или null
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/UserRecommendations'
                - type: 'null'
        '401':
          description: Требуется авторизация
  /users/me:
    get:
      tags:
      - users
      summary: Текущий пользователь
      description: Получить профиль текущего аутентифицированного пользователя
      responses:
        '200':
          description: Профиль пользователя
    patch:
      tags:
      - users
      summary: Обновить профиль
      description: Частичное обновление профиля текущего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Профиль обновлён
  /professions:
    get:
      tags:
      - Профессии
      summary: Список профессий
      description: Получить справочник профессий с фильтрацией и пагинацией
      security: []
      parameters:
      - name: direction_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по профессиональному направлению
      - name: industry_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по отрасли
      - name: search
        in: query
        schema:
          type: string
        description: Поиск по названию
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список профессий
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profession'
                  total:
                    type: integer
    post:
      tags:
      - Профессии
      summary: Создать профессию
      description: Создать новую профессию (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - industry_id
              - direction_id
              properties:
                name:
                  type: string
                description:
                  type: string
                industry_id:
                  type: integer
                  format: int64
                direction_id:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Профессия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profession'
  /professions/{id}:
    get:
      tags:
      - Профессии
      summary: Детали профессии
      description: Получить полную информацию о профессии по идентификатору
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Карточка профессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profession'
        '404':
          description: Профессия не найдена
    put:
      tags:
      - Профессии
      summary: Обновить профессию
      description: Обновить профессию (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                industry_id:
                  type: integer
                  format: int64
                direction_id:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Профессия обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profession'
        '404':
          description: Не найдена
    delete:
      tags:
      - Профессии
      summary: Удалить профессию
      description: Удалить профессию (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Профессия удалена
        '404':
          description: Не найдена
  /industries:
    get:
      tags:
      - Профессии
      summary: Список отраслей
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список отраслей
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Industry'
                  total:
                    type: integer
    post:
      tags:
      - Профессии
      summary: Создать отрасль
      description: Создать новую отрасль (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Отрасль создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Industry'
  /industries/{id}:
    put:
      tags:
      - Профессии
      summary: Обновить отрасль
      description: Обновить отрасль (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Отрасль обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Industry'
        '404':
          description: Не найдена
    delete:
      tags:
      - Профессии
      summary: Удалить отрасль
      description: Удалить отрасль (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Отрасль удалена
        '409':
          description: Нельзя удалить — есть связанные профессии
  /directions:
    get:
      tags:
      - Профессии
      summary: Список направлений
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список направлений
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Direction'
                  total:
                    type: integer
    post:
      tags:
      - Профессии
      summary: Создать направление
      description: Создать новое направление (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Направление создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direction'
  /directions/{id}:
    put:
      tags:
      - Профессии
      summary: Обновить направление
      description: Обновить направление (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
