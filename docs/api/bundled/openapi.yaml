  /quiz/sessions:
    post:
      tags:
      - Викторина - Оператор
      summary: Создать сессию
      description: 'Создаёт сессию в статусе `1` (waiting). Она привязывается к LED-устройству
        `device_id`; на одном устройстве одновременно может быть только одна сессия
        со статусом `1` (waiting) или `2` (active).

        API принимает только готовый массив `rounds`, без `template_id`. Если оператор
        выбрал шаблон, клиент переносит его типы раундов и `question_ids` в этот массив.
        Для каждого раунда передаются либо конкретные `question_ids`, либо `question_count`
        и `question_filters` для автоматического выбора вопросов.

        Команды создаются автоматически по `settings.team_count` (для `mode = 2`,
        team).

        Оператор запускает первый вопрос через `POST /quiz/sessions/{id}/next`. Для
        командной игры нужны не менее двух команд с не менее чем двумя участниками
        в каждой. Пустые команды исключаются при старте. Состав раундов и вопросов
        после создания не редактируется.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - device_id
              - mode
              - rounds
              properties:
                device_id:
                  type: integer
                  format: int64
                  description: LED-устройство, на котором проводится сессия
                mode:
                  type: integer
                  enum:
                  - 1
                  - 2
                  description: 1 — individual, 2 — team
                rounds:
                  type: array
                  description: Раунды с вопросами из шаблона, выбранными явно по ID
                    или автоматически по количеству и фильтрам
                  items:
                    type: object
                    required:
                    - round_type
                    oneOf:
                    - required:
                      - question_ids
                    - required:
                      - question_count
                      - question_filters
                    properties:
                      round_type:
                        type: integer
                        enum:
                        - 1
                        - 2
                        - 3
                        - 4
                        - 5
                        - 6
                        - 7
                        - 8
                        - 9
                      question_ids:
                        type: array
                        description: Явно выбранные вопросы; используется вместо автоматического
                          выбора
                        items:
                          type: integer
                          format: int64
                      question_count:
                        type: integer
                        minimum: 1
                        description: Сколько вопросов автоматически выбрать для раунда
                      question_filters:
                        type: object
                        description: Фильтры кандидатов. Каждое поле необязательно;
                          заданные поля ограничивают выбор.
                        properties:
                          difficulty:
                            type: integer
                            enum:
                            - 1
                            - 2
                            - 3
                            description: Числовой ID сложности
                          age_group:
                            type: integer
                            description: Числовой ID возрастной группы
                          tags:
                            type: array
                            items:
                              type: string
                            description: Теги для фильтрации вопросов
                settings:
                  type: object
                  properties:
                    team_count:
                      type: integer
                      minimum: 2
                      maximum: 8
                      description: Количество команд (для mode=2, team)
                    team_capacity:
                      type: integer
                      minimum: 2
                      maximum: 10
                      default: 10
                      description: Максимум участников в одной команде
                    auto_reveal:
                      type: boolean
                      default: true
                    auto_next:
                      type: boolean
                      default: false
                    auto_next_delay:
                      type: integer
                      default: 5
                    between_rounds_delay:
                      type: integer
                      default: 10
                    show_intermediate_results:
                      type: boolean
                      default: true
                    scoring:
                      type: object
                      description: Настройки системы начисления баллов. Если не переданы
                        — подставляются стандартные из CMS
                      properties:
                        partial_correct:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                        speed_bonus:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            coefficient:
                              type: number
                              default: 1.5
                            threshold_percent:
                              type: integer
                              default: 50
                        streak_bonus:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            step:
                              type: number
                              default: 0.05
                            max:
                              type: number
                              default: 2.0
                        consensus_bonus:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            coefficient:
                              type: number
                              default: 1.2
                        final_multiplier:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: true
                            coefficient:
                              type: number
                              default: 1.5
                        penalty:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                              default: false
                            coefficient:
                              type: number
                              default: 0.0
      responses:
        '201':
          description: Сессия создана (статус waiting, ожидает старта оператора)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSession'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_rounds:
                  summary: Некорректные раунды
                  value:
                    error: invalid_rounds
                    message: Количество раундов должно быть от 3 до 8
                invalid_team_count:
                  summary: Некорректное количество команд
                  value:
                    error: invalid_team_count
                    message: Количество команд должно быть от 2 до 8
        '409':
          description: На этом устройстве уже есть незавершённая сессия
  /quiz/sessions/active:
    get:
      tags:
      - Викторина
      summary: Получить активную сессию
      description: 'Возвращает текущую незавершённую сессию (status=1, waiting или
        status=2, active) для указанного LED-устройства.

        Оператор использует запрос для отображения сессии, уже запущенной на этом
        устройстве.

        Всегда возвращает `round_count` — общее количество раундов и `current_round_question_count`
        — количество вопросов в текущем раунде. В статусе waiting счётчик вопросов
        относится к первому раунду.

        Во время active также возвращает текущий раунд, вопрос и таймер. `select=teams`
        и `select=participants` добавляют состав команд и участников; несколько значений
        select передаются повторяющимися параметрами запроса.

        Если активной сессии нет — возвращает 404.

        '
      parameters:
      - name: device_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        description: Связанные данные для включения
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - teams
            - participants
            - current_question
            - current_round
            - timer
      responses:
        '200':
          description: Активная сессия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionFull'
        '404':
          description: Активной сессии нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{id}:
    get:
      tags:
      - Викторина
      summary: Получить сессию
      description: 'Возвращает базовые поля сессии и счётчики round_count/current_round_question_count;
        во время active также текущий раунд, вопрос и таймер.

        `select=teams` и `select=participants` добавляют состав команд и участников.
        Несколько значений select передаются повторяющимися параметрами запроса. Если
        `participant_id` принадлежит капитану, `answer_submissions` текущего вопроса
        содержит ответы его команды. До раскрытия правильного ответа поля `is_correct`
        у вариантов и `answer_key` вопроса не возвращаются.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        description: Связанные данные для включения
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - teams
            - participants
            - current_question
            - current_round
            - timer
      - name: participant_id
        in: query
        description: ID GameSessionParticipant; when it identifies the team captain,
          current_question includes team-member submissions
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Состояние сессии; select добавляет запрошенные списки команд
            и участников.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionFull'
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{id}/finish:
    post:
      tags:
      - Викторина - Оператор
      summary: Завершить сессию
      description: Завершить сессию. Статус меняется на `3` (finished). Возвращает
        состояние завершённой сессии.
      parameters:
      - name: id
        in: path
