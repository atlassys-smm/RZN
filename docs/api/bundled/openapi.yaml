  /quiz/sessions/{id}/timer/stop:
    post:
      tags:
      - Викторина - Оператор
      summary: Остановить таймер
      description: Досрочно завершить приём ответов на текущий вопрос. При auto_reveal_delay
        = 0 ответ показывается сразу. При положительном значении клиент отсчитывает
        задержку и вызывает reveal; при null показ выполняется вручную. Сервер не
        отсчитывает задержки.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Текущее состояние игры после остановки таймера
          content:
            application/json:
