      summary: Ротация токенов
      description: Одноразовый refresh из cookie staff_refresh; тело и CSRF-токен
        не требуются. Повтор отзывает сессию. Обязателен доверенный Origin или Referer.
      security:
      - staffRefresh: []
      responses:
        '200':
          description: Новый access; refresh заменён в HttpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Недействительная сессия; cookie удаляется
        '403':
          description: Недопустимый или отсутствующий Origin/Referer
  /staff/info:
    get:
      tags:
      - Сотрудник
      summary: Данные сотрудника
      description: Профиль текущего сотрудника по Staff JWT. Доступен сотрудникам
        всех ролей. Хеш пароля не возвращается.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Данные текущего сотрудника
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            Pragma:
              schema:
                type: string
                enum:
                - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffInfoResponse'
        '401':
          description: Staff JWT отсутствует или недействителен; пользователь и устройство
            не допускаются; сотрудник заблокирован или сессия истекла/отозвана
    patch:
      tags:
      - Сотрудник
      summary: Изменить данные сотрудника
      description: 'Частично обновляет профиль владельца Staff JWT. Доступен сотрудникам
        всех

        ролей. Принимает first_name и last_name: хотя бы одно поле обязательно.

        Пропущенные поля сохраняются. Пробелы по краям удаляются до проверки длины;

        null не принимается. Email, роль, статус и пароль этим запросом не меняются.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                first_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                last_name:
                  type: string
                  minLength: 1
                  maxLength: 100
            example:
              first_name: Анна
              last_name: Иванова
      responses:
        '200':
          description: Данные текущего сотрудника
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            Pragma:
              schema:
                type: string
                enum:
                - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffInfoResponse'
        '401':
          description: Staff JWT отсутствует или недействителен; пользователь и устройство
            не допускаются; сотрудник заблокирован или сессия истекла/отозвана
        '422':
          description: Не передано ни одного поля; имя или фамилия null, не строка,
            пустые, длиннее 100 символов; переданы лишние поля
  /auth/{id}:
    get:
      tags:
      - Авторизация пользователей
      summary: Тестовый вход по ID пользователя
      description: 'Временный вход без пароля и действующего токена.

        '
      security: []
      parameters:
      - name: id
        in: path
        required: true
        description: ID существующего активного пользователя; нечисловой сегмент не
          соответствует маршруту (404).
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        '200':
          description: Access JWT пользователя; создана серверная сессия и установлена
            refresh cookie
          headers:
            Set-Cookie:
              schema:
                type: string
              description: user_refresh; HttpOnly; Path=/api/auth/user. Secure и SameSite
                определяются AUTH_COOKIE_SECURE и AUTH_COOKIE_SAMESITE.
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                properties:
                  token:
                    type: string
                    description: Штатный access JWT; имя поля сохранено для тестового
                      маршрута.
        '401':
          description: Пользователь деактивирован либо срок гостя отсутствует или
            истёк
          content:
            application/json:
              schema:
                type: object
                required:
                - detail
                properties:
                  detail:
                    type: string
              example:
                detail: Недействительная сессия
        '404':
          description: Тестовый вход выключен, пользователь не найден или URL не соответствует
            числовому ID
          content:
            application/json:
              schema:
                type: object
                required:
                - detail
                properties:
                  detail:
                    type: string
              examples:
                disabled:
                  value:
                    detail: Тестовый вход отключён
                missing-user:
                  value:
                    detail: Пользователь не найден
                invalid-path:
                  value:
                    detail: Not Found
  /auth/user/guest:
