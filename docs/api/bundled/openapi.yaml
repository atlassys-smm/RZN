              schema:
                type: object
                properties:
                  participant_id:
                    type: integer
                    format: int64
                  team_id:
                    type: integer
                    format: int64
                  is_captain:
                    type: boolean
                    description: true если участник стал капитаном (первый в команде)
        '409':
