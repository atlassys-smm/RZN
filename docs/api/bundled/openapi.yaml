      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Текущее состояние сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
  /quiz/sessions/{id}/results:
