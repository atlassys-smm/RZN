        properties:
          round_index:
            type: integer
          round_type:
            type: string
      - type: object
        properties:
          scores:
            type: array
            items:
              allOf:
              - $ref: '#/components/schemas/QuizScoredEntry'
              - type: object
                properties:
                  round_score:
                    type: integer
