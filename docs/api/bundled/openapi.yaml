                  anyOf:
                  - type: string
                    contentMediaType: application/octet-stream
                  - type: 'null'
                  title: File Preview
                file_title:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: File Title
                file_description:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: File Description
              type: object
              title: Body_update_branch_api_cms_video_scenarios__scenario_id__branches__branch_id__put
      responses:
        '200':
          description: Ветка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
        '404':
          description: Ветка не найдена
    delete:
      tags:
      - Профессии в действии - CMS
      summary: Удалить ветку
      description: Удалить ветку и все её дочерние ветки. Стартовую ветку удалить
        нельзя.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: branchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
