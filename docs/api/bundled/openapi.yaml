  /competences/{id}:
    get:
      tags:
      - Компетенции
      summary: Получить компетенцию
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Компетенция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competence'
        '404':
          description: Не найдена
    put:
      tags:
      - Компетенции
      summary: Обновить компетенцию
      description: Обновить компетенцию (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
