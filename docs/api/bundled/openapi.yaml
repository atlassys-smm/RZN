        '400':
          description: Нет текущего вопроса или приём ответов уже закрыт
  /quiz/sessions/{id}/skip:
    post:
      tags:
      - Викторина - Оператор
      summary: Пропустить показ ответа
      description: После закрытия приёма ответов перейти к следующему вопросу или
        результатам раунда без показа правильного ответа. Уже принятые зачётные ответы
        проверяются автоматически.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Текущее состояние игры после перехода
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
        '400':
          description: Нет текущего вопроса или приём ответов ещё открыт
  /quiz/sessions/{id}/led/next:
    post:
      tags:
      - Викторина - LED
      summary: Следующий вопрос (LED)
      description: LED вызывает endpoint после окончания таймера с учётом auto_reveal_delay,
        который отсчитывает клиент. Если время вопроса вышло и auto_reveal_delay задан
        числом, сервер раскрывает ответ и начисляет баллы; при null ожидает ручной
        reveal или skip. Если ответ уже показан, endpoint переходит к следующему вопросу.
        Перед таким автоматическим вызовом клиент отсчитывает auto_next_delay внутри
        раунда или between_rounds_delay между раундами; при null вызов не выполняется.
        Сервер не проверяет время этих задержек и не сохраняет дополнительные временные
        метки. После ручной остановки при положительном auto_reveal_delay клиент вызывает
        reveal по окончании задержки. После раскрытия последнего вопроса последнего
        раунда оператор выбирает finish или final-round по can_start_final_round;
        после финала вызывает только finish. Для device-токена требуется роль 1; другая
        группа устройства — 403.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Текущее состояние сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSessionState'
  /quiz/sessions/{id}/results:
    get:
      tags:
      - Викторина - Оператор
      summary: Текущий результат
      description: "Актуальный рейтинг на текущий момент. Можно запрашивать в любой\
        \ момент — между раундами или после завершения сессии.\n Для device-токена\
        \ требуется роль 1; другая группа устройства — 403."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Текущий результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizTotalResult'
  /quiz/sessions/{sessionId}/join:
    post:
      tags:
      - Викторина - Игрок
      summary: Подключиться к сессии
      description: Подключиться с user access-токеном после гостевого входа или OAuth.
        Повторный запрос возвращает того же участника.
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Подключён
          content:
            application/json:
              schema:
                type: object
                required:
                - participant_id
                - session_id
                - mode
                properties:
                  participant_id:
                    type: integer
                    format: int64
                    description: ID GameSessionParticipant
                  session_id:
                    type: integer
                    format: int64
                  mode:
                    type: integer
                    enum:
                    - 1
                    - 2
                    description: 1 — individual, 2 — team
                  teams:
                    type: array
                    description: Список команд (для mode=2, team)
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        name:
                          type: string
                        color:
                          type: string
                        participant_count:
                          type: integer
        '404':
          description: Сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Сессия уже завершена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /quiz/sessions/{sessionId}/team/{teamId}/join:
    post:
      tags:
      - Викторина - Игрок
      summary: Выбрать команду
      description: Присоединиться к команде (для mode=team). Участник определяется
        по текущему пользователю. Сначала вызовите /join; смена команды доступна оператору.
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Присоединился к команде
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant_id:
                    type: integer
                    format: int64
                  team_id:
                    type: integer
                    format: int64
                  is_captain:
                    type: boolean
                    description: true если участник стал капитаном (первый в команде)
        '409':
          description: Сессия уже началась или команда заполнена (10 участников)
  /quiz/sessions/{sessionId}/answer:
    post:
      tags:
      - Викторина - Игрок
      summary: Ответ на вопрос
      description: 'User access-токен обязателен. Участник определяется по пользователю
        и сессии.

        Ответ на текущий вопрос. Поведение зависит от режима и роли:

        - Individual mode: ответ засчитывается

        - Team mode, обычный участник: сохраняется как голос (для отображения капитану)

        - Team mode, капитан: любой ответ является решающим ответом команды независимо
        от `is_final`; повторная отправка запрещена

        После ответа последнего участника индивидуальной игры или ответа капитана
        последней непустой команды приём ответов автоматически закрывается. Голос
        капитана всегда решающий, независимо от `is_final`; предварительные голоса
        остальных участников не завершают командное голосование. Пустые команды не
        учитываются. После `answers_update` отправляется `all_answered` (только поле
        `type`), затем применяется та же обработка, что при окончании таймера через
        `/led/next`: при числовом `auto_reveal_delay` ответ раскрывается и начисляются
        баллы, при `null` ожидается ручной `reveal` или `skip`. Досрочное закрытие
        не отправляет `timer_expired` или `timer_stopped`. Дальнейший переход выполняется
        по существующему сценарию LED, задержки отсчитывает клиент.

        Ответ API остаётся {"accepted": true}, включая ответ, который досрочно закрыл
        вопрос.

        '
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - answer
              additionalProperties: false
              properties:
                answer:
                  type: object
                  description: JSON-ответ согласно типу вопроса; форматы описаны в
                    entities/quiz.md
                  additionalProperties: true
                is_final:
                  type: boolean
                  default: false
                  description: Необязательный флаг совместимости. Ответ капитана всегда
                    решающий независимо от значения; is_final=true у обычного участника
                    запрещён
      responses:
        '401':
          description: Отсутствующий, истёкший или недействительный токен
        '403':
          description: Нет доступа к сессии или операция недоступна роли
        '200':
          description: Ответ принят
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_answered:
                  summary: Уже ответил
                  value:
                    error: already_answered
                    message: Вы уже дали ответ на этот вопрос
                answering_closed:
                  summary: Приём ответов завершён
                  value:
                    error: answering_closed
                    message: Приём ответов на этот вопрос завершён
                captain_already_answered:
                  summary: Капитан уже отправил решающий ответ
                  value:
                    error: captain_already_answered
                    message: Капитан команды уже отправил решающий ответ
                not_captain:
                  summary: Решающий ответ может отправить только капитан
                  value:
                    error: not_captain
                    message: Только капитан может отправить решающий ответ команды
        '404':
          description: Сессия или вопрос не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/devices:
    post:
      tags:
      - Устройства
      summary: Зарегистрировать устройство
      description: 'Требуется staff access-токен оператора.

        Зарегистрировать новое устройство и выпустить для него device-токен (JWT,
        привязан к `device_id`).

        Токен возвращается только один раз, в ответе на регистрацию — сохраните его
        в конфигурации плеера.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - roles
              properties:
                name:
                  type: string
                location:
                  type: string
                  nullable: true
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/DeviceRole'
      responses:
        '422':
          description: Нужен непустой список известных неповторяющихся ролей.
        '403':
          description: Недостаточно прав
        '401':
