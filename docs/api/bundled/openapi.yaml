                - 1
                - 2
                - 3
                - 4
                - 5
                - 6
                - 7
                - 8
                - 9
          current_question:
            type: object
            nullable: true
            description: Текущий вопрос (заполняется при select=current_question).
              До раскрытия ответа из question опускаются answer_key и is_correct у
              вариантов.
            properties:
              index:
                type: integer
              question:
                $ref: '#/components/schemas/QuizQuestion'
              correct_answer:
                type: object
