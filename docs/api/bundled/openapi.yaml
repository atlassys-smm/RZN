paths:
  /cms/led/screensavers:
    get:
      tags:
      - Заставки LED - CMS
      summary: Список заставок LED
      description: Требуется staff access-токен admin/content_editor/operator или
        Device JWT любого активного устройства. Роль устройства не проверяется, включая
        устройства без ролей. В ответе объект file с подписанными ссылками на 24 часа;
        media_id остаётся внутренним полем БД. Сортировка по ID по убыванию.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Список заставок LED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedScreensaverList'
        '401':
          description: Отсутствующий или недействительный токен, неактивное или неизвестное
            устройство; User JWT не допускается
        '403':
          description: Недостаточно прав
        '422':
          description: Неверные поля формы или параметры
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
    post:
      tags:
      - Заставки LED - CMS
      summary: Создать заставку LED
      description: Требуется staff access-токен admin/content_editor. Поля передаются
        отдельными частями multipart/form-data; media_id не принимается. Файл и сущность
        сохраняются одной транзакцией. Превью — JPEG, PNG, WebP или GIF; для видео
        без превью создаётся первый кадр. Общий файловый механизм может вернуть 413
        (превышен размер), 422 (неверное превью или видео) или 503 (генератор превью
        недоступен). Обязательны name и file.
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Создать заставку LED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedScreensaver'
        '401':
          description: Отсутствующий или недействительный staff access-токен
        '403':
          description: Недостаточно прав
        '422':
          description: Неверные поля формы или параметры
        '413':
          description: Файл или превью превышает допустимый размер
        '503':
          description: Генератор превью недоступен
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                file:
                  type: string
                  format: binary
                file_preview:
                  type: string
                  format: binary
                file_title:
                  type:
                  - string
                  - 'null'
                file_description:
                  type:
                  - string
                  - 'null'
              required:
              - name
              - file
  /cms/led/screensavers/{screensaver_id}:
    get:
      tags:
      - Заставки LED - CMS
      summary: Получить заставку LED
      description: Требуется staff access-токен admin/content_editor/operator или
        Device JWT любого активного устройства. Роль устройства не проверяется, включая
        устройства без ролей. В ответе объект file с подписанными ссылками на 24 часа;
        media_id остаётся внутренним полем БД.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Получить заставку LED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedScreensaver'
        '401':
          description: Отсутствующий или недействительный токен, неактивное или неизвестное
            устройство; User JWT не допускается
        '403':
          description: Недостаточно прав
        '422':
          description: Неверные поля формы или параметры
        '404':
          description: Заставка не найдена
      parameters:
      - name: screensaver_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags:
      - Заставки LED - CMS
      summary: Обновить заставку LED
      description: Требуется staff access-токен admin/content_editor. Поля передаются
        отдельными частями multipart/form-data; media_id не принимается. Файл и сущность
        сохраняются одной транзакцией. Превью — JPEG, PNG, WebP или GIF; для видео
        без превью создаётся первый кадр. Общий файловый механизм может вернуть 413
        (превышен размер), 422 (неверное превью или видео) или 503 (генератор превью
        недоступен). Без нового file прежнее вложение и метаданные сохраняются; file_preview
        без file — 422. Старый файл сохраняется.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Обновить заставку LED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedScreensaver'
        '401':
          description: Отсутствующий или недействительный staff access-токен
        '403':
          description: Недостаточно прав
        '422':
          description: Неверные поля формы или параметры
        '404':
          description: Заставка не найдена
        '413':
          description: Файл или превью превышает допустимый размер
        '503':
          description: Генератор превью недоступен
      parameters:
      - name: screensaver_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                file:
                  type: string
                  format: binary
                file_preview:
                  type: string
                  format: binary
                file_title:
                  type:
                  - string
                  - 'null'
                file_description:
                  type:
                  - string
                  - 'null'
    delete:
      tags:
      - Заставки LED - CMS
      summary: Удалить заставку LED
      description: Требуется staff access-токен admin/content_editor. Удаляется только
        заставка; файл сохраняется.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Удалить заставку LED
        '401':
          description: Отсутствующий или недействительный staff access-токен
        '403':
          description: Недостаточно прав
        '422':
          description: Неверные поля формы или параметры
        '404':
          description: Заставка не найдена
      parameters:
      - name: screensaver_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
  /device/auth/qr:
    post:
      tags:
      - Авторизация устройства
      summary: Создать QR для подключения пользователя
      description: 'Требуется device-токен. QR действует 2 минуты. Новый QR заменяет
        предыдущий

        неподтверждённый код этого устройства; при подключённом пользователе — 409.

        API возвращает code и expires_at. Фронтенд устройства собирает ссылку

        /api/device/auth/qr/{code} на backend и отображает её QR. При открытии ссылки
        сервер отправляет qr_opened

        в сокет устройства и перенаправляет на мобильный фронтенд с fragment #code=...
        .

        Мобильный фронтенд сохраняет код на время входа и отправляет его в /device/auth/confirm.

        '
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Одноразовый QR создан; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceQrResponse'
        '401':
          description: Нет действующего device-токена
        '409':
          description: Устройство уже подключено к пользователю
  /device/auth/qr/{code}:
    get:
      tags:
      - Авторизация устройства
      summary: Открыть QR и перейти на фронтенд
      description: 'Публичный переход с телефона по одноразовому code. Для действующего
        QR отправляет событие qr_opened устройству, затем перенаправляет на настроенный
        мобильный фронтенд с #code=... . Открытие не погашает код и не продлевает
        его срок: повторный переход снова отправляет событие. Код погашается только
        после успешного confirm. Ответ не кешируется.'
      security: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '302':
          description: Переход на мобильный фронтенд
          headers:
            Location:
              schema:
                type: string
                format: uri
            Referrer-Policy:
              schema:
                type: string
                example: no-referrer
        '403':
          description: Устройство недоступно
        '410':
          description: Код неизвестен, истёк, заменён или уже использован
        '422':
          description: Некорректный код
  /device/auth/confirm:
    post:
      tags:
      - Авторизация устройства
      summary: Подтвердить подключение с телефона
      description: 'Требуется user access-токен; гостевой вход тоже поддерживается.

        Пользователь определяется по токену, устройство — по одноразовому code.

        Код погашается при успешном подтверждении. Подключение действует до часа

        с момента подтверждения, но не дольше пользовательской сессии и срока гостя.

        При каждом подтверждении создаётся новый connection_id, включая повторное
        подключение

        того же User. После успешной привязки отправляется user_connected в сокет
        устройства.

        Пользовательский JWT на устройство не передаётся.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceConfirmRequest'
      responses:
        '200':
          description: Подключение подтверждено; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceUserResponse'
        '401':
          description: Нет действующего user access-токена
        '403':
          description: Устройство недоступно
        '409':
          description: Устройство уже подключено к пользователю
        '410':
          description: Код неизвестен, истёк, заменён или уже использован
        '422':
          description: Некорректное тело запроса
  /device/auth/user:
    get:
      tags:
      - Авторизация устройства
      summary: Получить подключённого пользователя
      description: 'Требуется device-токен. Пока подключения нет, возвращает user,
        expires_at и connection_id со значением null.

        Фронтенд подключается к /api/device/auth/ws и ожидает события без периодического
        опроса.

        qr_opened сообщает об открытии QR; после user_connected фронтенд вызывает
        этот маршрут

        для получения профиля и connection_id. Маршрут также вызывается при подключении

        и переподключении сокета, чтобы восстановить текущее состояние.

        Чтение состояния не продлевает подключение. После истечения TTL, выхода на
        телефоне,

        истечения пользовательской сессии или деактивации пользователя — user: null.

        Ответ содержит connection_id текущего подключения. Для личных действий устройство

        передаёт его в X-Device-Connection-Id вместе с Device JWT; user_id не передаётся.

        Сервер определяет пользователя по Redis и отдельно проверяет роль модуля.

        Старый идентификатор после переподключения отклоняется.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Текущее подключение; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceUserResponse'
        '401':
          description: Нет действующего device-токена
    delete:
      tags:
      - Авторизация устройства
      summary: Завершить подключение пользователя
      parameters:
      - $ref: '#/components/parameters/DeviceConnectionId'
      description: 'Требуется device-токен. При действующем подключении обязателен

        X-Device-Connection-Id: без него — 422, несовпадение с текущим — 403.

        Удаляет только текущее подключение и его ожидающий QR. Повтор со старым идентификатором

        при отсутствии подключения возвращает 204 и не отменяет новый неподтверждённый
        QR.

        Без заголовка и без подключения можно отменить ожидающий QR.

        Авторизация на телефоне сохраняется.

        '
      security:
      - bearerAuth: []
      responses:
        '403':
          description: Идентификатор не соответствует текущему подключению
        '422':
          description: Для завершения текущего подключения требуется X-Device-Connection-Id
        '204':
          description: Подключение завершено или уже отсутствует
        '401':
          description: Нет действующего device-токена
  /auth/login:
    post:
      tags:
      - Авторизация сотрудников
      summary: Вход в систему
      description: Вход сотрудника. Refresh устанавливается только в HttpOnly cookie
        staff_refresh; Origin обязателен.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  description: Email сотрудника
                password:
                  type: string
                  description: Пароль
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthTokenResponse'
                - type: object
                  required:
                  - staff_user_id
                  - role
                  properties:
                    staff_user_id:
                      type: integer
                    role:
                      type: integer
                      enum:
                      - 1
                      - 2
                      - 3
                      - 4
          headers:
            Set-Cookie:
              schema:
                type: string
              description: staff_refresh; HttpOnly; Secure; SameSite=Lax; Path=/api/auth
        '401':
          description: Неверные учётные данные
        '403':
          description: Недопустимый Origin
  /auth/staff:
