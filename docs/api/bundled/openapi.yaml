openapi: 3.1.0
info:
  title: ПрофНавигатор 62 — API
  description: 'REST API платформы «ПрофНавигатор 62».

    Единая цифровая профориентационная платформа для Центра занятости населения Рязанской
    области.

    '
  version: 0.1.0
  contact:
    name: ПрофНавигатор 62
servers:
- url: http://localhost:8000/api
  description: Локальная разработка
tags:
- name: Авторизация пользователей
  description: Гостевой вход, OAuth и сессии посетителей
- name: Авторизация сотрудников
  description: Вход сотрудников, управление учётными записями и сессиями
- name: Пользователь
  description: Данные и профиль текущего пользователя
- name: LED-устройства
  description: Регистрация LED-устройств, управление ими и device-токенами
- name: Профессии
  description: Справочник профессий, отраслей и направлений
- name: Компетенции
  description: Справочник компетенций
- name: Организации
  description: Учебные заведения и работодатели
- name: Согласия
  description: Версионируемые юридические согласия на обработку персональных данных
- name: Аватары профессий
  description: Эталонные образы профессий для генерации аватаров
- name: Аватары пользователей
  description: Сгенерированные аватары пользователей
- name: Файлы
  description: Скачивание файлов по подписанным URL
- name: Викторина
  description: Общие методы — получение состояния сессии (используются оператором
    и игроками)
- name: Викторина - CMS
  description: Управление вопросами и шаблонами сценариев викторины
- name: Викторина - Оператор
  description: Игровая сессия — создание, управление ходом, результаты
- name: Викторина - Игрок
  description: Мобильный клиент — подключение к сессии и ответы
- name: Викторина - LED
  description: LED-экран — проверка таймера и автоматическое продвижение сессии
- name: Профессии в действии
  description: Общие методы — получение состояния показа (используется LED-экраном)
- name: Профессии в действии - CMS
  description: Управление видеосценариями и ветками
- name: Профессии в действии - Оператор
  description: Показ — запуск и остановка
- name: Профессии в действии - LED
  description: Получение состояния показа для LED-экрана
- name: Профессии в действии - Зритель
  description: Мобильный клиент — подключение и голосование
- name: profstart
  description: ПрофСтарт — тестирование
- name: analytics
  description: Аналитика и события
- name: cms
  description: CMS — управление контентом
- name: feedback
  description: Обратная связь и анкеты
- name: Обратная связь - CMS
  description: Управление анкетами и вопросами обратной связи
- name: Обратная связь - LED
  description: Получение анкет для LED-плееров
- name: Обратная связь - Пользователь
  description: Прохождение анкет обратной связи
- name: files
  description: Загрузка и управление файлами
paths:
  /auth/login:
    post:
      tags:
      - Авторизация сотрудников
      summary: Вход в систему
      description: Вход сотрудника. Refresh устанавливается только в HttpOnly cookie
        staff_refresh; Origin обязателен.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  description: Email сотрудника
                password:
                  type: string
                  description: Пароль
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthTokenResponse'
                - type: object
                  required:
                  - staff_user_id
                  - role
                  properties:
                    staff_user_id:
                      type: integer
                    role:
                      type: integer
                      enum:
                      - 1
                      - 2
                      - 3
                      - 4
          headers:
            Set-Cookie:
              schema:
                type: string
              description: staff_refresh; HttpOnly; Secure; SameSite=Lax; Path=/api/auth
        '401':
          description: Неверные учётные данные
        '403':
          description: Недопустимый Origin
  /auth/staff:
    post:
      tags:
      - Авторизация сотрудников
      summary: Создание сотрудника
      description: Создание новой учётной записи сотрудника (только для администраторов)
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - first_name
              - last_name
              - email
              - password
              - role
              properties:
                first_name:
                  type: string
                  description: Имя сотрудника
                last_name:
                  type: string
                  description: Фамилия сотрудника
                email:
                  type: string
                  description: Email для входа и уведомлений
                password:
                  type: string
                  description: Пароль без требований сложности; сохраняется хешем
                role:
                  type: integer
                  enum:
                  - 1
                  - 2
                  - 3
                  - 4
                  description: Роль сотрудника (1=admin, 2=operator, 3=analyst, 4=content_editor)
      responses:
        '201':
          description: Сотрудник создан
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - first_name
                - last_name
                - email
                - role
                - status
                properties:
                  id:
                    type: integer
                    description: ID сотрудника
                  first_name:
                    type: string
                  last_name:
                    type: string
                  email:
                    type: string
                  role:
                    type: integer
                    enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    description: Роль сотрудника (1=admin, 2=operator, 3=analyst,
                      4=content_editor)
                  status:
                    type: integer
                    enum:
                    - 1
                    - 2
                    description: Статус (1=active, 2=blocked)
        '401':
          description: Недействительный токен
        '403':
          description: Только для администраторов
        '409':
          description: Пользователь с таким email уже существует
        '422':
          description: Некорректные поля или роль
  /auth/logout:
    post:
      tags:
      - Авторизация сотрудников
      summary: Выход из текущей сессии
      description: Отзыв сессии и удаление refresh-cookie; её access сразу перестаёт
        работать. Остальные сессии сохраняются. Обязателен доверенный Origin или Referer.
      security:
      - staffRefresh: []
      responses:
        '204':
          description: Сессия отозвана, cookie удалена
        '401':
          description: Недействительная сессия; cookie удаляется
        '403':
          description: Недопустимый или отсутствующий Origin/Referer
  /auth/refresh:
    post:
      tags:
      - Авторизация сотрудников
      summary: Ротация токенов
      description: Одноразовый refresh из cookie staff_refresh; тело и CSRF-токен
        не требуются. Повтор отзывает сессию. Обязателен доверенный Origin или Referer.
      security:
      - staffRefresh: []
      responses:
        '200':
          description: Новый access; refresh заменён в HttpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Недействительная сессия; cookie удаляется
        '403':
          description: Недопустимый или отсутствующий Origin/Referer
  /auth/user/guest:
    post:
      tags:
      - Авторизация пользователей
      summary: Создание гостя
      description: Гость на 24 часа. Обязательны существующая версия согласия и consent_accepted=true.
        Тип, статус, дата и актуальность версии не проверяются. Origin обязателен.
        Refresh только в HttpOnly cookie user_refresh.
      security: []
      responses:
        '201':
          description: Гость создан
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthTokenResponse'
                - type: object
                  required:
                  - user_id
                  - is_guest
                  properties:
                    user_id:
                      type: integer
                    is_guest:
                      type: boolean
          headers:
            Set-Cookie:
              schema:
                type: string
              description: user_refresh; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/user
        '403':
          description: Недопустимый Origin
        '422':
          description: Согласие не принято или версия не существует
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - consent_version_id
              - consent_accepted
              properties:
                consent_version_id:
                  type: integer
                  minimum: 1
                consent_accepted:
                  type: boolean
                  enum:
                  - true
  /auth/user/refresh:
    post:
      tags:
      - Авторизация пользователей
      summary: Ротация токенов
      description: Одноразовый refresh из cookie user_refresh; тело и CSRF-токен не
        требуются. Повтор отзывает сессию. Обязателен доверенный Origin или Referer.
      security:
      - userRefresh: []
      responses:
        '200':
          description: Новый access; refresh заменён в HttpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Недействительная сессия; cookie удаляется
        '403':
          description: Недопустимый или отсутствующий Origin/Referer
  /auth/user/logout:
    post:
      tags:
      - Авторизация пользователей
      summary: Выход из текущей сессии
      description: Отзыв сессии и удаление refresh-cookie; её access сразу перестаёт
        работать. Остальные сессии сохраняются. Обязателен доверенный Origin или Referer.
      security:
      - userRefresh: []
      responses:
        '204':
          description: Сессия отозвана, cookie удалена
        '401':
          description: Недействительная сессия; cookie удаляется
        '403':
          description: Недопустимый или отсутствующий Origin/Referer
  /auth/user/oauth/{provider}:
    get:
      tags:
      - Авторизация пользователей
      summary: Вход через Яндекс ID / VK ID
      description: Фронтенд самостоятельно запускает OAuth и проверяет state. API
        принимает одноразовый код в параметре token, для VK также device_id, state,
        redirect_uri. Обязательны существующая версия согласия, consent_accepted=true
        и доверенный Origin/Referer. Access текущего гостя необязателен; он позволяет
        сохранить его ID при авторизации. При существующем OAuth-аккаунте выполняется
        вход в него без объединения истории. Access возвращается в JSON, refresh —
        в HttpOnly cookie. Аватар из OAuth не сохраняется.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - yandex
          - vk
      - name: token
        in: query
        required: true
        description: Одноразовый код авторизации от провайдера
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: consent_version_id
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - name: consent_accepted
        in: query
        required: true
        schema:
          type: boolean
          enum:
          - true
      - name: device_id
        in: query
        required: false
        description: 'Обязателен для VK: ID устройства из ответа VK ID'
        schema:
          type: string
          minLength: 1
      - name: state
        in: query
        required: false
        description: 'Обязателен для VK: state, проверенный фронтендом'
        schema:
          type: string
          minLength: 1
      - name: redirect_uri
        in: query
        required: false
        description: 'Обязателен для VK: URI фронтенда, использованный при получении
          кода; его origin должен быть в AUTH_ALLOWED_ORIGINS'
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Авторизация завершена
          headers:
            Set-Cookie:
              schema:
                type: string
              description: user_refresh; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/user
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthTokenResponse'
                - type: object
                  required:
                  - user_id
                  - is_guest
                  properties:
                    user_id:
                      type: integer
                    is_guest:
                      type: boolean
                      enum:
                      - false
        '400':
          description: Отказ провайдера, недействительный или повторный код, неправильные
            параметры VK
        '401':
          description: Связанный аккаунт заблокирован или сессия отозвана
        '409':
          description: Смена OAuth-аккаунта у авторизованного пользователя не поддерживается
        '503':
          description: Провайдер не настроен или сервис временно недоступен
        '422':
          description: Некорректные параметры, согласие не принято или версия не существует
        '403':
          description: Недопустимый Origin/Referer
  /auth/user/info:
    get:
      tags:
      - Пользователь
      summary: Данные пользователя
      description: Получение данных текущего пользователя по токену
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - is_guest
                properties:
                  id:
                    type: integer
                    description: ID пользователя
                  is_guest:
                    type: boolean
                    description: true — гость, false — авторизован
                  email:
                    type: string
                    nullable: true
                    description: Email (только для авторизованных)
                  name:
                    type: string
                    nullable: true
                    description: Имя (только для авторизованных)
                  avatar_url:
                    type: string
                    nullable: true
                    description: URL аватара (только для авторизованных)
        '401':
          description: Недействительный токен
  /users/me:
    get:
      tags:
      - Пользователь
      summary: Текущий пользователь
      description: Получить профиль текущего аутентифицированного пользователя
      responses:
        '200':
          description: Профиль пользователя
    patch:
      tags:
      - Пользователь
      summary: Обновить профиль
      description: Частичное обновление профиля текущего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Профиль обновлён
  /professions:
    get:
      tags:
      - Профессии
      summary: Список профессий
      description: Получить справочник профессий с фильтрацией и пагинацией
      security: []
      parameters:
      - name: direction_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по профессиональному направлению
      - name: industry_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по отрасли
      - name: search
        in: query
        schema:
          type: string
        description: Поиск по названию
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список профессий
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profession'
                  total:
                    type: integer
    post:
      tags:
      - Профессии
      summary: Создать профессию
      description: Требуется staff access-токен редактора контента. Создать новую
        профессию (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - industry_id
              - direction_id
              properties:
                name:
                  type: string
                description:
                  type: string
                industry_id:
                  type: integer
                  format: int64
                direction_id:
                  type: integer
                  format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '201':
          description: Профессия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profession'
  /professions/{id}:
    get:
      tags:
      - Профессии
      summary: Детали профессии
      description: Получить полную информацию о профессии по идентификатору
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Карточка профессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profession'
        '404':
          description: Профессия не найдена
    put:
      tags:
      - Профессии
      summary: Обновить профессию
      description: Требуется staff access-токен редактора контента. Обновить профессию
        (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                industry_id:
                  type: integer
                  format: int64
                direction_id:
                  type: integer
                  format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Профессия обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profession'
        '404':
          description: Не найдена
    delete:
      tags:
      - Профессии
      summary: Удалить профессию
      description: Требуется staff access-токен редактора контента. Удалить профессию
        (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '204':
          description: Профессия удалена
        '404':
          description: Не найдена
  /industries:
    get:
      tags:
      - Профессии
      summary: Список отраслей
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список отраслей
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Industry'
                  total:
                    type: integer
    post:
      tags:
      - Профессии
      summary: Создать отрасль
      description: Требуется staff access-токен редактора контента. Создать новую
        отрасль (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '201':
          description: Отрасль создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Industry'
  /industries/{id}:
    put:
      tags:
      - Профессии
      summary: Обновить отрасль
      description: Требуется staff access-токен редактора контента. Обновить отрасль
        (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '200':
          description: Отрасль обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Industry'
        '404':
          description: Не найдена
    delete:
      tags:
      - Профессии
      summary: Удалить отрасль
      description: Требуется staff access-токен редактора контента. Удалить отрасль
        (требуются права CMS)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '403':
          description: Недостаточно прав
        '401':
          description: Недействительный или отсутствующий токен
        '204':
          description: Отрасль удалена
