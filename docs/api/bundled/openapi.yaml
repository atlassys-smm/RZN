                    description: ID GameSessionParticipant
                  session_id:
                    type: integer
                    format: int64
                  token:
                    type: string
                    description: User JWT гостевого пользователя
                  mode:
                    type: integer
                    enum:
                    - 1
                    - 2
                    description: 1 — individual, 2 — team
                  teams:
                    type: array
                    description: Список команд (для mode=2, team)
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        name:
                          type: string
                        color:
                          type: string
                        participant_count:
                          type: integer
