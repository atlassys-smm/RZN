paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Вход в систему
      description: Аутентификация пользователя и получение JWT-токенов
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              - password
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Успешная аутентификация
        '401':
          description: Неверные учётные данные
  /auth/logout:
    post:
      tags:
      - auth
      summary: Выход из системы
      description: Инвалидация текущего токена
      responses:
        '204':
          description: Токен инвалидирован
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Обновление токена
      description: Получение новой пары access/refresh токенов
      responses:
        '200':
          description: Токены обновлены
        '401':
          description: Refresh-токен недействителен
  /users/me:
    get:
      tags:
      - users
      summary: Текущий пользователь
      description: Получить профиль текущего аутентифицированного пользователя
      responses:
        '200':
          description: Профиль пользователя
    patch:
      tags:
      - users
      summary: Обновить профиль
      description: Частичное обновление профиля текущего пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Профиль обновлён
  /professions:
    get:
      tags:
      - Профессии
      summary: Список профессий
      description: Получить справочник профессий с фильтрацией и пагинацией
      security: []
      parameters:
      - name: direction_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по профессиональному направлению
      - name: industry_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по отрасли
      - name: search
        in: query
        schema:
          type: string
        description: Поиск по названию
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список профессий
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profession'
                  total:
                    type: integer
    post:
      tags:
      - Профессии
      summary: Создать профессию
      description: Создать новую профессию (требуются права CMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - industry_id
              - direction_id
              properties:
                name:
                  type: string
                description:
                  type: string
                industry_id:
                  type: integer
                  format: int64
                direction_id:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Профессия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profession'
  /professions/{id}:
    get:
      tags:
      - Профессии
      summary: Детали профессии
      description: Получить полную информацию о профессии по идентификатору
      security: []
      parameters:
      - name: id
        in: path
        required: true
