        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Новый токен устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '404':
          description: Устройство не найдено
        '409':
          description: Устройство неактивно
  /cms/video-scenarios:
    get:
      tags:
      - Профессии в действии - CMS
      summary: Список видеосценариев
      description: Получить список видеосценариев с фильтрацией и пагинацией
      parameters:
      - name: profession_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по профессии
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Список видеосценариев
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InteractiveVideoScenario'
                  total:
                    type: integer
    post:
      tags:
      - Профессии в действии - CMS
      summary: Создать видеосценарий
      description: 'Создать новый видеосценарий. Стартовая ветка создаётся автоматически,

        её `media_id` заполняется системным видео-заглушкой (`DEFAULT_SCENARIO_VIDEO_ID`)
        — замените его на реальное видео через `PUT /cms/video-scenarios/{id}/branches/{branchId}`.

        Для добавления дочерних веток используйте `POST /cms/video-scenarios/{id}/branches`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              properties:
                title:
                  type: string
                description:
                  type: string
                profession_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '201':
          description: Видеосценарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenario'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/video-scenarios/{id}:
    get:
      tags:
      - Профессии в действии - CMS
      summary: Получить видеосценарий
      description: Получить видеосценарий с деревом веток
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Видеосценарий с деревом веток
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioFull'
        '404':
          description: Видеосценарий не найден
    put:
      tags:
      - Профессии в действии - CMS
      summary: Обновить видеосценарий
      description: Обновить название, описание или профессию
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                profession_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '200':
          description: Видеосценарий обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenario'
        '404':
          description: Видеосценарий не найден
    delete:
      tags:
      - Профессии в действии - CMS
      summary: Удалить видеосценарий
      description: Удалить видеосценарий (только если не использовался в активных
        сессиях)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Видеосценарий удалён
        '409':
          description: Видеосценарий использовался в сессиях, удаление невозможно
  /cms/video-scenarios/{id}/branches:
    post:
      tags:
      - Профессии в действии - CMS
      summary: Добавить ветку
      description: 'Добавить дочернюю ветку к указанному родителю.

        Если `parent_id` не указан — добавляется как вариант выбора для стартовой
        ветки.

        '
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: ID видеосценария
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - parent_id
              - text
              - media_id
              properties:
                parent_id:
                  type: integer
                  format: int64
                  description: ID родительской ветки
                text:
                  type: string
                  description: Текст варианта выбора
                media_id:
                  type: integer
                  format: int64
                  description: ID видеофайла
                prompt:
                  type: string
                  description: Текст вопроса в точке выбора (для родительской ветки)
      responses:
        '201':
          description: Ветка добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cms/video-scenarios/{id}/branches/{branchId}:
    put:
      tags:
      - Профессии в действии - CMS
      summary: Обновить ветку
      description: Обновить текст вопроса, текст варианта или видеофайл
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: branchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                prompt:
                  type: string
                media_id:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Ветка обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
        '404':
          description: Ветка не найдена
    delete:
      tags:
