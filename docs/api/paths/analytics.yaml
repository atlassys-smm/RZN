catalog:
  get:
    tags: [Аналитика]
    summary: Справочник объектов Metabase
    operationId: getAnalyticsCatalog
    description: |
      Получить соответствия постоянных ключей проекта и объектов Metabase:
      каждый объект содержит id и type (collection, dashboard или question).
      Ответ содержит только collections, dashboards и charts.
      Требуется Bearer access-токен пользователя (включая гостя), сотрудника любой
      роли или активного устройства. Дополнительных проверок ролей и привязки
      устройства к пользователю нет. Токен проверяется штатной авторизацией API.
      Бэкенд читает локальный реестр state.json, не обращается к Metabase
      и не выполняет аналитические запросы. Фронтенд получает данные напрямую
      через Metabase API с отдельной авторизацией Metabase.
      При отсутствии или повреждении реестра возвращается 503.
      Пароли, токены и внутренние настройки не возвращаются.
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Справочник текущих объектов Metabase
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsCatalog'
      '401':
        description: Токен отсутствует, недействителен или срок его действия истёк; сессия или сущность недействительна
      '503':
        description: Реестр Metabase не развёрнут или недоступен

report:
  get:
    tags: [Аналитика]
    summary: PDF-отчет аналитики за неделю или месяц
    operationId: getAnalyticsReport
    description: |
      Создает PDF на 12 страницах с графиками, портретом группы участников и карьерными перспективами,
      абсолютными и относительными изменениями. Требуется сотрудник
      с ролью ADMIN или ANALYST. Запрос не изменяет аналитические данные.
      Обязательны period (week или month) и date (YYYY-MM-DD).
      По МСК отчет начинается в понедельник содержащей дату недели либо
      первого числа содержащего дату месяца и включает выбранную дату целиком.
      Конец выборки - начало следующего дня, исключая события следующей даты.
      Граница не обрезается моментом формирования отчета при date=сегодня.
      Сравнение с предыдущей полной календарной неделей или месяцем.
      Будущая дата дает 422. number и year заменены параметром date.
      В PDF и имени файла даты выводятся без времени.
      Страница 7 посвящена Аватару профессий: генерации, доля успеха, время,
      пользователи, отдельные загрузки и рейтинг профессий.
      Последующие разделы занимают страницы 8-12.
      Пол и дата рождения берутся из профилей уникальных участников каждого периода.
      Возраст вычисляется на последний день соответствующего периода.
      В тексте существующей страницы выводов приведены состав по полу и возрасту
      и преобладающие группы среди заполненных сведений.
      Доли и преобладание определяются по заполненным сведениям каждого поля;
      упоминания пропусков и отсутствующих демографических полей в выводах не печатаются.
      Используются SQL определений карточек Metabase и читатель ClickHouse.
      Диаграммы перерисованы в векторном виде, это не снимки интерфейса.
      При нулевой базе относительный рост не определен; изменение долей
      дополнительно выражено в процентных пунктах. Нет оценок означает
      отсутствие данных, а не нулевую оценку. Сбой источника дает 503.
      Ответ содержит attachment и Cache-Control: no-store.
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: period
        required: true
        description: week - календарная ISO-неделя; month - календарный месяц
        schema:
          type: string
          enum: [week, month]
      - in: query
        name: date
        required: true
        description: Дата отчета YYYY-MM-DD, включается целиком; определяет календарную неделю или месяц
        schema:
          type: string
          format: date
        example: '2026-10-25'
    responses:
      '200':
        description: PDF-отчет с графиками и сравнением периодов
        headers:
          Content-Disposition:
            schema:
              type: string
            description: |
              attachment; имя файла передается в filename*=UTF-8 с процентным кодированием.
              Имя содержит даты без времени, например:
              «Аналитический отчет за неделю - 19.10.2026 - 25.10.2026.pdf» или
              «Аналитический отчет за месяц - 01.09.2026 - 30.09.2026.pdf».
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      '401':
        description: Недействительный токен или отсутствует авторизация
      '403':
        description: Доступ только для администратора и аналитика
      '422':
        description: Отсутствует period или date, недопустимые значения либо будущая дата
      '503':
        description: ClickHouse или определения карточек Metabase недоступны
embed-tokens:
  post:
    tags: [Аналитика]
    summary: Получить токены встраивания графиков Metabase
    operationId: createAnalyticsEmbedTokens
    description: |
      Требуется staff access-токен ADMIN или ANALYST либо Device JWT активного устройства с ролью QUIZ_VIDEO (1).
      Принимает только keys: от 1 до 100 постоянных ключей charts из справочника.
      Возвращает items с key/token в порядке запроса и общий expires_at (UTC).
      Повторяющиеся ключи сохраняются. Фильтры и params не принимаются.
      Подписываются только развёрнутые графики, у которых в шаблоне
      enable_embedding=true. Произвольные ID, коллекции и дашборды не принимаются.
      Весь пакет проверяется до подписи: ошибка одного ключа отклоняет весь запрос.
      JWT HS256 содержит resource.question, пустой params и exp. Для устройства срок составляет 24 часа.
      Для сотрудника срок составляет до 24 часов и ограничен сессией. Ответ Cache-Control: no-store.
      date_from/date_to, time_grain, device_id, module_id, survey_id и source_id
      настроены как редактируемые фильтры Metabase и передаются отдельно при
      получении данных графика. Их изменение не требует перевыпуска JWT.
      Без фильтров используются SQL-значения по умолчанию; date_to включителен,
      часовой пояс Europe/Moscow. Секрет подписи фронтенду не передаётся.
      iframe URL: {METABASE_URL}/embed/question/{token}.
      Данные: GET {METABASE_URL}/api/embed/card/{token}/query?date_from=2026-10-22&date_to=2026-10-28.
      Токен предоставляет доступ к графику до exp, в том числе после выхода
      сотрудника из нашего API.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalyticsEmbedTokensRequest'
          example:
            keys: [led.common.sessions, led.common.sessions_daily]
    responses:
      '200':
        description: Токены для всех запрошенных графиков
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEmbedTokensResponse'
      '401':
        description: Требуется действующий staff access-токен или Device JWT
      '403':
        description: Недостаточно прав сотрудника или у устройства нет роли QUIZ_VIDEO
      '404':
        description: Ключ графика отсутствует в развёрнутом реестре
      '422':
        description: Некорректный пакет или встраивание графика не разрешено
      '503':
        description: Секрет подписи не настроен, реестр или шаблоны графиков недоступны

visitor-profiles:
  post:
    tags: [Аналитика]
    summary: Профили посетителей по списку ID
    operationId: getAnalyticsVisitorProfiles
    description: >
      Доступен сотрудникам ADMIN и ANALYST, а также активным устройствам с ролью
      QUIZ_VIDEO (1) по Device JWT. Возвращает имена, фамилии и файлы аватарок
      по ID пользователей и гостей. Неизвестные ID пропускаются, повторы объединяются.
      Список посетителей и статистику фронтенд получает из Metabase.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VisitorProfilesRequest'
          example:
            user_ids: [42, 57]
    responses:
      '200':
        description: Профили, найденные по переданным ID
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorProfilesResponse'
      '401':
        description: Требуется действующий staff access-токен или Device JWT
      '403':
        description: Недостаточно прав сотрудника или у устройства нет роли QUIZ_VIDEO
      '422':
        description: Некорректный список ID

external-events:
  post:
    tags: [Аналитика]
    summary: Принять внешнее событие аналитики
    operationId: receiveExternalAnalyticsEvent
    description: |
      Принимает одно событие «Древа профессий» (module_id 7), «Интерактивной
      карты региона» (module_id 8), «Профбаттла» (module_id 9) или
      «Конструктора карьеры» (module_id 16).
      Для event_id принимаются целые числа от 0 до 65535
      по типу поля ClickHouse. Требуется staff access-токен ADMIN или Device JWT
      активного устройства с ролью EXTERNAL_APPS (5). Передавайте токен
      в заголовке Authorization: Bearer <token>.
      Сервер заполняет analytics.events.device_id по проверенному Device JWT.
      При авторизации администратором device_id равен NULL.
      Устройство создаёт UUID session_id один раз на прохождение. Сервер сохраняет
      его в analytics.events.external_session_id и payload.session_id.
      Каждый принятый запрос создаёт событие с новым серверным UUID.
      Повторная отправка того же запроса создаёт ещё одно событие.
      Числовая колонка analytics.events.session_id для внешних событий имеет
      значение NULL. Необязательный user_id сохраняется в колонке
      analytics.events.user_id. Если пользователь неизвестен, поле можно
      пропустить или передать null.
      Запись в ClickHouse выполняется в фоне через общую очередь аналитики.
      Ответ 202 означает приём в очередь без гарантии сохранения в ClickHouse.
      Для «Древа профессий» используйте 1 для начала сеанса, 11 для открытия
      карточки и 4 для подтверждённого завершения. Передавайте sessionId из
      WebGL как session_id. Для события 11 передавайте professionCode из WebGL
      в payload.profession_code. Сервер находит активную профессию в справочнике
      и добавляет в payload её profession_id и profession_name. При отсутствии
      однозначного сопоставления сохраняется событие с исходным кодом.
      Для событий 1 и 4 допустим пустой payload.
      Интерактивная карта отправляет старт (1), подтверждённое завершение (4),
      открытие объекта (16) и выбор территории (17). Для события 16 передавайте
      object_code и category_code в payload. Сервер сохраняет категорию как
      числовой object_category и её название. Для работодателей и учебных
      заведений сервер также добавляет organization_id, organization_name и
      organization_type при однозначном совпадении со справочником.
      Для события 17 передавайте payload.territory_code. Сервер добавляет
      числовой territory_id и название territory_name.
      «Профбаттл» отправляет старт кейса (1) и завершение сессии (4).
      Событие 4 соответствует battle:finished, подтверждённому выходу из
      начатого кейса, включая досрочный выход. В обоих событиях передавайте
      payload.mode (individual или group) и payload.case_code из каталога Unity.
      В payload сохраняются эти поля и session_id.
      «Конструктор карьеры» отправляет старт (1), завершение с результатом (4),
      ответ (6) и прерывание (9). Код 6 отправляется один раз за подтверждённый
      этап. При изменении этапа отправляется новый факт с теми же session_id
      и stage_id и увеличенным stage_revision.
      В payload старта передавайте версии сборки и каталога. В ответе этапа
      передавайте stage_id, stage_revision и массив answers. Каждый элемент
      answers содержит question_id и option_ids либо числовое value.
      Этапы идут в порядке visitor_category, interests, motives, strengths,
      self_assessment и rhythm. Самооценка передаёт 8 значений, ритм работы 5.
      Для завершения передавайте duration_ms, result_revision и professions
      со списком id, name, position и score.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [module_id, event_id, session_id, occurred_at, payload]
            properties:
              module_id:
                type: integer
                enum: [7, 8, 9, 16]
              event_id:
                type: integer
                minimum: 0
                maximum: 65535
              session_id:
                type: string
                format: uuid
              user_id:
                type: [integer, 'null']
                format: int64
                minimum: 1
                maximum: 9223372036854775807
              occurred_at:
                type: string
                format: date-time
              payload:
                type: object
                additionalProperties: true
          examples:
            treeProfession:
              summary: Открытие профессии в «Древе профессий»
              value:
                module_id: 7
                event_id: 11
                session_id: 1314510c-2fe8-4f3e-85a7-fba4a4e1ab43
                user_id: 42
                occurred_at: '2026-11-20T10:00:00+03:00'
                payload:
                  profession_code: architect
            mapObject:
              summary: Открытие организации на интерактивной карте
              value:
                module_id: 8
                event_id: 16
                session_id: 1314510c-2fe8-4f3e-85a7-fba4a4e1ab43
                occurred_at: '2026-11-23T10:00:00+03:00'
                payload:
                  object_code: grpz
                  category_code: employer
            mapTerritory:
              summary: Выбор территории на интерактивной карте
              value:
                module_id: 8
                event_id: 17
                session_id: 1314510c-2fe8-4f3e-85a7-fba4a4e1ab43
                occurred_at: '2026-11-23T10:00:00+03:00'
                payload:
                  territory_code: ryazan
            profbattleStart:
              summary: Начало прохождения кейса Профбаттла
              value:
                module_id: 9
                event_id: 1
                session_id: 1314510c-2fe8-4f3e-85a7-fba4a4e1ab43
                user_id: 42
                occurred_at: '2026-11-23T10:00:00+03:00'
                payload:
                  case_code: it-school
                  mode: individual
            constructorStage:
              summary: Ответы этапа «Конструктора карьеры»
              value:
                module_id: 16
                event_id: 6
                session_id: bbb05e9e-862d-4e27-9919-16d34ec9411a
                occurred_at: '2026-11-20T10:00:00+03:00'
                payload:
                  stage_id: rhythm
                  stage_revision: 1
                  answers:
                    - {question_id: rhythm.schedule, value: 0.25}
                    - {question_id: rhythm.workplace, value: 0.5}
                    - {question_id: rhythm.team, value: 1}
                    - {question_id: rhythm.pace, value: 0.75}
                    - {question_id: rhythm.workload, value: 0}
    responses:
      '202':
        description: Событие принято в фоновую очередь аналитики
      '401':
        description: Требуется действующий staff access-токен или Device JWT активного устройства
      '403':
        description: У сотрудника нет роли ADMIN или у устройства нет роли EXTERNAL_APPS
      '413':
        description: Размер записи после сериализации превышает 64 000 байт
      '422':
        description: Некорректное событие
      '503':
        description: Очередь аналитики заполнена или недоступна
