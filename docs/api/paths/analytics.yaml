events:
  post:
    tags: [analytics]
    summary: Отправить событие
    description: Зарегистрировать аналитическое событие
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '201':
        description: Событие зарегистрировано
  get:
    tags: [analytics]
    summary: Список событий
    description: Получить список аналитических событий с фильтрацией
    parameters:
      - name: type
        in: query
        schema:
          type: string
        description: Тип события
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
    responses:
      '200':
        description: Список событий
