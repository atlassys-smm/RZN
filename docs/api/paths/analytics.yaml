catalog:
  get:
    tags: [Аналитика]
    summary: Справочник объектов Metabase
    operationId: getAnalyticsCatalog
    description: |
      Получить соответствия постоянных ключей проекта и объектов Metabase:
      каждый объект содержит id и type (collection, dashboard или question).
      Ответ содержит только collections, dashboards и charts.
      Требуется Bearer access-токен пользователя (включая гостя), сотрудника любой
      роли или активного устройства. Дополнительных проверок ролей и привязки
      устройства к пользователю нет. Токен проверяется штатной авторизацией API.
      Бэкенд читает локальный реестр state.json, не обращается к Metabase
      и не выполняет аналитические запросы. Фронтенд получает данные напрямую
      через Metabase API с отдельной авторизацией Metabase.
      При отсутствии или повреждении реестра возвращается 503.
      Пароли, токены и внутренние настройки не возвращаются.
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Справочник текущих объектов Metabase
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsCatalog'
      '401':
        description: Токен отсутствует, недействителен или срок его действия истёк; сессия или сущность недействительна
      '503':
        description: Реестр Metabase не развёрнут или недоступен

report:
  get:
    tags: [Аналитика]
    summary: PDF-отчет аналитики за неделю или месяц
    operationId: getAnalyticsReport
    description: |
      Создает PDF на 11 страницах с графиками, портретом группы участников и карьерными перспективами,
      абсолютными и относительными изменениями. Требуется сотрудник
      с ролью ADMIN или ANALYST. Запрос не изменяет аналитические данные.
      Обязательны period (week или month) и date (YYYY-MM-DD).
      По МСК отчет начинается в понедельник содержащей дату недели либо
      первого числа содержащего дату месяца и включает выбранную дату целиком.
      Конец выборки - начало следующего дня, исключая события следующей даты.
      Граница не обрезается моментом формирования отчета при date=сегодня.
      Сравнение с предыдущей полной календарной неделей или месяцем.
      Будущая дата дает 422. number и year заменены параметром date.
      В PDF и имени файла даты выводятся без времени.
      Пол и дата рождения берутся из профилей уникальных участников каждого периода.
      Возраст вычисляется на последний день соответствующего периода.
      В тексте существующей страницы выводов приведены состав по полу и возрасту
      и преобладающие группы среди заполненных сведений.
      Доли и преобладание определяются по заполненным сведениям каждого поля;
      упоминания пропусков и отсутствующих демографических полей в выводах не печатаются.
      Используются SQL определений карточек Metabase и читатель ClickHouse.
      Диаграммы перерисованы в векторном виде, это не снимки интерфейса.
      При нулевой базе относительный рост не определен; изменение долей
      дополнительно выражено в процентных пунктах. Нет оценок означает
      отсутствие данных, а не нулевую оценку. Сбой источника дает 503.
      Ответ содержит attachment и Cache-Control: no-store.
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: period
        required: true
        description: week - календарная ISO-неделя; month - календарный месяц
        schema:
          type: string
          enum: [week, month]
      - in: query
        name: date
        required: true
        description: Дата отчета YYYY-MM-DD, включается целиком; определяет календарную неделю или месяц
        schema:
          type: string
          format: date
        example: '2026-10-25'
    responses:
      '200':
        description: PDF-отчет с графиками и сравнением периодов
        headers:
          Content-Disposition:
            schema:
              type: string
            description: |
              attachment; имя файла передается в filename*=UTF-8 с процентным кодированием.
              Имя содержит даты без времени, например:
              «Аналитический отчет за неделю - 19.10.2026 - 25.10.2026.pdf» или
              «Аналитический отчет за месяц - 01.09.2026 - 30.09.2026.pdf».
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      '401':
        description: Недействительный токен или отсутствует авторизация
      '403':
        description: Доступ только для администратора и аналитика
      '422':
        description: Отсутствует period или date, недопустимые значения либо будущая дата
      '503':
        description: ClickHouse или определения карточек Metabase недоступны
embed-tokens:
  post:
    tags: [Аналитика]
    summary: Получить токены встраивания графиков Metabase
    operationId: createAnalyticsEmbedTokens
    description: |
      Требуется действующий staff access-токен ADMIN или ANALYST.
      Принимает только keys: от 1 до 100 постоянных ключей charts из справочника.
      Возвращает items с key/token в порядке запроса и общий expires_at (UTC).
      Повторяющиеся ключи сохраняются. Фильтры и params не принимаются.
      Подписываются только развёрнутые графики, у которых в шаблоне
      enable_embedding=true. Произвольные ID, коллекции и дашборды не принимаются.
      Весь пакет проверяется до подписи: ошибка одного ключа отклоняет весь запрос.
      JWT HS256 содержит resource.question, пустой params и exp; срок до 24 часов,
      не дольше сессии сотрудника. Ответ Cache-Control: no-store.
      date_from/date_to, time_grain, device_id, module_id, survey_id и source_id
      настроены как редактируемые фильтры Metabase и передаются отдельно при
      получении данных графика. Их изменение не требует перевыпуска JWT.
      Без фильтров используются SQL-значения по умолчанию; date_to включителен,
      часовой пояс Europe/Moscow. Секрет подписи фронтенду не передаётся.
      iframe URL: {METABASE_URL}/embed/question/{token}.
      Данные: GET {METABASE_URL}/api/embed/card/{token}/query?date_from=2026-10-22&date_to=2026-10-28.
      Токен предоставляет доступ к графику до exp, в том числе после выхода
      сотрудника из нашего API.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalyticsEmbedTokensRequest'
          example:
            keys: [led.common.sessions, led.common.sessions_daily]
    responses:
      '200':
        description: Токены для всех запрошенных графиков
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEmbedTokensResponse'
      '401':
        description: Недействительный staff access-токен или сессия; пользователь и устройство не допускаются
      '403':
        description: У сотрудника нет роли ADMIN или ANALYST
      '404':
        description: Ключ графика отсутствует в развёрнутом реестре
      '422':
        description: Некорректный пакет или встраивание графика не разрешено
      '503':
        description: Секрет подписи не настроен, реестр или шаблоны графиков недоступны
