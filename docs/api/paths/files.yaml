detail:
  get:
    tags: [Файлы]
    summary: Скачать файл
    description: Скачать основной файл или превью по подписанной ссылке. Идентификатор превью — UUID основного файла с суффиксом _preview.
    parameters:
      - name: file_uuid
        in: path
        required: true
        schema:
          type: string
      - name: expires
        in: query
        required: true
        schema:
          type: integer
          format: int64
        description: Timestamp истечения подписи
      - name: sig
        in: query
        required: true
        schema:
          type: string
        description: HMAC-подпись
    responses:
      '200':
        description: Файл
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '403':
        description: Неверная или истёкшая подпись
      '404':
        description: Файл не найден
