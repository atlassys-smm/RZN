detail:
  get:
    tags: [Файлы]
    summary: Получить файл
    description: |
      Получить основной файл или превью по подписанной ссылке. По умолчанию
      Content-Disposition равен inline для открытия в браузере. Параметр
      type=download переключает его на attachment для скачивания. Параметр
      не входит в подпись. CDN хранит одну копию для обоих режимов и меняет
      заголовок при выдаче для скачивания. Идентификатор превью
      — UUID основного файла с суффиксом _preview. Для растровых изображений width
      и height задают максимальные размеры в пикселях. Можно передать один или
      оба параметра. Пропорции сохраняются. Изображение, которое уже помещается
      в заданные границы, выдаётся в исходном виде. Уменьшенный вариант выдаётся
      в формате исходного изображения. Размеры можно дописать к уже подписанному URL.
      Имя основного файла для скачивания берётся из files.title. Если нужного
      расширения в имени нет, оно берётся из files.file_path или определяется
      по MIME-типу, когда путь не содержит расширения.
      Политика срока ссылки и TTL CDN — 1 день для files.module из списка avatars,
      avatar_generation_inputs и 90 дней для остальных значений.
      Каждая ссылка получает собственный полный срок от создания: 1 или 90 дней.
      При одинаковых параметрах файла sig и expires сохраняются между запросами.
      Суточная ссылка обновляется при остатке часа или меньше, 90-дневная — дня
      или меньше. Старая действует до своего expires. Сроки хранятся в памяти
      процесса API; после перезапуска первая выдача создаёт новую ссылку.
      Замена версии превью, политики срока или ключа подписи меняет ссылку сразу.
      Новые ссылки содержат ttl (86400 или 7776000), включённый в подпись;
      срок при скачивании берётся из проверенной подписи, без ttl — 1 день.
      Модуль определяет срок при создании ссылки, его изменение не вызывает
      отказа по ранее выданной действующей ссылке. Старые ссылки без ttl
      сохраняют прежний срок и суточный кэш. Поля file.url и file.preview_url содержат только
      относительные пути /api/files/... с параметрами подписи и срока; домен CDN
      подставляет фронтенд. Новые ссылки подписываются отдельным ключом
      FILE_SIGNING_SECRET. Ранее выданные прямые ссылки основного API
      сохраняют действие до истечения срока. Новые ссылки на превью содержат v —
      SHA-256 уникального пути превью. Версия входит в подпись и ключ кэша CDN;
      после замены API возвращает новую ссылку. На основном API запрос старой
      версии возвращает 404. Старые ссылки без v разрешаются в текущее превью
      и выдаются CDN без кэширования. CDN проверяет подпись и при попадании в кэш.
      Успешные ответы CDN (200, 206, 304) разрешают браузерный кэш:
      Cache-Control: private, max-age=N, must-revalidate. N ограничен остатком
      срока ссылки и подписанным ttl (без ttl — 1 день). Ошибки имеют no-store.
      Превью без v получают max-age=0 и требуют перепроверки при каждом использовании.
    parameters:
      - name: file_uuid
        in: path
        required: true
        schema:
          type: string
      - name: expires
        in: query
        required: true
        schema:
          type: integer
          format: int64
        description: Timestamp истечения подписи
      - name: sig
        in: query
        required: true
        schema:
          type: string
        description: HMAC-подпись
      - name: ttl
        in: query
        description: Срок кэширования в секундах, включённый в подпись. У новых ссылок обязателен.
        schema:
          type: integer
          enum: [86400, 7776000]
      - name: v
        in: query
        description: Версия превью, включённая в подпись ссылки. Для новых preview_url.
        schema:
          type: string
          pattern: '^[0-9a-f]{64}$'
      - name: width
        in: query
        description: Максимальная ширина изображения в пикселях.
        schema:
          type: integer
          minimum: 1
          maximum: 2048
      - name: height
        in: query
        description: Максимальная высота изображения в пикселях.
        schema:
          type: integer
          minimum: 1
          maximum: 2048
      - name: type
        in: query
        description: Укажите download для скачивания. Без параметра файл открывается в браузере, если формат поддерживается.
        schema:
          type: string
          enum: [download]
    responses:
      '200':
        description: Файл
        headers:
          Content-Disposition:
            description: inline по умолчанию или attachment при type=download. Оба значения содержат имя файла.
            schema:
              type: string
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/*:
            schema:
              type: string
              format: binary
      '403':
        description: Неверная или истёкшая подпись
      '404':
        description: Файл не найден
      '415':
        description: Для уменьшения нужен файл в поддерживаемом растровом формате
      '422':
        description: Недопустимое значение type, недопустимые размеры или изображение не удалось уменьшить

cdn_manifest:
  get:
    tags: [Файлы]
    summary: Получить подписанные ссылки для прогрева CDN
    operationId: getCdnFileManifest
    description: |
      Только для администратора. Основной API возвращает text/plain: относительный
      подписанный путь /api/files/... на каждой строке. Включает только файлы
      с 90-дневной политикой: ttl=7776000 и срок ссылок 90 дней от создания. Файлы с
      module=avatars, avatar_generation_inputs исключаются
      независимо от связей с контентом.
      Запрос ничего не скачивает и не изменяет БД/Redis. На CDN-сервере список
      обрабатывает CDN/warmup.sh. Оригиналы и текущие превью с v включаются всегда;
      sizes добавляет уменьшенные варианты изображений и превью. Общие UUID
      объединяются. Файлы включаются только по связям с активным контентом;
      профили пользователей и неиспользуемые загрузки отдельно не перебираются.
      ПрофСтарт выбирается по статусу ACTIVE, анкеты по is_active; профессии,
      организации — без deleted_at. Фильтр avatars совместим, но суточные
      файлы шаблонов не выдаются. У вопросов викторины,
      заставок и видеосценариев нет статуса активности, выбирается весь контент.
      Без modules включаются все поддерживаемые модули. Нужен FILE_SIGNING_SECRET.
    parameters:
      - name: modules
        in: query
        description: Модули контента. Можно передать несколько параметров modules.
        schema:
          type: array
          items:
            type: string
            enum: [quiz, profstart, screensavers, video, surveys, professions, organizations, avatars]
        style: form
        explode: true
      - name: sizes
        in: query
        description: Дополнительные размеры вида 320x180, каждая сторона 1–2048. Можно повторить.
        schema:
          type: array
          items:
            type: string
            pattern: '^[0-9]+x[0-9]+$'
        style: form
        explode: true
    responses:
      '200':
        description: Список ссылок; пустая строка, если подходящих файлов нет.
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
          X-File-Count:
            description: Число уникальных файлов.
            schema:
              type: integer
          X-URL-Count:
            description: Число URL с учётом превью и размеров.
            schema:
              type: integer
        content:
          text/plain:
            schema:
              type: string
      '401':
        description: Недействительный или отсутствующий access JWT.
      '403':
        description: Требуется роль администратора.
      '422':
        description: Неизвестный модуль или недопустимый размер.
      '503':
        description: Не настроен отдельный ключ подписи файлов.
