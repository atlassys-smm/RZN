cms-surveys:
  get:
    tags:
    - Обратная связь — CMS
    summary: Список анкет
    operationId: list_surveys_api_cms_surveys_get
    parameters:
    - name: is_active
      in: query
      required: false
      schema:
        anyOf:
        - type: boolean
        - type: 'null'
        title: Is Active
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
        title: Limit
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        title: Offset
    responses:
      '200':
        description: Успешный ответ
