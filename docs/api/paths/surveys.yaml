                    - order
                    title: SurveyAnswerOptionUpdateItem
                    type: object
                  title: Answer Options
                  type: array
                example: '[{"id":101,"text":"Да","order":1},{"text":"Новый вариант","order":2}]'
              file:
                type: string
                format: binary
              file_preview:
                type: string
                format: binary
                description: Превью файла; без него для видео создаётся первый кадр.
            title: SurveyQuestionUpdateRequest
            type: object
          encoding:
            condition:
              contentType: text/plain
            answer_options:
              contentType: text/plain
      required: false
    responses:
      '200':
        description: Успешный ответ
