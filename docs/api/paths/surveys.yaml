cms-survey-questions:
  post:
    tags:
    - Обратная связь — CMS
    summary: Добавить вопрос анкеты
    operationId: add_question_api_cms_surveys__survey_id__questions_post
    parameters:
    - name: survey_id
      in: path
      required: true
      schema:
        type: integer
        title: Survey Id
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            additionalProperties: false
            properties:
              type:
                enum:
                - 1
                - 2
                - 3
                - 4
                - 5
                title: SurveyQuestionType
                type: integer
              text:
                title: Text
                type: string
              order:
                title: Order
                type: integer
              required:
                default: false
                title: Required
                type: boolean
              parent_id:
                anyOf:
                - type: integer
                - type: 'null'
                default: null
                title: Parent Id
              file_title:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: File Title
              file_description:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: File Description
              condition:
                type:
                - string
                - 'null'
                title: Condition
                description: JSON в отдельном текстовом поле формы.
                contentMediaType: application/json
                contentSchema:
                  anyOf:
                  - additionalProperties: true
                    type: object
                  - type: 'null'
                  default: null
                  title: Condition
              scale_min:
                anyOf:
                - type: integer
                - type: 'null'
                default: null
                title: Scale Min
              scale_max:
                anyOf:
                - type: integer
                - type: 'null'
                default: null
                title: Scale Max
              file:
                type: string
                format: binary
              file_preview:
                type: string
                format: binary
                description: Превью файла; без него для видео создаётся первый кадр.
            required:
            - type
            - text
            - order
            title: SurveyQuestionCreateRequest
            type: object
          encoding:
            condition:
              contentType: text/plain
    responses:
      '201':
        description: Создано
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyQuestionResponse'
      '422':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '404':
        description: Анкета или вопрос не найдены
    description: Поля вопроса передаются отдельно в multipart/form-data; file — необязательный
      файл, file_title и file_description — его метаданные. condition передаётся JSON
      в одноимённом поле. ID файла не принимается.
