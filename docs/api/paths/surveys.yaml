      и response_id.
cms-survey-questions:
  post:
    tags:
    - Обратная связь - CMS
    summary: Добавить вопрос анкеты
    operationId: add_question_api_cms_surveys__survey_id__questions_post
    parameters:
    - name: survey_id
      in: path
      required: true
      schema:
        type: integer
        title: Survey Id
    requestBody:
      content:
        multipart/form-data:
          schema:
            additionalProperties: false
            properties:
              type:
                enum:
                - 1
                - 2
                - 3
                - 4
                - 5
                title: SurveyQuestionType
                type: integer
              text:
                title: Text
                type: string
              order:
                title: Order
                type: integer
              required:
                default: false
                title: Required
                type: boolean
              parent_id:
                anyOf:
                - type: integer
                - type: 'null'
                title: Parent Id
              file_title:
                anyOf:
                - type: string
                - type: 'null'
                title: File Title
              file_description:
                anyOf:
                - type: string
                - type: 'null'
                title: File Description
              condition:
                type:
                - string
                - 'null'
                title: Condition
                description: JSON в отдельном текстовом поле формы.
                contentMediaType: application/json
                contentSchema:
                  anyOf:
                  - additionalProperties: true
                    type: object
                  - type: 'null'
                  title: Condition
              scale_min:
                anyOf:
                - type: integer
                - type: 'null'
                title: Scale Min
              scale_max:
                anyOf:
                - type: integer
                - type: 'null'
                title: Scale Max
              answer_options:
                type:
                - string
                - 'null'
                title: Answer Options
                description: JSON-массив вариантов ответа в одном текстовом поле формы. text и order обязательны;
                  profession_id обязателен только для PROFESSION_CHOICE. При создании id не передаётся. Вопрос и
                  варианты сохраняются одной транзакцией. В ответе варианты находятся в options.
                contentMediaType: application/json
                contentSchema:
                  items:
                    additionalProperties: false
                    properties:
                      text:
                        minLength: 1
                        title: Text
                        type: string
                      order:
                        minimum: 1
                        title: Order
                        type: integer
                      profession_id:
                        anyOf:
                        - exclusiveMinimum: 0
                          type: integer
                        - type: 'null'
                        title: Profession Id
                    required:
                    - text
                    - order
                    title: SurveyAnswerOptionRequest
                    type: object
                  title: Answer Options
                  type: array
                example: '[{"text":"Да","order":1},{"text":"Нет","order":2}]'
              file:
                type: string
                format: binary
              file_preview:
                type: string
                format: binary
                description: Превью файла; без него для видео создаётся первый кадр.
            required:
            - type
            - text
            - order
            title: SurveyQuestionCreateRequest
            type: object
          encoding:
            condition:
              contentType: text/plain
            answer_options:
              contentType: text/plain
      required: true
    responses:
      '201':
        description: Создано
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyQuestionResponse'
      '422':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '404':
        description: Анкета или вопрос не найдены
    description: Изменения доступны редактору контента только у неактивной анкеты без прохождений. У активной или
      уже начатой версии создайте копию анкеты. answer_options — JSON-массив в multipart/form-data, аналогично созданию
      вопроса викторины; подробности и пример находятся в описании поля.
    security:
    - bearerAuth: []
