        application/json:
          schema:
            $ref: '#/components/schemas/SurveyCreateRequest'
    responses:
      '201':
        description: Создано
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyResponse'
      '422':
        description: Ошибка валидации
        content:
          application/json:
            schema:
