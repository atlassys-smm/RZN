# Действующий маршрут обновления профиля: PATCH /user/info.
user-info:
  patch:
    tags: [Пользователь]
    summary: Изменить данные пользователя
    description: |
      Частично обновляет данные текущего пользователя по Bearer-токену, включая
      гостя с действующей сессией. Принимает first_name и last_name: хотя бы одно
      поле обязательно. Пропущенные поля сохраняются. Пробелы по краям удаляются
      до проверки длины; null не принимается. При следующем OAuth-входе имя
      и фамилия могут быть обновлены данными провайдера.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              first_name:
                type: string
                minLength: 1
                maxLength: 255
                description: Непустое имя после удаления пробелов по краям.
              last_name:
                type: string
                minLength: 1
                maxLength: 255
                description: Непустая фамилия после удаления пробелов по краям.
          example:
            first_name: Анна
            last_name: Иванова
    responses:
      '200':
        description: Обновлённые данные текущего пользователя
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
          Pragma:
            schema:
              type: string
              enum: [no-cache]
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInfoResponse'
      '401':
        description: Токен отсутствует или недействителен; токены сотрудников и устройств не принимаются
      '422':
        description: Не передано ни одного поля; имя или фамилия null, не строка, пустые, длиннее 255 символов; переданы лишние поля
