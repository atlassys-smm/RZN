# Планируемые маршруты профиля; в действующий OpenAPI не включены.
# Реализовано получение текущего пользователя через GET /user/info.
me:
  get:
    tags: [Пользователь]
    summary: Текущий пользователь
    description: Получить профиль текущего аутентифицированного пользователя
    responses:
      '200':
        description: Профиль пользователя
  patch:
    tags: [Пользователь]
    summary: Обновить профиль
    description: Частичное обновление профиля текущего пользователя
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '200':
        description: Профиль обновлён
