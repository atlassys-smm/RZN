user-info:
  patch:
    tags:
    - Пользователь
    summary: Изменить данные пользователя
    description: 'Частично обновляет профиль текущего пользователя, включая гостя с действующей сессией.

      Принимает first_name, last_name, gender, birth_date, а в multipart/form-data также

      file, file_preview, file_title и file_description по общим правилам загрузки файлов.

      Требуется хотя бы одно поле профиля, новый file или file_preview. Пропущенные поля и файл сохраняются.

      Превью можно обновить отдельно для существующего файла. Имена не могут быть пустыми или null; пробелы по краям удаляются.

      Пол: 1 — мужской, 2 — женский. Дата рождения: YYYY-MM-DD. Для очистки пола и даты

      в JSON используется null, в форме — текст null. Ответ содержит стандартный объект

      file с подписанными ссылками или null. media_id и avatar_url в запросе не принимаются.

      При следующем OAuth-входе данные могут обновиться из профиля провайдера.

      '
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              first_name:
                type: string
                minLength: 1
                maxLength: 255
                description: Непустое имя после удаления пробелов по краям.
              last_name:
                type: string
                minLength: 1
                maxLength: 255
                description: Непустая фамилия после удаления пробелов по краям.
              gender:
                type:
                - integer
                - 'null'
                enum:
                - 1
                - 2
                - null
                description: 1 — мужской, 2 — женский; null очищает значение.
              birth_date:
                type:
                - string
                - 'null'
                format: date
                description: Дата рождения YYYY-MM-DD; null очищает значение.
              file_title:
                type:
                - string
                - 'null'
              file_description:
                type:
                - string
                - 'null'
          example:
            first_name: Анна
            last_name: Иванова
            gender: 2
            birth_date: '2000-05-17'
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              first_name:
                type: string
                minLength: 1
                maxLength: 255
                description: Непустое имя после удаления пробелов по краям.
              last_name:
                type: string
                minLength: 1
                maxLength: 255
                description: Непустая фамилия после удаления пробелов по краям.
              gender:
                type:
                - integer
                - 'null'
                enum:
                - 1
                - 2
                - null
                description: 1 — мужской, 2 — женский; null очищает значение.
              birth_date:
                type:
                - string
                - 'null'
                format: date
                description: Дата рождения YYYY-MM-DD; null очищает значение.
              file_title:
                type:
                - string
                - 'null'
              file_description:
                type:
                - string
                - 'null'
              file:
                type: string
                format: binary
              file_preview:
                type: string
                format: binary
    responses:
      '200':
        description: Обновлённые данные текущего пользователя
        headers:
          Cache-Control:
            schema:
              type: string
              enum:
              - no-store
          Pragma:
            schema:
              type: string
              enum:
              - no-cache
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInfoResponse'
      '401':
        description: Токен отсутствует или недействителен; токены сотрудников и устройств не принимаются
      '422':
        description: Не передано ни одного поля; имя или фамилия null, не строка, пустые, длиннее 255
          символов; недопустимый пол или дата рождения; переданы лишние поля; превью при отсутствии прикреплённого файла
      '413':
        description: Превышен общий лимит размера файла или превью.
