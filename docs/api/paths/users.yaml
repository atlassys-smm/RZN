# Действующий маршрут обновления профиля: PATCH /user/info.
user-info:
  patch:
    tags: [Пользователь]
    summary: Изменить данные пользователя
    description: |
      Частично обновляет данные текущего пользователя по Bearer-токену, включая
      гостя с действующей сессией. Принимает first_name, last_name, gender и birth_date:
      хотя бы одно поле обязательно. Пропущенные поля сохраняются. Пробелы по краям
      имени и фамилии удаляются до проверки длины; null для них не принимается.
      Пол: 1 — мужской, 2 — женский. Дата рождения — YYYY-MM-DD. Пол и дату
      рождения можно очистить значением null. При следующем OAuth-входе эти
      данные могут быть обновлены данными провайдера.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              first_name:
                type: string
                minLength: 1
                maxLength: 255
                description: Непустое имя после удаления пробелов по краям.
              last_name:
                type: string
                minLength: 1
                maxLength: 255
                description: Непустая фамилия после удаления пробелов по краям.
              gender:
                type: [integer, 'null']
                enum: [1, 2, null]
                description: 1 — мужской, 2 — женский; null очищает значение.
              birth_date:
                type: [string, 'null']
                format: date
                description: Дата рождения YYYY-MM-DD; null очищает значение.
          example:
            first_name: Анна
            last_name: Иванова
            gender: 2
            birth_date: '2000-05-17'
    responses:
      '200':
        description: Обновлённые данные текущего пользователя
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
          Pragma:
            schema:
              type: string
              enum: [no-cache]
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInfoResponse'
      '401':
        description: Токен отсутствует или недействителен; токены сотрудников и устройств не принимаются
      '422':
        description: Не передано ни одного поля; имя или фамилия null, не строка, пустые, длиннее 255 символов; недопустимый пол или дата рождения; переданы лишние поля
