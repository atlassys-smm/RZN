# ═══════════════════════════════════════════════════════════════
# Организации
# ═══════════════════════════════════════════════════════════════

organizations:
  get:
    tags: [Организации]
    summary: Список организаций
    description: Получить справочник организаций с фильтрацией и пагинацией
    security: []
    parameters:
      - name: type
        in: query
        schema:
          type: string
          enum: [education, employer]
        description: Фильтр по типу (education — учебные заведения, employer — работодатели)
      - name: search
        in: query
        schema:
          type: string
        description: Поиск по названию
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '200':
        description: Список организаций
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Organization'
                total:
                  type: integer
  post:
    tags: [Организации]
    summary: Создать организацию
    description: Создать новую организацию (требуются права CMS)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
              type:
                type: string
                enum: [education, employer]
              address:
                type: string
              coordinates:
                type: object
                properties:
                  lat:
                    type: number
                  lng:
                    type: number
              description:
                type: string
              website:
                type: string
              phone:
                type: string
    responses:
      '201':
        description: Организация создана
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'

organizations-detail:
  get:
    tags: [Организации]
    summary: Детали организации
    description: Получить полную информацию об организации
    security: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Организация
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      '404':
        description: Не найдена
  put:
    tags: [Организации]
    summary: Обновить организацию
    description: Обновить организацию (требуются права CMS)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum: [education, employer]
              address:
                type: string
              coordinates:
                type: object
                properties:
                  lat:
                    type: number
                  lng:
                    type: number
              description:
                type: string
              website:
                type: string
              phone:
                type: string
    responses:
      '200':
        description: Организация обновлена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      '404':
        description: Не найдена
  delete:
    tags: [Организации]
    summary: Удалить организацию
    description: Удалить организацию (требуются права CMS)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Организация удалена
      '404':
        description: Не найдена
