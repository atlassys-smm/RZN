organizations:
  get:
    tags:
    - Организации
    summary: Список организаций
    parameters:
    - name: type
      in: query
      required: false
      schema:
        anyOf:
        - $ref: '#/components/schemas/OrganizationType'
        - type: 'null'
        title: Type
    - name: industry_branch_id
      in: query
      required: false
      schema:
        anyOf:
        - type: integer
        - type: 'null'
        title: Industry Branch Id
    - name: search
      in: query
      required: false
      schema:
        anyOf:
        - type: string
        - type: 'null'
        title: Search
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
        title: Limit
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        title: Offset
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationListResponse'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Отсутствующий или недействительный JWT.
    security:
    - bearerAuth: []
    description: "Требуется действующий Bearer JWT пользователя (включая гостя), сотрудника любой роли или активного устройства. Возвращаются только записи с deleted_at IS NULL. Пагинация и total учитывают только доступные записи."
  post:
    tags:
    - Организации
    summary: Создать организацию
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationCreateRequest'
    responses:
      '201':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Требуется авторизация сотрудника
      '403':
        description: Недостаточно прав
      '409':
        description: Активные зависимости или конфликт уникальной пары связей
    description: Требуется staff access-токен редактора контента или администратора.
      Удалённая запись недоступна для изменения и повторного удаления (404). Ссылки
      на удалённые записи отклоняются (422).
