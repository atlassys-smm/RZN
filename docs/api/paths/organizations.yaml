    tags:
    - Организации
    summary: Удалить организацию
    security:
    - bearerAuth: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        title: Organization Id
    responses:
      '204':
        description: Successful Response
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Требуется авторизация сотрудника
      '403':
        description: Недостаточно прав
      '409':
        description: Активные зависимости или конфликт уникальной пары связей
      '404':
        description: Запись не найдена или удалена
    description: Требуется staff access-токен редактора контента или администратора.
      Устанавливает deleted_at, сохраняя строку физически. Удалённый ID возвращает
      404. Ответ 409, если существуют активные связи с направлениями подготовки. Связи
      с профессиями или организациями также помечаются удалёнными.
education-programs:
  get:
    tags:
    - Организации
    summary: Список направлений подготовки
    parameters:
    - name: organization_id
      in: query
      required: false
      schema:
        anyOf:
        - type: integer
        - type: 'null'
        title: Organization Id
    - name: search
      in: query
      required: false
      schema:
        anyOf:
        - type: string
        - type: 'null'
        title: Search
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
        title: Limit
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        title: Offset
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationProgramListResponse'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Отсутствующий или недействительный JWT.
    security:
    - bearerAuth: []
    description: Действующий JWT пользователя, гостя, сотрудника или активного устройства. Общий справочник активных направлений
      без дубликатов по организациям. Фильтр organization_id использует активную связь с активным учебным заведением; total
      считает направления. Точное сочетание name, education_level, duration и base_class уникально, включая base_class=null.
      Близкие названия, NULL и пустая строка не объединяются. organization_id отсутствует в теле и ответе направления; неизвестные
      поля тела отклоняются (422).
  post:
    tags:
    - Организации
    summary: Создать направление подготовки
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EducationProgramCreateRequest'
    responses:
      '201':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationProgram'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Требуется авторизация сотрудника
      '403':
        description: Недостаточно прав
      '409':
        description: Активные зависимости или конфликт уникальной пары связей
    description: Staff JWT admin/content_editor. Точное сочетание name, education_level, duration и base_class уникально,
      включая base_class=null. Близкие названия, NULL и пустая строка не объединяются. organization_id отсутствует в теле
      и ответе направления; неизвестные поля тела отклоняются (422). Активный дубликат — 409. POST удалённого сочетания восстанавливает
      его ID; связи с организациями и профессиями автоматически не восстанавливаются.

