              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Отсутствующий или недействительный JWT.
      '403':
        description: Недостаточная роль сотрудника.
      '409':
        description: Пара уже существует или конфликт ссылок.
      '404':
        description: Связь не найдена или недоступна для изменения.
    description: Staff JWT admin/content_editor. Пара education_program_id/organization_id уникальна. Ссылки должны вести
      на активное направление и активное учебное заведение типа 2; иначе 422. POST удалённой пары восстанавливает её ID. PUT
      на занятую пару возвращает 409. DELETE мягко удаляет только связь с организацией; направление и его связи с профессиями
      не изменяются. PUT и повторный DELETE удалённой связи возвращают 404.
