organizations:
  get:
    tags:
    - Организации
    summary: Список организаций
    parameters:
    - name: type
      in: query
      required: false
      schema:
        anyOf:
        - $ref: '#/components/schemas/OrganizationType'
        - type: 'null'
        title: Type
    - name: industry_branch_id
      in: query
      required: false
      schema:
        anyOf:
        - type: integer
        - type: 'null'
        title: Industry Branch Id
    - name: education_program_id
      in: query
      required: false
      description: ID направления подготовки. Учитываются только активные направление,
        связь и учебное заведение. Неизвестный или удалённый ID даёт пустой список.
      schema:
        anyOf:
        - type: integer
        - type: 'null'
        title: Education Program Id
    - name: search
      in: query
      required: false
      schema:
        anyOf:
        - type: string
        - type: 'null'
        title: Search
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
        title: Limit
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        title: Offset
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationListResponse'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Отсутствующий или недействительный JWT.
    security:
    - bearerAuth: []
    description: Требуется действующий Bearer JWT пользователя (включая гостя), сотрудника
      любой роли или активного устройства. Возвращаются только записи с deleted_at
      IS NULL. Пагинация и total учитывают только доступные записи. Фильтр
      education_program_id возвращает полные данные учебных заведений выбранного
      направления, включая file (или null), без дублей. Учитываются только активные
      направление и связи. Фильтры type, industry_branch_id, education_program_id
      и search применяются совместно (AND); limit и offset сохраняются.
  post:
    tags:
    - Организации
    summary: Создать организацию
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            properties:
              name:
                maxLength: 255
                minLength: 1
                title: Name
                type: string
              type:
                enum:
                - 1
                - 2
                title: OrganizationType
                type: integer
              full_name:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Full Name
              location:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Location
              industry_branch_id:
                anyOf:
                - type: integer
                - type: 'null'
                default: null
                title: Industry Branch Id
              employee_count:
                anyOf:
                - minimum: 0
                  type: integer
                - type: 'null'
                default: null
                title: Employee Count
              scale_or_product:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Scale Or Product
              practice_info:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Practice Info
              education_level:
                anyOf:
                - maxLength: 100
                  type: string
                - type: 'null'
                default: null
                title: Education Level
              address:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Address
              coordinates:
                type:
                - string
                - 'null'
                title: coordinates
                description: JSON в отдельном текстовом поле формы.
                contentMediaType: application/json
                contentSchema:
                  anyOf:
                  - properties:
                      lat:
                        title: Lat
                        type: number
                      lng:
                        title: Lng
                        type: number
                    required:
                    - lat
                    - lng
                    title: CoordinatesSchema
                    type: object
                  - type: 'null'
                  default: null
              description:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Description
              website:
                anyOf:
                - maxLength: 500
                  type: string
                - type: 'null'
                default: null
                title: Website
              phone:
                anyOf:
                - maxLength: 50
                  type: string
                - type: 'null'
                default: null
                title: Phone
              file_title:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: File Title
              file_description:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: File Description
              file:
                type: string
                format: binary
              file_preview:
                type: string
                format: binary
                description: Превью файла; без него для видео создаётся первый кадр.
            required:
            - name
            - type
            title: OrganizationCreateRequest
            type: object
          encoding:
            coordinates:
              contentType: text/plain
    responses:
      '201':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Требуется авторизация сотрудника
      '403':
        description: Недостаточно прав
      '409':
        description: Активные зависимости или конфликт уникальной пары связей
      '413':
        description: Файл или превью превышает допустимый размер.
    description: 'Требуется staff access-токен редактора контента или администратора.
      Удалённая запись недоступна для изменения и повторного удаления (404). Ссылки
      на удалённые записи отклоняются (422). Для загрузки вложения используется multipart/form-data:
      file, необязательные file_preview, file_title и file_description. coordinates
      передаётся JSON-строкой. В ответе file содержит подписанный URL, preview_url,
      mime_type, title и description либо null. При PUT без нового file прежнее вложение
      сохраняется; новый file заменяет привязку. file_preview без нового file возвращает
      422. Новая загрузка и организация сохраняются одной транзакцией; при ошибке
      новые файлы удаляются.'
organizations-detail:
  get:
    tags:
    - Организации
    summary: Получить организацию
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        title: Organization Id
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '404':
        description: Запись не найдена
      '401':
        description: Отсутствующий или недействительный JWT.
    security:
    - bearerAuth: []
    description: Требуется действующий Bearer JWT пользователя (включая гостя), сотрудника
      любой роли или активного устройства. Возвращается запись по ID, включая мягко
      удалённую, независимо от deleted_at связанных сущностей. Неизвестный ID возвращает
      404. Изменение и повторное удаление мягко удалённой записи недоступны (404).
      Успешный GET с JWT пользователя (type=user, включая гостя) создаёт событие
      просмотра организации ORGANIZATION_VIEWED=10. JWT сотрудника или устройства
      не создаёт просмотров. Каждый повторный GET считается отдельно; view_id не
      требуется. Событие содержит ID, название и тип организации, ID пользователя
      и is_guest. Отправка асинхронная, best effort; отключение аналитики не меняет ответ.
  put:
    tags:
    - Организации
    summary: Изменить организацию
    security:
    - bearerAuth: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        title: Organization Id
    requestBody:
      required: false
      content:
        multipart/form-data:
          schema:
            properties:
              name:
                anyOf:
                - maxLength: 255
                  minLength: 1
                  type: string
                - type: 'null'
                default: null
                title: Name
              type:
                anyOf:
                - enum:
                  - 1
                  - 2
                  title: OrganizationType
                  type: integer
                - type: 'null'
                default: null
              full_name:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Full Name
              location:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Location
              industry_branch_id:
                anyOf:
                - type: integer
                - type: 'null'
                default: null
                title: Industry Branch Id
              employee_count:
                anyOf:
                - minimum: 0
                  type: integer
                - type: 'null'
                default: null
                title: Employee Count
              scale_or_product:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Scale Or Product
              practice_info:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Practice Info
              education_level:
                anyOf:
                - maxLength: 100
                  type: string
                - type: 'null'
                default: null
                title: Education Level
              address:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Address
              coordinates:
                type:
                - string
                - 'null'
                title: coordinates
                description: JSON в отдельном текстовом поле формы.
                contentMediaType: application/json
                contentSchema:
                  anyOf:
                  - properties:
                      lat:
                        title: Lat
                        type: number
                      lng:
                        title: Lng
                        type: number
                    required:
                    - lat
                    - lng
                    title: CoordinatesSchema
                    type: object
                  - type: 'null'
                  default: null
              description:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: Description
              website:
                anyOf:
                - maxLength: 500
                  type: string
                - type: 'null'
                default: null
                title: Website
              phone:
                anyOf:
                - maxLength: 50
                  type: string
                - type: 'null'
                default: null
                title: Phone
              file_title:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: File Title
              file_description:
                anyOf:
                - type: string
                - type: 'null'
                default: null
                title: File Description
              file:
                type: string
                format: binary
              file_preview:
                type: string
                format: binary
                description: Превью файла; без него для видео создаётся первый кадр.
            title: OrganizationUpdateRequest
            type: object
          encoding:
            coordinates:
              contentType: text/plain
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Требуется авторизация сотрудника
      '403':
        description: Недостаточно прав
      '409':
        description: Активные зависимости или конфликт уникальной пары связей
      '404':
        description: Запись не найдена или удалена
      '413':
        description: Файл или превью превышает допустимый размер.
    description: 'Требуется staff access-токен редактора контента или администратора.
      Удалённая запись недоступна для изменения и повторного удаления (404). Ссылки
      на удалённые записи отклоняются (422). Пропущенные поля сохраняются. Для загрузки
      вложения используется multipart/form-data: file, необязательные file_preview,
      file_title и file_description. coordinates передаётся JSON-строкой. В ответе
      file содержит подписанный URL, preview_url, mime_type, title и description либо
      null. При PUT без нового file прежнее вложение сохраняется; новый file заменяет
      привязку. file_preview без нового file возвращает 422. Новая загрузка и организация
      сохраняются одной транзакцией; при ошибке новые файлы удаляются.'
