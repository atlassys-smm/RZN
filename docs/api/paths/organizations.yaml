organization-recommendations:
  get:
    tags: [Организации]
    summary: Рекомендации организаций по выбранным профессиям
    description: "Требуется действующий Bearer JWT пользователя (включая гостя), сотрудника любой роли или активного устройства. Принимает от 1 до 3 различных ID профессий повторяемым query-параметром profession_ids. Возвращает до 5 работодателей (employers, type=1) и до 5 учебных заведений (educations, type=2). Профессии, связи, программы и организации учитываются независимо от deleted_at. Порядок каждого списка: число различных совпавших профессий DESC, ID организации ASC. Несколько программ одной профессии считаются одним совпадением. Каждый элемент содержит organization, profession_ids, profession_count и position. Профиль пользователя и результаты тестов не требуются; данные не сохраняются. Если связей нет, оба массива пустые. Любой неизвестный ID профессии возвращает 404. Сначала формируется обычный топ-5 по числу различных совпавших профессий DESC и ID организации ASC. Затем проверяется покрытие каждой выбранной профессии в каждом типе организаций. Если для профессии есть связанные организации, но ни одна не попала в топ-5, лучшая из них заменяет последнюю организацию, удаление которой не лишает покрытия другие профессии. Одна организация может покрывать несколько профессий. После замен сохраняется сортировка по рейтингу; лимит — 5 уникальных организаций каждого типа. Если связей данного типа нет, покрытие для этой профессии не требуется."
    security:
    - bearerAuth: []
    parameters:
    - name: profession_ids
      in: query
      required: true
      style: form
      explode: true
      description: От 1 до 3 различных ID профессий, включая мягко удалённые.
      schema:
        type: array
        minItems: 1
        maxItems: 3
        uniqueItems: true
        items:
          type: integer
      example: [1, 2, 3]
    responses:
      '200':
        description: Рекомендации организаций по выбранным профессиям
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRecommendations'
      '401':
        description: Отсутствующий или недействительный JWT.
      '404':
        description: Профессия не найдена.
      '422':
        description: Неверное количество, повторяющиеся ID или некорректный формат profession_ids.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
