        type: integer
        title: Education Program Id
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationProgram'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '404':
        description: Запись не найдена
      '401':
        description: Отсутствующий или недействительный JWT.
    security:
    - bearerAuth: []
    description: Требуется действующий Bearer JWT пользователя (включая гостя), сотрудника любой роли или активного устройства.
      Возвращается запись по ID, включая мягко удалённую, независимо от deleted_at связанных сущностей. Неизвестный ID возвращает
      404. Изменение и повторное удаление мягко удалённой записи недоступны (404).
      Успешный GET с JWT пользователя (type=user, включая гостя) создаёт EDUCATION_PROGRAM_VIEWED=12, module_id=15. Сотрудники, устройства и ошибки не создают просмотров. Каждый повторный GET считается отдельно, без view_id. Направление учитывается по education_program_id, независимо от числа связанных организаций. Доставка best effort не меняет ответ API.
