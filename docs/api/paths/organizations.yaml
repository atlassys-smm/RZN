        description: Запись не найдена или удалена
    description: Staff JWT admin/content_editor. Пропущенные поля сохраняются, base_class=null очищает базу приёма. Точное
      сочетание name, education_level, duration и base_class уникально, включая base_class=null. Близкие названия, NULL и
      пустая строка не объединяются. organization_id отсутствует в теле и ответе направления; неизвестные поля тела отклоняются
      (422). Существующее сочетание — 409; удалённое направление — 404.
  delete:
