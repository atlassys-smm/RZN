# ═══════════════════════════════════════════════════════════════
# CMS — Видеосценарии
# ═══════════════════════════════════════════════════════════════

cms-scenarios:
  get:
    tags: [Профессии в действии - CMS]
    summary: Список видеосценариев
    description: Получить список видеосценариев с фильтрацией и пагинацией
    parameters:
      - name: profession_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по профессии
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '200':
        description: Список видеосценариев
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/InteractiveVideoScenario'
                total:
                  type: integer
  post:
    tags: [Профессии в действии - CMS]
    summary: Создать видеосценарий
    description: |
      Создать новый видеосценарий. Стартовая ветка создаётся автоматически,
      её `media_id` заполняется системным видео-заглушкой (`DEFAULT_SCENARIO_VIDEO_ID`) — замените его на реальное видео через `PUT /cms/video-scenarios/{id}/branches/{branchId}`.
      Для добавления дочерних веток используйте `POST /cms/video-scenarios/{id}/branches`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties:
              title:
                type: string
              description:
                type: string
              profession_id:
                type: integer
                format: int64
                nullable: true
    responses:
      '201':
        description: Видеосценарий создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoScenario'
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

cms-scenarios-detail:
  get:
    tags: [Профессии в действии - CMS]
    summary: Получить видеосценарий
    description: Получить видеосценарий с деревом веток
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Видеосценарий с деревом веток
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoScenarioFull'
      '404':
        description: Видеосценарий не найден
  put:
    tags: [Профессии в действии - CMS]
    summary: Обновить видеосценарий
    description: Обновить название, описание или профессию
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              profession_id:
                type: integer
                format: int64
                nullable: true
    responses:
      '200':
        description: Видеосценарий обновлён
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoScenario'
      '404':
        description: Видеосценарий не найден
  delete:
    tags: [Профессии в действии - CMS]
    summary: Удалить видеосценарий
    description: Удалить видеосценарий (только если не использовался в активных сессиях)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Видеосценарий удалён
      '409':
        description: Видеосценарий использовался в сессиях, удаление невозможно

# ── Ветки видеосценария ─────────────────────────────────────

cms-branches-create:
  post:
    tags: [Профессии в действии - CMS]
    summary: Добавить ветку
    description: |
      Добавить дочернюю ветку к указанному родителю.
      Если `parent_id` не указан — добавляется как вариант выбора для стартовой ветки.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: ID видеосценария
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [parent_id, text, media_id]
            properties:
              parent_id:
                type: integer
                format: int64
                description: ID родительской ветки
              text:
                type: string
                description: Текст варианта выбора
              media_id:
                type: integer
                format: int64
                description: ID видеофайла
              prompt:
                type: string
                description: Текст вопроса в точке выбора (для родительской ветки)
    responses:
      '201':
        description: Ветка добавлена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

cms-branches-update:
  put:
    tags: [Профессии в действии - CMS]
    summary: Обновить ветку
    description: Обновить текст вопроса, текст варианта или видеофайл
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: branchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              text:
                type: string
              prompt:
                type: string
              media_id:
                type: integer
                format: int64
    responses:
      '200':
        description: Ветка обновлена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
      '404':
        description: Ветка не найдена

cms-branches-delete:
  delete:
    tags: [Профессии в действии - CMS]
    summary: Удалить ветку
    description: Удалить ветку и все её дочерние ветки. Стартовую ветку удалить нельзя.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: branchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Ветка удалена
      '400':
        description: Нельзя удалить стартовую ветку
      '404':
        description: Ветка не найдена

# ═══════════════════════════════════════════════════════════════
# Показ — создание и управление (оператор)
# ═══════════════════════════════════════════════════════════════

session-create:
  post:
    tags: [Профессии в действии - Оператор]
    summary: Запустить показ
    description: |
      Запустить показ видеосценариев на LED-экране.
      В `settings` передаётся либо `scenario_ids` (ручной выбор), либо `profession_count` (случайный выбор N сценариев).
      Бэкенд конвертит `profession_count` в `scenario_ids` перед сохранением.
      Статус сессии сразу становится `active`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [device_id, settings]
            properties:
              device_id:
                type: integer
                format: int64
                description: Идентификатор LED-устройства, на котором запускается показ
              settings:
                type: object
                required: [scenario_ids или profession_count]
                properties:
                  scenario_ids:
                    type: array
                    items:
                      type: integer
                      format: int64
                    description: ID видеосценариев для показа (ручной выбор)
                  profession_count:
                    type: integer
                    minimum: 1
                    maximum: 10
                    default: 3
                    description: Количество случайных сценариев для показа (если scenario_ids не указан)
                  voting_duration:
                    type: integer
                    default: 30
                    description: Длительность голосования в секундах
                  result_display_duration:
                    type: integer
                    default: 5
                    description: Длительность показа результата в секундах
    responses:
      '201':
        description: Показ запущен
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoSession'
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              no_scenarios:
                summary: Нет доступных сценариев
                value:
                  error: no_scenarios
                  message: Нет доступных видеосценариев для показа
              device_busy:
                summary: Устройство занято
                value:
                  error: device_busy
                  message: На этом устройстве уже запущена сессия

session-active:
  get:
    tags: [Профессии в действии]
    summary: Получить активную сессию
    description: |
      Возвращает текущую активную сессию показа с полным состоянием.
      Если указан `device_id` — возвращает сессию для этого устройства.
      Если `device_id` не указан — возвращает любую активную сессию (для оператора).
      Используется LED-экраном при переподключении для восстановления состояния.
      Используется оператором при перезапуске планшета для возможности остановки.
      Если активной сессии нет — возвращает 404.
    parameters:
      - name: device_id
        in: query
        schema:
          type: integer
          format: int64
        description: Идентификатор LED-устройства (если не указан — возвращается любая активная сессия)
    responses:
      '200':
        description: Активная сессия с полным состоянием
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoState'
      '404':
        description: Активной сессии нет

session-stop:
  post:
    tags: [Профессии в действии - Оператор]
    summary: Остановить показ
    description: Остановить показ и вернуть LED-экран в режим ожидания
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Показ остановлен
      '404':
        description: Сессия не найдена

# ═══════════════════════════════════════════════════════════════
# Состояние показа (LED-экран)
# ═══════════════════════════════════════════════════════════════

session-state:
  get:
    tags: [Профессии в действии - LED]
    summary: Получить состояние показа
    description: |
      Текущее состояние показа для LED-экрана.
      Включает информацию о текущем видео, точке голосования, результатах.
      LED-экран опрашивает этот эндпоинт для синхронизации.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Состояние показа
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoState'
      '403':
        description: Сессия принадлежит другому устройству
      '404':
        description: Сессия не найдена

session-advance:
  post:
    tags: [Профессии в действии - LED]
    summary: Сигнал окончания видео
    description: |
      Вызывается LED-плеером, когда воспроизведение текущего видеофрагмента (`current_branch`) завершилось.
      Сервер не хранит длительность видео — момент перехода к точке голосования (или к следующему сценарию/завершению показа)
      определяется именно этим сигналом, а не таймером.
      Требует device-токен (`Authorization: Bearer <device token>`), полученный при регистрации устройства.
      - Если у `current_branch` есть дочерние ветки — показ переходит в фазу `voting` (голосование).
      - Если дочерних веток нет и в очереди остались сценарии — переход к следующему сценарию (`scenario_finished`).
      - Если дочерних веток нет и сценариев больше нет — показ завершается (`session_finished`).
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Обновлённое состояние показа
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoState'
      '400':
        description: Показ сейчас не в фазе воспроизведения видео
      '403':
        description: Сессия принадлежит другому устройству
      '404':
        description: Сессия не найдена

session-voting:
  get:
    tags: [Профессии в действии - Зритель]
    summary: Получить информацию о голосовании
    description: |
      Информация о текущей точке голосования для мобильного клиента.
      Включает варианты выбора, таймер, статус участника (проголосовал/не проголосовал), результат.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: participant_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
        description: ID участника (получен при подключении через /join)
    responses:
      '200':
        description: Информация о голосовании
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoVoting'
      '404':
        description: Сессия или точка голосования не найдена

# ═══════════════════════════════════════════════════════════════
# Мобильный клиент — подключение и голосование
# ═══════════════════════════════════════════════════════════════

player-join:
  post:
    tags: [Профессии в действии - Зритель]
    summary: Подключиться к показу
    description: Подключиться к показу по QR-коду
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Подключён
        content:
          application/json:
            schema:
              type: object
              properties:
                participant_id:
                  type: integer
                  format: int64
                session_id:
                  type: integer
                  format: int64
      '404':
        description: Сессия не найдена
      '409':
        description: Показ уже завершён

player-vote:
  post:
    tags: [Профессии в действии - Зритель]
    summary: Проголосовать
    description: |
      Проголосовать за вариант продолжения в точке голосования.
      Один участник может проголосовать только один раз за каждую точку голосования.
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [branch_id]
            properties:
              branch_id:
                type: integer
                format: int64
                description: ID выбранной ветки (варианта продолжения)
    responses:
      '200':
        description: Голос принят
        content:
          application/json:
            schema:
              type: object
              properties:
                accepted:
                  type: boolean
                message:
                  type: string
      '400':
        description: Ошибка
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              voting_closed:
                summary: Голосование завершено
                value:
                  error: voting_closed
                  message: Голосование уже завершено
              already_voted:
                summary: Уже голосовал
                value:
                  error: already_voted
                  message: Вы уже проголосовали
              invalid_branch:
                summary: Неверная ветка
                value:
                  error: invalid_branch
                  message: Выбранная ветка не является допустимым вариантом
      '404':
        description: Сессия или точка голосования не найдена

# ═══════════════════════════════════════════════════════════════
# WebSocket — уведомления об изменениях
# ═══════════════════════════════════════════════════════════════
#
# WebSocket для получения уведомлений об изменениях состояния.
# Клиент получает событие и загружает актуальные данные через REST API.
#
# ## Подключение
#
# ws://host/api/v1/interactive-video/sessions/{sessionId}/ws
#
# ## События от сервера
#
# Сервер отправляет только тип события. Клиент сам загружает данные через REST.
#
# ### phase_changed
# Сменилась фаза показа (playing → voting → playing).
# LED загружает: GET /interactive-video/sessions/{id}/state
# Мобильный загружает: GET /interactive-video/sessions/{id}/voting
#
# { "type": "phase_changed" }
#
# ### votes_updated (только для LED)
# Поступил новый голос.
# LED загружает: GET /interactive-video/sessions/{id}/state
#
# { "type": "votes_updated" }
#
# ### scenario_finished
# Текущий сценарий завершён, переход к следующему.
# LED загружает: GET /interactive-video/sessions/{id}/state
# Мобильный загружает: GET /interactive-video/sessions/{id}/voting
#
# { "type": "scenario_finished" }
#
# ### session_finished
# Показ завершён.
#
# { "type": "session_finished" }
#
# ## Пример использования (LED)
#
# 1. LED подключается к WebSocket
# 2. Загружает начальное состояние: GET /state
# 3. Получает событие { "type": "votes_updated" }
# 4. Загружает обновлённое состояние: GET /state
# 5. Обновляет отображение
#
# ## Пример использования (мобильный)
#
# 1. Мобильный подключается к WebSocket
# 2. Загружает начальное состояние: GET /voting
# 3. Голосует: POST /vote
# 4. Получает событие { "type": "phase_changed" } (переход между playing и voting)
# 5. Загружает результат: GET /voting
