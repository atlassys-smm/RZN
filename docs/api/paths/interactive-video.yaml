# ═══════════════════════════════════════════════════════════════
# CMS — Видеосценарии
# ═══════════════════════════════════════════════════════════════

cms-scenarios:
  get:
    tags: [Профессии в действии - CMS]
    summary: Список видеосценариев
    description: Требуется staff access-токен редактора контента или оператора. Получить список видеосценариев с фильтрацией и пагинацией. Каждый элемент содержит profession_id. При select=profession добавляется вложенный profession с полными данными профессии; без привязки profession=null. Без select=profession поле profession отсутствует. Мягко удалённая профессия существующего сценария также возвращается при выборе profession.
    parameters:
      - name: profession_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по профессии
      - name: select
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        description: 'Дополнительные данные: select=profession включает полную профессию. Параметр можно повторять; неизвестные значения игнорируются. По умолчанию дополнительные данные не загружаются.'
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Список видеосценариев
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/InteractiveVideoScenarioListItem'
                total:
                  type: integer
  post:
    tags: [Профессии в действии - CMS]
    summary: Создать видеосценарий
    description: |
      Требуется staff access-токен редактора контента.
      Создать новый видеосценарий. Стартовая ветка создаётся автоматически,
      её видео заполняется системным видео-заглушкой (`DEFAULT_SCENARIO_VIDEO_ID`) — замените его на реальное видео через `PUT /cms/video-scenarios/{id}/branches/{branchId}`.
      Для добавления дочерних веток используйте `POST /cms/video-scenarios/{id}/branches`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties:
              title:
                type: string
              description:
                type: string
              profession_id:
                type: integer
                format: int64
                nullable: true
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '201':
        description: Видеосценарий создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoScenario'
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

cms-scenarios-detail:
  get:
    tags: [Профессии в действии - CMS]
    summary: Получить видеосценарий
    description: Требуется staff access-токен редактора контента или оператора. Получить видеосценарий с деревом веток. При select=profession добавляется полная связанная профессия (включая мягко удалённую), без привязки — profession=null. Без этого параметра поле profession отсутствует и данные профессии не загружаются.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        description: 'Дополнительные данные: select=profession включает полную профессию. Параметр можно повторять; неизвестные значения игнорируются.'
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Видеосценарий с деревом веток
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoScenarioFull'
      '404':
        description: Видеосценарий не найден
  put:
    tags: [Профессии в действии - CMS]
    summary: Обновить видеосценарий
    description: Требуется staff access-токен редактора контента. Обновить название, описание или профессию
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              profession_id:
                type: integer
                format: int64
                nullable: true
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Видеосценарий обновлён
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoScenario'
      '404':
        description: Видеосценарий не найден
  delete:
    tags: [Профессии в действии - CMS]
    summary: Удалить видеосценарий
    description: Требуется staff access-токен редактора контента. Удалить видеосценарий (только если не использовался в активных сессиях)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '204':
        description: Видеосценарий удалён
      '409':
        description: Видеосценарий использовался в сессиях, удаление невозможно

# ── Ветки видеосценария ─────────────────────────────────────

cms-branches-create:
  post:
    tags: [Профессии в действии - CMS]
    summary: Добавить ветку
    description: |
      Требуется staff access-токен редактора контента.
      Добавить дочернюю ветку к указанному родителю.
      `parent_id` обязателен. Файл передаётся в поле `file` multipart/form-data.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: ID видеосценария
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            properties:
              parent_id:
                type: integer
                title: Parent Id
              text:
                type: string
                title: Text
              file:
                type: string
                contentMediaType: application/octet-stream
                title: File
              file_preview:
                anyOf:
                - type: string
                  contentMediaType: application/octet-stream
                - type: 'null'
                title: File Preview
              prompt:
                anyOf:
                - type: string
                - type: 'null'
                title: Prompt
              file_title:
                anyOf:
                - type: string
                - type: 'null'
                title: File Title
              file_description:
                anyOf:
                - type: string
                - type: 'null'
                title: File Description
            type: object
            required:
            - parent_id
            - text
            - file
            title: Body_create_branch_api_cms_video_scenarios__scenario_id__branches_post
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '201':
        description: Ветка добавлена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

cms-branches-update:
  put:
    tags:
    - Профессии в действии - CMS
    summary: Обновить ветку
    description: Требуется staff access-токен редактора контента. Обновить текст вопроса,
      текст варианта или видеофайл
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: branchId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        multipart/form-data:
          schema:
            properties:
              text:
                anyOf:
                - type: string
                - type: 'null'
                title: Text
              prompt:
                anyOf:
                - type: string
                - type: 'null'
                title: Prompt
              file:
                anyOf:
                - type: string
                  contentMediaType: application/octet-stream
                - type: 'null'
                title: File
              file_preview:
                anyOf:
                - type: string
                  contentMediaType: application/octet-stream
                - type: 'null'
                title: File Preview
              file_title:
                anyOf:
                - type: string
                - type: 'null'
                title: File Title
              file_description:
                anyOf:
                - type: string
                - type: 'null'
                title: File Description
            type: object
            title: Body_update_branch_api_cms_video_scenarios__scenario_id__branches__branch_id__put
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Ветка обновлена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoScenarioBranch'
      '404':
        description: Ветка не найдена

session-create:
  post:
    tags: [Профессии в действии - Оператор]
    summary: Запустить показ
    description: |
      Запустить показ видеосценариев на LED-экране. Требуется staff access-токен оператора или администратора.
      В `settings` передаётся либо `scenario_ids` (ручной выбор), либо `profession_count` (случайный выбор N сценариев).
      Бэкенд конвертит `profession_count` в `scenario_ids` перед сохранением.
      Статус сессии сразу становится `active`.
      Устройство получает session_started в /api/device/sessions/ws с payload device_id, session_id и module=interactive_video.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [device_id, settings]
            properties:
              device_id:
                type: integer
                format: int64
                description: Идентификатор LED-устройства, на котором запускается показ
              settings:
                type: object
                required: [scenario_ids или profession_count]
                properties:
                  scenario_ids:
                    type: array
                    items:
                      type: integer
                      format: int64
                    description: ID видеосценариев для показа (ручной выбор)
                  profession_count:
                    type: integer
                    minimum: 1
                    maximum: 10
                    default: 3
                    description: Количество случайных сценариев для показа (если scenario_ids не указан)
                  voting_duration:
                    type: integer
                    default: 30
                    description: Длительность голосования в секундах
                  result_display_duration:
                    type: integer
                    default: 5
                    description: Длительность показа результата в секундах
    responses:
      '401':
        description: Отсутствующий или недействительный staff access-токен
      '403':
        description: Требуется роль оператора или администратора
      '201':
        description: Показ запущен
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoSession'
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              no_scenarios:
                summary: Нет доступных сценариев
                value:
                  error: no_scenarios
                  message: Нет доступных видеосценариев для показа
              device_busy:
                summary: Устройство занято
                value:
                  error: device_busy
                  message: На этом устройстве уже запущена сессия

session-active:
  get:
    tags: [Профессии в действии]
    summary: Получить активную сессию
    description: "Доступ с действующим User JWT (включая гостя), staff access-токеном сотрудника любой роли или Device JWT с ролью QUIZ_VIDEO=1. Возвращает активную сессию показа с полным состоянием. Для пользователя и сотрудника device_id выбирает устройство; без device_id возвращается любая активная сессия. User JWT не требует предварительного присоединения к показу или QR-привязки. Для Device JWT используется устройство из токена; чужой device_id возвращает 403. Устройства без роли 1 получают 403. Недействительный или отсутствующий JWT — 401; отсутствие активной сессии — 404. Права остальных маршрутов интерактивного видео не меняются."
    parameters:
      - name: device_id
        in: query
        schema:
          type: integer
          format: int64
        description: Идентификатор LED-устройства (если не указан — возвращается любая активная сессия)
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Активная сессия с полным состоянием
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoState'
      '404':
        description: Активной сессии нет

session-stop:
  post:
    tags: [Профессии в действии - Оператор]
    summary: Остановить показ
    description: Остановить показ и вернуть LED-экран в режим ожидания. После первого завершения устройство получает session_finished в /api/device/sessions/ws с module=interactive_video. Требуется staff access-токен оператора или администратора.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий или недействительный staff access-токен
      '403':
        description: Требуется роль оператора или администратора
      '204':
        description: Показ остановлен
      '404':
        description: Сессия не найдена

# ═══════════════════════════════════════════════════════════════
# Состояние показа (LED-экран)
# ═══════════════════════════════════════════════════════════════

session-scenarios:
  get:
    security:
    - bearerAuth: []
    tags: [Профессии в действии - LED]
    summary: Сценарии сессии с первой веткой и файлом
    description: "Требуется staff access-токен admin/operator или device-токен активного устройства. Возвращает массив сценариев в порядке settings.scenario_ids для карточек LED.\nfirst_branch — стартовая ветка (parent_id = null), без дочерних веток.\nfirst_branch.file содержит url, preview_url, mime_type, title и description.\nЕсли стартовой ветки нет, first_branch равен null. Удалённые сценарии пропускаются.\nДоступно для активных и завершённых сессий; не меняет состояние показа. Для device-токена требуется роль 1; другая группа устройства — 403."
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий или недействительный токен.
      '403':
        description: Недостаточно прав.
      '200':
        description: Сценарии сессии; пустой массив, если доступных сценариев нет
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/InteractiveVideoSessionScenario'
      '404':
        description: Сессия не найдена

session-state:
  get:
    tags:
    - Профессии в действии - LED
    summary: Получить состояние показа
    description: "Доступен с device-токеном устройства этой сессии либо staff access-токеном оператора. Возвращает состояние показа: текущее видео, голосование и результаты. Для device-токена требуется роль 1; другая группа устройства — 403."
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: Состояние показа
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoState'
      '403':
        description: Сессия принадлежит другому устройству
      '404':
        description: Сессия не найдена
      '401':
        description: Недействительный или отсутствующий токен
    security:
    - bearerAuth: []

session-advance:
  post:
    tags:
    - Профессии в действии - LED
    summary: Сигнал окончания видео
    description: "Вызывается LED-плеером, когда воспроизведение текущего видеофрагмента (`current_branch`) завершилось.\nСервер не хранит длительность видео — момент перехода к точке голосования (или к следующему сценарию/завершению показа)\nопределяется именно этим сигналом, а не таймером.\nТребует device-токен (`Authorization: Bearer <device token>`), полученный при регистрации устройства.\n- Если у `current_branch` есть дочерние ветки — показ переходит в фазу `voting` (голосование).\n- Если дочерних веток нет и в очереди остались сценарии — переход к следующему сценарию (`scenario_finished`).\n- Если дочерних веток нет и сценариев больше нет — показ завершается (`session_finished`).\n Для device-токена требуется роль 1; другая группа устройства — 403."
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: Обновлённое состояние показа
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoState'
      '400':
        description: Показ сейчас не в фазе воспроизведения видео
      '403':
        description: Сессия принадлежит другому устройству
      '404':
        description: Сессия не найдена
      '401':
        description: Недействительный или отсутствующий токен
    security:
    - bearerAuth: []

session-voting:
  get:
    tags: [Профессии в действии - Зритель]
    summary: Получить информацию о голосовании
    description: |
      Информация о текущей точке голосования для мобильного клиента. Пользователь определяется по user access-токену.
      Включает варианты выбора, таймер, число проголосовавших voting_point.voted_count, статус участника (проголосовал/не проголосовал), результат.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный user access-токен
      '200':
        description: Информация о голосовании
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractiveVideoVoting'
      '404':
        description: Сессия или точка голосования не найдена

# ═══════════════════════════════════════════════════════════════
# Мобильный клиент — подключение и голосование
# ═══════════════════════════════════════════════════════════════

player-join:
  post:
    tags: [Профессии в действии - Зритель]
    summary: Подключиться к показу
    description: Подключиться с user access-токеном после гостевого входа или OAuth. Возвращает ID текущего пользователя.
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный user access-токен
      '200':
        description: Подключён
        content:
          application/json:
            schema:
              type: object
              properties:
                participant_id:
                  type: integer
                  format: int64
                session_id:
                  type: integer
                  format: int64
      '404':
        description: Сессия не найдена
      '409':
        description: Показ уже завершён

player-vote:
  post:
    tags: [Профессии в действии - Зритель]
    summary: Проголосовать
    description: "Проголосовать за вариант продолжения в точке голосования. Пользователь определяется по user access-токену.\nОдин участник может проголосовать только один раз за каждую точку голосования. После каждого принятого голоса проверяется текущий participant_count. Если он больше нуля и число голосов в текущей точке достигло этого значения, голосование завершается досрочно: применяется обычный выбор победителя, показ переходит к его ветке в фазе playing, voting_ends_at очищается. После votes_updated отправляется phase_changed (только type). Ожидать остаток таймера не требуется; дальнейшее воспроизведение и переходы выполняются как обычно. При отсутствии участников досрочного завершения нет. Повторные голоса не учитываются; поздний голос получает voting_closed. Счётчик participant_count сохраняет прежнюю семантику: каждый успешный /join увеличивает его, включая повторное подключение того же пользователя."
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [branch_id]
            additionalProperties: false
            properties:
              branch_id:
                type: integer
                format: int64
                description: ID выбранной ветки (варианта продолжения)
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный user access-токен
      '200':
        description: Голос принят
        content:
          application/json:
            schema:
              type: object
              properties:
                accepted:
                  type: boolean
                message:
                  type: string
      '400':
        description: Ошибка
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              voting_closed:
                summary: Голосование завершено
                value:
                  error: voting_closed
                  message: Голосование уже завершено
              already_voted:
                summary: Уже голосовал
                value:
                  error: already_voted
                  message: Вы уже проголосовали
              invalid_branch:
                summary: Неверная ветка
                value:
                  error: invalid_branch
                  message: Выбранная ветка не является допустимым вариантом
      '404':
        description: Сессия или точка голосования не найдена

# ═══════════════════════════════════════════════════════════════
# WebSocket — уведомления об изменениях
# ═══════════════════════════════════════════════════════════════
# JWT передаётся в query token; до accept проверяются авторизация, роль и доступ к сессии.
# Соединение с БД освобождается до ожидания сообщений.
# Ошибка токена/доступа или отсутствующая сессия — close 1008 до accept (HTTP 403 при handshake).
# Проверка выполняется только при подключении; открытый сокет не перепроверяется.
# Начальное состояние при подключении/переподключении клиент запрашивает через REST.
# Канал и схема: x-websocket-channels.interactive-video-session и InteractiveVideoWebSocketEvent в openapi.yaml.
#
# WebSocket для получения уведомлений об изменениях состояния.
# Клиент получает событие и загружает актуальные данные через REST API.
#
# ## Подключение
#
# ws://host/api/interactive-video/sessions/{sessionId}/ws?token=<jwt>
#
# ## События от сервера
#
# Сервер отправляет только тип события. Клиент сам загружает данные через REST.
#
# ### phase_changed
# Сменилась фаза показа (playing → voting → playing).
# LED загружает: GET /interactive-video/sessions/{id}/state
# Мобильный загружает: GET /interactive-video/sessions/{id}/voting
#
# { "type": "phase_changed" }
#
# ### votes_updated (только для LED)
# Поступил новый голос.
# LED загружает: GET /interactive-video/sessions/{id}/state
#
# { "type": "votes_updated" }
#
# ### scenario_finished
# Текущий сценарий завершён, переход к следующему.
# LED загружает: GET /interactive-video/sessions/{id}/state
# Мобильный загружает: GET /interactive-video/sessions/{id}/voting
#
# { "type": "scenario_finished" }
#
# ### session_finished
# Показ завершён.
#
# { "type": "session_finished" }
#
# ## Пример использования (LED)
#
# 1. LED подключается к WebSocket
# 2. Загружает начальное состояние: GET /state
# 3. Получает событие { "type": "votes_updated" }
# 4. Загружает обновлённое состояние: GET /state
# 5. Обновляет отображение
#
# ## Пример использования (мобильный)
#
# 1. Мобильный подключается к WebSocket
# 2. Загружает начальное состояние: GET /voting
# 3. Голосует: POST /vote
# 4. Получает событие { "type": "phase_changed" } (переход между playing и voting)
# 5. Загружает результат: GET /voting
