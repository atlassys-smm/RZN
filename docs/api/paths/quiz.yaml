        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '201':
        description: Раунд добавлен

cms-templates-rounds-update:
  put:
    tags: [Викторина - CMS]
    summary: Обновить раунд
    description: Требуется staff access-токен редактора контента.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: roundId
        in: path
        required: true
        schema:
          type: integer
