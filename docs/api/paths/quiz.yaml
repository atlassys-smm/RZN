    responses:
      '200':
        description: Порядок изменён

# ═══════════════════════════════════════════════════════════════
# Игровая сессия — создание и управление
# ═══════════════════════════════════════════════════════════════

session-create:
  post:
    tags: [Викторина - Оператор]
    summary: Создать сессию
    description: |
      Создаёт сессию в статусе `waiting` (формирование команд).
      `current_round` и `current_question` = null — игра ещё не началась.
      Фронтенд получает список шаблонов через `GET /cms/quiz/templates`, выбирает нужный и отправляет раунды с вопросами.
      Команды создаются автоматически по `settings.team_count` (для mode=team).
      Оператор запускает первый вопрос через `POST /quiz/sessions/{id}/next`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [mode, rounds]
            properties:
              mode:
                type: string
                enum: [individual, team]
              rounds:
                type: array
                description: Раунды с вопросами (заполнены из шаблона или вручную)
                items:
                  type: object
                  properties:
                    round_type:
                      type: string
                    question_ids:
                      type: array
                      items:
                        type: string
                        format: uuid
              settings:
                type: object
                properties:
                  team_count:
                    type: integer
                    minimum: 2
                    maximum: 8
                    description: Количество команд (для mode=team)
                  auto_reveal:
                    type: boolean
                    default: true
                  auto_next:
                    type: boolean
                    default: false
                  auto_next_delay:
                    type: integer
                    default: 5
                  between_rounds_delay:
                    type: integer
                    default: 10
                  show_intermediate_results:
                    type: boolean
                    default: true
    responses:
      '201':
        description: Сессия создана (статус waiting, ожидает старта оператора)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSession'
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              invalid_rounds:
                summary: Некорректные раунды
                value:
                  error: invalid_rounds
                  message: Количество раундов должно быть от 3 до 8
              invalid_team_count:
                summary: Некорректное количество команд
                value:
                  error: invalid_team_count
                  message: Количество команд должно быть от 2 до 8

session-active:
  get:
    tags: [Викторина]
    summary: Получить активную сессию
    description: |
      Возвращает текущую активную сессию (status=waiting или active).
      Используется оператором при перезапуске планшета для восстановления состояния.
      Если активной сессии нет — возвращает 404.
    parameters:
      - name: select
        in: query
        description: Связанные данные для включения
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
              - teams
              - participants
              - current_question
              - current_round
              - timer
    responses:
      '200':
        description: Активная сессия
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionFull'
      '404':
        description: Активной сессии нет
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

session-detail:
  get:
    tags: [Викторина]
    summary: Получить сессию
    description: |
      Без параметра select возвращает только базовые поля сессии (QuizSession).
      С параметром select возвращает QuizSessionFull с запрошенными связями.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: select
        in: query
        description: Связанные данные для включения
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
              - teams
              - participants
              - current_question
              - current_round
              - timer
    responses:
      '200':
        description: Сессия. Без select — только базовые поля. С select — запрошенные связи заполнены, остальные null.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionFull'
      '404':
        description: Сессия не найдена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

session-finish:
  post:
    tags: [Викторина - Оператор]
    summary: Завершить сессию
    description: Завершить сессию. Статус меняется на `finished`.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Сессия завершена

# ═══════════════════════════════════════════════════════════════
# Управление ходом (оператор)
# ═══════════════════════════════════════════════════════════════

session-next:
  post:
    tags: [Викторина - Оператор]
    summary: Следующий вопрос / Начать игру
    description: |
      Если сессия в статусе `waiting` — запускает первый вопрос первого раунда (старт игры).
      Если игра идёт — переход к следующему вопросу. Между вопросами — таймер автопереключения (auto_next_delay).
      Если вопросов в раунде больше нет — показ результатов раунда, затем (через between_rounds_delay) — следующий раунд.
      После последнего вопроса последнего раунда — показ финальных результатов. Сессия остаётся в статусе `active`, оператор завершает её явно через `POST /quiz/sessions/{id}/finish`.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Текущее состояние игры
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionState'
      '400':
        description: Ошибка
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              session_finished:
                summary: Сессия завершена
                value:
                  error: session_finished
                  message: Сессия уже завершена
              no_more_questions:
                summary: Нет следующих вопросов
                value:
                  error: no_more_questions
                  message: Это последний вопрос, используйте finish для завершения

session-reveal:
  post:
    tags: [Викторина - Оператор]
    summary: Показать ответ
    description: Показать правильный ответ с пояснением (используется если auto_reveal = false)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Правильный ответ
        content:
          application/json:
            schema:
              type: object
              properties:
                answer_option_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                explanation:
                  type: string
                  nullable: true
      '400':
        description: Ошибка
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              already_revealed:
                summary: Ответ уже показан
                value:
                  error: already_revealed
                  message: Правильный ответ уже был показан
              no_active_question:
                summary: Нет активного вопроса
                value:
                  error: no_active_question
                  message: Нет активного вопроса для показа ответа

session-timer-pause:
  post:
    tags: [Викторина - Оператор]
    summary: Пауза таймера
    description: Поставить на паузу таймер текущего вопроса
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Состояние таймера
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTimerState'

session-timer-resume:
  post:
    tags: [Викторина - Оператор]
    summary: Возобновить таймер
    description: Возобновить отсчёт таймера текущего вопроса
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Состояние таймера
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTimerState'

# ═══════════════════════════════════════════════════════════════
# Результаты
# ═══════════════════════════════════════════════════════════════

session-results-round:
  get:
    tags: [Викторина - Оператор]
    summary: Результат раунда
    description: Результаты конкретного раунда. Используется LED для показа после окончания раунда.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roundIndex
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Результат раунда
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizRoundResult'
      '404':
        description: Раунд не найден

session-results-total:
  get:
    tags: [Викторина - Оператор]
    summary: Итоговый результат
    description: |
      Итоговый результат на текущий момент (сумма по завершённым раундам).
      Можно запрашивать в любой момент — между раундами или после завершения сессии.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Итоговый результат
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTotalResult'

# ═══════════════════════════════════════════════════════════════
# Мобильный клиент — подключение и ответы
# ═══════════════════════════════════════════════════════════════

player-join:
  post:
    tags: [Викторина - Игрок]
    summary: Подключиться к сессии
    description: Подключиться к сессии по коду (из QR)
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Подключён
        content:
          application/json:
            schema:
              type: object
              properties:
                participant_id:
                  type: string
                  format: uuid
                session_id:
                  type: string
                  format: uuid
                mode:
                  type: string
                  enum: [individual, team]
                teams:
                  type: array
                  description: Список команд (для mode=team)
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      color:
                        type: string
                      participant_count:
                        type: integer
      '404':
        description: Сессия не найдена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: Сессия уже завершена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

player-team-join:
  post:
    tags: [Викторина - Игрок]
    summary: Выбрать команду
    description: Присоединиться к команде (для mode=team)
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: teamId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Присоединился к команде
        content:
          application/json:
            schema:
              type: object
              properties:
                participant_id:
                  type: string
                  format: uuid
                team_id:
                  type: string
                  format: uuid
                is_captain:
                  type: boolean
                  description: true если участник стал капитаном (первый в команде)

player-answer:
  post:
    tags: [Викторина - Игрок]
    summary: Ответ на вопрос
    description: |
      Ответ на текущий вопрос. Поведение зависит от режима и роли:
      - Individual mode: ответ засчитывается
      - Team mode, обычный участник: сохраняется как голос (для отображения капитану)
      - Team mode, капитан: засчитывается как ответ команды
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              answer:
                description: Зависит от типа вопроса
    responses:
      '200':
        description: Ответ принят
        content:
          application/json:
            schema:
              type: object
              properties:
                accepted:
                  type: boolean
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              already_answered:
                summary: Уже ответил
                value:
                  error: already_answered
                  message: Вы уже дали ответ на этот вопрос
              voting_closed:
                summary: Приём ответов завершён
                value:
                  error: voting_closed
                  message: Приём ответов на этот вопрос завершён
              captain_already_answered:
                summary: Капитан уже ответил
                value:
                  error: captain_already_answered
                  message: Капитан команды уже дал итоговый ответ
              not_captain:
                summary: Не капитан
                value:
                  error: not_captain
                  message: Только капитан может дать итоговый ответ команды
      '404':
        description: Сессия или вопрос не найдены
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

