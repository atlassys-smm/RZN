# ═══════════════════════════════════════════════════════════════
# Игровая сессия — создание и управление
# ═══════════════════════════════════════════════════════════════

session-create:
  post:
    tags: [Викторина - Оператор]
    summary: Создать сессию
    description: |
      Создаёт сессию в статусе `1` (waiting). Она привязывается к LED-устройству `device_id`; на одном устройстве одновременно может быть только одна сессия со статусом `1` (waiting) или `2` (active).
      После создания в waiting устройство получает session_started в /api/device/sessions/ws с payload device_id, session_id и module=quiz.
      API принимает только готовый массив `rounds`, без `template_id`. Если оператор выбрал шаблон, клиент переносит его типы раундов и `question_ids` в этот массив. Для каждого раунда передаются либо конкретные `question_ids`, либо `question_count` и `question_filters` для автоматического выбора вопросов.
      Команды создаются автоматически по `settings.team_count` (для `mode = 2`, team).
      Оператор запускает первый вопрос через `POST /quiz/sessions/{id}/next`. Для командной игры нужны не менее двух команд с не менее чем двумя участниками в каждой. Пустые команды исключаются при старте. Состав раундов и вопросов после создания не редактируется.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [device_id, mode, rounds]
            properties:
              device_id:
                type: integer
                format: int64
                description: LED-устройство, на котором проводится сессия
              mode:
                type: integer
                enum: [1, 2]
                description: 1 — individual, 2 — team
              rounds:
                type: array
                description: Раунды с вопросами из шаблона, выбранными явно по ID или автоматически по количеству и фильтрам
                items:
                  type: object
                  required: [round_type]
                  oneOf:
                    - required: [question_ids]
                    - required: [question_count, question_filters]
                  properties:
                    round_type:
                      type: integer
                      enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
                    question_ids:
                      type: array
                      description: Явно выбранные вопросы; используется вместо автоматического выбора
                      items:
                        type: integer
                        format: int64
                    question_count:
                      type: integer
                      minimum: 1
                      description: Сколько вопросов автоматически выбрать для раунда
                    question_filters:
                      type: object
                      description: Фильтры кандидатов. Каждое поле необязательно; заданные поля ограничивают выбор.
                      properties:
                        difficulty:
                          type: integer
                          enum: [1, 2, 3]
                          description: Числовой ID сложности
                        age_group:
                          type: integer
                          description: Числовой ID возрастной группы
                        tags:
                          type: array
                          items:
                            type: string
                          description: Теги для фильтрации вопросов
              settings:
                type: object
                additionalProperties: false
                properties:
                  team_count:
                    type: integer
                    minimum: 2
                    maximum: 8
                    description: Количество команд (для mode=2, team)
                  team_capacity:
                    type: integer
                    minimum: 2
                    maximum: 10
                    default: 10
                    description: Максимум участников в одной команде
                  auto_reveal_delay:
                    type: [integer, "null"]
                    minimum: 0
                    default: 0
                    description: "Задержка показа ответа после закрытия приёма ответов, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, используется значение из CMS."
                  auto_next_delay:
                    type: [integer, "null"]
                    minimum: 0
                    default: null
                    description: "Задержка перехода к следующему вопросу внутри раунда после показа ответа, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, используется значение из CMS."
                  between_rounds_delay:
                    type: [integer, "null"]
                    minimum: 0
                    default: 10
                    description: "Задержка перехода к следующему раунду после показа ответа на последний вопрос, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, используется значение из CMS."
                  show_intermediate_results:
                    type: boolean
                    default: true
                  scoring:
                    type: object
                    description: Настройки системы начисления баллов. Если не переданы — подставляются стандартные из CMS
                    properties:
                      partial_correct:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            default: true
                      speed_bonus:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            default: true
                          coefficient:
                            type: number
                            default: 1.5
                          threshold_percent:
                            type: integer
                            default: 50
                      streak_bonus:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            default: true
                          step:
                            type: number
                            default: 0.05
                          max:
                            type: number
                            default: 2.0
                      consensus_bonus:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            default: true
                          coefficient:
                            type: number
                            default: 1.2
                      final_multiplier:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            default: true
                          coefficient:
                            type: number
                            default: 1.5
                      penalty:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            default: false
                          coefficient:
                            type: number
                            default: 0.0
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '201':
        description: Сессия создана (статус waiting, ожидает старта оператора)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSession'
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              invalid_rounds:
                summary: Некорректные раунды
                value:
                  error: invalid_rounds
                  message: Количество раундов должно быть от 3 до 8
              invalid_team_count:
                summary: Некорректное количество команд
                value:
                  error: invalid_team_count
                  message: Количество команд должно быть от 2 до 8
      '409':
        description: На этом устройстве уже есть незавершённая сессия

session-active:
  get:
    tags: [Викторина]
    summary: Получить активную сессию
    description: "Возвращает текущую незавершённую сессию (status=1, waiting или status=2, active) для указанного LED-устройства.\nОператор использует запрос для отображения сессии, уже запущенной на этом устройстве.\nВсегда возвращает `round_count` — общее количество раундов и `current_round_question_count` — количество вопросов в текущем раунде. В статусе waiting счётчик вопросов относится к первому раунду. current_question.revealed показывает реальное раскрытие ответа на этот вопрос для всех ролей, независимо от select; в waiting и finished объекта current_question нет. can_start_final_round показывает возможность добавить финал после раскрытия последнего вопроса; в waiting и при наличии FINAL он false.\nВо время active также возвращает текущий раунд, вопрос и таймер. Сотрудник получает current_question.correct_answer сразу; User и Device — только после reveal. Просмотр сотрудником не раскрывает ответ для игроков. `select=answers` добавляет корневое поле `answers` с голосами участников, решающими ответами и статусами команд, счётчиками по вариантам; без параметра поле отсутствует. До начала и после завершения игры `answers=null`. User в командной игре видит свою команду, StaffUser — все команды, Device — общие счётчики и статусы без содержимого ответов. `select=teams` и `select=participants` добавляют состав команд и участников; несколько значений select передаются повторяющимися параметрами запроса.\nЕсли активной сессии нет — возвращает 404.\n Для device-токена требуется роль 1; другая группа устройства — 403."
    parameters:
      - name: device_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        description: Связанные данные для включения; answers добавляет голосование текущего вопроса в корневое поле answers.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
              - teams
              - participants
              - answers
              - current_question
              - current_round
              - timer
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Активная сессия
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionFull'
      '404':
        description: Активной сессии нет
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

session-detail:
  get:
    tags: [Викторина]
    summary: Получить сессию
    description: "Возвращает базовые поля сессии, счётчики round_count/current_round_question_count и вычисляемый can_start_final_round. Во время active также возвращаются текущий раунд, вопрос и таймер. current_question.revealed показывает реальное раскрытие ответа на этот вопрос, независимо от роли и select; в waiting/finished объекта current_question нет.\n`select=answers` добавляет корневое поле `answers` с голосами участников, решающими ответами и статусами команд, счётчиками по вариантам; без параметра поле отсутствует. До начала и после завершения игры `answers=null`. User в командной игре видит свою команду, StaffUser — все команды, Device — общие счётчики и статусы без содержимого ответов. `select=teams` и `select=participants` добавляют состав команд и участников. Несколько значений select передаются повторяющимися параметрами запроса. Для авторизованного капитана `answer_submissions` текущего вопроса содержит ответы его команды; участник определяется по access-токену. Сотрудник получает current_question.correct_answer сразу; User и Device — только после reveal. Просмотр сотрудником не раскрывает ответ для игроков. До раскрытия правильного ответа поля `is_correct` у вариантов и `answer_key` вопроса не возвращаются.\n Для device-токена требуется роль 1; другая группа устройства — 403."
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        description: Связанные данные для включения; answers добавляет голосование текущего вопроса в корневое поле answers.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
              - teams
              - participants
              - answers
              - current_question
              - current_round
              - timer
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Состояние сессии; select добавляет состав команд, участников и блок answers.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionFull'
      '404':
        description: Сессия не найдена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

session-final-round:
  post:
    tags: [Викторина - Оператор]
    summary: Добавить и запустить финальный раунд
    description: |
      Доступен admin/operator только в активной сессии после раскрытия последнего вопроса последнего раунда.
      Проверяется реальное раскрытие для игроков, а не наличие correct_answer у оператора.
      Создаёт последний GameSessionRound с round_type=9 и связанные GameSessionQuestion,
      переключает индексы и сразу запускает первый вопрос обычным механизмом викторины.
      В запросе укажите question_ids либо question_count с необязательными question_filters.
      При одновременной передаче приоритет у question_ids. Отсутствие или null фильтров означает выбор без фильтров.
      Отбор использует общую базу вопросов, как при создании сессии; ранее использованные вопросы не исключаются.
      Начальные 3–8 раундов дополняются одним финальным: после 8 основных допустимо 9 раундов.
      Статус остаётся active; ID сессии, участники, команды, настройки и набранные баллы сохраняются.
      Повторный или параллельный запрос не добавляет второй финал: существующий FINAL в любом месте сессии даёт 409.
      Если вопросы не найдены или их недостаточно, раунд не создаётся и текущая позиция не меняется.
      Возвращает состояние с can_start_final_round=false; первый вопрос имеет работающий таймер.
      Отправляются существующие question_started и session_state. События начала/завершения сессии устройства не отправляются.
      В финале действуют обычные переходы, ответы и final_multiplier. После последнего вопроса финала
      клиент завершает игру через /finish без повторного предложения финала. Сервер не добавляет новые задержки или временные метки.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FinalRoundRequest'
          examples:
            explicit:
              summary: Конкретные вопросы
              value:
                question_ids: [101, 102]
            random:
              summary: Случайный выбор по фильтрам
              value:
                question_count: 3
                question_filters:
                  difficulty: 2
    responses:
      '200':
        description: Финальный раунд добавлен, первый вопрос запущен
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionState'
      '400':
        description: Сессия не active, основные вопросы ещё не раскрыты, способ выбора не указан, вопросы не найдены или их недостаточно
      '401':
        description: Отсутствует действующая авторизация сотрудника
      '403':
        description: Сотруднику требуется роль admin/operator
      '404':
        description: Сессия не найдена
      '409':
        description: В сессии уже есть финальный раунд
      '422':
        description: Некорректное тело запроса, пустой question_ids, question_count меньше 1 или неизвестное поле

session-finish:
  post:
    tags: [Викторина - Оператор]
    summary: Завершить сессию
    description: Завершить сессию. Статус меняется на `3` (finished). Возвращает состояние завершённой сессии. После первого завершения устройство получает session_finished в /api/device/sessions/ws с module=quiz.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Сессия завершена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionState'

session-team-update:
  patch:
    tags: [Викторина - Оператор]
    summary: Переименовать команду
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Команда обновлена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTeam'
      '404':
        description: Сессия или команда не найдена

session-participant-team:
  patch:
    tags: [Викторина - Оператор]
    summary: Переместить участника в другую команду
    description: >
      При переносе капитана в другую команду новый капитан старой команды выбирается случайно из оставшихся участников. Если участников не осталось, `captain_id` старой команды становится `null`. Если в целевой команде нет капитана, им становится перенесённый участник (даже если до переноса он не был капитаном); существующий капитан целевой команды сохраняется.
      Участник и капитаны обеих команд обновляются одной транзакцией.
      После сохранения отправляется только participant_team_changed; клиент по нему обновляет составы и капитанов команд.
      Повторный запрос с текущей командой возвращает участника без изменений и событий, даже если команда заполнена.
      Перенос в другую заполненную команду возвращает 409 без изменений.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: participantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [team_id]
            properties:
              team_id:
                type: integer
                format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Участник перемещён
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizParticipant'
      '404':
        description: Сессия, участник или команда не найдены
      '409':
        description: В целевой команде достигнут лимит в 10 участников

session-team-captain:
  put:
    tags: [Викторина - Оператор]
    summary: Назначить капитана команды
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [participant_id]
            properties:
              participant_id:
                type: integer
                format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Капитан назначен
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTeam'
      '404':
        description: Сессия, команда или участник не найдены

# ═══════════════════════════════════════════════════════════════
# Управление ходом (оператор)
# ═══════════════════════════════════════════════════════════════

session-next:
  post:
    tags: [Викторина - Оператор]
    summary: Следующий вопрос / Начать игру
    description: |
      Если сессия в статусе `1` (waiting) — запускает первый вопрос первого раунда (старт игры).
      При старте командной игры исключает пустые команды и требует не менее 2 оставшихся команд с минимум 2 участниками в каждой.
      Если игра идёт — ручной переход к следующему вопросу без ожидания автоматической задержки.
      Если вопросов в раунде больше нет — ручной запуск следующего раунда. Задержки отсчитывает клиент перед вызовом LED endpoint /led/next.
      После последнего вопроса последнего раунда сессия остаётся в статусе `2` (active); /next больше не продвигает игру. После раскрытия ответа can_start_final_round=true позволяет оператору выбрать /finish или /final-round. Если FINAL (9) уже есть, доступно только завершение через /finish.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Текущее состояние игры
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionState'
      '400':
        description: Ошибка
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              insufficient_team_members:
                summary: Недостаточный состав при старте игры
                value:
                  error: insufficient_team_members
                  message: Для старта нужны минимум 2 команды по 2 участника
              session_finished:
                summary: Сессия завершена
                value:
                  error: session_finished
                  message: Сессия уже завершена
              no_more_questions:
                summary: Нет следующих вопросов
                value:
                  error: no_more_questions
                  message: Это последний вопрос, используйте finish для завершения

session-reveal:
  post:
    tags: [Викторина - Оператор]
    summary: Показать ответ
    description: Показать правильный ответ с пояснением вручную, в том числе при auto_reveal_delay = null или до окончания задержки
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Правильный ответ
        content:
          application/json:
            schema:
              type: object
              properties:
                answer:
                  type: object
                  description: Эталонный ответ в формате соответствующего question_type
                  additionalProperties: true
                explanation:
                  type: string
                  nullable: true
      '400':
        description: Ошибка
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              already_revealed:
                summary: Ответ уже показан
                value:
                  error: already_revealed
                  message: Правильный ответ уже был показан
              no_active_question:
                summary: Нет активного вопроса
                value:
                  error: no_active_question
                  message: Нет активного вопроса для показа ответа

session-timer-pause:
  post:
    tags: [Викторина - Оператор]
    summary: Пауза таймера
    description: Поставить на паузу таймер текущего вопроса
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Состояние таймера
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTimerState'

session-timer-resume:
  post:
    tags: [Викторина - Оператор]
    summary: Возобновить таймер
    description: Возобновить отсчёт таймера текущего вопроса
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Состояние таймера
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTimerState'

session-timer-add-time:
  post:
    tags: [Викторина - Оператор]
    summary: Добавить время
    description: Увеличить оставшееся время текущего вопроса. Работает при запущенном таймере и на паузе.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [seconds]
            properties:
              seconds:
                type: integer
                minimum: 1
                description: Сколько секунд добавить
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Обновлённое состояние таймера
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTimerState'
      '400':
        description: Нет текущего вопроса или приём ответов уже закрыт

session-timer-stop:
  post:
    tags: [Викторина - Оператор]
    summary: Остановить таймер
    description: "Досрочно завершить приём ответов на текущий вопрос. При auto_reveal_delay = 0 ответ показывается сразу. При положительном значении клиент отсчитывает задержку и вызывает reveal; при null показ выполняется вручную. Сервер не отсчитывает задержки."
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Текущее состояние игры после остановки таймера
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionState'
      '400':
        description: Нет текущего вопроса или приём ответов уже закрыт

session-skip:
  post:
    tags: [Викторина - Оператор]
    summary: Пропустить показ ответа
    description: После закрытия приёма ответов перейти к следующему вопросу или результатам раунда без показа правильного ответа. Уже принятые зачётные ответы проверяются автоматически.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Текущее состояние игры после перехода
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionState'
      '400':
        description: Нет текущего вопроса или приём ответов ещё открыт

session-led-next:
  post:
    tags: [Викторина - LED]
    summary: Следующий вопрос (LED)
    description: "LED вызывает endpoint после окончания таймера с учётом auto_reveal_delay, который отсчитывает клиент. Если время вопроса вышло и auto_reveal_delay задан числом, сервер раскрывает ответ и начисляет баллы; при null ожидает ручной reveal или skip. Если ответ уже показан, endpoint переходит к следующему вопросу. Перед таким автоматическим вызовом клиент отсчитывает auto_next_delay внутри раунда или between_rounds_delay между раундами; при null вызов не выполняется. Сервер не проверяет время этих задержек и не сохраняет дополнительные временные метки. После ручной остановки при положительном auto_reveal_delay клиент вызывает reveal по окончании задержки. После раскрытия последнего вопроса последнего раунда оператор выбирает finish или final-round по can_start_final_round; после финала вызывает только finish. Для device-токена требуется роль 1; другая группа устройства — 403."
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Текущее состояние сессии
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionState'

# ═══════════════════════════════════════════════════════════════
# Результаты
# ═══════════════════════════════════════════════════════════════

session-results:
  get:
    tags: [Викторина - Оператор]
    summary: Текущий результат
    description: "Актуальный рейтинг на текущий момент. Можно запрашивать в любой момент — между раундами или после завершения сессии.\n Для device-токена требуется роль 1; другая группа устройства — 403."
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Текущий результат
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTotalResult'

# ═══════════════════════════════════════════════════════════════
# Мобильный клиент — подключение и ответы
# Все запросы требуют user access-токен. Управление сессией выше — staff ADMIN/OPERATOR; LED next — device-токен своей сессии.
# Чтение состояния/результатов — участник сессии, сотрудник или устройство сессии.
# ═══════════════════════════════════════════════════════════════

player-join:
  post:
    tags: [Викторина - Игрок]
    summary: Подключиться к сессии
    description: Подключиться с user access-токеном после гостевого входа или OAuth. Повторный запрос возвращает того же участника.
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Подключён
        content:
          application/json:
            schema:
              type: object
              required: [participant_id, session_id, mode]
              properties:
                participant_id:
                  type: integer
                  format: int64
                  description: ID GameSessionParticipant
                session_id:
                  type: integer
                  format: int64
                mode:
                  type: integer
                  enum: [1, 2]
                  description: 1 — individual, 2 — team
                teams:
                  type: array
                  description: Список команд (для mode=2, team)
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                      name:
                        type: string
                      color:
                        type: string
                      participant_count:
                        type: integer
      '404':
        description: Сессия не найдена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: Сессия уже завершена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

player-team-join:
  post:
    tags: [Викторина - Игрок]
    summary: Выбрать команду
    description: Присоединиться к команде (для mode=team). Участник определяется по текущему пользователю. Сначала вызовите /join; смена команды доступна оператору.
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Присоединился к команде
        content:
          application/json:
            schema:
              type: object
              properties:
                participant_id:
                  type: integer
                  format: int64
                team_id:
                  type: integer
                  format: int64
                is_captain:
                  type: boolean
                  description: true если участник стал капитаном (первый в команде)
      '409':
        description: Сессия уже началась или команда заполнена (10 участников)

player-answer:
  post:
    tags: [Викторина - Игрок]
    summary: Ответ на вопрос
    description: |
      User access-токен обязателен. Участник определяется по пользователю и сессии.
      Ответ на текущий вопрос. Поведение зависит от режима и роли:
      - Individual mode: ответ засчитывается
      - Team mode, обычный участник: сохраняется как голос (для отображения капитану)
      - Team mode, капитан: любой ответ является решающим ответом команды независимо от `is_final`; повторная отправка запрещена
      После ответа последнего участника индивидуальной игры или ответа капитана последней непустой команды приём ответов автоматически закрывается. Голос капитана всегда решающий, независимо от `is_final`; предварительные голоса остальных участников не завершают командное голосование. Пустые команды не учитываются. После `answers_update` отправляется `all_answered` (только поле `type`), затем применяется та же обработка, что при окончании таймера через `/led/next`: при числовом `auto_reveal_delay` ответ раскрывается и начисляются баллы, при `null` ожидается ручной `reveal` или `skip`. Досрочное закрытие не отправляет `timer_expired` или `timer_stopped`. Дальнейший переход выполняется по существующему сценарию LED, задержки отсчитывает клиент.
      Ответ API остаётся {"accepted": true}, включая ответ, который досрочно закрыл вопрос.
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [answer]
            additionalProperties: false
            properties:
              answer:
                type: object
                description: JSON-ответ согласно типу вопроса; форматы описаны в entities/quiz.md
                additionalProperties: true
              is_final:
                type: boolean
                default: false
                description: Необязательный флаг совместимости. Ответ капитана всегда решающий независимо от значения; is_final=true у обычного участника запрещён
    responses:
      '401':
        description: Отсутствующий, истёкший или недействительный токен
      '403':
        description: Нет доступа к сессии или операция недоступна роли
      '200':
        description: Ответ принят
        content:
          application/json:
            schema:
              type: object
              properties:
                accepted:
                  type: boolean
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              already_answered:
                summary: Уже ответил
                value:
                  error: already_answered
                  message: Вы уже дали ответ на этот вопрос
              answering_closed:
                summary: Приём ответов завершён
                value:
                  error: answering_closed
                  message: Приём ответов на этот вопрос завершён
              captain_already_answered:
                summary: Капитан уже отправил решающий ответ
                value:
                  error: captain_already_answered
                  message: Капитан команды уже отправил решающий ответ
              not_captain:
                summary: Решающий ответ может отправить только капитан
                value:
                  error: not_captain
                  message: Только капитан может отправить решающий ответ команды
      '404':
        description: Сессия или вопрос не найдены
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

# ═══════════════════════════════════════════════════════════════
# WebSocket — обновления в реальном времени
# ═══════════════════════════════════════════════════════════════
# URL: ws://host/api/quiz/sessions/{sessionId}/ws?token=<jwt>
# Формат: {"type": "event_name", "data": {...}}; data опускается у уведомлений без данных.
# Схема: components/schemas/QuizWebSocketEvent в openapi.yaml.
# Канал: x-websocket-channels.quiz-session в openapi.yaml.
# Полное описание и примеры: ../websocket.md, раздел «Викторина».
#
# ### question_started
# Начался приём ответов на вопрос.
#
# {
#   "type": "question_started",
#   "data": {
#     "question_index": 0,
#     "time_limit": 30
#   }
# }
#
# ### all_answered
# Все участники или все непустые команды отправили зачётные ответы; приём ответов досрочно закрыт.
# {"type": "all_answered"}
#
# ### answers_update
# Новый предварительный ответ участника или решающий ответ капитана. Клиент обновляет голосование запросом GET /quiz/sessions/{id}?select=answers.
#
# {
#   "type": "answers_update",
#   "data": {
#     "submitted_count": 8,
#     "eligible_count": 12
#   }
# }
#
# ### question_revealed
# Правильный ответ показан.
#
# {
#   "type": "question_revealed",
#   "data": {
#     "correct_answer": {
#       "answer": { ... },
#       "explanation": "Пояснение"
#     }
#   }
# }
#
# ### round_finished
# Раунд завершён, показ результатов.
#
# {
#   "type": "round_finished",
#   "data": {
#     "round_index": 0,
#     "scores": [...]
#   }
# }
#
# ### session_finished
# Сессия завершена.
#
# {
#   "type": "session_finished",
#   "data": {}
# }
#
# ## События от клиента
#
# ### subscribe
# Подписка на определённые типы событий.
#
# {
#   "type": "subscribe",
#   "events": ["answers_update", "question_revealed"]
# }
#
# Если не отправлено — клиент получает все события.

# Все события имеют формат {"type": "event_name"}, без data.
# session_state — уведомление после смены вопроса, раскрытия ответа,
# изменения таймера и завершения сессии; снимок состояния не передаётся.
# При подключении/переподключении сервер не отправляет начальный session_state.
# После подключения и каждого события клиент запрашивает
# GET /quiz/sessions/active?device_id=...&select=teams&select=participants.
# Состояние содержит round_count и current_round_question_count.
# События: participant_joined, participant_team_changed, captain_changed,
# team_renamed, answers_update, question_started, question_revealed,
# timer_paused, timer_resumed, timer_updated, timer_stopped, timer_expired,
# round_finished (включая последний раунд), session_finished, session_state.
# После завершения active возвращает 404; состояние и результаты доступны по ID.
# Ответы команды доступны капитану через
# GET /quiz/sessions/{id} с access-токеном капитана.
# Истечение таймера проверяет POST /quiz/sessions/{id}/led/next, фоновой рассылки нет.
# Подключение получает все события сессии; subscribe-фильтрация не поддерживается.
# JWT передаётся в query token; до accept проверяются авторизация, роль и доступ к сессии.
# Соединение с БД освобождается до ожидания сообщений.
# Ошибка токена/доступа или отсутствующая сессия — close 1008 до accept (HTTP 403 при handshake).
# Проверка выполняется только при подключении; открытый сокет не перепроверяется.
