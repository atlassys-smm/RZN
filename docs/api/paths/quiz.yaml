    summary: Убрать вопрос из раунда
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roundId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: questionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Вопрос убран из раунда

cms-templates-rounds-questions-reorder:
  put:
    tags: [Викторина - CMS]
    summary: Изменить порядок вопросов в раунде
    parameters:
      - name: id
        in: path
        required: true
