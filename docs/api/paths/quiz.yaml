cms-templates-rounds-delete:
  delete:
    tags: [Викторина - CMS]
    summary: Удалить раунд
    description: Требуется staff access-токен редактора контента.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: roundId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '204':
        description: Раунд удалён

cms-templates-rounds-reorder:
  put:
    tags: [Викторина - CMS]
    summary: Изменить порядок раундов
    description: Требуется staff access-токен редактора контента.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              round_ids:
                type: array
                items:
                  type: integer
                  format: int64
                description: ID раундов в новом порядке
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Порядок изменён

# ── Вопросы в раунде шаблона ───────────────────────────────

