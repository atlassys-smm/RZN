# ═══════════════════════════════════════════════════════════════
# CMS — Настройки сессий
# ═══════════════════════════════════════════════════════════════

cms-settings-defaults-get:
  get:
    tags: [Викторина - CMS]
    summary: Стандартные настройки сессии
    description: Требуется staff access-токен редактора контента или оператора. Получить стандартные настройки, которые подставляются при создании сессии, если не переданы в запросе
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Стандартные настройки
        content:
          application/json:
            schema:
              type: object
              properties:
                team_count:
                  type: integer
                team_capacity:
                  type: integer
                auto_reveal_delay:
                  type: [integer, "null"]
                  minimum: 0
                  default: 0
                  description: "Задержка показа ответа после закрытия приёма ответов, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, используется значение из CMS."
                auto_next_delay:
                  type: [integer, "null"]
                  minimum: 0
                  default: null
                  description: "Задержка перехода к следующему вопросу внутри раунда после показа ответа, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, используется значение из CMS."
                between_rounds_delay:
                  type: [integer, "null"]
                  minimum: 0
                  default: 10
                  description: "Задержка перехода к следующему раунду после показа ответа на последний вопрос, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, используется значение из CMS."
                show_intermediate_results:
                  type: boolean

cms-settings-defaults-update:
  put:
    tags: [Викторина - CMS]
    summary: Обновить стандартные настройки сессии
    description: Требуется staff access-токен редактора контента. Обновить стандартные настройки. Передаются только изменяемые поля.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              team_count:
                type: integer
              team_capacity:
                type: integer
              auto_reveal_delay:
                type: [integer, "null"]
                minimum: 0
                description: "Задержка показа ответа после закрытия приёма ответов, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, значение не меняется."
              auto_next_delay:
                type: [integer, "null"]
                minimum: 0
                description: "Задержка перехода к следующему вопросу внутри раунда после показа ответа, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, значение не меняется."
              between_rounds_delay:
                type: [integer, "null"]
                minimum: 0
                description: "Задержка перехода к следующему раунду после показа ответа на последний вопрос, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, значение не меняется."
              show_intermediate_results:
                type: boolean
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Настройки обновлены
        content:
          application/json:
            schema:
              type: object
              properties:
                team_count:
                  type: integer
                team_capacity:
                  type: integer
                auto_reveal_delay:
                  type: [integer, "null"]
                  minimum: 0
                  default: 0
                  description: "Задержка показа ответа после закрытия приёма ответов, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, используется значение из CMS."
                auto_next_delay:
                  type: [integer, "null"]
                  minimum: 0
                  default: null
                  description: "Задержка перехода к следующему вопросу внутри раунда после показа ответа, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, используется значение из CMS."
                between_rounds_delay:
                  type: [integer, "null"]
                  minimum: 0
                  default: 10
                  description: "Задержка перехода к следующему раунду после показа ответа на последний вопрос, в секундах. null отключает автоматическое действие; 0 выполняет без ожидания. Если поле не передано, используется значение из CMS."
                show_intermediate_results:
                  type: boolean

