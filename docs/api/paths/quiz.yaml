# ═══════════════════════════════════════════════════════════════
# CMS — Вопросы викторины
# ═══════════════════════════════════════════════════════════════

cms-questions:
  get:
    tags: [Викторина - CMS]
    summary: Список вопросов
    description: Получить список вопросов викторины с фильтрацией и пагинацией
    parameters:
      - name: question_type
        in: query
        schema:
          type: string
        description: Тип вопроса (single_choice, multiple_choice, ...)
      - name: difficulty
        in: query
        schema:
          type: string
          enum: [easy, medium, hard]
      - name: age_group
        in: query
        schema:
          type: string
      - name: round_type
        in: query
        schema:
          type: string
        description: Тип раунда (quick_start, tools, ...)
      - name: tag
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '200':
        description: Список вопросов
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/QuizQuestion'
                total:
                  type: integer
  post:
    tags: [Викторина - CMS]
    summary: Создать вопрос
    description: Создать новый вопрос с вариантами ответов
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [text, question_type, difficulty, time_limit, points, answer_options]
            properties:
              text:
                type: string
              question_type:
                type: string
              difficulty:
                type: string
                enum: [easy, medium, hard]
              age_group:
                type: string
              time_limit:
                type: integer
                description: Время на ответ в секундах
              points:
                type: integer
              explanation:
                type: string
                description: Пояснение правильного ответа
              round_type:
                type: string
              tags:
                type: array
                items:
                  type: string
              media_id:
                type: string
                format: uuid
              answer_options:
                type: array
                items:
                  type: object
                  required: [text, is_correct]
                  properties:
                    text:
                      type: string
                    is_correct:
                      type: boolean
                    media_id:
                      type: string
                      format: uuid
                    order:
                      type: integer
    responses:
      '201':
        description: Вопрос создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizQuestion'

cms-questions-detail:
  get:
    tags: [Викторина - CMS]
    summary: Получить вопрос
    description: Получить вопрос со всеми вариантами ответов
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Вопрос с вариантами ответов
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizQuestion'
      '404':
        description: Вопрос не найден

cms-questions-update:
  put:
    tags: [Викторина - CMS]
    summary: Обновить вопрос
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '200':
        description: Вопрос обновлён
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizQuestion'
      '404':
        description: Вопрос не найден

cms-questions-delete:
  delete:
    tags: [Викторина - CMS]
    summary: Удалить вопрос
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Вопрос удалён
      '404':
        description: Вопрос не найден

# ═══════════════════════════════════════════════════════════════
# CMS — Шаблоны сценариев
# ═══════════════════════════════════════════════════════════════

cms-templates:
  get:
    tags: [Викторина - CMS]
    summary: Список шаблонов
    description: Получить список шаблонов сценариев
    parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [draft, published]
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '200':
        description: Список шаблонов
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/QuizScenarioTemplate'
                total:
                  type: integer
  post:
    tags: [Викторина - CMS]
    summary: Создать шаблон
    description: Создать новый шаблон сценария
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
              description:
                type: string
    responses:
      '201':
        description: Шаблон создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizScenarioTemplate'

cms-templates-update:
  put:
    tags: [Викторина - CMS]
    summary: Обновить шаблон
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '200':
        description: Шаблон обновлён
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizScenarioTemplate'

cms-templates-delete:
  delete:
    tags: [Викторина - CMS]
    summary: Удалить шаблон
    description: Удалить шаблон (только если не использовался в проведённых сессиях)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Шаблон удалён
      '409':
        description: Шаблон использовался в сессиях, удаление невозможно

cms-templates-publish:
  post:
    tags: [Викторина - CMS]
    summary: Опубликовать шаблон
    description: Изменить статус с draft на published — шаблон становится доступен оператору
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Шаблон опубликован

cms-templates-unpublish:
  post:
    tags: [Викторина - CMS]
    summary: В черновик
    description: Изменить статус с published на draft
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Шаблон переведён в черновик

# ── Раунды шаблона ─────────────────────────────────────────

cms-templates-rounds-create:
