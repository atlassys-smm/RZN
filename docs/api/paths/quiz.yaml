    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roundId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Раунд обновлён

cms-templates-rounds-delete:
  delete:
    tags: [Викторина - CMS]
    summary: Удалить раунд
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roundId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Раунд удалён

cms-templates-rounds-reorder:
  put:
    tags: [Викторина - CMS]
    summary: Изменить порядок раундов
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              round_ids:
                type: array
                items:
                  type: string
                  format: uuid
                description: ID раундов в новом порядке
    responses:
      '200':
        description: Порядок изменён

# ── Вопросы в раунде шаблона ───────────────────────────────

cms-templates-rounds-questions-add:
  post:
    tags: [Викторина - CMS]
