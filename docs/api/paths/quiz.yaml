# ═══════════════════════════════════════════════════════════════
# Игровая сессия — создание и управление
# ═══════════════════════════════════════════════════════════════

session-create:
  post:
    tags: [Викторина - Оператор]
    summary: Создать сессию
    description: |
      Создаёт сессию в статусе `1` (waiting). Она привязывается к LED-устройству `device_id`; на одном устройстве одновременно может быть только одна сессия со статусом `1` (waiting) или `2` (active).
      API принимает только готовый массив `rounds`, без `template_id`. Если оператор выбрал шаблон, клиент переносит его типы раундов и `question_ids` в этот массив. Для каждого раунда передаются либо конкретные `question_ids`, либо `question_count` и `question_filters` для автоматического выбора вопросов.
      Команды создаются автоматически по `settings.team_count` (для `mode = 2`, team).
      Оператор запускает первый вопрос через `POST /quiz/sessions/{id}/next`. Для командной игры нужны не менее двух команд с не менее чем двумя участниками в каждой. Пустые команды исключаются при старте. Состав раундов и вопросов после создания не редактируется.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [device_id, mode, rounds]
            properties:
              device_id:
                type: integer
                format: int64
                description: LED-устройство, на котором проводится сессия
              mode:
                type: integer
                enum: [1, 2]
                description: 1 — individual, 2 — team
              rounds:
                type: array
                description: Раунды с вопросами из шаблона, выбранными явно по ID или автоматически по количеству и фильтрам
                items:
                  type: object
                  required: [round_type]
                  oneOf:
                    - required: [question_ids]
                    - required: [question_count, question_filters]
                  properties:
                    round_type:
                      type: integer
                      enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
                    question_ids:
                      type: array
                      description: Явно выбранные вопросы; используется вместо автоматического выбора
                      items:
                        type: integer
                        format: int64
                    question_count:
                      type: integer
                      minimum: 1
                      description: Сколько вопросов автоматически выбрать для раунда
                    question_filters:
                      type: object
                      description: Фильтры кандидатов. Каждое поле необязательно; заданные поля ограничивают выбор.
                      properties:
                        difficulty:
                          type: integer
                          enum: [1, 2, 3]
                          description: Числовой ID сложности
                        age_group:
                          type: integer
                          description: Числовой ID возрастной группы
                        tags:
                          type: array
                          items:
                            type: string
                          description: Теги для фильтрации вопросов
              settings:
                type: object
                properties:
                  team_count:
                    type: integer
                    minimum: 2
                    maximum: 8
                    description: Количество команд (для mode=2, team)
                  team_capacity:
                    type: integer
                    minimum: 2
                    maximum: 10
                    default: 10
                    description: Максимум участников в одной команде
                  auto_reveal:
                    type: boolean
                    default: true
                  auto_next:
                    type: boolean
                    default: false
                  auto_next_delay:
                    type: integer
                    default: 5
                  between_rounds_delay:
                    type: integer
                    default: 10
                  show_intermediate_results:
                    type: boolean
                    default: true
    responses:
      '201':
        description: Сессия создана (статус waiting, ожидает старта оператора)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSession'
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              invalid_rounds:
                summary: Некорректные раунды
                value:
                  error: invalid_rounds
                  message: Количество раундов должно быть от 3 до 8
              invalid_team_count:
                summary: Некорректное количество команд
                value:
                  error: invalid_team_count
                  message: Количество команд должно быть от 2 до 8
      '409':
        description: На этом устройстве уже есть незавершённая сессия

session-active:
  get:
    tags: [Викторина]
    summary: Получить активную сессию
    description: |
      Возвращает текущую незавершённую сессию (status=1, waiting или status=2, active) для указанного LED-устройства.
      Оператор использует запрос для отображения сессии, уже запущенной на этом устройстве.
      Если активной сессии нет — возвращает 404.
    parameters:
      - name: device_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        description: Связанные данные для включения
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
              - teams
              - participants
              - current_question
              - current_round
              - timer
    responses:
      '200':
        description: Активная сессия
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionFull'
      '404':
        description: Активной сессии нет
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

session-detail:
  get:
    tags: [Викторина]
    summary: Получить сессию
    description: |
      Без параметра select возвращает только базовые поля сессии (QuizSession).
      С параметром select возвращает QuizSessionFull с запрошенными связями. Если `participant_id` принадлежит капитану и запрошен `current_question`, `answer_submissions` содержит предварительные ответы команды. До раскрытия правильного ответа поля `is_correct` у вариантов и `answer_key` вопроса не возвращаются.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: select
        in: query
        description: Связанные данные для включения
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
              - teams
              - participants
              - current_question
              - current_round
              - timer
      - name: participant_id
        in: query
        description: ID GameSessionParticipant; when it identifies the team captain, current_question includes team-member submissions
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Сессия. Без select — только базовые поля. С select — запрошенные связи заполнены, остальные null.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionFull'
      '404':
        description: Сессия не найдена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

session-finish:
  post:
    tags: [Викторина - Оператор]
    summary: Завершить сессию
    description: Завершить сессию. Статус меняется на `3` (finished).
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Сессия завершена

session-team-update:
  patch:
    tags: [Викторина - Оператор]
    summary: Переименовать команду
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
    responses:
      '200':
        description: Команда обновлена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTeam'
      '404':
        description: Сессия или команда не найдена

session-participant-team:
  patch:
    tags: [Викторина - Оператор]
    summary: Переместить участника в другую команду
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: participantId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [team_id]
            properties:
              team_id:
                type: integer
                format: int64
    responses:
      '200':
        description: Участник перемещён
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizParticipant'
      '404':
        description: Сессия, участник или команда не найдены
      '409':
        description: В целевой команде достигнут лимит в 10 участников

session-team-captain:
  put:
    tags: [Викторина - Оператор]
    summary: Назначить капитана команды
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [participant_id]
            properties:
              participant_id:
                type: integer
                format: int64
    responses:
      '200':
        description: Капитан назначен
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTeam'
      '404':
        description: Сессия, команда или участник не найдены

# ═══════════════════════════════════════════════════════════════
# Управление ходом (оператор)
# ═══════════════════════════════════════════════════════════════

session-next:
  post:
    tags: [Викторина - Оператор]
    summary: Следующий вопрос / Начать игру
    description: |
      Если сессия в статусе `1` (waiting) — запускает первый вопрос первого раунда (старт игры).
      При старте командной игры исключает пустые команды и требует не менее 2 оставшихся команд с минимум 2 участниками в каждой.
      Если игра идёт — переход к следующему вопросу. Между вопросами — таймер автопереключения (auto_next_delay).
      Если вопросов в раунде больше нет — показ результатов раунда, затем (через between_rounds_delay) — следующий раунд.
      После последнего вопроса последнего раунда — показ финальных результатов. Сессия остаётся в статусе `2` (active), оператор завершает её явно через `POST /quiz/sessions/{id}/finish`.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Текущее состояние игры
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionState'
      '400':
        description: Ошибка
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              insufficient_team_members:
                summary: Недостаточный состав при старте игры
                value:
                  error: insufficient_team_members
                  message: Для старта нужны минимум 2 команды по 2 участника
              session_finished:
                summary: Сессия завершена
                value:
                  error: session_finished
                  message: Сессия уже завершена
              no_more_questions:
                summary: Нет следующих вопросов
                value:
                  error: no_more_questions
                  message: Это последний вопрос, используйте finish для завершения

session-reveal:
  post:
    tags: [Викторина - Оператор]
    summary: Показать ответ
    description: Показать правильный ответ с пояснением (используется если auto_reveal = false)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Правильный ответ
        content:
          application/json:
            schema:
              type: object
              properties:
                answer:
                  type: object
                  description: Эталонный ответ в формате соответствующего question_type
                  additionalProperties: true
                explanation:
                  type: string
                  nullable: true
      '400':
        description: Ошибка
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              already_revealed:
                summary: Ответ уже показан
                value:
                  error: already_revealed
                  message: Правильный ответ уже был показан
              no_active_question:
                summary: Нет активного вопроса
                value:
                  error: no_active_question
                  message: Нет активного вопроса для показа ответа

session-timer-pause:
  post:
    tags: [Викторина - Оператор]
    summary: Пауза таймера
    description: Поставить на паузу таймер текущего вопроса
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Состояние таймера
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTimerState'

session-timer-resume:
  post:
    tags: [Викторина - Оператор]
    summary: Возобновить таймер
    description: Возобновить отсчёт таймера текущего вопроса
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Состояние таймера
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTimerState'

session-timer-add-time:
  post:
    tags: [Викторина - Оператор]
    summary: Добавить время
    description: Увеличить оставшееся время текущего вопроса. Работает при запущенном таймере и на паузе.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [seconds]
            properties:
              seconds:
                type: integer
                minimum: 1
                description: Сколько секунд добавить
    responses:
      '200':
        description: Обновлённое состояние таймера
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTimerState'
      '400':
        description: Нет текущего вопроса или приём ответов уже закрыт

session-timer-stop:
  post:
    tags: [Викторина - Оператор]
    summary: Остановить таймер
    description: Досрочно завершить приём ответов на текущий вопрос. После остановки применяется настройка `auto_reveal`; при выключенном автопоказе оператор вызывает `reveal` или `skip`.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Текущее состояние игры после остановки таймера
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionState'
      '400':
        description: Нет текущего вопроса или приём ответов уже закрыт

session-skip:
  post:
    tags: [Викторина - Оператор]
    summary: Пропустить показ ответа
    description: После закрытия приёма ответов перейти к следующему вопросу или результатам раунда без показа правильного ответа. Уже принятые зачётные ответы проверяются автоматически.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Текущее состояние игры после перехода
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSessionState'
      '400':
        description: Нет текущего вопроса или приём ответов ещё открыт

# ═══════════════════════════════════════════════════════════════
# Результаты
# ═══════════════════════════════════════════════════════════════

session-results-round:
  get:
    tags: [Викторина - Оператор]
    summary: Результат раунда
    description: Результаты конкретного раунда. Используется LED для показа после окончания раунда.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: roundIndex
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Результат раунда
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizRoundResult'
      '404':
        description: Раунд не найден

session-results-total:
  get:
    tags: [Викторина - Оператор]
    summary: Итоговый результат
    description: |
      Итоговый результат на текущий момент (сумма по завершённым раундам).
      Можно запрашивать в любой момент — между раундами или после завершения сессии.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Итоговый результат
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizTotalResult'

# ═══════════════════════════════════════════════════════════════
# Мобильный клиент — подключение и ответы
# ═══════════════════════════════════════════════════════════════

player-join:
  post:
    tags: [Викторина - Игрок]
    summary: Подключиться к сессии
    description: Подключиться к сессии по коду (из QR)
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Подключён
        content:
          application/json:
            schema:
              type: object
              required: [participant_id, session_id, token, mode]
              properties:
                participant_id:
                  type: integer
                  format: int64
                  description: ID GameSessionParticipant
                session_id:
                  type: integer
                  format: int64
                token:
                  type: string
                  description: User JWT гостевого пользователя
                mode:
                  type: integer
                  enum: [1, 2]
                  description: 1 — individual, 2 — team
                teams:
                  type: array
                  description: Список команд (для mode=2, team)
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                      name:
                        type: string
                      color:
                        type: string
                      participant_count:
                        type: integer
      '404':
        description: Сессия не найдена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: Сессия уже завершена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

player-team-join:
  post:
    tags: [Викторина - Игрок]
    summary: Выбрать команду
    description: Присоединиться к команде (для mode=team)
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [participant_id]
            properties:
              participant_id:
                type: integer
                format: int64
    responses:
      '200':
        description: Присоединился к команде
        content:
          application/json:
            schema:
              type: object
              properties:
                participant_id:
                  type: integer
                  format: int64
                team_id:
                  type: integer
                  format: int64
                is_captain:
                  type: boolean
                  description: true если участник стал капитаном (первый в команде)
      '409':
        description: Сессия уже началась или команда заполнена (10 участников)

player-answer:
  post:
    tags: [Викторина - Игрок]
    summary: Ответ на вопрос
    description: |
      Ответ на текущий вопрос. Поведение зависит от режима и роли:
      - Individual mode: ответ засчитывается
      - Team mode, обычный участник: сохраняется как голос (для отображения капитану)
      - Team mode, капитан: предварительный ответ при `is_final=false`, зачётный ответ команды при `is_final=true`
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [participant_id, answer]
            properties:
              participant_id:
                type: integer
                format: int64
                description: ID GameSessionParticipant, полученный при подключении
              answer:
                type: object
                description: JSON-ответ согласно типу вопроса; форматы описаны в entities/quiz.md
                additionalProperties: true
              is_final:
                type: boolean
                default: false
                description: true только для решающего ответа капитана команды; false означает предварительный ответ участника
    responses:
      '200':
        description: Ответ принят
        content:
          application/json:
            schema:
              type: object
              properties:
                accepted:
                  type: boolean
      '400':
        description: Ошибка валидации
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            examples:
              already_answered:
                summary: Уже ответил
                value:
                  error: already_answered
                  message: Вы уже дали ответ на этот вопрос
              answering_closed:
                summary: Приём ответов завершён
                value:
                  error: answering_closed
                  message: Приём ответов на этот вопрос завершён
              captain_already_answered:
                summary: Капитан уже отправил решающий ответ
                value:
                  error: captain_already_answered
                  message: Капитан команды уже отправил решающий ответ
              not_captain:
                summary: Решающий ответ может отправить только капитан
                value:
                  error: not_captain
                  message: Только капитан может отправить решающий ответ команды
      '404':
        description: Сессия или вопрос не найдены
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

# ═══════════════════════════════════════════════════════════════
# WebSocket — обновления в реальном времени
# ═══════════════════════════════════════════════════════════════
#
# WebSocket-эндпоинты для получения обновлений в реальном времени.
# OpenAPI 3.1 не поддерживает WebSocket, поэтому описание приведено ниже.
#
# ## Подключение
#
# ws://host/api/v1/quiz/sessions/{sessionId}/ws
#
# ## События от сервера
#
# ### session_state
# Обновление состояния сессии (для оператора и LED).
#
# {
#   "type": "session_state",
#   "data": {
#     "status": 2,
#     "current_round": { "index": 0, "round_type": 1 },
#     "current_question": { ... },
#     "timer": { "ends_at": 1780000000000, "remaining_at_pause": null, "running": true },
#     "scores": [...]
#   }
# }
#
# ### question_started
# Начался приём ответов на вопрос.
#
# {
#   "type": "question_started",
#   "data": {
#     "question_index": 0,
#     "time_limit": 30
#   }
# }
#
# ### answers_update
# Новый предварительный ответ участника или решающий ответ капитана. Капитан обновляет состояние запросом GET /quiz/sessions/{id}?select=current_question&participant_id={captainParticipantId}.
#
# {
#   "type": "answers_update",
#   "data": {
#     "submitted_count": 8,
#     "eligible_count": 12
#   }
# }
#
# ### question_revealed
# Правильный ответ показан.
#
# {
#   "type": "question_revealed",
#   "data": {
#     "correct_answer": {
#       "answer": { ... },
#       "explanation": "Пояснение"
#     }
#   }
# }
#
# ### round_finished
# Раунд завершён, показ результатов.
#
# {
#   "type": "round_finished",
#   "data": {
#     "round_index": 0,
#     "scores": [...]
#   }
# }
#
# ### session_finished
# Сессия завершена.
#
# {
#   "type": "session_finished",
#   "data": {}
# }
#
# ## События от клиента
#
# ### subscribe
# Подписка на определённые типы событий.
#
# {
#   "type": "subscribe",
#   "events": ["answers_update", "question_revealed"]
# }
#
# Если не отправлено — клиент получает все события.

