user-guest:
  post:
    tags:
    - Авторизация пользователей
    summary: Создание гостя
    description: Гость на 24 часа. При создании first_name получает «Гость», last_name — строковый users.id. Обязательны существующая версия согласия
      и consent_accepted=true. Тип, статус, дата и актуальность версии не проверяются. Origin обязателен. Refresh только в HttpOnly
      cookie user_refresh.
    security: []
    responses:
      '201':
        description: Гость создан
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AuthTokenResponse'
              - type: object
                required:
                - user_id
                - is_guest
                properties:
                  user_id:
                    type: integer
                  is_guest:
                    type: boolean
        headers:
          Set-Cookie:
            schema:
              type: string
            description: user_refresh; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/user
      '403':
        description: Недопустимый Origin
      '422':
        description: Согласие не принято или версия не существует
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - consent_version_id
            - consent_accepted
            properties:
              consent_version_id:
                type: integer
                minimum: 1
              consent_accepted:
                type: boolean
                enum:
                - true
user-demo:
  post:
    tags: [Авторизация пользователей]
    summary: Создать авторизованного демо-пользователя
    operationId: createDemoUser
    description: |
      Требуется staff access-токен администратора и доверенный Origin.
      Создаёт отдельный аккаунт с is_guest=false, записывает согласие и
      выдаёт обычную пользовательскую сессию. Refresh-токен устанавливается
      как HttpOnly cookie user_refresh.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [consent_version_id, consent_accepted]
            properties:
              consent_version_id:
                type: integer
                minimum: 1
              consent_accepted:
                type: boolean
                const: true
    responses:
      '201':
        description: Аккаунт и сессия созданы
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AuthTokenResponse'
                - type: object
                  required: [user_id, is_guest]
                  properties:
                    user_id: {type: integer}
                    is_guest: {type: boolean, const: false}
      '401':
        description: Требуется действующий staff access-токен
      '403':
        description: Недопустимый Origin или недостаточно прав
      '422':
        description: Согласие не принято или версия не существует
user-refresh:
  post:
    tags:
    - Авторизация пользователей
    summary: Ротация токенов
    description: Одноразовый refresh из cookie user_refresh; тело и CSRF-токен не
      требуются. Повтор отзывает сессию. Обязателен доверенный Origin или Referer.
    security:
    - userRefresh: []
    responses:
      '200':
        description: Новый access; refresh заменён в HttpOnly cookie
        headers:
          Set-Cookie:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenResponse'
      '401':
        description: Недействительная сессия; cookie удаляется
      '403':
        description: Недопустимый или отсутствующий Origin/Referer
user-info:
  get:
    tags:
    - Пользователь
    summary: Данные пользователя
    description: Получение данных текущего пользователя по токену
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Данные пользователя
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - is_guest
              properties:
                id:
                  type: integer
                  description: ID пользователя
                service_user:
                  type: [integer, 'null']
                  description: Номер служебного аккаунта из пула модуля. Для обычного пользователя null.
                is_guest:
                  type: boolean
                  description: true — гость, false — OAuth-пользователь, служебный или демо-аккаунт
                email:
                  type: string
                  nullable: true
                  description: Email (только для авторизованных)
                first_name:
                  type: string
                  nullable: true
                  description: Имя из OAuth или заданное пользователем через PATCH /user/info
                last_name:
                  type: string
                  nullable: true
                  description: Фамилия из OAuth или заданная пользователем через PATCH /user/info
                file:
                  anyOf:
                  - $ref: '#/components/schemas/FileResponse'
                  - type: 'null'
                  description: Загруженный файл профиля с подписанными ссылками или null.
                gender:
                  type: [integer, 'null']
                  enum: [1, 2, null]
                  description: 1 — мужской, 2 — женский; null — не указан.
                birth_date:
                  type: [string, 'null']
                  format: date
                  description: Дата рождения YYYY-MM-DD или null.
      '401':
        description: Недействительный токен
user-logout:
  post:
    tags:
    - Авторизация пользователей
    summary: Выход из текущей сессии
    description: Отзыв сессии и удаление refresh-cookie; её access сразу перестаёт
      работать. Остальные сессии сохраняются. Обязателен доверенный Origin или Referer.
    security:
    - userRefresh: []
    responses:
      '204':
        description: Сессия отозвана, cookie удалена
      '401':
        description: Недействительная сессия; cookie удаляется
      '403':
        description: Недопустимый или отсутствующий Origin/Referer
user-oauth:
  get:
    tags:
    - Авторизация пользователей
    summary: Вход через Яндекс ID / VK ID
    description: Фронтенд самостоятельно запускает OAuth и проверяет state. API принимает
      одноразовый код в параметре token, для VK также device_id, state, redirect_uri.
      Обязательны существующая версия согласия, consent_accepted=true и доверенный
      Origin/Referer. Access текущего гостя необязателен; он позволяет сохранить его
      ID при авторизации. При существующем OAuth-аккаунте выполняется вход в него
      без объединения истории. Access возвращается в JSON, refresh — в HttpOnly cookie.
      Изображение аватара провайдера скачивается в общее файловое хранилище;
      users.media_id хранит ID файла. Изображение скачивается и сохраняется только
      при отсутствии текущего файла (users.media_id IS NULL). Уже установленная фотография,
      включая загруженную пользователем, сохраняется; обращения к CDN аватара не происходит.
      Отсутствующий аватар не стирает текущий файл. Если требуется загрузка и она завершается
      ошибкой, возвращается 503 без изменения пользователя и создания сессии.
    security:
    - {}
    - bearerAuth: []
    parameters:
    - name: provider
      in: path
      required: true
      schema:
        type: string
        enum:
        - yandex
        - vk
    - name: token
      in: query
      required: true
      description: Одноразовый код авторизации от провайдера
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    - name: consent_version_id
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    - name: consent_accepted
      in: query
      required: true
      schema:
        type: boolean
        enum:
        - true
    - name: device_id
      in: query
      required: false
      description: 'Обязателен для VK: ID устройства из ответа VK ID'
      schema:
        type: string
        minLength: 1
    - name: state
      in: query
      required: false
      description: 'Обязателен для VK: state, проверенный фронтендом'
      schema:
        type: string
        minLength: 1
    - name: redirect_uri
      in: query
      required: false
      description: 'Обязателен для VK: URI фронтенда, использованный при получении
        кода; его origin должен быть в AUTH_ALLOWED_ORIGINS'
      schema:
        type: string
        minLength: 1
    responses:
      '200':
        description: Авторизация завершена
        headers:
          Set-Cookie:
            schema:
              type: string
            description: user_refresh; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/user
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AuthTokenResponse'
              - type: object
                required:
                - user_id
                - is_guest
                properties:
                  user_id:
                    type: integer
                  is_guest:
                    type: boolean
                    enum:
                    - false
      '400':
        description: Отказ провайдера, недействительный или повторный код, неправильные
          параметры VK
      '401':
        description: Связанный аккаунт заблокирован или сессия отозвана
      '409':
        description: Смена OAuth-аккаунта у авторизованного пользователя не поддерживается
      '503':
        description: Провайдер не настроен или сервис временно недоступен
      '422':
        description: Некорректные параметры, согласие не принято или версия не существует
      '403':
        description: Недопустимый Origin/Referer

user-service:
  post:
    tags: [Авторизация пользователей]
    summary: Получить служебный аккаунт с чистыми результатами
    description: |
      Доступен активному администратору со Staff JWT или активному устройству с Device JWT
      независимо от роли устройства. User JWT, включая гостя и служебного пользователя, не допускается.
      Пулы по module и users.service_user: 1 — ПрофСтарт (1–5), 2 — аватар (6–10),
      7 — Древо профессий (11–15), 8 — Интерактивная карта региона (16–20),
      9 — Профбаттл (21–25), 16 — Конструктор карьеры (26–30).
      Выбирается активный аккаунт с самой ранней датой последнего входа MAX(auth_sessions.created_at).
      Не использованные ранее идут первыми; при равенстве — по service_user.
      Выдача без блокировки/резервирования пула: вызывающая сторона должна выполнять входы последовательно.
      Сбрасываются профиль, прохождения и ответы ПрофСтарта, источники рекомендаций, согласия, генерации и аватары.
      Из PostgreSQL удаляются начатые прохождения анкет и отправленные ответы служебного аккаунта.
      Имя и фамилия служебного пользователя сбрасываются в «Анонимный» и «Пользователь».
      Удаляются только файлы прежнего использования, общие исходники шаблонов сохраняются.
      Старые auth-сессии отзываются, но сохраняются для порядка выдачи; их access и refresh недействительны.
      Поздний webhook удалённого задания получает 404 и не восстанавливает результат.
      Возвращается обычный User access JWT; refresh — только в HttpOnly cookie user_refresh.
      Срок auth-сессии — 7 дней, access — максимум 30 минут; следующий вход в этот аккаунт отзывает их.
      Согласие гостевого входа не требуется; аккаунты не являются гостями и не могут привязываться к OAuth.
      Для аватара служебный пользователь подключается к устройству через /device/auth/qr и /device/auth/confirm.
      POST/GET /users/avatar-generations по-прежнему требуют Device JWT с ролью AVATAR и X-Device-Connection-Id.
      Cache-Control — no-store. Отдельная проверка Origin для этого Bearer-защищённого входа не требуется;
      refresh/logout по cookie сохраняют обязательную проверку доверенного Origin/Referer.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [module]
            properties:
              module:
                type: integer
                enum: [1, 2, 7, 8, 9, 16]
                description: >
                  1 — ПрофСтарт, 2 — аватар, 7 — Древо профессий, 8 — Интерактивная карта региона,
                  9 — Профбаттл, 16 — Конструктор карьеры.
    responses:
      '201':
        description: Служебный аккаунт очищен, новая auth-сессия создана.
        headers:
          Set-Cookie:
            schema: {type: string}
            description: user_refresh; HttpOnly; Secure; SameSite=Lax; Path=/api/auth/user.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AuthTokenResponse'
                - type: object
                  required: [user_id, service_user]
                  properties:
                    user_id: {type: integer, format: int64}
                    service_user: {type: integer, minimum: 1, maximum: 30}
      '401': {description: Нет действительного Staff/Device JWT или передан User JWT.}
      '403': {description: Сотрудник не является администратором.}
      '422': {description: Неизвестный модуль или лишние поля.}
      '503': {description: В выбранном пуле нет активных служебных аккаунтов.}
