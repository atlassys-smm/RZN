# ═══════════════════════════════════════════════════════════════
# Аватары пользователей
# ═══════════════════════════════════════════════════════════════

user-avatars-create:
  post:
    security:
    - bearerAuth: []
    tags: [Аватары пользователей]
    summary: Сохранить аватар пользователя
    description: |
      Требуется device-токен активного устройства с ролью 2 и действующее QR-подключение
      пользователя. Передайте X-Device-Connection-Id из /device/auth/user;
      пользователь определяется по Redis-привязке, user_id не передаётся.
      Отсутствие подключения, другой идентификатор или недостаточная роль — 403.
      Терминал сохраняет сгенерированный аватар для подключённого пользователя.
    parameters:
      - $ref: '#/components/parameters/RequiredDeviceConnectionId'
      - name: profession_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            properties:
              photo:
                type: string
                contentMediaType: application/octet-stream
                title: Photo
              file_title:
                anyOf:
                - type: string
                - type: 'null'
                title: File Title
              file_description:
                anyOf:
                - type: string
                - type: 'null'
                title: File Description
            type: object
            required:
            - photo
            title: Body_create_user_avatar_api_users_avatars_post
    responses:
      '422':
        description: Некорректные поля формы или отсутствующий X-Device-Connection-Id.
      '403':
        description: Недостаточная роль устройства или пользователь не подключён к этому устройству.
      '401':
        description: Отсутствующий или недействительный токен.
      '201':
        description: Аватар сохранён
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAvatar'

user-avatars-list:
  get:
    security:
    - bearerAuth: []
    tags: [Аватары пользователей]
    summary: Список моих аватаров
    description: |
      Получить свои аватары, включая результаты FaceAI, от новых к старым.
      Пользователь определяется по user access-токену. Необязательный profession_id
      фильтрует список по профессии. total учитывает владельца и фильтр до пагинации.
      Без совпадений возвращаются items — пустой массив и total — 0.
    parameters:
      - name: profession_id
        in: query
        required: false
        description: Профессия аватара; без параметра возвращаются все свои аватары.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '401':
        description: Недействительный или отсутствующий user access-токен
      '200':
        description: Список аватаров
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/UserAvatar'
                total:
                  type: integer

user-avatars-detail:
  get:
    security:
    - bearerAuth: []
    tags: [Аватары пользователей]
    summary: Детали моего аватара
    description: Проверка владельца по user access-токену; чужой аватар возвращает 404.
    parameters:
      - name: avatar_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Недействительный или отсутствующий user access-токен
      '200':
        description: Аватар
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAvatar'
      '404':
        description: Не найден
  delete:
    security:
    - bearerAuth: []
    tags: [Аватары пользователей]
    summary: Удалить мой аватар
    description: |
      Удалить собственный аватар по его числовому id из списка или avatar_id
      результата генерации. Требуется user access-токен; чужой аватар — 404.
      Удаляются аватар и итоговый файл, исходники генерации сохраняются.
      Повторный webhook завершённого задания не восстанавливает удалённый аватар.
    parameters:
      - name: avatar_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '401':
        description: Недействительный или отсутствующий user access-токен
      '204':
        description: Аватар удалён
      '404':
        description: Не найден

user-avatars-qr:
  get:
    tags: [Аватары пользователей]
    summary: Аватар по QR-токену
    description: Публичный доступ по QR-коду
    parameters:
      - name: qr_token
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Аватар
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAvatar'
      '404':
        description: Не найден
