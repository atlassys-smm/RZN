cms-devices:
  post:
    tags: [Устройства]
    summary: Зарегистрировать устройство
    description: |
      Требуется staff access-токен оператора.
      Зарегистрировать новое устройство и выпустить для него device-токен (JWT, привязан к `device_id`).
      Токен возвращается только один раз, в ответе на регистрацию — сохраните его в конфигурации плеера.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, roles]
            properties:
              name:
                type: string
              location:
                type: string
                nullable: true
              roles:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  $ref: '#/components/schemas/DeviceRole'
    responses:
      '422':
        description: Нужен непустой список известных неповторяющихся ролей.
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '201':
        description: Устройство зарегистрировано
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceWithToken'
  get:
    tags: [Устройства]
    summary: Список устройств
    description: Требуется staff access-токен оператора. Получить список зарегистрированных устройств
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Список устройств
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Device'

cms-devices-detail:
  get:
    tags: [Устройства]
    summary: Получить устройство
    description: Требуется staff access-токен оператора.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Устройство
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
      '404':
        description: Устройство не найдено
  delete:
    tags: [Устройства]
    summary: Отозвать устройство
    description: Требуется staff access-токен оператора. Отзывает device-токен устройства (`is_active = false`). Существующий токен перестаёт приниматься сервером.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '204':
        description: Устройство отозвано
      '404':
        description: Устройство не найдено

cms-device-refresh-token:
  post:
    tags: [Устройства]
    summary: Обновить JWT устройства
    description: Требуется staff access-токен оператора. Выпустить новый device JWT по идентификатору активного устройства.
    parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Новый токен устройства
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenResponse'
      '404':
        description: Устройство не найдено
      '409':
        description: Устройство неактивно

references:
  get:
    tags: [Справочники]
    summary: Справочники
    description: Получить список справочников CMS
    responses:
      '200':
        description: Список справочников

quiz-questions:
  get:
    tags: [Справочники]
    summary: Вопросы викторины
    description: Получить список вопросов викторины (CMS)
    responses:
      '200':
        description: Список вопросов
  post:
    tags: [Справочники]
    summary: Создать вопрос
    description: Добавить новый вопрос викторины
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
    responses:
      '201':
        description: Вопрос создан

surveys:
  get:
    tags: [Обратная связь - CMS]
    summary: Список анкет
    description: Требуется staff access-токен редактора контента или аналитика. Получить список анкет обратной связи с пагинацией
    parameters:
      - name: is_active
        in: query
        schema:
          type: boolean
        description: Фильтр по статусу активности
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Список анкет
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CmsSurvey'
                total:
                  type: integer
  post:
    tags: [Обратная связь - CMS]
    summary: Создать анкету
    description: Требуется staff access-токен редактора контента. Создать новую анкету (черновик)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CmsSurveyCreateRequest'
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '201':
        description: Анкета создана
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CmsSurvey'

surveys-detail:
  get:
    tags: [Обратная связь - CMS]
    summary: Детали анкеты
    description: Требуется staff access-токен редактора контента или аналитика. Получить анкету с вопросами
    parameters:
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Анкета с вопросами
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CmsSurvey'
      '404':
        description: Анкета не найдена
  put:
    tags: [Обратная связь - CMS]
    summary: Обновить анкету
    description: Требуется staff access-токен редактора контента. Обновить название и описание анкеты. Нельзя редактировать активную анкету.
    parameters:
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CmsSurveyUpdateRequest'
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Анкета обновлена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CmsSurvey'
      '404':
        description: Анкета не найдена
      '422':
        description: Нельзя редактировать активную анкету
  delete:
    tags: [Обратная связь - CMS]
    summary: Удалить анкету
    description: Требуется staff access-токен редактора контента. Удалить анкету-черновик. Нельзя удалить активную анкету или анкету с ответами.
    parameters:
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '204':
        description: Анкета удалена
      '404':
        description: Анкета не найдена
      '409':
        description: Нельзя удалить — есть связанные ответы
      '422':
        description: Нельзя удалить активную анкету

surveys-copy:
  post:
    tags: [Обратная связь - CMS]
    summary: Создать новую версию анкеты
    description: Требуется staff access-токен редактора контента. Скопировать анкету и все её вопросы в новый черновик с тем же type
    parameters:
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '201':
        description: Новая версия создана
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CmsSurvey'
      '404':
        description: Анкета не найдена

surveys-publish:
  post:
    tags: [Обратная связь - CMS]
    summary: Опубликовать анкету
    description: Требуется staff access-токен редактора контента. Активировать анкету. Предыдущая активная анкета с тем же type автоматически деактивируется.
    parameters:
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Анкета опубликована
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CmsSurvey'
      '404':
        description: Анкета не найдена
      '422':
        description: Анкета уже активна

surveys-questions-create:
  post:
    tags:
    - Обратная связь - CMS
    summary: Добавить вопрос
    description: Требуется staff access-токен редактора контента. Добавить вопрос в анкету-черновик
    parameters:
    - name: survey_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        multipart/form-data:
          schema:
            additionalProperties: false
            properties:
              type:
                enum:
                - 1
                - 2
                - 3
                - 4
                - 5
                title: SurveyQuestionType
                type: integer
              text:
                title: Text
                type: string
              order:
                title: Order
                type: integer
              required:
                default: false
                title: Required
                type: boolean
              parent_id:
                anyOf:
                - type: integer
                - type: 'null'
                title: Parent Id
              file_title:
                anyOf:
                - type: string
                - type: 'null'
                title: File Title
              file_description:
                anyOf:
                - type: string
                - type: 'null'
                title: File Description
              condition:
                type:
                - string
                - 'null'
                title: Condition
                description: JSON в отдельном текстовом поле формы.
                contentMediaType: application/json
                contentSchema:
                  anyOf:
                  - additionalProperties: true
                    type: object
                  - type: 'null'
                  title: Condition
              scale_min:
                anyOf:
                - type: integer
                - type: 'null'
                title: Scale Min
              scale_max:
                anyOf:
                - type: integer
                - type: 'null'
                title: Scale Max
              answer_options:
                type:
                - string
                - 'null'
                title: Answer Options
                description: JSON-массив вариантов ответа в одном текстовом поле формы. text и order обязательны;
                  profession_id обязателен только для PROFESSION_CHOICE. При создании id не передаётся. Вопрос и
                  варианты сохраняются одной транзакцией. В ответе варианты находятся в options.
                contentMediaType: application/json
                contentSchema:
                  items:
                    additionalProperties: false
                    properties:
                      text:
                        minLength: 1
                        title: Text
                        type: string
                      order:
                        minimum: 1
                        title: Order
                        type: integer
                      profession_id:
                        anyOf:
                        - exclusiveMinimum: 0
                          type: integer
                        - type: 'null'
                        title: Profession Id
                    required:
                    - text
                    - order
                    title: SurveyAnswerOptionRequest
                    type: object
                  title: Answer Options
                  type: array
                example: '[{"text":"Да","order":1},{"text":"Нет","order":2}]'
              file:
                type: string
                format: binary
              file_preview:
                type: string
                format: binary
                description: Превью файла; без него для видео создаётся первый кадр.
            required:
            - type
            - text
            - order
            title: SurveyQuestionCreateRequest
            type: object
          encoding:
            condition:
              contentType: text/plain
            answer_options:
              contentType: text/plain
      required: true
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '201':
        description: Вопрос добавлен
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CmsSurveyQuestion'
      '404':
        description: Анкета не найдена
      '422':
        description: Нельзя редактировать активную анкету

surveys-questions-update:
  put:
    tags:
    - Обратная связь - CMS
    summary: Обновить вопрос
    description: Требуется staff access-токен редактора контента. Обновить вопрос анкеты-черновика
    parameters:
    - name: survey_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: question_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      content:
        multipart/form-data:
          schema:
            additionalProperties: false
            properties:
              text:
                anyOf:
                - type: string
                - type: 'null'
                title: Text
              required:
                anyOf:
                - type: boolean
                - type: 'null'
                title: Required
              condition:
                type:
                - string
                - 'null'
                title: Condition
                description: JSON в отдельном текстовом поле формы.
                contentMediaType: application/json
                contentSchema:
                  anyOf:
                  - additionalProperties: true
                    type: object
                  - type: 'null'
                  title: Condition
              scale_min:
                anyOf:
                - type: integer
                - type: 'null'
                title: Scale Min
              scale_max:
                anyOf:
                - type: integer
                - type: 'null'
                title: Scale Max
              file_title:
                anyOf:
                - type: string
                - type: 'null'
                title: File Title
              file_description:
                anyOf:
                - type: string
                - type: 'null'
                title: File Description
              answer_options:
                type:
                - string
                - 'null'
                title: Answer Options
                description: 'JSON-массив вариантов ответа в одном текстовом поле формы. text и order обязательны;
                  profession_id обязателен только для PROFESSION_CHOICE. Переданный список полностью заменяет состав
                  вариантов: id обновляет существующий, без id создаётся новый, пропущенные ID удаляются. Без поля
                  список не меняется; [] очищает его. Вопрос и варианты сохраняются одной транзакцией. В ответе
                  варианты находятся в options.'
                contentMediaType: application/json
                contentSchema:
                  items:
                    additionalProperties: false
                    properties:
                      text:
                        minLength: 1
                        title: Text
                        type: string
                      order:
                        minimum: 1
                        title: Order
                        type: integer
                      profession_id:
                        anyOf:
                        - exclusiveMinimum: 0
                          type: integer
                        - type: 'null'
                        title: Profession Id
                      id:
                        anyOf:
                        - exclusiveMinimum: 0
                          type: integer
                        - type: 'null'
                        title: Id
                    required:
                    - text
                    - order
                    title: SurveyAnswerOptionUpdateItem
                    type: object
                  title: Answer Options
                  type: array
                example: '[{"id":101,"text":"Да","order":1},{"text":"Новый вариант","order":2}]'
              file:
                type: string
                format: binary
              file_preview:
                type: string
                format: binary
                description: Превью файла; без него для видео создаётся первый кадр.
            title: SurveyQuestionUpdateRequest
            type: object
          encoding:
            condition:
              contentType: text/plain
            answer_options:
              contentType: text/plain
      required: false
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Вопрос обновлён
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CmsSurveyQuestion'
      '404':
        description: Вопрос не найден
      '422':
        description: Нельзя редактировать вопросы активной анкеты

surveys-questions-delete:
  delete:
    tags: [Обратная связь - CMS]
    summary: Удалить вопрос
    description: Требуется staff access-токен редактора контента. Удалить вопрос из анкеты-черновика
    parameters:
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: question_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '204':
        description: Вопрос удалён
      '404':
        description: Вопрос не найден
      '422':
        description: Нельзя редактировать вопросы активной анкеты

surveys-questions-reorder:
  put:
    tags: [Обратная связь - CMS]
    summary: Изменить порядок вопросов
    description: Требуется staff access-токен редактора контента. Переупорядочить вопросы анкеты
    parameters:
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [question_ids]
            properties:
              question_ids:
                type: array
                items:
                  type: integer
                  format: int64
                description: ID вопросов в новом порядке
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Порядок обновлён
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CmsSurveyQuestion'
      '404':
        description: Анкета не найдена
      '422':
        description: question_ids не совпадают с существующими вопросами

responses:
  get:
    tags: [Обратная связь - CMS]
    summary: Список ответов
    description: Требуется staff access-токен аналитика. Получить список ответов пользователей на анкеты с фильтрами
    parameters:
      - name: survey_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по ID анкеты
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/SurveyType'
        description: Фильтр по type анкеты
      - name: is_active
        in: query
        schema:
          type: boolean
        description: Фильтр по статусу активности анкеты
      - name: user_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по ID пользователя
      - name: completed_from
        in: query
        schema:
          type: string
          format: date-time
        description: Фильтр по дате начала (completed_at >=)
      - name: completed_to
        in: query
        schema:
          type: string
          format: date-time
        description: Фильтр по дате окончания (completed_at <=)
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '403':
        description: Недостаточно прав
      '401':
        description: Недействительный или отсутствующий токен
      '200':
        description: Список ответов
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CmsSurveyResponse'
                total:
                  type: integer


cms-device-roles:
  put:
    tags: [Устройства]
    summary: Заменить роли устройства
    description: 'Требуется staff access-токен admin/operator. Полностью заменяет список ролей устройства; нужен хотя бы один элемент, дубли и неизвестные роли запрещены. Изменение действует сразу для существующего device-токена; активность устройства не меняется.'
    security:
    - bearerAuth: []
    parameters:
    - name: device_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceRolesRequest'
    responses:
      '200':
        description: Устройство с новым списком ролей
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
      '401':
        description: Недействительный или отсутствующий токен
      '403':
        description: Недостаточно прав
      '404':
        description: Устройство не найдено
      '422':
        description: Нужен непустой список известных неповторяющихся ролей
