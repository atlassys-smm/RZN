screensavers:
  get:
    tags:
    - Заставки LED - CMS
    summary: Список заставок LED
    description: Требуется staff access-токен admin/content_editor/operator или Device
      JWT любого активного устройства. Роль устройства не проверяется, включая устройства
      без ролей. В ответе объект file с подписанными ссылками на 24 часа; media_id
      остаётся внутренним полем БД. Сортировка по ID по убыванию.
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Список заставок LED
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedScreensaverList'
      '401':
        description: Отсутствующий или недействительный токен, неактивное или неизвестное
          устройство; User JWT не допускается
      '403':
        description: Недостаточно прав
      '422':
        description: Неверные поля формы или параметры
    parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  post:
    tags:
    - Заставки LED - CMS
    summary: Создать заставку LED
    description: Требуется staff access-токен admin/content_editor. Поля передаются
      отдельными частями multipart/form-data; media_id не принимается. Файл и сущность
      сохраняются одной транзакцией. Превью — JPEG, PNG, WebP или GIF; для видео без
      превью создаётся первый кадр. Общий файловый механизм может вернуть 413 (превышен
      размер), 422 (неверное превью или видео) или 503 (генератор превью недоступен).
      Обязательны name и file.
    security:
    - bearerAuth: []
    responses:
      '201':
        description: Создать заставку LED
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedScreensaver'
      '401':
        description: Отсутствующий или недействительный staff access-токен
      '403':
        description: Недостаточно прав
      '422':
        description: Неверные поля формы или параметры
      '413':
        description: Файл или превью превышает допустимый размер
      '503':
        description: Генератор превью недоступен
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 255
              file:
                type: string
                format: binary
              file_preview:
                type: string
                format: binary
              file_title:
                type:
                - string
                - 'null'
              file_description:
                type:
                - string
                - 'null'
            required:
            - name
            - file
screensaver-detail:
  get:
    tags:
    - Заставки LED - CMS
    summary: Получить заставку LED
    description: Требуется staff access-токен admin/content_editor/operator или Device
      JWT любого активного устройства. Роль устройства не проверяется, включая устройства
      без ролей. В ответе объект file с подписанными ссылками на 24 часа; media_id
      остаётся внутренним полем БД.
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Получить заставку LED
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedScreensaver'
      '401':
        description: Отсутствующий или недействительный токен, неактивное или неизвестное
          устройство; User JWT не допускается
      '403':
        description: Недостаточно прав
      '422':
        description: Неверные поля формы или параметры
      '404':
        description: Заставка не найдена
    parameters:
    - name: screensaver_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  put:
    tags:
    - Заставки LED - CMS
    summary: Обновить заставку LED
    description: Требуется staff access-токен admin/content_editor. Поля передаются
      отдельными частями multipart/form-data; media_id не принимается. Файл и сущность
      сохраняются одной транзакцией. Превью — JPEG, PNG, WebP или GIF; для видео без
      превью создаётся первый кадр. Общий файловый механизм может вернуть 413 (превышен
      размер), 422 (неверное превью или видео) или 503 (генератор превью недоступен).
      Без нового file прежнее вложение и метаданные сохраняются; file_preview без
      file — 422. Старый файл сохраняется.
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Обновить заставку LED
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedScreensaver'
      '401':
        description: Отсутствующий или недействительный staff access-токен
      '403':
        description: Недостаточно прав
      '422':
        description: Неверные поля формы или параметры
      '404':
        description: Заставка не найдена
      '413':
        description: Файл или превью превышает допустимый размер
      '503':
        description: Генератор превью недоступен
    parameters:
    - name: screensaver_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    requestBody:
      required: false
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 255
              file:
                type: string
                format: binary
              file_preview:
                type: string
                format: binary
              file_title:
                type:
                - string
                - 'null'
              file_description:
                type:
                - string
                - 'null'
  delete:
    tags:
    - Заставки LED - CMS
    summary: Удалить заставку LED
    description: Требуется staff access-токен admin/content_editor. Удаляется только
      заставка; файл сохраняется.
    security:
    - bearerAuth: []
    responses:
      '204':
        description: Удалить заставку LED
      '401':
        description: Отсутствующий или недействительный staff access-токен
      '403':
        description: Недостаточно прав
      '422':
        description: Неверные поля формы или параметры
      '404':
        description: Заставка не найдена
    parameters:
    - name: screensaver_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
