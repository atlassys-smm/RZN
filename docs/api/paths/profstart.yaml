        description: Устройство не имеет роли ПрофСтарт (3).
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartGroup'
      '404':
        description: Тип теста не найден или группа не принадлежит указанному типу.
      '422':
        description: Некорректные параметры пути или пагинации.
