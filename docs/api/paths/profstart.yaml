    description: 'Сохранённый общий профиль в совместимом формате ПрофСтарта: максимум три профессии, источники и текущие веса. Обновляется после завершения нового типа и изменения весов CMS. Каждый тип завершается один раз. Без результатов — пустые results и professions, is_complete=false. Основной общий маршрут — /users/me/recommendations.'
