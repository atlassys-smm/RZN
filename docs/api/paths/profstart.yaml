  post:
    tags:
    - ПрофСтарт - Пользователь
    summary: Сохранить ответ и рассчитать результат после последнего вопроса
    operationId: profstart_answer_post
    description: >-
      Только следующий неотвеченный вопрос. Последний ответ атомарно сохраняет ответ,
      результат, показатели групп и рекомендации и переводит сессию в completed (status=2).
      Подтверждение содержит status: 1 — in_progress, 2 — completed, 3 — abandoned.
      Результат в подтверждение не включается; для чтения используется GET /profstart/sessions/{id}/result.
      Число вопросов: solomin 42, holland 15, dellinger 1. Расчёт поддерживает только эти типы.
      Ошибка проверки банка или расчёта откатывает последний ответ и результат.
      Повтор того же варианта возвращает сохранённый ответ и текущий прогресс
      без повторного расчёта, включая конкурентные повторы. Результат завершённой сессии сохраняется.
      Изменение принятого варианта, новая запись в закрытую сессию или нарушение порядка — 409;
      чужой вариант — 422. next_question_id=null у закрытой сессии.
      Принятые time_spent_ms и answered_at не изменяются повтором.
      Архивирование теста не препятствует завершению начатой сессии.
    x-implementation-status: implemented
    parameters:
    - name: id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
