cms-validate:
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Проверить готовность публикации
    operationId: profstart_cms_validate_post
    description: 'Проверка не меняет статус. Ошибки
      банка возвращаются с valid=false и errors в ответе 200. Для solomin ровно 42 вопроса: по 3 на группу
      в каждом блоке want/can; общий максимум группы 18. scale_maxima содержит по одной записи на группу
      без axis. Для holland ровно 15, максимум 15; dellinger 1 вопрос. Для новых
      типов только общая целостность, scale_maxima=[]; алгоритм итогового расчёта не добавляется.'
    x-implementation-status: implemented
    security: []
    parameters:
    - name: test_id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartValidation'
      '404':
        description: Ресурс не найден или недоступен владельцу. Ошибка FastAPI с полем detail.
      '409':
        description: Конфликт состояния или уникальности. Ошибка FastAPI с полем detail.
      '422':
        description: Некорректные параметры, ссылки или состав теста. Ошибка FastAPI с полем detail.
cms-publish:
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Опубликовать и активировать тест
    operationId: profstart_cms_publish_post
    description: После проверки draft → active, published_at
      заполняется. Предыдущий active того же типа атомарно становится archived. Не более одного active на тип, включая
      конкурентную активацию; частичный UNIQUE(test_type_id) WHERE status=2. Неполный банк — 422. Повтор active
      возвращает ту же запись; archived — 409, для новой публикации используется /copy. Новые типы могут активироваться
      в CMS, но пользовательское прохождение и итоговый расчёт пока доступны только solomin/holland/dellinger. Начатые
      сессии прежней версии продолжаются.
    x-implementation-status: implemented
    security: []
    parameters:
    - name: test_id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTest'
      '404':
        description: Ресурс не найден или недоступен владельцу. Ошибка FastAPI с полем detail.
      '409':
        description: Конфликт состояния или уникальности. Ошибка FastAPI с полем detail.
      '422':
        description: Некорректные параметры, ссылки или состав теста. Ошибка FastAPI с полем detail.
