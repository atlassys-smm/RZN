group:
  get:
    description: 'Требуется пользовательский access-токен (включая гостя) или Device JWT активного устройства с ролью 3. QR-привязка
      и X-Device-Connection-Id не требуются: группы являются общим справочником. Доступны группы всех типов независимо от
      статуса версии теста; возвращаются актуальные данные CMS. Проверяется принадлежность group_id указанному test_code_type.'
    tags:
    - ПрофСтарт - Пользователь
    summary: Карточка группы результата
    operationId: profstart_group_get
    x-implementation-status: implemented
    security:
    - bearerAuth: []
    parameters:
    - name: test_code_type
      in: path
      required: true
      description: Код типа теста, например solomin, holland или dellinger
      schema:
        type: string
    - name: group_id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
