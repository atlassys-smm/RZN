      in: path
      required: true
      description: Код типа теста, например solomin, holland или dellinger
      schema:
        type: string
    responses:
      '201':
        description: Ресурс создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartGroup'
