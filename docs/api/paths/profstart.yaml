cms-publish:
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Опубликовать и активировать тест
    operationId: profstart_cms_publish_post
    description: Проектируемый контракт; backend ещё не реализован. После проверки draft → active, published_at
      заполняется. Предыдущий active того же типа атомарно становится archived. Не более одного active на тип, включая
      конкурентную активацию; частичный UNIQUE(test_type_id) WHERE status=active. Неполный банк — 422. Повтор active
      возвращает ту же запись; archived — 409, для новой публикации используется /copy. Новые типы могут активироваться
      в CMS, но пользовательское прохождение и итоговый расчёт пока доступны только solomin/holland/dellinger. Начатые
      сессии прежней версии продолжаются.
    x-implementation-status: planned
    parameters:
    - name: test_id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTest'
      '401':
        $ref: '#/components/responses/ProfStartError401'
      '403':
        $ref: '#/components/responses/ProfStartError403'
      '404':
        $ref: '#/components/responses/ProfStartError404'
      '409':
        $ref: '#/components/responses/ProfStartError409'
      '422':
        $ref: '#/components/responses/ProfStartError422'
