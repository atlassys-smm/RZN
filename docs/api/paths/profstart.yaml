      с valid=false и errors в ответе 200. Для solomin ровно 42 вопроса: по 3 на группу на каждой из want/can, максимум
      9; для holland ровно 15, максимум 15; dellinger 1 вопрос. Для новых типов только общая целостность, scale_maxima=[];
      алгоритм итогового расчёта не добавляется.'
    x-implementation-status: planned
    parameters:
    - name: test_id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
        minimum: 1
