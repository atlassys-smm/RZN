      '404':
        description: Ресурс не найден или недоступен владельцу. Ошибка FastAPI с полем detail.
      '409':
        description: Конфликт состояния или уникальности. Ошибка FastAPI с полем detail.
      '422':
        description: Некорректные параметры, ссылки или состав теста. Ошибка FastAPI с полем detail.
    requestBody:
      required: true
      content:
