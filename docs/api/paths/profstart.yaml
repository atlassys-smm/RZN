cms-recommendation-weights:
  put:
    tags:
    - ПрофСтарт - CMS
    summary: Настроить влияние тестов на общий подбор
    operationId: profstart_cms_recommendation_weights_put
    x-implementation-status: implemented
    security: []
    description: 'Сумма процентов должна равняться 100; иначе 422. Вес 0 исключает тип из подбора. По умолчанию:
        solomin=40, holland=40, dellinger=20. Изменение влияет на общий подбор, сохраняя результаты отдельных
        тестов.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfStartRecommendationWeightsUpdate'
    responses:
      '200':
        description: Обновлённые три типа тестов; порядок solomin, holland, dellinger
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProfStartTestType'
              minItems: 3
              maxItems: 3
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
