# Контракт ПрофСтарт: CMS и пользовательское прохождение.
cms-age-groups:
  get:
    tags:
    - ПрофСтарт - CMS
    summary: Справочник возрастных групп
    operationId: profstart_cms_age_groups_get
    description: Возрастные границы включительно; порядок id ASC.
    x-implementation-status: implemented
    security: []
    responses:
      '200':
        description: Возрастные группы
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProfStartAgeGroup'
age-groups:
  get:
    tags:
    - ПрофСтарт - Пользователь
    summary: Справочник возрастных групп
    operationId: profstart_age_groups_get
    description: Группы для выбора возраста и фильтра каталога. Границы включительно; порядок id ASC.
    x-implementation-status: implemented
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Возрастные группы
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProfStartAgeGroup'
      '401':
        description: Требуется авторизация.
cms-types:
  get:
    tags:
    - ПрофСтарт - CMS
    summary: Каталог типов тестов
    operationId: profstart_cms_types_get
    description: Все типы, включая дополнительные; порядок id ASC. Прохождение доступно только для solomin, holland
        и dellinger.
    x-implementation-status: implemented
    security: []
    parameters: []
    responses:
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProfStartTestType'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Создать тип теста
    operationId: profstart_cms_types_post
    description: 'Код должен быть уникальным: дубликат — 409. Дополнительные типы имеют вес 0 и недоступны для пользовательского
        прохождения.'
    x-implementation-status: implemented
    security: []
    parameters: []
    responses:
      '201':
        description: Ресурс создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTestType'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfStartTestTypeCreate'
cms-tests:
  get:
    tags:
    - ПрофСтарт - CMS
    summary: Версии тестов
    operationId: profstart_cms_tests_get
    description: Порядок created_at DESC, id DESC.
    x-implementation-status: implemented
    security: []
    parameters:
    - name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: offset
      in: query
      required: false
      description: Смещение
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: test_type_id
      in: query
      required: false
      description: Фильтр типа
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: status
      in: query
      required: false
      description: 1 — draft, 2 — active, 3 — archived
      schema:
        type: integer
        format: int32
        enum: [1, 2, 3]
    responses:
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTestPage'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Создать черновик версии
    operationId: profstart_cms_tests_post
    description: Создаёт draft (status=1). Номер версии назначается автоматически.
    x-implementation-status: implemented
    security: []
    parameters: []
    responses:
      '201':
        description: Ресурс создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTest'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfStartTestCreate'
cms-test:
  get:
    tags:
    - ПрофСтарт - CMS
    summary: Карточка версии
    operationId: profstart_cms_test_get
    x-implementation-status: implemented
    security: []
    parameters:
    - name: test_id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTest'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
  patch:
    tags:
    - ПрофСтарт - CMS
    summary: Изменить черновик
    operationId: profstart_cms_test_patch
    description: Только draft; active/archived — 409. Для смены статуса используйте /publish или /archive.
    x-implementation-status: implemented
    security: []
    parameters:
    - name: test_id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTest'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfStartTestPatch'
  delete:
    tags:
    - ПрофСтарт - CMS
    summary: Удалить черновик
    operationId: profstart_cms_test_delete
    description: Только draft без сессий; иначе 409. Вопросы и варианты удаляются вместе с версией. Группы типа и
        связи профессий сохраняются.
    x-implementation-status: implemented
    security: []
    parameters:
    - name: test_id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '204':
        description: Удалено
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
cms-copy:
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Копировать в новую версию
    operationId: profstart_cms_copy_post
    description: Создаёт draft из любой версии. Вопросы и варианты получают новые ID; группы и связи профессий остаются
        общими для типа.
    x-implementation-status: implemented
    security: []
    parameters:
    - name: test_id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '201':
        description: Ресурс создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTest'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
cms-validate:
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Проверить готовность публикации
    operationId: profstart_cms_validate_post
    description: Не меняет статус. Ошибки публикации возвращаются в ответе 200 с valid=false и errors. Для дополнительных
        типов scale_maxima=[].
    x-implementation-status: implemented
    security: []
    parameters:
    - name: test_id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartValidation'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
cms-publish:
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Опубликовать и активировать тест
    operationId: profstart_cms_publish_post
    description: Публикует draft и архивирует предыдущую активную версию типа. Ошибки проверки — 422. Повтор для
        active возвращает ту же запись; archived — 409 (используйте /copy). Начатые сессии продолжаются
        на прежней версии. Дополнительные типы можно публиковать в CMS, но проходить нельзя.
    x-implementation-status: implemented
    security: []
    parameters:
    - name: test_id
      in: path
      required: true
      description: Числовой идентификатор ресурса
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTest'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
