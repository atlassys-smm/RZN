      422. 0 выключает влияние типа. Стандарт: solomin=40, holland=40, dellinger=20.
      Конкурентные изменения весов, создание/удаление типов согласованы общей блокировкой конфигурации;
      частичное сохранение запрещено. При конкурентных PUT сохраняется один полный набор, смешение значений
      запрещено. Изменение доступно и при активных тестах; сохранённые результаты не меняются. Фиксированный
      маршрут регистрируется перед /test-types/{test_type_id}.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfStartRecommendationWeightsUpdate'
    responses:
      '200':
        description: Обновлённые три типа тестов; порядок solomin, holland, dellinger
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProfStartTestType'
              minItems: 3
              maxItems: 3
      '404':
        description: Ресурс не найден или недоступен владельцу. Ошибка FastAPI с полем detail.
      '409':
        description: Конфликт состояния или уникальности. Ошибка FastAPI с полем detail.
      '422':
        description: Некорректные параметры, ссылки или состав теста. Ошибка FastAPI с полем detail.
me-recommendations:
  get:
    tags:
    - ПрофСтарт - Пользователь
    summary: Общий подбор профессий по результатам тестов
    operationId: profstart_me_recommendations_get
    x-implementation-status: implemented
    description: 'Владелец определяется контекстом,
      включая гостя; user_id и веса клиента не принимаются. Берётся последний завершённый результат каждого
      поддерживаемого типа с положительным весом: created_at DESC, id DESC, включая архивные версии. Кандидаты
      — объединение сохранённых рекомендаций этих результатов; отсутствие профессии в одном из выбранных
      результатов даёт test_score=0. score=round_half_up(sum(test_score*recommendation_weight_percent)/available_weight_percent,2).
      При неполном наборе веса имеющихся результатов нормируются, is_complete=false и missing_test_types
      перечисляет недостающие типы. При отсутствии результатов: 200, results=[], professions=[], available_weight_percent=0,
      is_complete=false; деления на ноль нет. Веса и результаты читаются из одного согласованного снимка;
      новый результат не сохраняется. При изменении весов выдача пересчитывается по текущей настройке.
      Без пагинации и лимита; score DESC, profession_id ASC, только положительный округлённый score.'
    responses:
      '200':
        description: Общий рейтинг и использованные результаты/веса
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartCombinedRecommendations'
      '401':
        description: Требуется действительный пользовательский контекст. Ошибка FastAPI с полем detail.
      '404':
        description: Ресурс не найден или недоступен владельцу. Ошибка FastAPI с полем detail.
      '409':
        description: Конфликт состояния или уникальности. Ошибка FastAPI с полем detail.
      '422':
        description: Некорректные параметры, ссылки или состав теста. Ошибка FastAPI с полем detail.
