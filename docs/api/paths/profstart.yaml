# Контракт ПрофСтарт: CMS и пользовательское прохождение.
cms-types:
  get:
    tags:
    - ПрофСтарт - CMS
    summary: Каталог типов тестов
    operationId: profstart_cms_types_get
    description: Все типы, включая созданные CMS; порядок
      id ASC. Наличие типа не означает поддержку итогового расчёта.
    x-implementation-status: implemented
    security: []
    parameters: []
    responses:
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProfStartTestType'
      '404':
        description: Ресурс не найден или недоступен владельцу. Ошибка FastAPI с полем detail.
      '409':
        description: Конфликт состояния или уникальности. Ошибка FastAPI с полем detail.
      '422':
        description: Некорректные параметры, ссылки или состав теста. Ошибка FastAPI с полем detail.
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Создать тип теста
    operationId: profstart_cms_types_post
    description: 'Создать новый тип с уникальным неизменяемым
      code. Дубликат — 409. Алгоритмы результатов доступны только для solomin, holland, dellinger; создание
      типа не добавляет алгоритм. recommendation_weight_percent по умолчанию 0. Неподдерживаемый тип не
      может получить положительный вес: 422. Сумма весов поддерживаемых типов должна
      оставаться 100: иначе 422.'
    x-implementation-status: implemented
    security: []
    parameters: []
    responses:
      '201':
        description: Ресурс создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTestType'
      '404':
        description: Ресурс не найден или недоступен владельцу. Ошибка FastAPI с полем detail.
      '409':
        description: Конфликт состояния или уникальности. Ошибка FastAPI с полем detail.
      '422':
        description: Некорректные параметры, ссылки или состав теста. Ошибка FastAPI с полем detail.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfStartTestTypeCreate'
cms-tests:
  get:
    tags:
    - ПрофСтарт - CMS
    summary: Версии тестов
    operationId: profstart_cms_tests_get
    description: Фильтры test_type_id и status=1/2/3 (draft/active/archived);
      порядок created_at DESC, id DESC. Каталог типов расширяем.
    x-implementation-status: implemented
    security: []
    parameters:
    - name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: offset
      in: query
      required: false
      description: Смещение
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: test_type_id
      in: query
      required: false
      description: Фильтр типа
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: status
      in: query
      required: false
      description: 1 — draft, 2 — active, 3 — archived
      schema:
        type: integer
        format: int32
        enum: [1, 2, 3]
    responses:
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTestPage'
      '404':
        description: Ресурс не найден или недоступен владельцу. Ошибка FastAPI с полем detail.
      '409':
        description: Конфликт состояния или уникальности. Ошибка FastAPI с полем detail.
      '422':
        description: Некорректные параметры, ссылки или состав теста. Ошибка FastAPI с полем detail.
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Создать черновик версии
    operationId: profstart_cms_tests_post
    description: Любой существующий test_type_id; сервер назначает
      номер версии, status=1 (draft) и published_at=null. Только тест имеет черновик.
    x-implementation-status: implemented
    security: []
    parameters: []
    responses:
      '201':
        description: Ресурс создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTest'
      '404':
        description: Ресурс не найден или недоступен владельцу. Ошибка FastAPI с полем detail.
      '409':
        description: Конфликт состояния или уникальности. Ошибка FastAPI с полем detail.
      '422':
        description: Некорректные параметры, ссылки или состав теста. Ошибка FastAPI с полем detail.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfStartTestCreate'
