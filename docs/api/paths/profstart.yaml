# Контракт ПрофСтарт: CMS и пользовательское прохождение.
cms-age-groups:
  get:
    tags:
    - ПрофСтарт - CMS
    summary: Справочник возрастных групп
    operationId: profstart_cms_age_groups_get
    description: "Требуется staff access-токен: admin/content_editor/operator. Возрастные границы включительно; порядок id ASC."
    x-implementation-status: implemented
    security:
    - bearerAuth: []
    responses:
      '401':
        description: Отсутствующий или недействительный staff-токен.
      '403':
        description: Недостаточно прав.
      '200':
        description: Возрастные группы
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProfStartAgeGroup'
age-groups:
  get:
    tags:
    - ПрофСтарт - Пользователь
    summary: Справочник возрастных групп
    operationId: profstart_age_groups_get
    description: "Требуется пользовательский access-токен или токен активного устройства. Группы для выбора возраста и фильтра каталога. Границы включительно; порядок id ASC. Для device-токена требуется роль 3; другая группа устройства — 403."
    x-implementation-status: implemented
    security:
    - bearerAuth: []
    responses:
      '403':
        description: Недостаточно прав устройства или сотрудника.
      '200':
        description: Возрастные группы
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProfStartAgeGroup'
      '401':
        description: Требуется авторизация.
cms-types:
  get:
    tags:
    - ПрофСтарт - CMS
    summary: Каталог типов тестов
    operationId: profstart_cms_types_get
    description: "Требуется staff access-токен: admin/content_editor/operator. Все типы, включая дополнительные; порядок id ASC. Прохождение и показатели групп доступны для всех типов; участие источника в итоговом рейтинге определяется SOURCE_WEIGHTS."
    x-implementation-status: implemented
    security:
    - bearerAuth: []
    parameters: []
    responses:
      '401':
        description: Отсутствующий или недействительный staff-токен.
      '403':
        description: Недостаточно прав.
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ProfStartTestType'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Создать тип теста
    operationId: profstart_cms_types_post
    description: "Требуется staff access-токен: admin/content_editor. Код должен быть уникальным: дубликат — 409. Дополнительные типы недоступны для пользовательского прохождения."
    x-implementation-status: implemented
    security:
    - bearerAuth: []
    parameters: []
    responses:
      '401':
        description: Отсутствующий или недействительный staff-токен.
      '403':
        description: Недостаточно прав.
      '201':
        description: Ресурс создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTestType'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfStartTestTypeCreate'
cms-tests:
  get:
    tags:
    - ПрофСтарт - CMS
    summary: Версии тестов
    operationId: profstart_cms_tests_get
    description: "Требуется staff access-токен: admin/content_editor/operator. Порядок created_at DESC, id DESC."
    x-implementation-status: implemented
    security:
    - bearerAuth: []
    parameters:
    - name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: offset
      in: query
      required: false
      description: Смещение
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: test_type_id
      in: query
      required: false
      description: Фильтр типа
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: status
      in: query
      required: false
      description: 1 — draft, 2 — active, 3 — archived
      schema:
        type: integer
        format: int32
        enum: [1, 2, 3]
    responses:
      '401':
        description: Отсутствующий или недействительный staff-токен.
      '403':
        description: Недостаточно прав.
      '200':
        description: Успешный ответ
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTestPage'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
  post:
    tags:
    - ПрофСтарт - CMS
    summary: Создать черновик версии
    operationId: profstart_cms_tests_post
    description: "Требуется staff access-токен: admin/content_editor. Создаёт draft (status=1). Номер версии назначается автоматически."
    x-implementation-status: implemented
    security:
    - bearerAuth: []
    parameters: []
    responses:
      '401':
        description: Отсутствующий или недействительный staff-токен.
      '403':
        description: Недостаточно прав.
      '201':
        description: Ресурс создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfStartTest'
      '404':
        description: Ресурс не найден или недоступен владельцу.
      '409':
        description: Конфликт состояния или уникальности.
      '422':
        description: Некорректные параметры, ссылки или состав теста.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/ProfStartTestCreate'
          encoding:
            age_group_ids:
              contentType: text/plain
