      порядок created_at DESC, id DESC. Каталог типов расширяем.
    x-implementation-status: planned
    parameters:
    - name: limit
      in: query
      required: false
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: offset
      in: query
      required: false
      description: Смещение
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: test_type_id
      in: query
      required: false
      description: Фильтр типа
      schema:
        type: integer
        format: int64
        minimum: 1
    - name: status
      in: query
      required: false
      description: Статус теста
      schema:
        type: string
        enum:
        - draft
        - active
        - archived
    responses:
