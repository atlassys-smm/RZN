# ═══════════════════════════════════════════════════════════════
# Обратная связь — Пользователь
# ═══════════════════════════════════════════════════════════════

survey-by-external-id:
  get:
    tags: [Обратная связь - LED]
    summary: Активная анкета по external_id
    description: "Получить активную анкету по external_id. Требуется device-токен активного устройства с ролью 4. QR-привязка для чтения состава анкеты не требуется."
    security:
      - bearerAuth: []
    parameters:
      - name: external_id
        in: path
        required: true
        schema:
          type: string
        description: Символьный идентификатор анкеты (например, videoresume_feedback)
    responses:
      '403':
        description: Недостаточная роль устройства или пользователь не подключён к этому устройству.
      '200':
        description: Активная анкета с вопросами
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSurvey'
      '401':
        description: Недействительный или отсутствующий device-токен
      '404':
        description: Активная анкета не найдена

respond:
  post:
    tags: [Обратная связь - Пользователь]
    summary: Ответить на анкету
    description: "Отправить ответы по User JWT либо Device JWT с ролью 4 и действующей QR-привязкой. Для устройства обязателен X-Device-Connection-Id; пользователь определяется по связи в Redis. При User JWT владелец определяется по токену. user_id в JSON не принимается."
    parameters:
      - $ref: '#/components/parameters/DeviceConnectionId'
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Идентификатор анкеты
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeedbackSubmitRequest'
    responses:
      '403':
        description: Недостаточная роль устройства или пользователь не подключён к этому устройству.
      '401':
        description: Недействительный или отсутствующий user access-токен
      '201':
        description: Ответы отправлены
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmitResponse'
      '404':
        description: Анкета не найдена
      '422':
        description: Анкета не активна
