completion:
  get:
    tags: [Обратная связь - Пользователь]
    summary: Проверить прохождение обратной связи
    description: |
      Возвращает true, если текущий пользователь отправил хотя бы одну анкету
      обратной связи. Учитывается история всех версий анкет. Начатая анкета
      учитывается после отправки. Требуется User JWT, в том числе гостевой.
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Статус прохождения обратной связи
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed:
                  type: boolean
      '401':
        description: Требуется действующий User JWT

surveys:
  get:
    tags: [Обратная связь - Пользователь]
    summary: Список активных анкет
    description: >-
      Получить активные анкеты с вопросами и вариантами ответов.
      Требуется User JWT либо Device JWT с ролью 4 и действующей QR-привязкой.
      Для устройства обязателен X-Device-Connection-Id. Черновики и неактивные
      версии не возвращаются. Необязательный type фильтрует по ID типа анкеты,
      module_id — по привязкам к модулю. При передаче обоих действуют оба фильтра.
      total считается после фильтрации до limit/offset.
      completed показывает, отправил ли текущий пользователь ответ на эту версию анкеты.
      Статус считывается отдельно от общего кеша на каждом запросе.
      Общий Redis-кэш на 86400 секунд без продления при чтении; публикация новой
      версии или изменение привязок инвалидирует кэш. Подписанные URL формируются заново. При сбое Redis
      выполняется чтение БД. Авторизация проверяется на каждом запросе.
    security:
      - bearerAuth: []
    parameters:
      - name: module_id
        in: query
        required: false
        description: Фильтр по модулю, к которому привязан тип анкеты.
        schema: {$ref: '#/components/schemas/SurveyModuleType'}
      - name: type
        in: query
        description: Фильтр по ID типа анкеты.
        schema: {$ref: '#/components/schemas/SurveyType'}
      - $ref: '#/components/parameters/DeviceConnectionId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
    responses:
      '200':
        description: Список активных анкет со статусами прохождения
        headers:
          Cache-Control: {schema: {type: string, const: no-store}}
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginatedResponse_FeedbackUserSurveyResponse_'
      '401':
        description: Требуется действующий токен пользователя или устройства
      '403':
        description: Недостаточная роль устройства или пользователь не подключён
      '422':
        description: Неверный module_id, type или пагинация, либо не передан заголовок подключения устройства

survey-detail:
  get:
    tags: [Обратная связь - Пользователь]
    summary: Активная анкета по ID
    description: >-
      Получить активную анкету по её survey_id с вопросами и вариантами ответов.
      Требуется User JWT либо Device JWT с ролью 4 и действующей QR-привязкой.
      Для устройства обязателен X-Device-Connection-Id. Отсутствующая или неактивная
      анкета возвращает 404. survey_id — ID анкеты, а не её type.
      completed показывает, отправил ли текущий пользователь ответ на эту версию анкеты.
      Статус считывается отдельно от общего кеша на каждом запросе.
      Общий Redis-кэш на 86400 секунд без продления при чтении; публикация новой
      версии инвалидирует кэш. Подписанные URL формируются заново. При сбое Redis
      выполняется чтение БД. Авторизация проверяется на каждом запросе.
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/DeviceConnectionId'
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Активная анкета со статусом прохождения
        headers:
          Cache-Control: {schema: {type: string, const: no-store}}
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackUserSurveyResponse'
      '401':
        description: Требуется действующий токен пользователя или устройства
      '403':
        description: Недостаточная роль устройства или пользователь не подключён
      '404':
        description: Активная анкета не найдена
      '422':
        description: Неверный ID или не передан заголовок подключения устройства

start:
  post:
    tags: [Обратная связь - Пользователь]
    summary: Начать заполнение анкеты
    description: >-
      Создать незавершённый SurveyResponse перед показом первого вопроса.
      started_at назначается сервером, completed_at остаётся NULL.
      Требуется User JWT либо Device JWT с ролью 4 и действующей QR-привязкой.
      Для устройства обязателен X-Device-Connection-Id. Полученный id передать
      как response_id в respond. Каждый вызов start создаёт новое прохождение:
      после успешного ответа используйте сохранённый id, не вызывайте start повторно.
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/DeviceConnectionId'
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeedbackStartRequest'
    responses:
      '201':
        description: Создан незавершённый ответ на анкету
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackStartResponse'
      '401':
        description: Требуется действующий токен пользователя или устройства
      '403':
        description: Недостаточная роль устройства или пользователь не подключён
      '404':
        description: Анкета не найдена
      '422':
        description: Анкета неактивна, неверное тело или не передан заголовок подключения

respond:
  post:
    tags: [Обратная связь - Пользователь]
    summary: Ответить на анкету
    description: >-
      Отправить ответы по User JWT либо Device JWT с ролью 4 и действующей QR-привязкой.
      Для устройства обязателен X-Device-Connection-Id; пользователь определяется по
      связи в Redis. При User JWT владелец определяется по токену; user_id в JSON запрещён.
      Новый поток: сначала start, затем response_id в этом запросе. Повтор с тем же
      response_id и ответами возвращает прежний результат без новых событий. Другие
      ответы, согласие или источник завершённого прохождения дают 409. Без response_id
      сохранение остаётся совместимым со старым клиентом: есть оценки и окончание, но нет
      реального старта или защиты от повторной отправки. Оценка rating_scale — целое
      число в границах шкалы; чужие и повторные question_id отклоняются. Для SINGLE_CHOICE
      value содержит строку с ID варианта, для MULTIPLE_CHOICE и PROFESSION_CHOICE —
      строку с JSON-массивом ID вариантов. ID должны принадлежать вопросу и не повторяться.
    parameters:
      - $ref: '#/components/parameters/DeviceConnectionId'
      - name: survey_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Идентификатор анкеты
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeedbackSubmitRequest'
    responses:
      '403':
        description: Недостаточная роль устройства или пользователь не подключён к этому устройству.
      '401':
        description: Недействительный или отсутствующий user access-токен
      '201':
        description: Ответы отправлены
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmitResponse'
      '404':
        description: Анкета не найдена
      '409':
        description: Источник или ответы не совпадают с сохранённым прохождением
      '422':
        description: Анкета не активна, оценка некорректна или вопрос чужой/повторный
