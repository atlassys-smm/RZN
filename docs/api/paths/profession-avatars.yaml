# ═══════════════════════════════════════════════════════════════
# Аватары профессий
# ═══════════════════════════════════════════════════════════════

avatars:
  get:
    tags: [Аватары профессий]
    summary: Список аватаров профессий
    security: []
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '200':
        description: Список аватаров
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProfessionAvatar'
                total:
                  type: integer
  post:
    tags: [Аватары профессий]
    summary: Создать аватар профессии
    description: Добавить аватар для профессии — мужской и женский образ (требуются права CMS)
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            properties:
              profession_id:
                type: integer
                title: Profession Id
              male_photo:
                type: string
                contentMediaType: application/octet-stream
                title: Male Photo
              female_photo:
                type: string
                contentMediaType: application/octet-stream
                title: Female Photo
              male_file_title:
                anyOf:
                - type: string
                - type: 'null'
                title: Male File Title
              male_file_description:
                anyOf:
                - type: string
                - type: 'null'
                title: Male File Description
              female_file_title:
                anyOf:
                - type: string
                - type: 'null'
                title: Female File Title
              female_file_description:
                anyOf:
                - type: string
                - type: 'null'
                title: Female File Description
            type: object
            required:
            - profession_id
            - male_photo
            - female_photo
            title: Body_create_avatar_api_avatars_post
    responses:
      '201':
        description: Аватар создан
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessionAvatar'
      '422':
        description: Аватар для этой профессии уже существует

avatars-detail:
  get:
    tags: [Аватары профессий]
    summary: Аватар профессии
    description: Получить аватар по ID профессии
    security: []
    parameters:
      - name: profession_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Аватар
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessionAvatar'
      '404':
        description: Не найден
  put:
    tags: [Аватары профессий]
    summary: Обновить аватар профессии
    description: Обновить фото мужского или женского образа (требуются права CMS)
    parameters:
      - name: profession_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      content:
        multipart/form-data:
          schema:
            properties:
              male_photo:
                anyOf:
                - type: string
                  contentMediaType: application/octet-stream
                - type: 'null'
                title: Male Photo
              female_photo:
                anyOf:
                - type: string
                  contentMediaType: application/octet-stream
                - type: 'null'
                title: Female Photo
              male_file_title:
                anyOf:
                - type: string
                - type: 'null'
                title: Male File Title
              male_file_description:
                anyOf:
                - type: string
                - type: 'null'
                title: Male File Description
              female_file_title:
                anyOf:
                - type: string
                - type: 'null'
                title: Female File Title
              female_file_description:
                anyOf:
                - type: string
                - type: 'null'
                title: Female File Description
            type: object
            title: Body_update_avatar_api_avatars__profession_id__put
    responses:
      '200':
        description: Аватар обновлён
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessionAvatar'
      '404':
        description: Не найден
  delete:
    tags: [Аватары профессий]
    summary: Удалить аватар профессии
    description: Удалить аватар профессии (требуются права CMS)
    parameters:
      - name: profession_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Аватар удалён
      '404':
        description: Не найден
