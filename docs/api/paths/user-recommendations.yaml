me-recommendations:
  get:
    tags: [Рекомендации пользователя]
    summary: Общий профиль рекомендаций текущего пользователя
    operationId: user_recommendations_get
    description: "User JWT или Device JWT с ролью 3 и действующей QR-привязкой; для устройства обязателен X-Device-Connection-Id. Профиль с максимум тремя профессиями и вкладами источников. До первого сохранённого источника — JSON null. В расчёте участвуют только источники с положительным весом в SOURCE_WEIGHTS. Рейтинг рассчитывается при каждом запросе из снимков источников; веса заданы в коде, итог не сохраняется. Мягкое удаление профессии (`deleted_at`) не исключает её из ранее сохранённых рекомендаций: ID, название и исходные баллы берутся из снимка источника. При новом прохождении подбираются только активные профессии по активным связям. По максимум трём профессиям из итогового рейтинга рассчитываются employers (до 5 работодателей типа 1) и educations (до 5 учебных заведений типа 2). Связи: profession_employers и profession_education_programs → education_programs → organizations. Порядок внутри каждого типа: число различных совпавших профессий DESC, ID организации ASC. Несколько программ одной профессии не увеличивают её вклад. Каждая запись содержит organization (полные данные организации), profession_ids (по возрастанию ID), profession_count и position (1–5). Профессии, связи, программы и организации с deleted_at участвуют в расчёте для сохранённых рекомендаций. Организации и связи читаются в текущем состоянии при каждом GET; снимок организаций не сохраняется. При отсутствии профессий или связей массивы пустые; до создания профиля ответ остаётся null. Сначала формируется обычный топ-5 по числу различных совпавших профессий DESC и ID организации ASC. Затем проверяется покрытие каждой выбранной профессии в каждом типе организаций. Если для профессии есть связанные организации, но ни одна не попала в топ-5, лучшая из них заменяет последнюю организацию, удаление которой не лишает покрытия другие профессии. Одна организация может покрывать несколько профессий. После замен сохраняется сортировка по рейтингу; лимит — 5 уникальных организаций каждого типа. Если связей данного типа нет, покрытие для этой профессии не требуется."
    security:
      - bearerAuth: []
    parameters:
    - $ref: '#/components/parameters/DeviceConnectionId'
    responses:
      '403':
        description: Недостаточная роль устройства или пользователь не подключён к этому устройству.
      '422':
        description: Некорректные параметры; для Device JWT обязателен X-Device-Connection-Id.
      '200':
        description: Профиль рекомендаций или null
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/UserRecommendations'
                - type: 'null'
      '401':
        description: Требуется авторизация
