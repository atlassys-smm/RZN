me-recommendations:
  get:
    tags: [Рекомендации пользователя]
    summary: Общий профиль рекомендаций текущего пользователя
    operationId: user_recommendations_get
    description: Профиль с максимум тремя профессиями и вкладами источников. До первого сохранённого источника — JSON null. В расчёте участвуют только источники с положительным весом в SOURCE_WEIGHTS. Рейтинг рассчитывается при каждом запросе из снимков источников; веса заданы в коде, итог не сохраняется.
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Профиль рекомендаций или null
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/UserRecommendations'
                - type: 'null'
      '401':
        description: Требуется авторизация
