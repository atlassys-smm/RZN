me-recommendations:
  get:
    tags: [Рекомендации пользователя]
    summary: Общий профиль рекомендаций текущего пользователя
    operationId: user_recommendations_get
    description: "User JWT или Device JWT с ролью 3 и действующей QR-привязкой; для устройства обязателен X-Device-Connection-Id. Профиль с максимум тремя профессиями и вкладами источников. До первого сохранённого источника — JSON null. В расчёте участвуют только источники с положительным весом в SOURCE_WEIGHTS. Рейтинг рассчитывается при каждом запросе из снимков источников; веса заданы в коде, итог не сохраняется. Мягкое удаление профессии (`deleted_at`) не исключает её из ранее сохранённых рекомендаций: ID, название и исходные баллы берутся из снимка источника. При новом прохождении подбираются только активные профессии по активным связям. По максимум трём профессиям из итогового рейтинга рассчитываются три отдельных списка: `employers` (до 5 работодателей типа 1), `educations` (до 5 учебных заведений типа 2) и `education_programs` (до 5 направлений подготовки). Работодатели определяются через profession_employers, учебные заведения — через profession_education_programs → education_programs → organization_education_programs → organizations. Направления подбираются непосредственно через profession_education_programs → education_programs, независимо от наличия организаций. В каждом списке сначала идут записи с большим числом различных совпавших профессий, затем с меньшим ID. Несколько программ одной профессии не увеличивают её вклад в рейтинг организации. Элементы списков организаций содержат `organization` (полные данные организации), `profession_ids` (по возрастанию ID), `profession_count` и `position` (1–5). В списке направлений вместо `organization` возвращается `education_program`: id, name, education_level, duration, base_class, created_at, updated_at; остальные поля совпадают. Общее направление возвращается один раз независимо от числа его организаций. Профессии, связи, программы и организации с deleted_at участвуют в расчёте для сохранённых рекомендаций. Данные и связи читаются в текущем состоянии при каждом GET; снимки этих трёх списков не сохраняются. При отсутствии профессий или соответствующих связей массивы пустые; до создания профиля ответ остаётся null. Правило покрытия применяется отдельно к каждому из трёх списков: employers, educations, education_programs. Сначала формируется топ-5 по числу различных совпавших профессий DESC и ID организации или направления ASC. Затем проверяется покрытие каждой выбранной профессии. Если для неё есть связанные записи, но ни одна не попала в топ-5, лучшая из них заменяет последнюю запись, удаление которой не лишает покрытия другие профессии. Одна запись может покрывать несколько профессий. После замен сохраняется сортировка по рейтингу; лимит — 5 уникальных записей в каждом списке. Если соответствующих связей нет, покрытие этой профессии в данном списке не требуется."
    security:
      - bearerAuth: []
    parameters:
    - $ref: '#/components/parameters/DeviceConnectionId'
    responses:
      '403':
        description: Недостаточная роль устройства или пользователь не подключён к этому устройству.
      '422':
        description: Некорректные параметры; для Device JWT обязателен X-Device-Connection-Id.
      '200':
        description: Профиль рекомендаций или null
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/UserRecommendations'
                - type: 'null'
      '401':
        description: Требуется авторизация
