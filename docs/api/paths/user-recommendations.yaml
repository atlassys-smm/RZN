me-recommendations:
  get:
    tags: [Рекомендации пользователя]
    summary: Общий профиль рекомендаций пользователя
    operationId: user_recommendations_get
    description: "Дополнительный источник quiz/answers пополняется при полном завершении викторины: group_scores содержит profession_id/answers_count, оценки — 100 × answers_count / максимум; reasons — answers_count/max_answers_count. Вес викторины 1, просмотров 4; оба источника необязательны и пустыми не влияют на знаменатель. Источник professions/views обновляется перед расчётом при отсутствии записи или возрасте более 6 часов: первый импорт за 30 суток, далее прибавление событий [updated_at, начало выборки). Счётчики в group_scores, оценки в profession_scores — 100 × просмотры / максимум. Пустой views не участвует в расчёте; views необязателен для is_complete и не входит в missing_sources. Ошибка ClickHouse сохраняет прежние данные и updated_at. User JWT, Device JWT с ролью 3 и действующей QR-привязкой или Staff JWT с ролью ADMIN или ANALYST. Сотрудник указывает user_id. Для устройства обязателен X-Device-Connection-Id. Профиль с максимум тремя профессиями и вкладами источников. Каждая профессия содержит description — текущее описание из справочника или null, а также file: собственный файл; при пустом media_id — male_photo_file_id шаблона аватара; без обоих — null. Название и баллы сохраняют значения из снимков источников. До первого сохранённого источника — JSON null. В расчёте участвуют только источники с положительным весом в SOURCE_WEIGHTS. Последняя подборка хранится в PostgreSQL. Следующий запрос пересчитывает её при изменении ID или updated_at любого источника, при изменении весов или версии справочников, а также по истечении суток. Проверка шестичасового интервала источника просмотров выполняется при пересчёте. Подписанные URL формируются при выдаче. Мягкое удаление профессии (`deleted_at`) не исключает её из ранее сохранённых рекомендаций: ID, название и исходные баллы берутся из снимка источника. При новом прохождении подбираются только активные профессии по активным связям. По максимум трём профессиям из итогового рейтинга рассчитываются три отдельных списка: `employers` (до 5 работодателей типа 1), `educations` (до 5 учебных заведений типа 2) и `education_programs` (до 5 направлений подготовки). Работодатели определяются через profession_employers, учебные заведения — через profession_education_programs → education_programs → organization_education_programs → organizations. Направления подбираются непосредственно через profession_education_programs → education_programs, независимо от наличия организаций. В каждом списке сначала идут записи с большим числом различных совпавших профессий, затем с меньшим ID. Несколько программ одной профессии не увеличивают её вклад в рейтинг организации. Элементы списков организаций содержат `organization` (полные данные организации), `profession_ids` (по возрастанию ID), `profession_count` и `position` (1–5). В списке направлений вместо `organization` возвращается `education_program`: id, name, education_level, duration, base_class, created_at, updated_at; остальные поля совпадают. Общее направление возвращается один раз независимо от числа его организаций. При расчёте рекомендаций по обучению используются активные программы, учебные заведения и связи. Программа с активной связью с профессией может попасть в подборку при отсутствии активной связи с учебным заведением. Данные и связи читаются в текущем состоянии при пересчёте. Три списка сохраняются вместе с рейтингом профессий. При отсутствии профессий или соответствующих связей массивы пустые; до создания профиля ответ остаётся null. Правило покрытия применяется отдельно к каждому из трёх списков: employers, educations, education_programs. Сначала формируется топ-5 по числу различных совпавших профессий DESC и ID организации или направления ASC. Затем проверяется покрытие каждой выбранной профессии. Если для неё есть связанные записи, но ни одна не попала в топ-5, лучшая из них заменяет последнюю запись, удаление которой не лишает покрытия другие профессии. Одна запись может покрывать несколько профессий. После замен сохраняется сортировка по рейтингу; лимит — 5 уникальных записей в каждом списке. Если соответствующих связей нет, покрытие этой профессии в данном списке не требуется."
    security:
      - bearerAuth: []
    parameters:
    - $ref: '#/components/parameters/DeviceConnectionId'
    - name: user_id
      in: query
      required: false
      description: ID пользователя. Обязателен для ADMIN и ANALYST. При User JWT и Device JWT пользователь определяется по токену или QR-привязке.
      schema:
        type: integer
        format: int64
        minimum: 1
    responses:
      '403':
        description: Недостаточная роль устройства или пользователь не подключён к этому устройству.
      '404':
        description: Указанный сотрудником пользователь не найден.
      '422':
        description: Некорректные параметры. Для ADMIN и ANALYST нужен user_id, для Device JWT нужен X-Device-Connection-Id.
      '200':
        description: Профиль рекомендаций или null
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/UserRecommendations'
                - type: 'null'
      '401':
        description: Требуется авторизация
