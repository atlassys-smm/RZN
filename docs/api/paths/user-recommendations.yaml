me-recommendations:
  get:
    tags: [Рекомендации пользователя]
    summary: Общий профиль рекомендаций текущего пользователя
    operationId: user_recommendations_get
    description: "User JWT или Device JWT с ролью 3 и действующей QR-привязкой; для устройства обязателен X-Device-Connection-Id. Профиль с максимум тремя профессиями и вкладами источников. До первого сохранённого источника — JSON null. В расчёте участвуют только источники с положительным весом в SOURCE_WEIGHTS. Рейтинг рассчитывается при каждом запросе из снимков источников; веса заданы в коде, итог не сохраняется."
    security:
      - bearerAuth: []
    parameters:
    - $ref: '#/components/parameters/DeviceConnectionId'
    responses:
      '403':
        description: Недостаточная роль устройства или пользователь не подключён к этому устройству.
      '422':
        description: Некорректные параметры; для Device JWT обязателен X-Device-Connection-Id.
      '200':
        description: Профиль рекомендаций или null
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/UserRecommendations'
                - type: 'null'
      '401':
        description: Требуется авторизация
