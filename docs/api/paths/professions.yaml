# ═══════════════════════════════════════════════════════════════
# Профессии
# ═══════════════════════════════════════════════════════════════

professions:
  get:
    tags: [Профессии]
    summary: Список профессий
    description: Получить справочник профессий с фильтрацией и пагинацией
    security: []
    parameters:
      - name: direction_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по профессиональному направлению
      - name: industry_id
        in: query
        schema:
          type: integer
          format: int64
        description: Фильтр по отрасли
      - name: search
        in: query
        schema:
          type: string
        description: Поиск по названию
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '200':
        description: Список профессий
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Profession'
                total:
                  type: integer
  post:
    tags: [Профессии]
    summary: Создать профессию
    description: Создать новую профессию (требуются права CMS)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, industry_id, direction_id]
            properties:
              name:
                type: string
              description:
                type: string
              industry_id:
                type: integer
                format: int64
              direction_id:
                type: integer
                format: int64
    responses:
      '201':
        description: Профессия создана
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profession'

professions-detail:
  get:
    tags: [Профессии]
    summary: Детали профессии
    description: Получить полную информацию о профессии по идентификатору
    security: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: Карточка профессии
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profession'
      '404':
        description: Профессия не найдена
  put:
    tags: [Профессии]
    summary: Обновить профессию
    description: Обновить профессию (требуются права CMS)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              industry_id:
                type: integer
                format: int64
              direction_id:
                type: integer
                format: int64
    responses:
      '200':
        description: Профессия обновлена
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profession'
      '404':
        description: Не найдена
  delete:
    tags: [Профессии]
    summary: Удалить профессию
    description: Удалить профессию (требуются права CMS)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '204':
        description: Профессия удалена
      '404':
        description: Не найдена

