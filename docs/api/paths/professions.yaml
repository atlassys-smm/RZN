industries:
  get:
    tags:
    - Профессии
    summary: Список индустрий
    parameters:
    - name: search
      in: query
      required: false
      schema:
        anyOf:
        - type: string
        - type: 'null'
        title: Search
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
        title: Limit
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        title: Offset
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndustryListResponse'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Отсутствующий или недействительный JWT.
    security:
    - bearerAuth: []
    description: "Требуется действующий Bearer JWT пользователя (включая гостя), сотрудника любой роли или активного устройства. Возвращаются только записи с deleted_at IS NULL. Удалённая запись по ID возвращает 404. Пагинация и total учитывают только доступные записи."
  post:
    tags:
    - Профессии
    summary: Создать индустрию
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IndustryCreateRequest'
    responses:
      '201':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Industry'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Требуется авторизация сотрудника
      '403':
        description: Недостаточно прав
      '409':
        description: Активные зависимости или конфликт уникальной пары связей
    description: Требуется staff access-токен редактора контента или администратора.
      Удалённая запись недоступна для изменения и повторного удаления (404). Ссылки
      на удалённые записи отклоняются (422).
industries-detail:
  get:
    tags:
    - Профессии
    summary: Получить индустрию
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        title: Industry Id
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Industry'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '404':
        description: Запись не найдена или удалена
      '401':
        description: Отсутствующий или недействительный JWT.
    security:
    - bearerAuth: []
    description: "Требуется действующий Bearer JWT пользователя (включая гостя), сотрудника любой роли или активного устройства. Возвращаются только записи с deleted_at IS NULL. Удалённая запись по ID возвращает 404. Пагинация и total учитывают только доступные записи."
  put:
    tags:
    - Профессии
    summary: Изменить индустрию
    security:
    - bearerAuth: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        title: Industry Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IndustryUpdateRequest'
    responses:
      '200':
        description: Successful Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Industry'
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Требуется авторизация сотрудника
      '403':
        description: Недостаточно прав
      '409':
        description: Активные зависимости или конфликт уникальной пары связей
      '404':
        description: Запись не найдена или удалена
    description: Требуется staff access-токен редактора контента или администратора.
      Удалённая запись недоступна для изменения и повторного удаления (404). Ссылки
      на удалённые записи отклоняются (422). Пропущенные поля сохраняются; явный null
      очищает nullable-поле.
  delete:
    tags:
    - Профессии
    summary: Удалить индустрию
    security:
    - bearerAuth: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        title: Industry Id
    responses:
      '204':
        description: Successful Response
      '422':
        description: Validation Error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPValidationError'
      '401':
        description: Требуется авторизация сотрудника
      '403':
        description: Недостаточно прав
      '409':
        description: Активные зависимости или конфликт уникальной пары связей
      '404':
        description: Запись не найдена или удалена
    description: Требуется staff access-токен редактора контента или администратора.
      Устанавливает deleted_at, сохраняя строку физически. Удалённый ID возвращает
      404. Ответ 409, если существуют активные профессии или отрасли.
