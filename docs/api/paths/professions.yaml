list:
  get:
    tags: [professions]
    summary: Список профессий
    description: Получить справочник профессий с фильтрацией и пагинацией
    security: []
    parameters:
      - name: direction
        in: query
        schema:
          type: string
        description: Фильтр по профессиональному направлению
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
    responses:
      '200':
        description: Список профессий

detail:
  get:
    tags: [professions]
    summary: Детали профессии
    description: Получить полную информацию о профессии по идентификатору
    security: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Карточка профессии
      '404':
        description: Профессия не найдена
