staff-list:
  get:
    tags: [Сотрудник]
    summary: Список сотрудников
    description: |
      Только активный администратор со Staff JWT, роль 1. Возвращает активных
      и заблокированных сотрудников в порядке id.
      total считается до limit/offset. Хеши паролей и токены не возвращаются.
    security:
      - bearerAuth: []
    parameters:
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, default: 20}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, default: 0}
    responses:
      '200':
        description: Страница сотрудников и общее число записей.
        headers:
          Cache-Control:
            schema: {type: string, enum: [no-store]}
          Pragma:
            schema: {type: string, enum: [no-cache]}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffListResponse'}
      '401': {description: Нет действующего Staff JWT; пользователь и устройство не допускаются.}
      '403': {description: Только для администраторов.}
      '422': {description: limit меньше 1 либо offset меньше 0.}

staff-detail:
  patch:
    tags: [Сотрудник]
    summary: Изменить сотрудника
    description: |
      Только активный администратор со Staff JWT, роль 1. Частично обновляет
      first_name, last_name, email, role и status сотрудника по staff_id.
      Хотя бы одно поле обязательно; пропущенные поля сохраняются, null
      и неизвестные поля не принимаются. Пробелы по краям строк удаляются;
      email приводится к нижнему регистру и должен быть уникальным.
      Новая роль учитывается со следующего запроса с ранее выданным токеном.
      При блокировке отзываются все сессии сотрудника: access/refresh больше
      не работают, в том числе после разблокировки; необходим новый вход.
      Разблокировка выполняется status=1. Администратор может менять свои
      имя, фамилию и email, но не может понизить собственную роль или
      заблокировать собственный аккаунт. Пароль этим запросом не меняется.
    security:
      - bearerAuth: []
    parameters:
      - name: staff_id
        in: path
        required: true
        schema: {type: integer}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              first_name:
                type: string
                minLength: 1
                maxLength: 100
              last_name:
                type: string
                minLength: 1
                maxLength: 100
              email:
                type: string
                format: email
                maxLength: 255
              role:
                type: integer
                enum: [1, 2, 3, 4]
                description: 1 — администратор, 2 — оператор, 3 — аналитик, 4 — контент-редактор.
              status:
                type: integer
                enum: [1, 2]
                description: 1 — активен, 2 — заблокирован.
          example:
            first_name: Анна
            last_name: Иванова
            email: anna@example.com
            role: 3
    responses:
      '200':
        description: Обновлённый профиль сотрудника без пароля и токенов.
        headers:
          Cache-Control:
            schema: {type: string, enum: [no-store]}
          Pragma:
            schema: {type: string, enum: [no-cache]}
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffInfoResponse'}
      '401': {description: Нет действующего Staff JWT; пользователь и устройство не допускаются.}
      '403': {description: Только для администраторов.}
      '404': {description: Сотрудник не найден.}
      '409': {description: Email уже используется; нельзя понизить собственную роль или заблокировать себя.}
      '422': {description: Некорректный staff_id; пустой объект, null, неверный формат или длина строк, неизвестная роль или статус, лишние поля.}
  delete:
    tags: [Сотрудник]
    summary: Удалить сотрудника
    description: |
      Только активный администратор со Staff JWT, роль 1. Физическое удаление:
      одной транзакцией удаляются refresh-токены сотрудника, его сессии и учётная
      запись. Access/refresh-токены перестают работать, вход запрещён, сотрудник
      исчезает из списка. Email освобождается для повторной регистрации.
      Другие сотрудники и пользовательские данные не удаляются.
      Свой аккаунт удалить нельзя.
    security:
      - bearerAuth: []
    parameters:
      - name: staff_id
        in: path
        required: true
        schema: {type: integer}
    responses:
      '204':
        description: Сотрудник удалён, ответ без тела.
        headers:
          Cache-Control:
            schema: {type: string, enum: [no-store]}
          Pragma:
            schema: {type: string, enum: [no-cache]}
      '401': {description: Нет действующего Staff JWT.}
      '403': {description: Только для администраторов.}
      '404': {description: Сотрудник отсутствует либо уже удалён.}
      '409': {description: Нельзя удалить собственную учётную запись.}
      '422': {description: Некорректный staff_id.}

staff-info:
  get:
    tags: [Сотрудник]
    summary: Данные сотрудника
    description: Профиль текущего сотрудника по Staff JWT. Доступен сотрудникам всех ролей. Хеш пароля не возвращается.
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Данные текущего сотрудника
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
          Pragma:
            schema:
              type: string
              enum: [no-cache]
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInfoResponse'
      '401':
        description: Staff JWT отсутствует или недействителен; пользователь и устройство не допускаются; сотрудник заблокирован или сессия истекла/отозвана
  patch:
    tags: [Сотрудник]
    summary: Изменить данные сотрудника
    description: |
      Частично обновляет профиль владельца Staff JWT. Доступен сотрудникам всех
      ролей. Принимает first_name и last_name: хотя бы одно поле обязательно.
      Пропущенные поля сохраняются. Пробелы по краям удаляются до проверки длины;
      null не принимается. Email, роль, статус и пароль этим запросом не меняются.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              first_name:
                type: string
                minLength: 1
                maxLength: 100
              last_name:
                type: string
                minLength: 1
                maxLength: 100
          example:
            first_name: Анна
            last_name: Иванова
    responses:
      '200':
        description: Данные текущего сотрудника
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
          Pragma:
            schema:
              type: string
              enum: [no-cache]
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInfoResponse'
      '401':
        description: Staff JWT отсутствует или недействителен; пользователь и устройство не допускаются; сотрудник заблокирован или сессия истекла/отозвана
      '422':
        description: Не передано ни одного поля; имя или фамилия null, не строка, пустые, длиннее 100 символов; переданы лишние поля
