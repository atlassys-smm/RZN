openapi: 3.1.0
info:
  title: ПрофНавигатор 62 — API
  description: |
    REST API платформы «ПрофНавигатор 62».
    Единая цифровая профориентационная платформа для Центра занятости населения Рязанской области.
  version: 0.1.0
  contact:
    name: ПрофНавигатор 62

servers:
  - url: http://localhost:8000/api
    description: Локальная разработка

tags:
  - name: auth
    description: Авторизация и аутентификация
  - name: users
    description: Пользователи и профили
  - name: Профессии
    description: Справочник профессий, отраслей и направлений
  - name: Компетенции
    description: Справочник компетенций
  - name: Организации
    description: Учебные заведения и работодатели
  - name: Викторина
    description: Общие методы — получение состояния сессии (используются оператором и игроками)
  - name: Викторина - CMS
    description: Управление вопросами и шаблонами сценариев викторины
  - name: Викторина - Оператор
    description: Игровая сессия — создание, управление ходом, результаты
  - name: Викторина - Игрок
    description: Мобильный клиент — подключение к сессии и ответы
  - name: Профессии в действии
    description: Общие методы — получение состояния показа (используется LED-экраном)
  - name: Профессии в действии - CMS
    description: Управление видеосценариями и ветками
  - name: Профессии в действии - Оператор
    description: Показ — запуск и остановка
  - name: Профессии в действии - LED
    description: Получение состояния показа для LED-экрана
  - name: Профессии в действии - Зритель
    description: Мобильный клиент — подключение и голосование
  - name: profstart
    description: ПрофСтарт — тестирование
  - name: analytics
    description: Аналитика и события
  - name: cms
    description: CMS — управление контентом
  - name: feedback
    description: Обратная связь и анкеты
  - name: files
    description: Загрузка и управление файлами

paths:
  # ── Авторизация ──────────────────────────────────
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /auth/refresh:
    $ref: './paths/auth.yaml#/refresh'

  # ── Пользователи ─────────────────────────────────
  /users/me:
    $ref: './paths/users.yaml#/me'

  # ── Профессии ────────────────────────────────────
  /professions:
    $ref: './paths/professions.yaml#/professions'
  /professions/{id}:
    $ref: './paths/professions.yaml#/professions-detail'
  /industries:
    $ref: './paths/professions.yaml#/industries'
  /industries/{id}:
    $ref: './paths/professions.yaml#/industries-detail'
  /directions:
    $ref: './paths/professions.yaml#/directions'
  /directions/{id}:
    $ref: './paths/professions.yaml#/directions-detail'

  # ── Компетенции ─────────────────────────────────
  /competences:
    $ref: './paths/competences.yaml#/competences'
  /competences/{id}:
    $ref: './paths/competences.yaml#/competences-detail'

  # ── Организации ─────────────────────────────────
  /organizations:
    $ref: './paths/organizations.yaml#/organizations'
  /organizations/{id}:
    $ref: './paths/organizations.yaml#/organizations-detail'

  # ── CMS: Викторина — Вопросы ────────────────────
  /cms/quiz/questions:
    $ref: './paths/quiz.yaml#/cms-questions'
  /cms/quiz/questions/{id}:
    $ref: './paths/quiz.yaml#/cms-questions-detail'

  # ── CMS: Викторина — Шаблоны ────────────────────
  /cms/quiz/templates:
    $ref: './paths/quiz.yaml#/cms-templates'
  /cms/quiz/templates/{id}/publish:
    $ref: './paths/quiz.yaml#/cms-templates-publish'
  /cms/quiz/templates/{id}/unpublish:
    $ref: './paths/quiz.yaml#/cms-templates-unpublish'

  # ── CMS: Викторина — Раунды шаблона ─────────────
  /cms/quiz/templates/{id}/rounds:
    $ref: './paths/quiz.yaml#/cms-templates-rounds-create'
  /cms/quiz/templates/{id}/rounds/reorder:
    $ref: './paths/quiz.yaml#/cms-templates-rounds-reorder'
  /cms/quiz/templates/{id}/rounds/{roundId}:
    $ref: './paths/quiz.yaml#/cms-templates-rounds-update'
  /cms/quiz/templates/{id}/rounds/{roundId}/questions:
    $ref: './paths/quiz.yaml#/cms-templates-rounds-questions-add'
  /cms/quiz/templates/{id}/rounds/{roundId}/questions/reorder:
    $ref: './paths/quiz.yaml#/cms-templates-rounds-questions-reorder'
  /cms/quiz/templates/{id}/rounds/{roundId}/questions/{questionId}:
    $ref: './paths/quiz.yaml#/cms-templates-rounds-questions-remove'

  # ── Игровая сессия ──────────────────────────────
  /quiz/sessions:
    $ref: './paths/quiz.yaml#/session-create'
  /quiz/sessions/active:
    $ref: './paths/quiz.yaml#/session-active'
  /quiz/sessions/{id}:
    $ref: './paths/quiz.yaml#/session-detail'
  /quiz/sessions/{id}/finish:
    $ref: './paths/quiz.yaml#/session-finish'
  /quiz/sessions/{id}/next:
    $ref: './paths/quiz.yaml#/session-next'
  /quiz/sessions/{id}/reveal:
    $ref: './paths/quiz.yaml#/session-reveal'
  /quiz/sessions/{id}/timer/pause:
    $ref: './paths/quiz.yaml#/session-timer-pause'
  /quiz/sessions/{id}/timer/resume:
    $ref: './paths/quiz.yaml#/session-timer-resume'
  /quiz/sessions/{id}/results/rounds/{roundIndex}:
    $ref: './paths/quiz.yaml#/session-results-round'
  /quiz/sessions/{id}/results/total:
    $ref: './paths/quiz.yaml#/session-results-total'

  # ── Мобильный клиент ────────────────────────────
  /quiz/sessions/{sessionId}/join:
    $ref: './paths/quiz.yaml#/player-join'
  /quiz/sessions/{sessionId}/team/{teamId}/join:
    $ref: './paths/quiz.yaml#/player-team-join'
  /quiz/sessions/{sessionId}/answer:
    $ref: './paths/quiz.yaml#/player-answer'

  # ── CMS: Профессии в действии — Устройства ───
  /cms/devices:
    $ref: './paths/cms.yaml#/cms-devices'
  /cms/devices/{id}:
    $ref: './paths/cms.yaml#/cms-devices-detail'
  /cms/devices/{device_id}/refresh-token:
    $ref: './paths/cms.yaml#/cms-device-refresh-token'

  # ── CMS: Профессии в действии — Видеосценарии ───
  /cms/video-scenarios:
    $ref: './paths/interactive-video.yaml#/cms-scenarios'
  /cms/video-scenarios/{id}:
    $ref: './paths/interactive-video.yaml#/cms-scenarios-detail'
  /cms/video-scenarios/{id}/branches:
    $ref: './paths/interactive-video.yaml#/cms-branches-create'
  /cms/video-scenarios/{id}/branches/{branchId}:
    $ref: './paths/interactive-video.yaml#/cms-branches-update'

  # ── Профессии в действии — Показ ────────────────
  /interactive-video/sessions:
    $ref: './paths/interactive-video.yaml#/session-create'
  /interactive-video/sessions/active:
    $ref: './paths/interactive-video.yaml#/session-active'
  /interactive-video/sessions/{id}/stop:
    $ref: './paths/interactive-video.yaml#/session-stop'
  /interactive-video/sessions/{id}/state:
    $ref: './paths/interactive-video.yaml#/session-state'
  /interactive-video/sessions/{id}/advance:
    $ref: './paths/interactive-video.yaml#/session-advance'
  /interactive-video/sessions/{id}/voting:
    $ref: './paths/interactive-video.yaml#/session-voting'

  # ── Мобильный клиент (Профессии в действии) ─────
  /interactive-video/sessions/{sessionId}/join:
    $ref: './paths/interactive-video.yaml#/player-join'
  /interactive-video/sessions/{sessionId}/vote:
    $ref: './paths/interactive-video.yaml#/player-vote'

  # ── ПрофСтарт ────────────────────────────────────
  /profstart/sessions:
    $ref: './paths/profstart.yaml#/sessions'
  /profstart/sessions/{id}/answer:
    $ref: './paths/profstart.yaml#/answer'
  /profstart/sessions/{id}/result:
    $ref: './paths/profstart.yaml#/result'

  # ── Аналитика ────────────────────────────────────
  /analytics/events:
    $ref: './paths/analytics.yaml#/events'

  # ── CMS ──────────────────────────────────────────
  /cms/references:
    $ref: './paths/cms.yaml#/references'
  /cms/surveys:
    $ref: './paths/cms.yaml#/surveys'

  # ── Обратная связь ───────────────────────────────
  /feedback/surveys:
    $ref: './paths/feedback.yaml#/surveys'
  /feedback/surveys/{id}/respond:
    $ref: './paths/feedback.yaml#/respond'

  # ── Файлы ────────────────────────────────────────
  /files/upload:
    $ref: './paths/files.yaml#/upload'
  /files/{id}:
    $ref: './paths/files.yaml#/detail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # ── Справочники ────────────────────────────────
    Industry:
      description: Отрасль экономики
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time

    Direction:
      description: Профессиональное направление
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time

    Profession:
      description: Профессия из справочника
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        industry_id:
          type: string
          format: uuid
        direction_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Competence:
      description: Компетенция (навык/способность)
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Organization:
      description: Организация (учебное заведение или работодатель)
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [education, employer]
        address:
          type: string
          nullable: true
        coordinates:
          type: object
          nullable: true
          properties:
            lat:
              type: number
            lng:
              type: number
        description:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Общие ──────────────────────────────────────
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    Device:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        location:
          type: string
          nullable: true
        is_active:
          type: boolean
    DeviceWithToken:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            token:
              type: string
              description: Device JWT. Показывается только один раз, при регистрации
    DeviceTokenResponse:
      type: object
      required: [device_id, token]
      properties:
        device_id:
          type: integer
          format: int64
        token:
          type: string
          description: Новый device JWT
    QuizQuestion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        question_type:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        age_group:
          type: string
          nullable: true
        time_limit:
          type: integer
          description: Время на ответ в секундах
        points:
          type: integer
        round_type:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        media_url:
          type: string
          nullable: true
        answer_options:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              text:
                type: string
              is_correct:
                type: boolean
              media_url:
                type: string
                nullable: true
              order:
                type: integer
        created_at:
          type: string
          format: date-time
    QuizScenarioTemplate:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, published]
        rounds:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              round_type:
                type: string
              order:
                type: integer
              questions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    question_id:
                      type: string
                      format: uuid
                    order:
                      type: integer
        created_at:
          type: string
          format: date-time
    QuizSession:
      description: Сущность сессии викторины (без связей)
      type: object
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [individual, team]
        status:
          type: string
          enum: [waiting, active, finished]
        settings:
          type: object
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    QuizSessionFull:
      description: Сессия викторины со связями. Поля заполняются в зависимости от параметра select.
      type: object
      allOf:
        - $ref: '#/components/schemas/QuizSession'
        - type: object
          properties:
            current_round:
              type: object
              nullable: true
              description: Текущий раунд (заполняется при select=current_round)
              properties:
                index:
                  type: integer
                round_type:
                  type: string
            current_question:
              type: object
              nullable: true
              description: Текущий вопрос (заполняется при select=current_question)
              properties:
                index:
                  type: integer
                question:
                  $ref: '#/components/schemas/QuizQuestion'
                correct_answer:
                  type: object
                  nullable: true
                  description: Заполнено после вызова reveal (ответ показан)
                  properties:
                    answer_option_ids:
                      type: array
                      items:
                        type: string
                        format: uuid
                    explanation:
                      type: string
                      nullable: true
                votes:
                  type: array
                  description: Распределение голосов по вариантам ответа
                  items:
                    type: object
                    properties:
                      answer_option_id:
                        type: string
                        format: uuid
                      count:
                        type: integer
            timer:
              $ref: '#/components/schemas/QuizTimerState'
            teams:
              type: array
              nullable: true
              description: Заполняется при select=teams
              items:
                $ref: '#/components/schemas/QuizTeam'
            participants:
              type: array
              nullable: true
              description: Заполняется при select=participants
              items:
                $ref: '#/components/schemas/QuizParticipant'
    QuizTeam:
      description: Команда в сессии викторины
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        captain_id:
          type: string
          format: uuid
          nullable: true
        score:
          type: integer
    QuizParticipant:
      description: Участник сессии викторины
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
          nullable: true
          description: ID команды (null для mode=individual)
        name:
          type: string
        individual_score:
          type: integer
    QuizSessionState:
      description: Текущее состояние игры викторины (для next, reveal)
      type: object
      properties:
        status:
          type: string
          enum: [waiting, active, finished]
        current_round:
          type: object
          nullable: true
          properties:
            index:
              type: integer
            round_type:
              type: string
        current_question:
          type: object
          nullable: true
          properties:
            index:
              type: integer
            question:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                text:
                  type: string
                question_type:
                  type: string
                media_url:
                  type: string
                  nullable: true
                time_limit:
                  type: integer
                answer_options:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      text:
                        type: string
                      media_url:
                        type: string
                        nullable: true
            correct_answer:
              type: object
              nullable: true
              description: Заполнено после вызова reveal
              properties:
                answer_option_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                explanation:
                  type: string
                  nullable: true
            votes:
              type: array
              description: Распределение голосов по вариантам ответа
              items:
                type: object
                properties:
                  answer_option_id:
                    type: string
                    format: uuid
                  count:
                    type: integer
        timer:
          $ref: '#/components/schemas/QuizTimerState'
        scores:
          type: array
          description: Текущий рейтинг
          items:
            type: object
            properties:
              team_id:
                type: string
                format: uuid
                nullable: true
              participant_id:
                type: string
                format: uuid
                nullable: true
              name:
                type: string
              score:
                type: integer
    QuizTimerState:
      description: |
        Состояние таймера текущего вопроса викторины.
        Для синхронизации используется абсолютный timestamp `ends_at`, а не относительный `remaining`.
        Клиент вычисляет оставшееся время: remaining = ends_at - now.
      type: object
      properties:
        ends_at:
          type: integer
          format: int64
          nullable: true
          description: UNIX timestamp (мс), когда таймер закончится. Null если на паузе.
        remaining_at_pause:
          type: integer
          nullable: true
          description: Секунд осталось на момент паузы. Заполняется если running=false.
        running:
          type: boolean
          description: true — таймер идёт, false — на паузе
    QuizScoredEntry:
      description: Запись с баллами. id — team_id для team mode, participant_id для individual.
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Название команды или имя участника
    QuizRoundResult:
      description: Результат раунда
      allOf:
        - type: object
          properties:
            round_index:
              type: integer
            round_type:
              type: string
        - type: object
          properties:
            scores:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/QuizScoredEntry'
                  - type: object
                    properties:
                      round_score:
                        type: integer
                        description: Баллы за этот раунд
                      total_score:
                        type: integer
                        description: Суммарные баллы на момент окончания раунда
    QuizFinalResult:
      description: Финальный результат
      allOf:
        - $ref: '#/components/schemas/QuizScoredEntry'
        - type: object
          properties:
            place:
              type: integer
            score:
              type: integer
    QuizTotalResult:
      description: Итоговый результат на текущий момент. mode определяет, что означает id.
      type: object
      properties:
        mode:
          type: string
          enum: [individual, team]
        results:
          type: array
          description: Рейтинг по убыванию баллов
          items:
            $ref: '#/components/schemas/QuizFinalResult'

    # ═══════════════════════════════════════════════════════
    # Профессии в действии — Схемы
    # ═══════════════════════════════════════════════════════

    InteractiveVideoScenario:
      description: Видеосценарий (интерактивный видеоролик с точками выбора)
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          nullable: true
        profession_id:
          type: integer
          format: int64
          nullable: true
        branch_count:
          type: integer
          description: Количество веток в сценарии
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InteractiveVideoScenarioFull:
      description: Видеосценарий с деревом веток
      allOf:
        - $ref: '#/components/schemas/InteractiveVideoScenario'
        - type: object
          properties:
            branches:
              type: array
              description: Дерево веток (стартовая ветка первая, с дочерними вложенными)
              items:
                $ref: '#/components/schemas/InteractiveVideoScenarioBranch'

    InteractiveVideoScenarioBranch:
      description: Ветка видеосценария (видеофрагмент с вариантами выбора)
      type: object
      properties:
        id:
          type: integer
          format: int64
        scenario_id:
          type: integer
          format: int64
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: ID родительской ветки (null для стартовой)
        media_id:
          type: integer
          format: int64
          nullable: true
          description: ID видеофайла
        media_url:
          type: string
          nullable: true
          description: URL видеофайла
        text:
          type: string
          nullable: true
          description: Текст варианта выбора (для дочерних веток)
        prompt:
          type: string
          nullable: true
          description: Текст вопроса в точке выбора (для веток с дочерними вариантами)
        children:
          type: array
          description: Дочерние ветки (варианты выбора после этого видео)
          items:
            $ref: '#/components/schemas/InteractiveVideoScenarioBranch'

    InteractiveVideoSession:
      description: Сессия показа «Профессии в действии»
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [active, finished]
        scenario_ids:
          type: array
          description: ID видеосценариев для показа
          items:
            type: integer
            format: int64
        current_scenario_index:
          type: integer
          nullable: true
          description: Индекс текущего сценария (0-based)
        settings:
          type: object
          properties:
            voting_duration:
              type: integer
              description: Длительность голосования в секундах
            result_display_duration:
              type: integer
              description: Длительность показа результата в секундах
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    InteractiveVideoState:
      description: Текущее состояние показа для LED-экрана
      type: object
      properties:
        session_id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
          description: Идентификатор LED-устройства, на котором запущена сессия
        status:
          type: string
          enum: [active, finished]
        phase:
          type: string
          enum: [playing, voting]
          description: |
            Фаза показа:
            - `playing` — проигрывание ролика
            - `voting` — точка голосования, сбор ответов
        phase_started_at:
          type: integer
          format: int64
          description: UNIX timestamp (мс), когда началась текущая фаза
        current_scenario:
          type: object
          nullable: true
          description: Текущий видеосценарий
          properties:
            index:
              type: integer
            scenario:
              $ref: '#/components/schemas/InteractiveVideoScenario'
        current_branch:
          type: object
          nullable: true
          description: Текущая ветка (видеофрагмент)
          properties:
            id:
              type: integer
              format: int64
            media_url:
              type: string
              nullable: true
            profession_name:
              type: string
              nullable: true
              description: Название профессии (показывается в начале видео)
        voting_point:
          type: object
          nullable: true
          description: Точка голосования (заполняется в фазе voting)
          properties:
            prompt:
              type: string
              description: Текст вопроса/ситуации
            options:
              type: array
              description: Варианты выбора (дочерние ветки)
              items:
                type: object
                properties:
                  branch_id:
                    type: integer
                    format: int64
                  text:
                    type: string
            timer:
              type: object
              properties:
                ends_at:
                  type: integer
                  format: int64
                  description: UNIX timestamp (мс), когда таймер закончится. Клиент вычисляет remaining = ends_at - now.
            votes:
              type: array
              description: Распределение голосов
              items:
                type: object
                properties:
                  branch_id:
                    type: integer
                    format: int64
                  count:
                    type: integer
            total_voters:
              type: integer
              description: Общее количество проголосовавших
            winner_branch_id:
              type: integer
              format: int64
              nullable: true
              description: ID выбранной ветки

    InteractiveVideoVoting:
      description: Информация о голосовании для мобильного клиента
      type: object
      properties:
        session_id:
          type: integer
          format: int64
        phase:
          type: string
          enum: [playing, voting]
          description: |
            Фаза показа:
            - `playing` — проигрывание ролика
            - `voting` — точка голосования, сбор ответов
        voting_point:
          type: object
          nullable: true
          description: Точка голосования (заполняется в фазе voting)
          properties:
            prompt:
              type: string
              description: Текст вопроса/ситуации
            options:
              type: array
              description: Варианты выбора
              items:
                type: object
                properties:
                  branch_id:
                    type: integer
                    format: int64
                  text:
                    type: string
            timer:
              type: object
              properties:
                ends_at:
                  type: integer
                  format: int64
                  description: UNIX timestamp (мс), когда таймер закончится. Клиент вычисляет remaining = ends_at - now.
            already_voted:
              type: boolean
              description: true, если участник уже проголосовал
            voted_branch_id:
              type: integer
              format: int64
              nullable: true
              description: ID ветки, за которую проголосовал участник (если already_voted=true)

security:
  - bearerAuth: []
