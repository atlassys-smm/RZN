    ProfStartScore:
      type: object
      additionalProperties: false
      required:
      - group_id
      - group_code
      - group_name
      - category
      - axis
      - raw_score
      - max_score
      - normalized_score
      - rank
      - is_leading
      properties:
        group_id:
          type: integer
          format: int64
          minimum: 1
        group_code:
          type: string
        group_name:
          type: string
        category:
          type: string
          enum:
          - subject
          - labor
          - riasec
          - geometry
        axis:
          type: string
          enum:
          - want
          - can
          - general
        raw_score:
          type: number
          minimum: 0
        max_score:
          type: number
          exclusiveMinimum: 0
          description: solomin — 9 на каждую группу/ось, holland — 15 на тип, dellinger — 1 на фигуру.
        normalized_score:
          type: number
          minimum: 0
          maximum: 100
          description: ' Значение округлено до двух знаков ROUND_HALF_UP на Decimal; JSON number.'
        rank:
          type: integer
          minimum: 1
        is_leading:
          type: boolean
    ProfStartReason:
      type: object
      additionalProperties: false
      required:
      - group_id
      - group_code
      - group_name
      - axis
      - normalized_score
      - coefficient
      - contribution
      properties:
        group_id:
          type: integer
          format: int64
          minimum: 1
        group_code:
          type: string
        group_name:
          type: string
        axis:
          type: string
          enum:
          - want
          - can
          - general
        normalized_score:
          type: number
          minimum: 0
          maximum: 100
          description: ' Значение округлено до двух знаков ROUND_HALF_UP на Decimal; JSON number.'
        coefficient:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        contribution:
          type: number
          minimum: 0
          maximum: 100
          description: round_half_up(normalized_score * coefficient, 2). Для Соломина вклад до усреднения двух категорий;
            reasons содержит одну максимальную subject- и одну labor-группу want. Для Голланда/Деллингер одну группу
            общего максимального вклада. При равенстве вкладов выбирается наименьший group_id. Значение округлено до
            двух знаков ROUND_HALF_UP на Decimal; JSON number.
