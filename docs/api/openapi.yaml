              properties:
                answers:
                  minItems: 1
          - if:
              properties:
                answered_count:
                  const: 1
              required:
              - answered_count
            then:
              properties:
                next_question_id:
                  type: 'null'
      - if:
          properties:
            status:
              const: 3
          required:
          - status
        then:
          properties:
            next_question_id:
              type: 'null'
      - if:
          properties:
            status:
              const: 2
          required:
          - status
        then:
          properties:
            completed_at:
              type: string
            result_id:
              type: integer
            next_question_id:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - 1
              - 3
          required:
          - status
        then:
          properties:
            completed_at:
              type: 'null'
            result_id:
              type: 'null'
      description: answers — принятые ответы. У completed заполнены completed_at и result_id; у остальных статусов
          результата нет.
    ProfStartAnswerReceipt:
      type: object
      additionalProperties: false
      required:
      - session_id
      - answer
      - answered_count
      - question_count
      - next_question_id
      - status
      properties:
        session_id:
          type: integer
          format: int64
          minimum: 1
        answer:
          $ref: '#/components/schemas/ProfStartSavedAnswer'
        answered_count:
          type: integer
          minimum: 1
        question_count:
          type: integer
          minimum: 1
          enum:
          - 1
          - 15
          - 42
        next_question_id:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        status:
          type: integer
          format: int32
          enum:
          - 1
          - 2
          description: 1 — in_progress, 2 — completed.
      allOf:
      - if:
          properties:
            question_count:
              const: 1
          required:
          - question_count
        then:
          properties:
            answered_count:
              maximum: 1
          allOf:
          - if:
              properties:
                status:
                  const: 2
              required:
              - status
            then:
              properties:
                answered_count:
                  const: 1
                next_question_id:
                  type: 'null'
      - if:
          properties:
            question_count:
              const: 15
          required:
          - question_count
        then:
          properties:
            answered_count:
              maximum: 15
          allOf:
          - if:
              properties:
                status:
                  const: 2
              required:
              - status
            then:
              properties:
                answered_count:
                  const: 15
                next_question_id:
                  type: 'null'
      - if:
          properties:
            question_count:
              const: 42
          required:
          - question_count
        then:
          properties:
            answered_count:
              maximum: 42
          allOf:
          - if:
              properties:
                status:
                  const: 2
              required:
              - status
            then:
              properties:
                answered_count:
                  const: 42
                next_question_id:
                  type: 'null'
      - if:
          properties:
            status:
              enum:
              - 2
          required:
          - status
        then:
          properties:
            next_question_id:
              type: 'null'
      description: Принятый ответ и текущий прогресс; next_question_id=null после завершения.
    ProfStartScore:
      type: object
      additionalProperties: false
      required:
      - group_id
      - group_code
      - group_name
      - category
      - raw_score
      - max_score
      - normalized_score
      - rank
      - is_leading
      properties:
        group_id:
          type: integer
          format: int64
          minimum: 1
        group_code:
          type: string
        group_name:
          type: string
        category:
          type: string
          enum:
          - subject
          - labor
          - riasec
          - geometry
        raw_score:
          type: number
          minimum: 0
        max_score:
          type: number
          exclusiveMinimum: 0
          description: Соломин — 18, Голланд — 15, Деллингер — 1.
        normalized_score:
          type: number
          minimum: 0
          maximum: 100
          description: Округлено до двух знаков.
        rank:
          type: integer
          minimum: 1
        is_leading:
          type: boolean
      description: Общий показатель группы; у Соломина объединяет want и can.
    ProfStartReason:
      type: object
      additionalProperties: false
      required:
      - group_id
      - group_code
      - group_name
      - normalized_score
      - coefficient
      - contribution
      properties:
        group_id:
          type: integer
          format: int64
          minimum: 1
        group_code:
          type: string
        group_name:
          type: string
        normalized_score:
          type: number
          minimum: 0
          maximum: 100
          description: Округлено до двух знаков.
        coefficient:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        contribution:
          type: number
          minimum: 0
          maximum: 100
          description: Вклад группы в рекомендацию, округлённый до двух знаков.
    ProfStartRecommendation:
      type: object
      additionalProperties: false
      required:
      - profession_id
      - profession_name
      - score
      - position
      - reasons
      properties:
        profession_id:
          type: integer
          format: int64
          minimum: 1
        profession_name:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Балл рекомендации, округлённый до двух знаков.
        position:
          type: integer
          minimum: 1
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/ProfStartReason'
          minItems: 1
    ProfStartResult:
      type: object
      additionalProperties: false
      required:
      - id
      - session_id
      - test_id
      - test_type_id
      - user_id
      - test_code_type
      - test_version
      - age_group_id
      - answered_count
      - question_count
      - created_at
      - scores
      - professions
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        session_id:
          type: integer
          format: int64
          minimum: 1
        test_id:
          type: integer
          format: int64
          minimum: 1
        test_type_id:
          type: integer
          format: int64
          minimum: 1
        user_id:
          type: integer
          format: int64
          minimum: 1
        test_version:
          type: integer
          minimum: 1
        age_group_id:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        answered_count:
          type: integer
          minimum: 1
        question_count:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        scores:
          type: array
          items:
            $ref: '#/components/schemas/ProfStartScore'
        professions:
          type: array
          items:
            $ref: '#/components/schemas/ProfStartRecommendation'
        test_code_type:
          type: string
          enum:
          - solomin
          - holland
          - dellinger
      allOf:
      - if:
          properties:
            test_code_type:
              const: solomin
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 42
            answered_count:
              const: 42
            scores:
              minItems: 7
              maxItems: 7
              items:
                properties:
                  group_code:
                    enum:
                    - human_human
                    - human_technology
                    - human_sign
                    - human_art
                    - human_nature
                    - executive
                    - creative
                  category:
                    enum:
                    - subject
                    - labor
                  raw_score:
                    maximum: 18
                    multipleOf: 1
                  max_score:
                    const: 18
            professions:
              items:
                properties:
                  reasons:
                    minItems: 2
                    maxItems: 2
      - if:
          properties:
            test_code_type:
              const: holland
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 15
            answered_count:
              const: 15
            scores:
              minItems: 6
              maxItems: 6
              items:
                properties:
                  group_code:
                    enum:
                    - R
                    - I
                    - S
                    - E
                    - C
                    - A
                  category:
                    enum:
                    - riasec
                  raw_score:
                    maximum: 15
                    multipleOf: 1
                  max_score:
                    const: 15
            professions:
              items:
                properties:
                  reasons:
                    minItems: 1
                    maxItems: 1
      - if:
          properties:
            test_code_type:
              const: dellinger
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 1
            answered_count:
              const: 1
            scores:
              minItems: 5
              maxItems: 5
              items:
                properties:
                  group_code:
                    enum:
                    - square
                    - triangle
                    - circle
                    - zigzag
                    - rectangle
                  category:
                    enum:
                    - geometry
                  raw_score:
                    maximum: 1
                    multipleOf: 1
                  max_score:
                    const: 1
            professions:
              items:
                properties:
                  reasons:
                    minItems: 1
                    maxItems: 1
      description: Сохранённый результат завершённой сессии. Список professions может быть пустым.
