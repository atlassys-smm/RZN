info:
  title: ПрофНавигатор 62 — API
  description: |
    REST API платформы «ПрофНавигатор 62».
    Единая цифровая профориентационная платформа для Центра занятости населения Рязанской области.
  version: 0.1.0
  contact:
    name: ПрофНавигатор 62

servers:
  - url: http://localhost:8000/api
    description: Локальная разработка

x-websocket-channels:
  device-auth:
    url: /api/device/auth/ws?token={device_jwt}
    parameters:
      token:
        in: query
        required: true
        schema:
          type: string
        description: JWT активного устройства без префикса Bearer.
    description: Устройство определяется по Device JWT; User и StaffUser не допускаются.
      Проверка токена и Origin выполняется только при подключении. Событие qr_opened
      отправляется при открытии действующей backend QR-ссылки, user_connected — после
      успешного /device/auth/confirm. В событиях передаётся code для сопоставления с
      текущим QR; профиль и connection_id запрашиваются через GET /device/auth/user.
      Уведомления отправляются через ConnectionManager в текущем процессе API и не воспроизводятся после переподключения.
    message:
      $ref: '#/components/schemas/DeviceAuthWebSocketEvent'
  device-sessions:
    url: /api/device/sessions/ws?token={device_jwt}
    parameters:
      token:
        in: query
        required: true
        schema:
          type: string
        description: Device JWT активного устройства с любыми ролями или без ролей, без Bearer.
    description: |
      Устройство получает только события своих сессий, device_id определяется по JWT.
      User и StaffUser не допускаются. Роли устройства не ограничиваются.
      Проверка JWT, актуального устройства и Origin выполняется до accept; при ошибке close 1008 (HTTP handshake 403).
      session_started отправляется после создания викторины в waiting или запуска видео в active.
      session_finished отправляется после завершения викторины, ручной остановки видео
      или естественного окончания последнего видеосценария. Повторное завершение не повторяет событие.
      Формат сообщений — type и payload с device_id, session_id, module (quiz / interactive_video).
      Подключение не требует session_id. Начальное состояние и история событий не отправляются;
      после переподключения клиент читает активные сессии обоих модулей через REST.
      Сокет подключается до создания оператором сессии. Авторизация проверяется только при подключении.
      Рассылка работает в текущем процессе API; для доставки запрос и сокет должны попасть в один процесс.
    message:
      $ref: '#/components/schemas/DeviceSessionWebSocketEvent'
  quiz-session:
    url: /api/quiz/sessions/{sessionId}/ws?token={jwt}
    parameters:
      token:
        in: query
        required: true
        schema:
          type: string
        description: User/Staff access JWT или Device JWT без префикса Bearer.
    description: |
      Канал сотрудника, устройства и игрока. До accept проверяются JWT и доступ к сессии.
      User должен быть участником викторины; активный StaffUser имеет доступ к чтению;
      Device требуется роль 1 и принадлежность сессии устройству.
      Если Origin передан, он должен входить в AUTH_ALLOWED_ORIGINS.
      Ошибки токена, Origin, доступа или отсутствующая сессия — close 1008 до accept
      (HTTP 403 при handshake). БД освобождается до ожидания сообщений.
      Авторизация проверяется только при подключении; открытый сокет не перепроверяется.
      При переподключении клиент передаёт актуальный JWT.
      Сообщения содержат только type, без data; начальное состояние не отправляется.
      После подключения и каждого события клиент сам запрашивает состояние через REST.
      Для игры используется GET /quiz/sessions/active?device_id=...;
      состав доступен с select=teams&select=participants; select=answers добавляет голосование в корневое поле answers.
      Истечение игрового таймера проверяет POST /quiz/sessions/{id}/led/next.
    message:
      $ref: '#/components/schemas/QuizWebSocketEvent'
  interactive-video-session:
    url: /api/interactive-video/sessions/{sessionId}/ws?token={jwt}
    parameters:
      token:
        in: query
        required: true
        schema:
          type: string
        description: User/Staff access JWT или Device JWT без префикса Bearer.
    description: |
      Канал устройства, сотрудника и мобильного клиента. До accept проверяются JWT
      и существование сессии; StaffUser требуется admin/operator, Device — роль 1
      и принадлежность сессии устройству. User допускается по действующему access:
      video join не сохраняет членство, поэтому факт join отдельно не проверяется.
      Если Origin передан, он должен входить в AUTH_ALLOWED_ORIGINS.
      Ошибки токена, Origin, доступа или отсутствующая сессия — close 1008 до accept
      (HTTP 403 при handshake). БД освобождается до ожидания сообщений.
      Авторизация проверяется только при подключении; открытый сокет не перепроверяется.
      После подключения клиент сам запрашивает состояние через /state или /voting
      с предусмотренной для REST авторизацией. Начальное состояние по сокету не отправляется.
      Все уведомления содержат только type и относятся к sessionId из URL.
    message:
      $ref: '#/components/schemas/InteractiveVideoWebSocketEvent'

