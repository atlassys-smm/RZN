components:
  parameters:
    DeviceConnectionId:
      name: X-Device-Connection-Id
      in: header
      required: false
      description: Обязателен для личных операций по Device JWT. Возьмите connection_id из /device/auth/user; пользователь определяется по Redis-привязке. При User JWT заголовок не требуется.
      schema:
        type: string
    RequiredDeviceConnectionId:
      name: X-Device-Connection-Id
      in: header
      required: true
      description: connection_id текущего подключения из /device/auth/user; требуется вместе с Device JWT.
      schema:
        type: string
    DeviceCatalogConnectionId:
      name: X-Device-Connection-Id
      in: header
      required: false
      description: Для персонализации каталога по Device JWT передайте connection_id текущего подключения. Без заголовка устройство читает общий каталог. При User JWT используется владелец токена.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    staffRefresh:
      type: apiKey
      in: cookie
      name: staff_refresh
    userRefresh:
      type: apiKey
      in: cookie
      name: user_refresh
  schemas:
    LedScreensaver:
      type: object
      required:
      - id
      - name
      - file
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 255
        file:
          $ref: '#/components/schemas/FileResponse'
    LedScreensaverList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedScreensaver'
        total:
          type: integer
    AnalyticsMetabaseObject:
      type: object
      required: [id, type]
      properties:
        id:
          type: integer
          description: Текущий числовой ID объекта Metabase
          example: 101
        type:
          type: string
          enum: [collection, dashboard, question]
          description: Тип объекта; question — сохранённый вопрос (график, таблица или карточка)
          example: dashboard
    AnalyticsCatalog:
      type: object
      required: [collections, dashboards, charts]
      properties:
        collections:
          type: object
          description: Коллекции по постоянному collection.key
          additionalProperties:
            $ref: '#/components/schemas/AnalyticsMetabaseObject'
        dashboards:
          type: object
          description: Дашборды по постоянному dashboards[].key
          additionalProperties:
            $ref: '#/components/schemas/AnalyticsMetabaseObject'
        charts:
          type: object
          description: Сохранённые вопросы по cards[].key; текстовые заготовки без SQL сюда не входят
          additionalProperties:
            $ref: '#/components/schemas/AnalyticsMetabaseObject'
    StaffInfoResponse:
      type: object
      required: [id, email, first_name, last_name, role, status]
      properties:
        id:
          type: integer
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: integer
          enum: [1, 2, 3, 4]
          description: 1 — администратор, 2 — оператор, 3 — аналитик, 4 — контент-редактор.
        status:
          type: integer
          enum: [1, 2]
          description: 1 — активен, 2 — заблокирован.
    UserInfoResponse:
      type: object
      required: [id, is_guest, email, first_name, last_name, avatar_url, gender, birth_date]
      properties:
        id:
          type: integer
        is_guest:
          type: boolean
        email:
          type: [string, 'null']
        first_name:
          type: [string, 'null']
        last_name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        gender:
          type: [integer, 'null']
          enum: [1, 2, null]
          description: 1 — мужской, 2 — женский; null — не указан.
        birth_date:
          type: [string, 'null']
          format: date
    AuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: JWT, максимум 30 минут; для гостя ограничен сроком гостя
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
