        question_filters:
          type: object
          nullable: true
          additionalProperties: true
          description: Необязательные фильтры difficulty, age_group и tags, как при создании раундов. Отсутствие или null означает выбор без фильтров.
      example:
        question_ids: [101, 102]
    QuizSession:
