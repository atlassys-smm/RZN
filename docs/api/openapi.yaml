          type: string
        age_group_ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          uniqueItems: true
        question_count:
          type: integer
          minimum: 1
          description: 'Число вопросов закреплённой версии: solomin — 42 (7 × 3 × 2), holland — 15, dellinger — 1.'
        test_code_type:
          type: string
          enum:
          - solomin
          - holland
          - dellinger
        status:
          type: string
          enum:
          - active
          - archived
          description: Архивная карточка доступна только владельцу существующей сессии; новый старт разрешён только
            active.
      allOf:
      - if:
          properties:
            test_code_type:
              const: solomin
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 42
      - if:
          properties:
            test_code_type:
              const: holland
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 15
      - if:
          properties:
            test_code_type:
              const: dellinger
          required:
          - test_code_type
        then:
          properties:
            question_count:
              const: 1
