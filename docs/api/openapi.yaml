      - status
      properties:
        id:
          type: integer
          format: int64
          description: ID записи GameSessionQuestion, различает повторения одного вопроса.
        question_id:
          type: integer
          format: int64
          description: ID вопроса в банке GameQuestion.
        text:
          type: string
          description: Текущий текст вопроса из банка.
        round_id:
          type: integer
          format: int64
          description: ID раунда сессии.
        round_type:
          type: integer
          description: Тип раунда.
        round_order:
          type: integer
          description: Порядок раунда в сессии.
        order:
          type: integer
          description: Порядок вопроса внутри раунда.
        status:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: 'GameSessionQuestionStatus: 1 — passed (пройден), 2 — current (текущий), 3 — future (будущий). Вычисляется
            при чтении, в БД не хранится.'
    QuizSessionFull:
      description: Сессия викторины со связями. Поля заполняются в зависимости от параметра select.
      type: object
      required: [round_count, current_round_question_count, can_start_final_round]
      allOf:
        - $ref: '#/components/schemas/QuizSession'
        - type: object
          properties:
            can_start_final_round:
              type: boolean
              description: true только в active после раскрытия последнего вопроса последнего раунда, если в сессии нет FINAL (9). Вычисляется заново при чтении; после добавления финала всегда false.
            round_count:
              type: integer
              minimum: 0
              description: Общее количество раундов в сессии.
            current_round_question_count:
              type: integer
              minimum: 0
              description: Количество вопросов в текущем раунде; до старта — в первом раунде, 0 при отсутствии раунда.
            current_round:
              type: object
              nullable: true
              description: Текущий раунд (заполняется при select=current_round)
              properties:
                index:
                  type: integer
                round_type:
                  type: integer
                  enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
            current_question:
              type: object
              nullable: true
              description: Текущий вопрос активной игры. До раскрытия ответа из question опускаются answer_key и is_correct у вариантов. В waiting/finished объект не возвращается.
              required: [revealed]
              properties:
                revealed:
                  type: boolean
                  description: Раскрыт ли ответ именно на этот вопрос для игроков. false при запуске вопроса, true после reveal; одинаков для всех ролей независимо от select и предварительной видимости correct_answer у оператора.
                index:
                  type: integer
                question:
                  $ref: '#/components/schemas/QuizQuestion'
                correct_answer:
                  type: object
                  nullable: true
                  description: Для Staff JWT возвращается сразу; для User и Device — только после reveal. Просмотр сотрудником не раскрывает ответ остальным.
                  properties:
                    answer:
                      type: object
                      description: Эталонный ответ в формате соответствующего question_type
                      additionalProperties: true
                    explanation:
                      type: string
                      nullable: true
                answer_submissions:
                  type: object
                  description: Счётчики принятых ответов; для капитана команды также содержит предварительные ответы участников на текущий вопрос
                  properties:
                    submitted_count:
                      type: integer
                      description: Число текущих ответов участников, включая капитанов; ответ капитана не хранится отдельно.
                    eligible_count:
                      type: integer
                    participant_answers:
                      type: array
                      description: Предварительные ответы команды, возвращаются только авторизованному капитану
                      items:
                        type: object
                        properties:
                          participant_id:
                            type: integer
                            format: int64
                          participant_name:
                            type: string
                            description: Имя и фамилия из users, соединённые пробелом; пустые части пропускаются
                          answer:
                            type: object
                            additionalProperties: true
            timer:
              $ref: '#/components/schemas/QuizTimerState'
            answers:
              description: Возвращается только при select=answers; null до начала и после завершения игры.
              anyOf:
                - $ref: '#/components/schemas/QuizAnswers'
                - type: 'null'
            teams:
              type: array
              nullable: true
              description: Заполняется при select=teams
              items:
                $ref: '#/components/schemas/QuizTeam'
            participants:
              type: array
              nullable: true
              description: Заполняется при select=participants
              items:
                $ref: '#/components/schemas/QuizParticipant'
    QuizAnswers:
      type: object
      required: [participant_answers, team_answers, option_counts]
      description: |
        Голосование текущего вопроса, только при select=answers.
        User в командной игре видит свою команду; в индивидуальной — всех участников.
        StaffUser видит все команды. Device получает общие счётчики и статусы команд,
        с пустым participant_answers и null в team_answers[].answer.
        Ответ команды берётся из текущего голоса капитана. Хранение ответов и начисление баллов не изменены.
      properties:
        participant_answers:
          type: array
          description: Участники, отправившие ответ, включая капитанов; для индивидуальной игры — принятый ответ.
          items:
            type: object
            required: [participant_id, participant_name, team_id, answer]
            properties:
              participant_id:
                type: integer
                format: int64
              participant_name:
                type: string
                description: Имя и фамилия из users, соединённые пробелом; пустые части пропускаются
              team_id:
                type: [integer, 'null']
                format: int64
              answer:
                type: object
                additionalProperties: true
                description: Исходный JSON ответа согласно типу вопроса.
        team_answers:
          type: array
          description: Все доступные клиенту команды; ответ команды совпадает с текущим ответом капитана. Пусто в индивидуальной игре.
          items:
            type: object
            required: [team_id, captain_id, submitted, answer]
            properties:
              team_id:
                type: integer
                format: int64
              captain_id:
                type: [integer, 'null']
                format: int64
                description: Текущий капитан команды, чей голос используется как ответ команды.
              submitted:
                type: boolean
                description: true, если у текущего капитана есть ответ на текущий вопрос; не зависит от is_final.
              answer:
                type: [object, 'null']
                additionalProperties: true
                description: Текущий ответ капитана; null при отсутствии ответа и для Device.
        option_counts:
          type: array
          description: |
            Число текущих голосов участников и голосов капитанов команд за вариант.
            Нулевые значения включены. User в командной игре получает счётчики своей команды,
            StaffUser и Device — всей сессии. При множественном выборе каждый участник/команда
            учитывается один раз на выбранный вариант. Для текста, сопоставления, порядка
            и распределения ролей возвращается пустой массив.
          items:
            type: object
            required: [option_id, participant_count, team_count]
            properties:
              option_id:
                type: integer
                format: int64
              participant_count:
                type: integer
                minimum: 0
              team_count:
                type: integer
                minimum: 0
      example:
        participant_answers:
          - participant_id: 34
            participant_name: Гость 123
            team_id: 2
            answer: {option_id: 12}
        team_answers:
          - team_id: 2
            captain_id: 34
            submitted: true
            answer: {option_id: 12}
        option_counts:
          - {option_id: 12, participant_count: 1, team_count: 1}
          - {option_id: 14, participant_count: 0, team_count: 0}
    QuizTeam:
      description: Команда в сессии викторины
      type: object
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
        captain_id:
          type: integer
          format: int64
