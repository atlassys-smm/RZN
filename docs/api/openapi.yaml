    ProfStartTest:
      type: object
      additionalProperties: false
      required:
      - id
      - test_type_id
      - test_code_type
      - version
      - name
      - description
      - instructions
      - age_group_ids
      - question_count
      - group_count
      - published_at
      - created_at
      - updated_at
      - status
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        test_type_id:
          type: integer
          format: int64
          minimum: 1
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
          default: ''
        instructions:
          type: string
          default: ''
        age_group_ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          uniqueItems: true
          default: []
        question_count:
          type: integer
          minimum: 0
          description: 'В draft количество может быть неполным. Для публикации: solomin — 42, holland — 15, dellinger
            — 1. Для нового типа число задаётся CMS.'
        group_count:
          type: integer
          minimum: 0
        published_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Дата первой активации; null у draft, заполнена у active и archived. Статус определяется полем
            status.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        test_code_type:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          minLength: 1
          maxLength: 64
          description: 'Уникальный неизменяемый код. Предзаданные: solomin, holland, dellinger; CMS может добавлять
            другие.'
        status:
          type: string
          enum:
          - draft
          - active
          - archived
          description: Только тест имеет жизненный цикл. На один test_type_id допускается не более одного active.
      allOf:
      - if:
          properties:
            status:
              const: draft
          required:
          - status
        then:
          properties:
            published_at:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - active
              - archived
          required:
          - status
        then:
          properties:
            published_at:
              type: string
      - if:
          properties:
            status:
              enum:
              - active
              - archived
            test_code_type:
              const: solomin
          required:
          - status
          - test_code_type
        then:
          properties:
            question_count:
              const: 42
            group_count:
              const: 7
      - if:
          properties:
            status:
              enum:
              - active
              - archived
            test_code_type:
              const: holland
          required:
          - status
          - test_code_type
        then:
          properties:
            question_count:
              const: 15
            group_count:
              const: 6
      - if:
          properties:
            status:
              enum:
              - active
              - archived
            test_code_type:
              const: dellinger
          required:
          - status
          - test_code_type
        then:
          properties:
            question_count:
              const: 1
            group_count:
              const: 5
    ProfStartPublicTest:
      type: object
      additionalProperties: false
      required:
      - id
      - test_type_id
      - test_code_type
      - version
      - name
      - description
      - instructions
      - age_group_ids
      - question_count
      - status
      properties:
        id:
          type: integer
          format: int64
