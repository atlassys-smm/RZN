      description: Сессия викторины со связями. Поля заполняются в зависимости от параметра select.
      type: object
      required: [round_count, current_round_question_count]
      allOf:
        - $ref: '#/components/schemas/QuizSession'
        - type: object
          properties:
            round_count:
              type: integer
              minimum: 0
              description: Общее количество раундов в сессии.
            current_round_question_count:
              type: integer
              minimum: 0
              description: Количество вопросов в текущем раунде; до старта — в первом раунде, 0 при отсутствии раунда.
            current_round:
              type: object
              nullable: true
              description: Текущий раунд (заполняется при select=current_round)
              properties:
                index:
                  type: integer
                round_type:
                  type: integer
                  enum: [1, 2, 3, 4, 5, 6, 7, 8, 9]
            current_question:
              type: object
              nullable: true
              description: Текущий вопрос (заполняется при select=current_question). До раскрытия ответа из question опускаются answer_key и is_correct у вариантов.
              properties:
                index:
                  type: integer
                question:
                  $ref: '#/components/schemas/QuizQuestion'
                correct_answer:
                  type: object
                  nullable: true
                  description: Заполнено после вызова reveal (ответ показан)
                  properties:
                    answer:
                      type: object
                      description: Эталонный ответ в формате соответствующего question_type
                      additionalProperties: true
                    explanation:
                      type: string
                      nullable: true
                answer_submissions:
                  type: object
                  description: Счётчики принятых ответов; для капитана команды также содержит предварительные ответы участников до отправки решающего ответа
                  properties:
                    submitted_count:
                      type: integer
                    eligible_count:
                      type: integer
                    participant_answers:
                      type: array
                      description: Предварительные ответы команды, возвращаются только если participant_id запроса указывает на капитана
                      items:
                        type: object
                        properties:
                          participant_id:
                            type: integer
                            format: int64
                          participant_name:
                            type: string
                          answer:
                            type: object
                            additionalProperties: true
            timer:
              $ref: '#/components/schemas/QuizTimerState'
            teams:
              type: array
              nullable: true
              description: Заполняется при select=teams
              items:
                $ref: '#/components/schemas/QuizTeam'
            participants:
              type: array
              nullable: true
              description: Заполняется при select=participants
              items:
                $ref: '#/components/schemas/QuizParticipant'
