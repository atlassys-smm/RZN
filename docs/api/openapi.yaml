        answered_count:
          type: integer
          minimum: 1
        question_count:
          type: integer
          minimum: 1
        next_question_id:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
        status:
          type: integer
          format: int32
          enum:
          - 1
          - 2
          description: 1 — in_progress, 2 — completed.
      allOf:
      - if:
          properties:
            question_count:
              const: 1
          required:
          - question_count
        then:
          properties:
            answered_count:
              maximum: 1
          allOf:
          - if:
              properties:
                status:
                  const: 2
              required:
              - status
            then:
              properties:
                answered_count:
                  const: 1
                next_question_id:
                  type: 'null'
      - if:
          properties:
            question_count:
              const: 15
          required:
