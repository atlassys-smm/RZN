  /auth/{id}:
    get:
      tags: [auth]
      summary: Временный тестовый JWT пользователя
      description: Без авторизации выдаёт JWT существующего пользователя; удалить перед запуском в production.
      x-implementation-status: implemented
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: JWT пользователя
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        '404':
          description: Пользователь не найден
