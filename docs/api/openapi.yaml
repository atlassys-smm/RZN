        then:
          properties:
            is_complete:
              const: false
            results:
              maxItems: 0
            professions:
              maxItems: 0
            missing_test_types:
              minItems: 1
      - if:
          properties:
            is_complete:
              const: true
          required:
          - is_complete
        then:
          properties:
            available_weight_percent:
              const: 100
            results:
              minItems: 1
            missing_test_types:
              maxItems: 0
      - if:
          properties:
            is_complete:
              const: false
          required:
          - is_complete
        then:
          properties:
            available_weight_percent:
              maximum: 99
            missing_test_types:
              minItems: 1

