openapi: 3.1.0
info:
  title: ПрофНавигатор 62 — API
  description: |
    REST API платформы «ПрофНавигатор 62».
    Единая цифровая профориентационная платформа для Центра занятости населения Рязанской области.
  version: 0.1.0
  contact:
    name: ПрофНавигатор 62

servers:
  - url: http://localhost:8000/api
    description: Локальная разработка

x-websocket-channels:
  quiz-session:
    url: /api/quiz/sessions/{sessionId}/ws
    description: |
      Канал оператора, LED и игрока. После подключения и переподключения клиент сам
      запрашивает актуальное состояние через GET /quiz/sessions/active с device_id.
      Все сообщения содержат только type, без data. После каждого события клиент запрашивает
      GET /quiz/sessions/active?device_id=...; состав доступен с select=teams&select=participants.
      session_state уведомляет о смене вопроса, раскрытии ответа, изменении таймера и завершении сессии.
      Ответы команды доступны капитану через REST с participant_id, не в общей рассылке.
      Подключение к сокету не вызывает отправку session_state. Перед регистрацией
      проверяется существование сессии одним запросом её id; соединение с БД освобождается.
      Несуществующая сессия отклоняется до принятия WebSocket (close 1008 в ASGI, HTTP 403 при handshake).
      Истечение таймера проверяется вызовом POST /quiz/sessions/{id}/led/next.
    message:
      $ref: '#/components/schemas/QuizWebSocketEvent'
  interactive-video-session:
    url: /api/interactive-video/sessions/{sessionId}/ws
    description: |
      Канал LED, оператора и мобильного клиента видеосценариев. Перед регистрацией
      проверяется существование сессии одним запросом её id; соединение с БД освобождается.
      Несуществующая сессия отклоняется до принятия WebSocket (close 1008 в ASGI, HTTP 403 при handshake).
      После подключения и переподключения клиент сам запрашивает состояние через
      GET /interactive-video/sessions/{id}/state или /voting?participant_id=... .
      Начальное состояние сервер не отправляет. Все уведомления относятся к sessionId из URL.
    message:
      $ref: '#/components/schemas/InteractiveVideoWebSocketEvent'

