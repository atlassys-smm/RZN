components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    QuestionCreateRequest:
      additionalProperties: false
      properties:
        text:
          title: Text
          type: string
        question_type:
          title: Question Type
          type: integer
        difficulty:
          title: Difficulty
          type: integer
        time_limit:
          title: Time Limit
          type: integer
        points:
          title: Points
          type: integer
        age_group:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Age Group
        explanation:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Explanation
        round_type:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Round Type
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Tags
        answer_key:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Answer Key
        file_title:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: File Title
        file_description:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: File Description
        answer_options:
          items:
            $ref: '#/components/schemas/AnswerOptionCreate'
          title: Answer Options
          type: array
      required:
      - text
      - question_type
      - difficulty
      - time_limit
      - points
      - answer_options
      title: QuestionCreateRequest
      type: object
    QuestionUpdateRequest:
      additionalProperties: false
      properties:
        text:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Text
        question_type:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Question Type
        difficulty:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Difficulty
        time_limit:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Time Limit
        points:
