site_name: ПрофНавигатор 62 — Документация
site_description: Единая цифровая профориентационная платформа для Центра занятости населения Рязанской области
site_url: 'http://sg.atlassys.tech/rz/docs/'
use_directory_urls: false

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключиться на тёмную тему
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключиться на светлую тему
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Главная:
    - Обзор: index.md
    - Вопросы к Заказчику: questions.md
  - Техническое задание:
    - Обзор: tech-spec/index.md
    - Концепция (10 дней): tech-spec/concept.md
    - 1. Общие положения: tech-spec/01-general.md
    - 2. Стандарт оказания услуг: tech-spec/02-standards.md
    - 3. Состав и содержание ПАК: tech-spec/03-composition.md
    - 4. Структура программного обеспечения: tech-spec/04-software-structure.md
    - 5. Требования к оборудованию: tech-spec/05-equipment.md
    - 6. Интеграция с LED-экраном: tech-spec/06-led-integration.md
    - 7. Порядок создания и ввода: tech-spec/07-implementation.md
    - 8. Установка и настройка: tech-spec/08-installation.md
    - 9. Испытания и приемка: tech-spec/09-testing.md
    - 10. Инструктаж персонала: tech-spec/10-training.md
    - 11. Документирование: tech-spec/11-documentation.md
    - 12. Гарантии: tech-spec/12-warranty.md
    - 13. Безопасность: tech-spec/13-security.md
    - 14. Материалы и оборудование: tech-spec/14-materials.md
    - 15. Нормативные ссылки: tech-spec/15-regulatory.md

  - Архитектура подсистем:
    - Обзор: subsystems.md
    - Идентификация и регистрация: subsystems/identification.md
    - LED-медиаплатформа:
      - Обзор: subsystems/led-platform/index.md
      - Заставка: subsystems/led-platform/screensaver.md
      - Викторина: subsystems/led-platform/quiz.md
      - Оператор: subsystems/led-platform/operator.md
    - Идентификация и регистрация: subsystems/identification.md
    - Аналитика и отчётность:
      - Описание: subsystems/analytics.md
      - Дашборды:
        - Обзор: subsystems/analytics/dashboards.md
        - Главный Dashboard: subsystems/analytics/dashboards/general.md
        - Сводная по ПАК: subsystems/analytics/dashboards/paks-summary.md
        - Детальная по ПАК:
          - Обзор: subsystems/analytics/dashboards/pak-detail.md
          - LED-медиаплатформа: subsystems/analytics/dashboards/pak-detail/led-platform.md
        - Посетители: subsystems/analytics/dashboards/visitors.md
      - Аналитика анкет: subsystems/analytics/surveys.md
      - Публичный LED: subsystems/analytics/led-dashboard.md
    - Обратная связь:
      - Обзор: subsystems/feedback/index.md
      - Клиентская часть: subsystems/feedback/client.md
    - Система администрирования (CMS):
      - Обзор: subsystems/cms/index.md
      - Справочники: subsystems/cms/references.md
      - Викторина: subsystems/cms/quiz.md
      - Администрирование анкет: subsystems/cms/surveys.md
      - Администрирование согласий: subsystems/cms/consents.md
  - Сущности:
    - Пользователи: entities/users.md
    - Файлы: entities/files.md
    - Профессии: entities/professions.md
    - Организации: entities/organizations.md
    - Внешние идентификаторы: entities/external-identifiers.md
    - Аватар профессий: entities/profession-avatar.md
    - ПрофСтарт: entities/test.md
    - Аналитика: entities/analytics.md
    - Профессии в действии: entities/video-scenario.md
    - Викторина:
      - Игровая сессия: entities/game-session.md
      - Вопросы викторины: entities/quiz.md
    - Обратная связь:
      - Анкеты: entities/survey.md
      - Ответы пользователей: entities/survey-responses.md
    - Согласия: entities/consent.md
  - Справочники:
    - Типы сценарных раундов: references/scenario-round-types.md
