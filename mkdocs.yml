      - Викторина: interfaces/admin-portal/quiz.md
      - Видеосценарии: interfaces/admin-portal/video-scenarios.md
      - Аватары профессий: interfaces/admin-portal/profession-avatars.md
      - Анкеты и согласия: interfaces/admin-portal/surveys.md
