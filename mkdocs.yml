site_name: ПрофНавигатор 62 — Документация
site_description: Единая цифровая профориентационная платформа для Центра занятости населения Рязанской области
site_url: 'http://sg.atlassys.tech/rz/docs/'
use_directory_urls: false

theme:
  name: material
  language: ru
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключиться на тёмную тему
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключиться на светлую тему
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

hooks:
  - scripts/mkdocs_hook.py

plugins:
  - search:
      lang: ru

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ''
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Главная:
    - Обзор: index.md
    - Вопросы к Заказчику: questions.md
    - Внешние ПАК:
      - Профбаттл: external-paks/profbattle.md
      - Дерево профессий: external-paks/profession-tree.md
      - Интерактивная карта: external-paks/interactive-map.md
    - Концепция:
      - Обзор: concept/index.md
      - Презентация: concept/presentation.md
      - ✅ Пояснительная записка: concept/explanatory-note.md
      - ✅ Архитектурные и блок-схемы: concept/architecture.md
      - Прототипы и UI/UX-концепция: concept/prototypes.md
      - ✅ Материалы по регистрации и профилю: concept/registration-profile.md
      - Видеоролик: concept/video.md
      - ✅ Перечень допущений: concept/assumptions.md
  - Техническое задание:
    - Обзор: tech-spec/index.md
    - Концепция (10 дней): tech-spec/concept.md
    - 1. Общие положения: tech-spec/01-general.md
    - 2. Стандарт оказания услуг: tech-spec/02-standards.md
    - 3. Состав и содержание ПАК: tech-spec/03-composition.md
    - 4. Структура программного обеспечения: tech-spec/04-software-structure.md
    - 5. Требования к оборудованию: tech-spec/05-equipment.md
    - 6. Интеграция с LED-экраном: tech-spec/06-led-integration.md
    - 7. Порядок создания и ввода: tech-spec/07-implementation.md
    - 8. Установка и настройка: tech-spec/08-installation.md
    - 9. Испытания и приемка: tech-spec/09-testing.md
    - 10. Инструктаж персонала: tech-spec/10-training.md
    - 11. Документирование: tech-spec/11-documentation.md
    - 12. Гарантии: tech-spec/12-warranty.md
    - 13. Безопасность: tech-spec/13-security.md
    - 14. Материалы и оборудование: tech-spec/14-materials.md
    - 15. Нормативные ссылки: tech-spec/15-regulatory.md

  - Архитектура подсистем:
    - Обзор: subsystems.md
    - Идентификация и регистрация: subsystems/identification.md
    - LED-медиаплатформа:
      - Обзор: subsystems/led-platform/index.md
      - Заставка: subsystems/led-platform/screensaver.md
      - Викторина: subsystems/led-platform/quiz.md
      - Оператор: subsystems/led-platform/operator.md
    - Аналитика и отчётность:
      - Описание: subsystems/analytics.md
      - Дашборды:
        - Обзор: subsystems/analytics/dashboards.md
        - Главный Dashboard: subsystems/analytics/dashboards/general.md
        - Сводная по ПАК: subsystems/analytics/dashboards/paks-summary.md
        - Детальная по ПАК:
          - Обзор: subsystems/analytics/dashboards/pak-detail.md
          - LED-медиаплатформа: subsystems/analytics/dashboards/pak-detail/led-platform.md
          - Аватар профессий: subsystems/analytics/dashboards/pak-detail/profession-avatars.md
          - Видео-окна: subsystems/analytics/dashboards/pak-detail/video-windows.md
          - ПрофСтарт: subsystems/analytics/dashboards/pak-detail/profstart.md
          - Древо профессий: subsystems/analytics/dashboards/pak-detail/profession-tree.md
          - Интерактивная карта региона: subsystems/analytics/dashboards/pak-detail/interactive-map.md
          - Видео-резюме: subsystems/analytics/dashboards/pak-detail/video-resume.md
          - Профбаттл: subsystems/analytics/dashboards/pak-detail/profbattle.md
        - Посетители: subsystems/analytics/dashboards/visitors.md
      - Аналитика анкет: subsystems/analytics/surveys.md
      - Публичный LED: subsystems/analytics/led-dashboard.md
    - Обратная связь:
      - Обзор: subsystems/feedback/index.md
      - Клиентская часть: subsystems/feedback/client.md
    - Система администрирования (CMS):
      - Обзор: subsystems/cms/index.md
      - Справочники: subsystems/cms/references.md
      - Контент ПАК:
          - Викторина: subsystems/cms/quiz.md
          - Аватары профессий: subsystems/cms/profession-avatars.md
          - Профессии в действии: subsystems/cms/video-scenarios.md
          - ПрофСтарт: subsystems/cms/profstart.md
      - Анкеты: subsystems/cms/surveys.md
      - Согласия: subsystems/cms/consents.md
      - Пользователи: subsystems/cms/users.md
      - Журнал изменений: subsystems/cms/change-log.md
    - ПрофСтарт:
      - Обзор: subsystems/profstart/index.md
      - Процесс прохождения: subsystems/profstart/test-flow.md
      - Результаты: subsystems/profstart/results.md
    - Цифровой профиль и личный кабинет:
      - Обзор: subsystems/digital-profile/index.md
      - Дашборд: subsystems/digital-profile/dashboard.md
      - Каталог активностей: subsystems/digital-profile/activities.md
      - Мой карьерный маршрут: subsystems/digital-profile/recommendations.md
      - Профиль: subsystems/digital-profile/profile.md
  - Сущности:
    - Пользователи: entities/users.md
    - Файлы: entities/files.md
    - Профессии: entities/professions.md
    - Компетенции: entities/competences.md
    - Организации: entities/organizations.md
    - Внешние идентификаторы: entities/external-identifiers.md
    - Аватар профессий: entities/profession-avatar.md
    - ПрофСтарт: entities/test.md
    - Аналитика: entities/analytics.md
    - Профессии в действии: entities/video-scenario.md
